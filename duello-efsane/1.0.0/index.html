<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Efsane Düellosu</title>
<style>
:root{--me:#18b6c9;--me2:#0c7d9c;--op:#ff8a3d;--op2:#e2457a;--ink:#1d2340;--card:#fffdf7;--ok:#22a85a;--bad:#e2445c;--gold:#ffcf3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#0d1630}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background-size:cover;background-position:center bottom;z-index:0}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,40,.28),rgba(10,18,40,0) 30%,rgba(10,18,40,.18))}
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.hidden{display:none!important}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:30;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#demo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:10px;z-index:30;background:rgba(255,255,255,.88);border-radius:12px;padding:4px 9px;font-size:12px;font-weight:700}
/* oyuncular */
.av{position:relative;width:62px;height:62px;flex:none}
.av img.pic{position:absolute;left:15%;top:15%;width:70%;height:70%;border-radius:50%;object-fit:cover;background:#fff}
.av img.frm{position:absolute;inset:0;width:100%;height:100%}
.av .badge{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;transform:scale(0);transition:transform .25s}
.av .badge.on{transform:scale(1)}.av .badge.ok{background:var(--ok)}.av .badge.bad{background:var(--bad)}.av .badge.wait{background:#5b6b8a}
.nm{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* üst bar */
#top{display:flex;align-items:center;gap:6px;margin-top:22px}
#top .pl{display:flex;flex-direction:column;align-items:center;gap:2px;width:86px}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#ref{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#ref.cheer{animation:cheer .5s ease}
@keyframes cheer{40%{transform:translateY(-8px) scale(1.08)}}
#score{display:flex;gap:8px;align-items:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#score .me{color:#bff6ff}#score .op{color:#ffe0c8}
#barWrap{position:relative;margin:8px 4px 0;height:22px}
#bar{position:absolute;inset:0;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);background:var(--op)}
#barMe{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--me2),var(--me));transition:width .7s cubic-bezier(.3,1.4,.5,1)}
#barOp{position:absolute;inset:0;background:linear-gradient(90deg,var(--op),var(--op2))}
#barMe{z-index:1}
#spark{position:absolute;top:50%;left:50%;width:46px;height:46px;transform:translate(-50%,-50%);z-index:2;transition:left .7s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
#spark img{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
#spark.pulse img{animation:sp .5s ease}
@keyframes sp{50%{transform:scale(1.35)}}
/* tur */
#roundRow{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 8px;gap:8px}
#rinfo{background:rgba(255,255,255,.9);border-radius:14px;padding:5px 10px;font-size:13px;font-weight:800;display:flex;gap:6px;align-items:center}
#timer{position:relative;width:54px;height:54px;flex:none}
#timer svg{width:100%;height:100%;transform:rotate(-90deg)}
#timer circle{fill:none;stroke-width:6}
#timer .tb{stroke:rgba(255,255,255,.55)}#timer .tf{stroke:#3ee08a;stroke-linecap:round;transition:stroke .3s}
#timer.warn .tf{stroke:#ffb020}#timer.crit .tf{stroke:#ff4b5c}
#timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:900;background:rgba(255,255,255,.92);border-radius:50%;margin:7px}
#timer.crit b{animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
#oppNote{font-size:12px;font-weight:800;color:#fff;background:rgba(226,69,122,.88);border-radius:12px;padding:4px 9px;opacity:0;transition:opacity .25s;white-space:nowrap}
#oppNote.on{opacity:1}
/* kart */
#card{flex:0 1 auto;min-height:0;overflow:auto;background:var(--card);border-radius:20px;padding:14px 14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
#card>*{flex-shrink:0}
#card.pop{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}
.subj{align-self:flex-start;font-size:12px;font-weight:800;padding:3px 9px;border-radius:10px;background:#eef1ff;color:#3b4aa8}
.subj.science{background:#e4f8ee;color:#16774a}.subj.math{background:#e8f0ff;color:#2d4fb0}.subj.turkish{background:#fff0e3;color:#a6501a}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:9px 11px;font-size:15px;line-height:1.45}
.prompt{font-size:17px;font-weight:700;line-height:1.38}
.fig{display:block;margin:0 auto;width:min(100%,250px);height:auto;max-height:min(200px,24vh)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}
.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:50px;padding:9px 12px;border-radius:14px;border:2.5px solid #dfe3f0;background:#fff;font-size:16px;font-weight:600;line-height:1.3}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef1ff;font-weight:900;font-size:14px}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.opt.sel{border-color:var(--me);background:#e6fbff}
.opt.right{border-color:var(--ok);background:#e5f8ec}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fde8ec}.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;font-weight:800;min-height:60px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.mt .col{display:grid;gap:8px;align-content:start}
.mi{min-height:48px;padding:8px 10px;border-radius:12px;border:2.5px solid #dfe3f0;background:#fff;font-size:14.5px;font-weight:700;text-align:left;line-height:1.25;position:relative}
.mi.sel{border-color:var(--me);background:#e6fbff}
.mi.done{border-style:dashed}
.mi .tag{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:11px;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px}
.mi.right{border-color:var(--ok);background:#e5f8ec}.mi.wrong{border-color:var(--bad);background:#fde8ec}
.hint{font-size:12.5px;color:#5b6380;font-weight:600}
#fb{min-height:0;font-size:14px;font-weight:700;border-radius:12px;padding:0 10px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s}
#fb.on{max-height:200px;padding:8px 10px}
#fb.ok{background:#e5f8ec;color:#11683a}#fb.bad{background:#fde8ec;color:#a3172e}#fb.wait{background:#eef1ff;color:#334}
/* katmanlar */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff}
.ov.dim{background:rgba(8,14,34,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov h1{margin:0;font-size:30px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.55)}
.ov p{margin:0;font-size:16px;font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,.6);max-width:330px}
.btn{border:0;border-radius:18px;padding:14px 26px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ffb23d,#ff7a1f);box-shadow:0 5px 0 #c4580e,0 8px 16px rgba(0,0,0,.3);min-width:150px}
.btn.alt{background:linear-gradient(180deg,#7d8bb8,#55618e);box-shadow:0 5px 0 #39436a,0 8px 16px rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4580e}
.vs{display:flex;align-items:center;gap:6px;justify-content:center}
.vs .av{width:96px;height:96px}
.vs .em{width:84px;height:84px}
.vs .em img{width:100%;height:100%}
.vs .q{position:absolute;left:15%;top:15%;width:70%;height:70%;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:34px;font-weight:900;color:#e2457a;animation:beat 1s infinite}
#lbRef{width:min(44vw,180px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#count{font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 16px rgba(0,0,0,.6)}
#count.go{animation:cnt .8s ease}
@keyframes cnt{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(1)}}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:25;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(20,26,60,.88);border:3px solid #ffd54a;border-radius:22px;padding:14px 22px;color:#fff;font-weight:900;font-size:22px;text-align:center;width:min(86vw,340px)}
#banner img{width:84px;height:84px}
#banner small{font-size:14px;font-weight:700}
#banner.on{animation:ban 2.2s ease forwards}
@keyframes ban{12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}to{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#end .ref{width:min(52vw,220px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#end .rozet{width:110px;height:110px;margin-top:-30px}
#end .big{font-size:44px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.6)}
#end .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#endBox{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .5s ease;max-width:360px}
#end h1{font-size:27px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:26;overflow:hidden}
#conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#err{background:rgba(8,14,34,.82)}
@media (max-height:620px){#top{margin-top:30px}#top .av{width:44px;height:44px}#top .nm{display:none}#ref{width:42px;height:42px}#score{font-size:18px}#barWrap{margin-top:4px;height:18px}#spark{width:36px;height:36px}#roundRow{margin:6px 4px 6px}#timer{width:44px;height:44px}#timer b{font-size:16px;margin:6px}#card{padding:10px 11px;gap:7px}.passage{font-size:13.5px;padding:7px 9px;line-height:1.38}.prompt{font-size:15px}.opt{min-height:44px;font-size:14.5px;padding:6px 10px}.opt .k{width:24px;height:24px;font-size:12px}.tf .opt{min-height:50px}.mi{min-height:44px;font-size:13.5px}#count{font-size:90px}.fig{max-height:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<button id="mute" aria-label="Sesi kapat">🔊</button>
<div id="demo" class="hidden">Deneme modu · kayıt yok</div>

<!-- Oyun ekranı -->
<div id="game" class="screen hidden" aria-live="polite">
 <div id="top">
  <div class="pl"><div class="av" id="avMe"><img class="pic" alt=""><img class="frm" alt=""><span class="badge"></span></div><div class="nm" id="nmMe"></div></div>
  <div id="mid"><img id="ref" alt="Hakem"><div id="score"><span class="me" id="scMe">0</span><span>–</span><span class="op" id="scOp">0</span></div></div>
  <div class="pl"><div class="av" id="avOp"><img class="pic" alt=""><img class="frm" alt=""><span class="badge"></span></div><div class="nm" id="nmOp"></div></div>
 </div>
 <div id="barWrap" role="img" aria-label="Güç barı"><div id="bar"><div id="barOp"></div><div id="barMe"></div></div><div id="spark"><img alt=""></div></div>
 <div id="roundRow"><div id="rinfo"><span id="rno">Tur 1/12</span></div><div id="oppNote">Rakip cevapladı</div><div id="timer" aria-label="Kalan süre"><svg viewBox="0 0 54 54"><circle class="tb" cx="27" cy="27" r="23"/><circle class="tf" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><b id="tsec">30</b></div></div>
 <div id="card"></div>
</div>

<!-- Bekleme / başlangıç -->
<div id="lobby" class="ov hidden">
 <img id="lbRef" alt="Hakem"><div class="vs"><div class="av" id="lbMe"><img class="pic" alt=""><img class="frm" alt=""></div><div class="em"><img id="lbEm" alt=""></div><div class="av" id="lbOp"><img class="pic" alt=""><img class="frm" alt=""><div class="q" id="lbQ">?</div></div></div>
 <h1 id="lbTitle">Rakip bekleniyor…</h1>
 <p id="lbText"></p>
 <div id="count" class="hidden">3</div>
 <button class="btn alt" id="lbCancel">Vazgeç</button>
</div>

<div id="end" class="ov dim hidden"><div id="endBox"></div></div>
<div id="err" class="ov hidden"><h1>⚠️</h1><p id="errText"></p></div>
<div id="banner"><img id="banImg" alt=""><span id="banText"></span><small id="banSub"></small></div>
<div id="conf"></div>

s":"science","d":"e","t":"mt","q":"Araçları basit makine türleriyle eşleştir.","x":"Günlük hayatta birçok basit makineden yararlanırız.","tp":"Eğik düzlem, çıkrık, dişli","pr":[["Kuyu çıkrığı","Çıkrık"],["Vida","Eğik düzlemin özel hâli"],["Bisiklet zinciri ve dişliler","Dişli çark"]],"u":4,"oc":14,"sr":4},{"id":"def-f-107","s":"science","d":"m","t":"c","q":"Destek noktası ortada olan bir kaldıraçta yük destekten 20 cm, kuvvet destekten 60 cm uzaktadır. 90 N’luk yükü dengelemek için kaç N kuvvet gerekir?","x":"Yük × yük kolu = kuvvet × kuvvet kolu: 90 × 20 = F × 60 ⇒ F = 30 N.","tp":"Kaldıraçlar","o":["30","90","270","45"],"u":4,"oc":14,"sr":4},{"id":"def-f-108","s":"science","d":"m","t":"c","q":"Bir kaldıraçta kuvvetten kazanç sağlamak için ne yapılmalıdır?","x":"Kuvvet kolu uzadıkça daha az kuvvet gerekir.","tp":"Kaldıraçlar","o":["Kuvvet kolu yük kolundan uzun olmalı","Yük kolu kuvvet kolundan uzun olmalı","Kollar eşit olmalı","Destek kaldırılmalı"],"u":4,"oc":14,"sr":4},{"id":"def-f-109","s":"science","d":"m","t":"c","q":"Ağırlığı 100 N olan yük tek hareketli makarayla dengeleniyor. Makara ağırlığı ihmal edilirse gereken kuvvet kaç N’dur?","x":"Hareketli makara kuvveti yarıya indirir.","tp":"Makaralar","o":["50","100","200","25"],"u":4,"oc":14,"sr":4},{"id":"def-f-110","s":"science","d":"m","t":"c","q":"Hareketli makarayla yük 2 m yükseltilmek istenirse ip kaç m çekilmelidir?","x":"Kuvvetten kazanç sağlanan hareketli makarada yoldan kayıp vardır; ip iki katı çekilir.","tp":"Makaralar","o":["4","2","1","8"],"u":4,"oc":14,"sr":4},{"id":"def-f-111","s":"science","d":"m","t":"c","q":"Aynı yüksekliğe çıkan iki rampadan uzun olanı için hangisi doğrudur?","x":"Eğik düzlemin uzunluğu arttıkça gereken kuvvet azalır.","tp":"Eğik düzlem, çıkrık, dişli","o":["Daha az kuvvet gerektirir.","Daha çok kuvvet gerektirir.","Daha az yol gerektirir.","İşten kazanç sağlar."],"u":4,"oc":14,"sr":4},{"id":"def-f-112","s":"science","d":"m","t":"c","q":"Çıkrıkta kuvvetten kazanç sağlamak i t-fiildir.","tp":"Fiilimsiler","o":["Sıfat-fiil","İsim-fiil","Zarf-fiil","Çekimli fiil"],"u":19,"oc":37,"sr":19},{"id":"def-t-030","s":"turkish","d":"e","t":"c","q":"Düşüncelerin kesin yargılara varmadan, samimi bir dille anlatıldığı yazı türü hangisidir?","x":"Denemede yazar kendi kendine konuşur gibi samimidir.","tp":"Metin türleri","o":["Deneme","Makale","Haber","Biyografi"],"u":27,"oc":47,"sr":27},{"id":"def-t-031","s":"turkish","d":"e","t":"tf","q":"“Gülerek” kelimesi bir zarf-fiildir.","x":"-erek eki zarf-fiil ekidir.","tp":"Fiilimsiler","v":true,"u":19,"oc":37,"sr":19},{"id":"def-t-032","s":"turkish","d":"e","t":"tf","q":"“Mektup yazıldı.” cümlesinin yüklemi etken çatılıdır.","x":"Öznesi belli olmadığı için edilgendir.","tp":"Fiilde çatı","v":false,"u":21,"oc":39,"sr":21},{"id":"def-t-033","s":"turkish","d":"e","t":"tf","q":"Her cümlede mutlaka bir yüklem bulunur.","x":"Yüklem cümlenin temel ögesidir.","tp":"Cümlenin ögeleri","v":true,"u":20,"oc":38,"sr":20},{"id":"def-t-034","s":"turkish","d":"e","t":"tf","q":"“Birçok” kelimesi bitişik yazılır.","x":"“Birçok, birkaç, birtakım” bitişik yazılır.","tp":"Yazım ve noktalama","v":true,"u":25,"oc":45,"sr":25},{"id":"def-t-035","s":"turkish","d":"e","t":"tf","q":"“Kalbi kırıldı.” cümlesinde “kırılmak” gerçek anlamda kullanılmıştır.","x":"Üzülmek anlamında mecazdır.","tp":"Sözcükte anlam","v":false,"u":23,"oc":41,"sr":23},{"id":"def-t-036","s":"turkish","d":"e","t":"tf","q":"Biyografi, bir kişinin hayatının başkası tarafından anlatılmasıdır.","x":"Kişi kendi hayatını anlatırsa otobiyografi olur.","tp":"Metin türleri","v":true,"u":27,"oc":47,"sr":27},{"id":"def-t-037","s":"turkish","d":"e","t":"tf","q":"“Bu roman yılın en güzel kitabıdır.” cümlesi öznel bir yargıdır.","x":"Kişiden kişiye değişen değerlendirme özneldir.","tp":"Öznel ve nesnel yargı","v":true,"u":24,"oc":43,"sr":24},{"id":"def-t-038","s":"turkish","d":"e","t":"tf","q":"Yüklemi isim soylu kelime olan cümlelere isim cümlesi denir.","x":"Örneğin “Hava güze r anda gelen bir şans sanır. Oysa başarılı insanların hikâyelerine bakıldığında yılların emeği, sayısız deneme ve bolca hata görülür. Thomas Edison ampulü bulmadan önce binlerce deneme yaptığını söyler. Demek ki başarı, vazgeçmeden yeniden deneyebilenlerin ödülüdür.","u":30,"oc":50,"sr":30},{"id":"def-t-052","s":"turkish","d":"m","t":"c","q":"Yukarıdaki paragrafta hangi düşünceyi geliştirme yollarına başvurulmuştur?","x":"Edison’un sözü tanık gösterme; şans sanılan başarı ile emeğe dayalı başarı karşılaştırılmıştır.","tp":"Paragrafta anlam","o":["Tanık gösterme ve karşılaştırma","Sayısal veri ve tanımlama","Benzetme ve kişileştirme","Yalnızca tanımlama"],"p":"Bazı insanlar başarıyı bir anda gelen bir şans sanır. Oysa başarılı insanların hikâyelerine bakıldığında yılların emeği, sayısız deneme ve bolca hata görülür. Thomas Edison ampulü bulmadan önce binlerce deneme yaptığını söyler. Demek ki başarı, vazgeçmeden yeniden deneyebilenlerin ödülüdür.","u":30,"oc":50,"sr":30},{"id":"def-t-053","s":"turkish","d":"m","t":"tf","q":"Yukarıdaki paragrafta yazar, başarının yalnızca şansa bağlı olduğunu savunmaktadır.","x":"Yazar başarının emek ve denemelerle geldiğini savunur.","tp":"Paragrafta anlam","v":false,"p":"Bazı insanlar başarıyı bir anda gelen bir şans sanır. Oysa başarılı insanların hikâyelerine bakıldığında yılların emeği, sayısız deneme ve bolca hata görülür. Thomas Edison ampulü bulmadan önce binlerce deneme yaptığını söyler. Demek ki başarı, vazgeçmeden yeniden deneyebilenlerin ödülüdür.","u":30,"oc":50,"sr":30},{"id":"def-t-054","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metnin ana duygusu hangisidir?","x":"Yazar kaybolan kokuyu ve sesi özlemle anar.","tp":"Paragrafta anlam","o":["Özlem","Öfke","Korku","Heyecan"],"p":"Mahallemizdeki eski fırın kapanınca sokağın kokusu da değişti. Artık sabahları sıcak ekmek kokusu yerine egzoz kokusu var. Fırıncı Hasan Amca’nın “Günaydın evlat!” diyen sesini de duymuyoruz. Bazen bir dükkân kapanınca yalnızca bir iş yeri değil, bir mahallenin hafızası da kaybolur.","u":30,"oc":50,"sr":30},{"id":"def-t-055","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metinden hangisi çıkarılabilir?","x":"Son cümle, dükkânların mahallenin hafızası olduğunu vurgular.","tp":"Paragrafta anlam","o":["Küçük dükkânlar mahalle kültürünün parçasıdır.","Fırın yeniden açılacaktır.","Hasan Amca başka bir şehre taşınmıştır.","Mahallede trafik azalmıştır."],"p":"Mahallemizdeki eski fırın kapanınca sokağın kokusu da değişti. Artık sabahları sıcak ekmek kokusu yerine egzoz kokusu var. Fırıncı Hasan Amca’nın “Günaydın evlat!” diyen sesini de duymuyoruz. Bazen bir dükkân kapanınca yalnızca bir iş yeri değil, bir mahallenin hafızası da kaybolur.","u":30,"oc":50,"sr":30},{"id":"def-t-056","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metinden öğrencilerle ilgili hangisine ulaşılabilir?","x":"Tatilde bile fidanları sulamaları sorumluluk bilincini gösterir.","tp":"Paragrafta anlam","o":["Sorumluluk sahibi oldukları","Yaz tatilini hiç sevmedikleri","Fidanları satmayı düşündükleri","Okul bahçesini hiç kullanmadıkları"],"p":"Okulumuzun bahçesine dikilen fidanlar, öğrencilerin sorumluluğuna verildi. Her sınıf bir fidan seçti, adını koydu ve sulama çizelgesi hazırladı. Yaz tatilinde bile bazı öğrenciler sırayla okula gelip fidanları suladı. Eylülde okul açıldığında fidanların hiçbiri kurumamıştı.","u":30,"oc":50,"sr":30},{"id":"def-t-057","s":"turkish","d":"m","t":"tf","q":"Yukarıdaki metne göre bazı fidanlar yaz boyunca kurumuştur.","x":"Eylülde fidanların hiçbiri kurumamıştı.","tp":"Paragrafta anlam","v":false,"p":"Okulumuzun bahçesine dikilen fidanlar, öğrencilerin sorumluluğuna verildi. Her sınıf bir fidan seçti, adını koydu ve sulama çizelgesi hazırladı. Yaz tatilinde bile bazı öğrenciler sırayla okula gelip fidanları suladı. Eylülde okul açıldığında fidanların hiçbiri kurumamıştı.","u":30,"oc":50,"sr":30},{"id":"def-t-058","s":"turkish","d":"m","t":"c","q":"Hangi cümlede fiilimsi yoktur?","x":"Diğer cümlelerde “çalışmak” is :48,"sr":28},{"id":"def-t-164","s":"turkish","d":"h","t":"c","q":"“Öğretmenimiz bize ödev ve sınavın yarın olacağını söyledi.” cümlesindeki bozukluğun sebebi nedir?","x":"“Ödev yarın olacak” denemez; “ödevin teslim edileceğini” gibi bir ifade gerekir.","tp":"Anlatım bozuklukları","o":["Ortak ögenin her iki kelimeye uymaması","Gereksiz kelime kullanılması","Noktalama yanlışı","Deyim yanlış kullanımı"],"u":28,"oc":48,"sr":28},{"id":"def-t-165","s":"turkish","d":"h","t":"c","q":"“Su, yaşamın kaynağıdır. Bir insan haftalarca yemeksiz kalabilir; ancak susuz birkaç günden fazla yaşayamaz.” cümlelerinde hangi düşünceyi geliştirme yolları vardır?","x":"İlk cümle tanım, ikinci cümle yemek ile suyun karşılaştırılmasıdır.","tp":"Düşünceyi geliştirme yolları","o":["Tanımlama ve karşılaştırma","Tanık gösterme ve benzetme","Sayısal veri ve kişileştirme","Örnekleme ve abartma"],"u":29,"oc":49,"sr":29},{"id":"def-t-166","s":"turkish","d":"h","t":"c","q":"Beş kitap rafta sıralanmıştır: Roman, şiir kitabının hemen sağında; deneme en solda; masal, romanın hemen sağında; hikâye en sağdadır. Ortadaki kitap hangisidir?","x":"Sıra: deneme – şiir – roman – masal – hikâye; ortada roman vardır.","tp":"Sözel mantık","o":["Roman","Şiir","Masal","Deneme"],"u":31,"oc":51,"sr":31},{"id":"def-t-167","s":"turkish","d":"h","t":"c","q":"Ayşe, Bora ve Cem’in en sevdiği renkler kırmızı, mavi ve yeşildir (her biri farklı). Ayşe kırmızıyı sevmez; Bora maviyi sever. Cem’in sevdiği renk hangisidir?","x":"Bora mavi; Ayşe kırmızı değil, o hâlde yeşil; Cem kırmızı.","tp":"Sözel mantık","o":["Kırmızı","Mavi","Yeşil","Belirlenemez"],"u":31,"oc":51,"sr":31},{"id":"def-t-168","s":"turkish","d":"h","t":"c","q":"Hangi cümlede hem nesnel hem öznel yargı bir arada bulunur?","x":"Fetih tarihi nesnel, “en güzel şehir” özneldir.","tp":"Öznel ve nesnel yargı","o":["Fethedilen İstanbul eşsizdir.","İstanbul 1453 yılında fethedildi.","İstanbul’un nüfusu 15 milyonu aşar.","İstanbul hem Avrupa’da hem Asya’da yer alır."],"u":24,"oc":43,"sr":24},{"id":"def-t-169","s":"turkish","d":"h","t":"tf","q":"“Okuldan gelen kardeşim, çantasını bırakıp koşarak bahçeye çıktı.” cümlesinde üç fiilimsi vardır.","x":"“Gelen” sıfat-fiil; “bırakıp” ve “koşarak” zarf-fiildir.","tp":"Fiilimsiler","v":true,"u":19,"oc":37,"sr":19},{"id":"def-t-170","s":"turkish","d":"h","t":"tf","q":"“Arkadaşımın bana verdiği kitabı iki günde okudum.” cümlesinde belirtili nesne bir sıfat-fiil grubudur.","x":"“Arkadaşımın bana verdiği kitabı” belirtili nesnedir.","tp":"Cümlenin ögeleri","v":true,"u":20,"oc":38,"sr":20},{"id":"def-t-171","s":"turkish","d":"h","t":"tf","q":"Edilgen çatılı fiiller nesne alabilir.","x":"Edilgen fiiller nesne almaz; nesne alabilen fiiller etkendir.","tp":"Fiilde çatı","v":false,"u":21,"oc":39,"sr":21},{"id":"def-t-172","s":"turkish","d":"h","t":"tf","q":"“Çalıştı ama kazanamadı.” cümlesi yapısına göre basit cümledir.","x":"İki yargı “ama” ile bağlanmıştır; bağlı sıralı cümledir.","tp":"Cümle türleri","v":false,"u":22,"oc":40,"sr":22},{"id":"def-t-173","s":"turkish","d":"h","t":"tf","q":"“İnce” kelimesi “ince düşünceli” ifadesinde mecaz anlamda kullanılmıştır.","x":"Kibar, nazik anlamındadır.","tp":"Sözcükte anlam","v":true,"u":23,"oc":41,"sr":23},{"id":"def-t-174","s":"turkish","d":"h","t":"tf","q":"Belirli bir tarihi gösteren ay ve gün adları büyük harfle başlar: “29 Ekim 1923 Pazartesi”.","x":"Belirli tarih bildiren ay ve gün adları büyük harfle yazılır.","tp":"Yazım ve noktalama","v":true,"u":25,"oc":45,"sr":25},{"id":"def-t-175","s":"turkish","d":"h","t":"tf","q":"“Geçen sene İstanbul’a gidecektik.” cümlesinde zaman uyumsuzluğu vardır.","x":"“Gidecektik” gelecek zamanın hikâyesidir; geçmişte planlanan bir eylemi anlatır, doğrudur.","tp":"Anlatım bozuklukları","v":false,"u":28,"oc":48,"sr":28},{"id":"def-t-176","s":"turkish","d":"h","t":"tf","q":"A, B’den uzun; C, A’dan uzunsa en kısa B’dir.","x":"C > A > B.","tp":"Sözel mantık","v":true,"u":31,"oc":51,"sr":31},{"id":"def-t-177","s":"turkish","d":"h","t":"mt","q":"Fiilimsileri cümledeki görevleriyle eşleştir.","x":"Fiilimsiler cümlede farklı görevler üstlenir.","tp":"Fiilimsiler","pr":[["Gülmek sağlığa iyi gelir.","Özne görevinde isim-fiil"],["Gülen kız el salladı.","Sıfat görevinde sıfat-fiil"],["Gülerek anlattı.","Durum bildiren zarf-fiil"]],"u":19,"oc":37,"sr":19},{"id":"def-t-178","s":"turkish","d":"h","t":"mt","q":"Cümlelerdeki altı çizili ögeleri eşleştir.","x":"Ögeler yükleme sorulan sorularla belirlenir.","tp":"Cümlenin ögeleri","pr":[["Kitabı Ali okudu.","Ali: özne"],["Ali kitabı okudu.","Kitabı: belirtili nesne"],["Ali dün okudu.","Dün: zarf tümleci"]],"u":20,"oc":38,"sr":20},{"id":"def-t-179","s":"turkish","d":"h","t":"mt","q":"Cümleleri anlam ilişkileriyle eşleştir.","x":"“Diye” amaç, “için” sebep, “rağmen” karşıtlık bildirebilir.","tp":"Cümlede anlam","pr":[["Islanmasın diye şemsiye aldı.","Amaç-sonuç"],["Islandığı için hastalandı.","Sebep-sonuç"],["Islanmasına rağmen hastalanmadı.","Karşıtlık"]],"u":24,"oc":44,"sr":24},{"id":"def-t-180","s":"turkish","d":"h","t":"mt","q":"Metin türlerini örneklerle eşleştir.","x":"Metin türleri amaç ve konularına göre ayrılır.","tp":"Metin türleri","pr":[["Bir yazarın Kapadokya izlenimleri","Gezi yazısı"],["Bir romanın değerlendirilmesi","Eleştiri"],["Atatürk’ün hayatının anlatılması","Biyografi"]],"u":27,"oc":47,"sr":27},{"id":"def-t-181","s":"turkish","d":"h","t":"mt","q":"Cümleleri düzeltilmiş hâlleriyle eşleştir.","x":"Gereksiz kelimeler atılır, çelişen ifadeler düzeltilir.","tp":"Anlatım bozuklukları","pr":[["Geri iade etti.","İade etti."],["Yaklaşık 10 kadar","Yaklaşık 10"],["Kesinlikle gelebilir.","Kesinlikle gelecek."]],"u":28,"oc":48,"sr":28},{"id":"def-t-182","s":"turkish","d":"h","t":"mt","q":"Dizeleri söz sanatlarıyla eşleştir.","x":"Söz sanatları şiirin etkisini artırır.","tp":"Söz sanatları","pr":[["Ağlarım hatıra geldikçe gülüştüklerimiz","Tezat"],["Ey yağmur, biraz da bize yağ!","Seslenme ve kişileştirme"],["Bir ah çeksem dağı taşı eritir","Abartma"]],"u":26,"oc":46,"sr":26},{"id":"def-t-183","s":"turkish","d":"h","t":"mt","q":"İpuçlarına göre kişileri sıralarıyla eşleştir: Defne, Ece’den önce; Ece, Ferit’ten önce yarışı bitirdi.","x":"Defne → Ece → Ferit.","tp":"Sözel mantık","pr":[["Birinci","Defne"],["İkinci","Ece"],["Üçüncü","Ferit"]],"u":31,"oc":51,"sr":31},{"id":"def-t-184","s":"turkish","d":"h","t":"mt","q":"Cümleleri yapılarına göre eşleştir.","x":"Cümleler yapılarına göre sınıflandırılır.","tp":"Cümle türleri","pr":[["Ders çalıştı ama yorulmadı.","Bağlı sıralı cümle"],["Ders bitince eve gitti.","Birleşik cümle"],["Ders bitti.","Basit cümle"]],"u":22,"oc":40,"sr":22},{"id":"def-t-185","s":"turkish","d":"h","t":"mt","q":"Durumları uygun atasözüyle eşleştir.","x":"Atasözü durumun ana fikrine göre seçilir.","tp":"Deyim ve atasözü","pr":[["Arkadaşından kötü alışkanlık edinen biri","Üzüm üzüme baka baka kararır."],["Gelirinden fazla harcayan biri","Ayağını yorganına göre uzat."],["Eleştirildiği için kızan biri","Dost acı söyler."]],"u":23,"oc":42,"sr":23},{"id":"def-t-186","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metinde Zeynep’in verdiği karar neyi gösterir?","x":"Yazarla karşılaşma, Zeynep’i yazmaya yönlendirmiştir.","tp":"Paragrafta anlam","o":["Yazarın sözlerinden etkilendiğini","Fuardan sıkıldığını","Yazarı sevmediğini","Kitap okumayı bırakacağını"],"p":"Kitap fuarına giden Zeynep, ilk standda en sevdiği yazarı gördü. Sıra çok uzundu ama Zeynep bekledi. Yazar, kitabını imzalarken “Okumaktan asla vazgeçme.” dedi. Zeynep o gün eve dönerken bir karar verdi: Kendi hikâyesini yazacaktı.","u":30,"oc":50,"sr":30},{"id":"def-t-187","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metinden Zeynep’in hangi özelliği çıkarılabilir?","x":"Uzun sırada beklemesi sabrını gösterir.","tp":"Paragrafta anlam","o":["Sabırlı olduğu","Telaşlı olduğu","Kıskanç olduğu","Kararsız olduğu"],"p":"Kitap fuarına giden Zeynep, ilk standda en sevdiği yazarı gördü. Sıra çok uzundu ama Zeynep bekledi. Yazar, kitabını imzalarken “Okumaktan asla vazgeçme.” dedi. Zeynep o gün eve dönerken bir karar verdi: Kendi hikâyesini yazacaktı.","u":30,"oc":50,"sr":30},{"id":"def-t-188","s":"turkish","d":"m","t":"c","q":"“Yorulan sporcular soyunma odasına girince dinlendi.” cümlesindeki fiilimsiler sırasıyla hangi türdedir?","x":"“Yorulan” sıfat-fiil, “girince” zarf-fiildir.","tp":"Fiilimsiler","o":["Sıfat-fiil, zarf-fiil","İsim-fiil, sıfat-fiil","Zarf-fiil, isim-fiil","Sıfat-fiil, isim-fiil"],"u":19,"oc":37,"sr":19},{"id":"def-t-189","s":"turkish","d":"m","t":"c","q":"“Kardeşime doğum günü için güzel bir kitap aldım.” cümlesinde “doğum günü için” hangi ögedir?","x":"Amaç bildiren söz grubu zarf tümlecidir.","tp":"Cümlenin ögeleri","o":["Zarf tümleci","Nesne","Dolaylı tümleç","Özne"],"u":20,"oc":38,"sr":20},{"id":"def-t-190","s":"turkish","d":"m","t":"c","q":"Hangi cümlede yüklem etken çatılıdır?","x":"Öznesi belli olan cümlenin yüklemi etkendir.","tp":"Fiilde çatı","o":["Öğrenciler sınıfı temizledi.","Sınıf temizlendi.","Kapılar kilitlendi.","Kitaplar dağıtıldı."],"u":21,"oc":39,"sr":21},{"id":"def-t-191","s":"turkish","d":"m","t":"c","q":"“Derin” kelimesi hangi cümlede mecaz anlamdadır?","x":"Derin bilgi, kapsamlı bilgi demektir.","tp":"Sözcükte anlam","o":["Bu konuda derin bilgisi var.","Havuzun derin yerine girme.","Derin bir kuyu kazdılar.","Göl çok derindi."],"u":23,"oc":41,"sr":23},{"id":"def-t-192","s":"turkish","d":"m","t":"c","q":"Hangi cümlede büyük harf kullanımı yanlıştır?","x":"Noktalı virgülden sonra gelen “annem” küçük harfle başlamalıdır.","tp":"Yazım ve noktalama","o":["Rize’ye gideceğiz; Annem sevinçli.","Bu yaz ailece Karadeniz’e gideceğiz.","Rize, çay üretimiyle ünlü bir şehirdir.","Annem Rize’yi ve yaylalarını çok seviyor."],"u":25,"oc":45,"sr":25},{"id":"def-t-193","s":"turkish","d":"m","t":"c","q":"“Ne kadar çalışırsan o kadar başarılı olursun.” cümlesinde hangi anlam ilişkisi vardır?","x":"Başarı, çalışmanın miktarına bağlı olarak artar.","tp":"Cümlede anlam","o":["Koşul ve orantı","Amaç-sonuç","Karşıtlık","Olasılık"],"u":24,"oc":44,"sr":24},{"id":"def-t-194","s":"turkish","d":"m","t":"c","q":"Bir olayın 5N1K sorularına cevap verecek biçimde, nesnel olarak anlatıldığı tür hangisidir?","x":"Haber metni ne, nerede, ne zaman, nasıl, neden ve kim sorularını cevaplar.","tp":"Metin türleri","o":["Haber","Deneme","Şiir","Masal"],"u":27,"oc":47,"sr":27},{"id":"def-t-195","s":"turkish","d":"m","t":"mt","q":"Cümlelerdeki “ince” kelimesini anlamlarıyla eşleştir.","x":"Bir kelime gerçek, mecaz ve terim anlamda kullanılabilir.","tp":"Sözcükte anlam","pr":[["İnce bir kalem aldı.","Gerçek anlam"],["İnce bir davranış","Mecaz: kibar, nazik"],["İnce bağırsak","Terim anlam"]],"u":23,"oc":41,"sr":23},{"id":"def-t-196","s":"turkish","d":"m","t":"mt","q":"Fiilimsi eklerini türleriyle eşleştir.","x":"Fiilimsiler aldıkları eklere göre sınıflandırılır.","tp":"Fiilimsiler","pr":[["-ma, -ış, -mak","İsim-fiil"],["-an, -dık, -acak","Sıfat-fiil"],["-ınca, -arak, -ıp","Zarf-fiil"]],"u":19,"oc":37,"sr":19},{"id":"def-t-197","s":"turkish","d":"m","t":"mt","q":"“Ece sabah annesine çiçek getirdi.” cümlesinin ögelerini eşleştir.","x":"Ögeler yükleme sorulan sorularla bulunur.","tp":"Cümlenin ögeleri","pr":[["Ece","Özne"],["Sabah","Zarf tümleci"],["Annesine","Dolaylı tümleç"]],"u":20,"oc":38,"sr":20},{"id":"def-t-198","s":"turkish","d":"m","t":"mt","q":"Deyimleri cümlelerle eşleştir.","x":"Deyimin anlamı cümleyle örtüşmelidir.","tp":"Deyim ve atasözü","pr":[["Ağzı kulaklarına varmak","Hediyeyi görünce çok sevindi."],["Dili tutulmak","Şaşkınlıktan konuşamadı."],["Gözü tutmak","Elbiseyi görür görmez beğendi."]],"u":23,"oc":42,"sr":23},{"id":"def-t-199","s":"turkish","d":"m","t":"mt","q":"Metin türlerini amaçlarıyla eşleştir.","x":"Metin türleri amaçlarına göre ayrılır.","tp":"Metin türleri","pr":[["Haber","Güncel olayı bildirmek"],["Eleştiri","Bir eseri değerlendirmek"],["Anı","Yaşanmış olayları anlatmak"]],"u":27,"oc":47,"sr":27},{"id":"def-t-200","s":"turkish","d":"h","t":"mt","q":"Cümleleri yazım kurallarıyla eşleştir.","x":"Yazım kuralları TDK’ye göredir.","tp":"Yazım ve noktalama","pr":[["Haftaya pazartesi","Belirli tarih bildirmeyen gün adı küçük yazılır."],["29 Ekim 1923","Belirli tarih bildiren ay adı büyük yazılır."],["Türk Dil Kurumuna","Kurum adına gelen ek kesmesiz yazılır."]],"u":25,"oc":45,"sr":25}];

ni ve hâl değişimini öz ısı ile ilişkilendirir.","Basit makinelerin sağladığı avantajları örneklerle açıklar.","Fotosentezin ve solunumun canlılar için önemini açıklar.","Besin zincirinde madde ve enerji akışını açıklar.","Madde döngülerini ve küresel iklim değişikliğinin nedenlerini açıklar.","Elektrik yüklerini ve elektriklenme yollarını açıklar; elektroskobun işlevini belirtir.","Elektrik enerjisinin ısı, ışık ve hareket enerjisine dönüşümüne örnekler verir.","Elektrik enerjisinin üretildiği santralleri ve enerji tasarrufunu açıklar.","İki doğal sayının aralarında asal olup olmadığını belirler.","Tam sayıların tam sayı kuvvetlerini hesaplar; üslü ifadelerle çarpma ve bölme işlemlerini yapar.","Tam kare pozitif tam sayılarla bu sayıların karekökleri arasındaki ilişkiyi belirler; kareköklü ifadelerle işlem yapar.","Gerçek sayıları tanır; rasyonel ve irrasyonel sayıları ayırt eder.","Basit bir olayın olma olasılığını hesaplar.","Üçgende kenar uzunlukları arasındaki ilişkiyi belirler; Pisagor bağıntısını oluşturur ve problemlerde kullanır.","Nokta, doğru parçası ve diğer şekillerin öteleme ve yansıma sonucundaki görüntülerini çizer.","Dik prizma, dik dairesel silindir, dik piramit ve dik koninin yüzey alanı ve hacmini hesaplar.","Birinci dereceden bir bilinmeyenli denklemleri çözer.","Sayıları ondalık gösterimle ve bilimsel gösterimle ifade eder.","Cebirsel ifadelerle çarpma yapar; özdeşlikleri modellerle açıklar; cebirsel ifadeleri çarpanlarına ayırır.","Doğrusal ilişkilerin eğimini belirler; doğrunun eğimini modellerle açıklar.","Birinci dereceden bir bilinmeyenli eşitsizlikleri çözer ve sayı doğrusunda gösterir.","Eşlik ve benzerliği ilişkilendirir; benzer çokgenlerin benzerlik oranını belirler.","Verilen pozitif tam sayıların çarpanlarını bulur, asal çarpanlarına ayırır; EBOB ve EKOK’u hesaplar, problemlerde kullanır.","En fazla üç veri grubuna ait çizgi ve sütun grafiklerini yorumlar.","Fiilimsilerin cümledeki işlevlerini kavrar.","Cümlenin ögelerini ayırt eder. function hash(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function prng(seed){let a=hash(String(seed));return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function sshuffle(arr,r){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rshuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const b=new Uint32Array(1);crypto.getRandomValues(b);const j=b[0]%(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;}

function pickQuestion(seed,side,roundNo,subjectId,difficulty){const d=DIFF[difficulty]||'m',t=roundType(seed,roundNo,subjectId,d);
 let pool=BUCKET[subjectId+'|'+d+'|'+t]||[];if(pool.length<2){pool=BANK.filter(q=>q.s===subjectId&&q.d===d);}
 const order=sshuffle(pool,prng(seed+'|'+subjectId+'|'+d+'|'+t));

const FAST=TEST_HOOKS&&/fast/.test(location.hash);
function LocalHost(){const H={},seed='demo-'+Date.now(),plan=[];let my=0,op=0,round=0,mine=null,botT=0,roundT=0,botAns=null;
 function roundPlan(){const subs=['turkish','science','math'],r=prng(seed+'|plan');const mk=d=>sshuffle(subs,r).map(s=>({s,d}));let seq=[...mk('easy'),...sshuffle([...subs,...subs],r).map(s=>({s,d:'medium'})),...mk('hard')];
  for(let k=0;k<50;k++){let okk=true;for(let i=1;i<seq.length;i++)if(seq[i].s===seq[i-1].s&&seq[i].d===seq[i-1].d||seq[i].s===seq[i-1].s){okk=false;const j=i+1+Math.floor(r()*(seq.length-i-1));if(j<seq.length&&seq[j].d===seq[i].d)[seq[i],seq[j]]=[seq[j],seq[i]];}if(okk)break;}return seq;}
 const seq=roundPlan(),dur=LEVEL.roundSeconds*1000;
 function to(type,payload){setTimeout(()=>receive({bridgeVersion:'1.0',type,messageId:uid('h'),runId:'demo',nonce:'demo',payload}),0);}
 function next(){round++;let r;if(round<=12)r=seq[round-1];else{if(my!==op){return end();}r={s:['turkish','science','math'][(round-13)%3],d:'medium'};}
  if(round>12&&my!==op)return end();mine=null;botAns=null;to('duel.round',{roundNo:round,isExtra:round>12,subjectId:r.s,difficulty:r.d,durationMs:dur,remainingMs:dur});
  clearTimeout(botT);botT=setTimeout(()=>{botAns=Math.random()<(FAST&&/win/.test(location.hash)?0.2:0.62);to('duel.opponentAnswered',{roundNo:round});maybeClose();},FAST?150+Math.random()*300:2500+Math.random()*(dur*0.55));clearTimeout(roundT);roundT=setTimeout(()=>close(),dur+1000);}
 function maybeClose(){if(mine!==null&&botAns!==null)close();}
 let closing=false;
 function close(){if(closing)return;closing=true;clearTimeout(roundT);clearTimeout(botT);const mOk=mine===true,oOk=botAns===true;if(mOk)my++;if(oOk)op++;to('duel.score',{roundNo:round,me:{correct:my,lastCorrect:mOk},opp:{correct:op,lastCorrect:oOk}});
  setTimeout(()=>{closing=false;if(round>=12&&my!==op&&(round===12||mOk!==oOk))end();else next();},FAST?350:reduced()?600:2600);}
 function end(){to('duel.end',{result:my>op?'win':'lose',myCorrect:my,oppCorrect:op,extraRounds:Math.max(0,round-12),reason:'normal'});}
 H.fromGame=m=>{if(m.type==='duel.ready'){to('duel.state',{state:'accepted'});setTimeout(()=>to('duel.state',{state:'starting',countdownMs:3000}),FAST?100:900);setTimeout(next,FAST?3300:900+3600);}
  else if(m.type==='duel.answer'){if(m.payload.roundNo===round){mine=m.payload.correct;if(window.__T)window.__T.answers.push(m.payload);maybeClose();}}
  else if(m.type==='duel.rematch'||m.type==='duel.exit'){if(window.__T)window.__T.events.push(m.type);}
  else if(m.type==='duel.cancel'){to('duel.state',{state:'cancelled'});}};
 H.start=()=>{ctx={runId:'demo',nonce:'demo',reducedMotion:false};setupDuel({mode:'duel',side:'A',seed,me:{displayName:'Sen'},opponent:{displayName:'Bot Yıldız'},state:'waiting',inviteExpiresInMs:120000,levelName:LEVEL.name});};
 H.seq=seq;return H;}
/* ---------- açılış ---------- */
function boot(){$('bg').style.backgroundImage=`url(${IMG.bg})`;$('ref').src=IMG.ref;$('spark').querySelector('img').src=IMG.vs;$('lbEm').src=IMG.vs;$('lbRef').src=IMG.ref;
 if(transport()){native=true;handshake();}
 else{$('demo').classList.remove('hidden');host=LocalHost();setTimeout(()=>host.start(),TEST_HOOKS?0:400);}}
if(TEST_HOOKS){window.__T={BANK,LEVEL,answers:[],events:[],get cur(){return cur;},get duel(){return duel;},pickQuestion,roundType,auto:ok=>cur&&cur.r&&!answered&&cur.r.auto(ok),receive,
 render:id=>{const q=BANK.find(x=>x.id===id);showGame();curRound={roundNo:1,total:30000};answered=false;locked=false;cur={q,start:performance.now()};deadline=performance.now()+30000;render(q);return !!q;},
 reveal:()=>cur.r.reveal(),score:()=>({myCorrect,opCorrect})};}
boot();
