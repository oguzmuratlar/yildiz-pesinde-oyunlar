<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Meteor Muhafızı</title>
<style>
:root{--c1:#ff8a3d;--c2:#3a5bd0;--deep:#102a6b;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:normal;text-align:center;width:92%;font-size:clamp(20px,6.6vw,26px);line-height:1.15}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}
.bin{min-width:0;border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px;max-width:100%;overflow-wrap:anywhere}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.mtr{position:absolute;width:12%;transform:translate(-50%,-50%) rotate(var(--r));z-index:3;pointer-events:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px #ff9a3a) drop-shadow(0 3px 3px rgba(5,10,40,.6));animation:mbob 2.4s var(--d) ease-in-out infinite}
.mtr svg{display:block;width:100%;height:auto}
@keyframes mbob{50%{transform:translate(-50%,-58%) rotate(var(--r))}}
.mtr.burn{animation:mburn .9s ease-in forwards}
@keyframes mburn{0%{filter:brightness(1.6) drop-shadow(0 0 10px #ffb03a)}35%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.2)}100%{transform:translate(260%,-420%) rotate(var(--r)) scale(.15,.05);opacity:0;filter:brightness(3) drop-shadow(0 0 12px #fff2b0)}}
.mspark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffe36a;box-shadow:0 0 6px #ff9a3a;z-index:4;pointer-events:none;transform:translate(-50%,-50%);animation:mspark .8s ease-out forwards}
@keyframes mspark{to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2);opacity:0}}
#boss.guard{filter:drop-shadow(0 0 12px #ff9a3a) drop-shadow(0 0 4px #ffe36a) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.mshower{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0}
.mshower i{position:absolute;top:-20%;width:5px;height:60px;border-radius:3px;background:linear-gradient(#fff6c0,#ff9a3a 50%,transparent);transform:rotate(30deg)}
.mshower i:nth-child(1){left:10%}.mshower i:nth-child(2){left:28%;animation-delay:.1s}.mshower i:nth-child(3){left:46%;animation-delay:.2s}.mshower i:nth-child(4){left:64%;animation-delay:.05s}.mshower i:nth-child(5){left:80%;animation-delay:.15s}.mshower i:nth-child(6){left:92%;animation-delay:.25s}
.mshower.on{animation:mshw 1.1s ease forwards}.mshower.on i{animation:mfall .8s ease-in forwards}
@keyframes mshw{0%,85%{opacity:1}100%{opacity:0}}
@keyframes mfall{to{transform:translate(-90px,260px) rotate(30deg)}}
#scene.mquake{animation:mqk .45s}
@keyframes mqk{20%{transform:translate(-4px,2px)}40%{transform:translate(4px,-2px)}60%{transform:translate(-3px,1px)}80%{transform:translate(2px,0)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>
<div id="conf" aria-hidden="true"></div>

rısı kısadır."]}, "textPlain": "Saf döl uzun boylu (UU) bir bezelye ile kısa boylu (uu) bir bezelye çaprazlanıyor. Oluşan bireyler nasıldır? Seçenekler: Hepsi uzun boyludur. / Hepsi kısa boyludur. / Yarısı uzun, yarısı kısadır.", "correctAnswer": "Hepsi uzun boyludur.", "explanation": "Bütün yavrular Uu genotipindedir; uzun boy baskın olduğu için hepsi uzun görünür."}, {"questionId": "boss-a13-f2-10", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Karşı zincir", "outcome": "Nükleotit, gen, DNA ve kromozom kavramlarını açıklar ve aralarındaki ilişkiyi model üzerinde gösterir.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "orta", "group": "f2", "rank": 2, "type": "choice", "prompt": "DNA’nın bir zincirinde bazlar A–T–G–S sırasıyla diziliyse karşı zincirdeki dizilim hangisidir?", "data": {"options": ["T–A–S–G", "A–T–G–S", "G–S–A–T"]}, "textPlain": "DNA’nın bir zincirinde bazlar A–T–G–S sırasıyla diziliyse karşı zincirdeki dizilim hangisidir? Seçenekler: T–A–S–G / A–T–G–S / G–S–A–T", "correctAnswer": "T–A–S–G", "explanation": "A’nın karşısına T, T’nin karşısına A, G’nin karşısına S, S’nin karşısına G gelir."}, {"questionId": "boss-a13-f2-11", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Saf döl ve melez", "outcome": "Kalıtımla ilgili kavramları kullanarak tek karakter çaprazlamalarının sonuçlarını tahmin eder.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "orta", "group": "f2", "rank": 2, "type": "sort2", "prompt": "Genotipleri saf döl ve melez diye ayır.", "data": {"bins": ["Saf döl", "Melez"], "items": [["AA", 0], ["Aa", 1], ["aa", 0], ["Bb", 1], ["BB", 0]]}, "textPlain": "Genotipleri saf döl ve melez diye ayır. (Saf döl / Melez) Kartlar: AA; Aa; aa; Bb; BB.", "correctAnswer": "Saf döl: AA, aa, BB. Melez: Aa, Bb.", "explanation": "Aynı iki geni taşıy te “DNA ve Genetik Kod”", "difficulty": "orta", "group": "f2", "rank": 2, "type": "order", "prompt": "DNA’nın kendini eşlemesinin adımlarını sırala.", "data": {"items": ["DNA’nın iki zinciri fermuar gibi birbirinden ayrılır.", "Serbest nükleotitler açılan zincirlerin karşısına yerleşir.", "Birbirinin aynısı iki DNA molekülü oluşur."]}, "textPlain": "DNA’nın kendini eşlemesinin adımlarını sırala. Kartlar: Birbirinin aynısı iki DNA molekülü oluşur.; Serbest nükleotitler açılan zincirlerin karşısına yerleşir.; DNA’nın iki zinciri fermuar gibi birbirinden ayrılır..", "correctAnswer": "DNA’nın iki zinciri fermuar gibi birbirinden ayrılır. → Serbest nükleotitler açılan zincirlerin karşısına yerleşir. → Birbirinin aynısı iki DNA molekülü oluşur.", "explanation": "Önce zincirler ayrılır, sonra her zincirin karşısına uygun nükleotitler gelir; sonunda iki özdeş DNA oluşur."}, {"questionId": "boss-a13-f2-15", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Çekinik olasılık", "outcome": "Kalıtımla ilgili kavramları kullanarak tek karakter çaprazlamalarının sonuçlarını tahmin eder.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Aa genotipli iki birey çaprazlanıyor. Oluşacak bireyin çekinik özellikte (aa) olma olasılığı yüzde kaçtır?", "data": {"options": ["%25", "%50", "%75"]}, "textPlain": "Aa genotipli iki birey çaprazlanıyor. Oluşacak bireyin çekinik özellikte (aa) olma olasılığı yüzde kaçtır? Seçenekler: %25 / %50 / %75", "correctAnswer": "%25", "explanation": "Aa × Aa → AA, Aa, Aa, aa. Dört olasılıktan biri aa’dır: %25."}, {"questionId": "boss-a13-f2-16", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Adenin sayısı", "outcome": "DNA’nın kendini nasıl eşlediğini ifade eder; baz eşleşme kuralını kullanır.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "zor", "group": "f2", "rank": 3, "type": "num", "prompt": "120 nükleotitten oluşan bir DNA molekülünde 35 guanin vardır. Bu molekülde kaç adenin bulunur?", "data": {"answer": 25, "digits": 2, "unit": ""}, "textPlain": "120 nükleotitten oluşan bir DNA molekülünde 35 guanin vardır. Bu molekülde kaç adenin bulunur?", "correctAnswer": "25", "explanation": "G = S = 35 → 70 nükleotit. Kalan 120 − 70 = 50 nükleotitin yarısı adenin, yarısı timindir: 25 adenin."}, {"questionId": "boss-a13-f2-17", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Kelebekler", "outcome": "Mutasyon ve modifikasyonu ayırt eder; adaptasyon ve doğal seçilimi örneklerle açıklar.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Bir bölgede koyu renkli kelebekler kuşlar tarafından daha az fark edildiği için zamanla sayıları arttı. Bu durum hangisine örnektir?", "data": {"options": ["Doğal seçilim", "Modifikasyon", "Klonlama"]}, "textPlain": "Bir bölgede koyu renkli kelebekler kuşlar tarafından daha az fark edildiği için zamanla sayıları arttı. Bu durum hangisine örnektir? Seçenekler: Doğal seçilim / Modifikasyon / Klonlama", "correctAnswer": "Doğal seçilim", "explanation": "Ortama daha uygun özellikteki bireylerin hayatta kalıp daha çok yavru bırakması doğal seçilimdir."}, {"questionId": "boss-a13-f2-18", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Gen tedavisi", "outcome": "Biyoteknoloji uygulamalarını (klonlama, gen aktarımı, gen tedavisi, ıslah) örneklerle açıklar ve olası etkilerini tartışır.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "zor", "group": "f2", "rank": 3, "type": "tf", "prompt": "Gen tedavisinde hastaya ait hatalı genin yerine sağlıklı gen konmaya çalışılır.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Gen tedavisinde hastaya ait hatalı genin yerine sağlıklı gen konmaya çalışılır.", "correctAnswer": "Doğru", "explanation": "Gen tedavisi, hastalığa neden olan hatalı genin onarılması ya da sağlıklı genle değiştirilmesidir."}, {"questionId": "boss-a13-f2-19", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Gen aktarımı ve ıslah", "outcome": "Biyoteknoloji uygulamalarını (klonlama, gen aktarımı, gen tedavisi, ıslah) örneklerle açıklar ve olası etkilerini tartışır.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "zor", "group": "f2", "rank": 3, "type": "sort2", "prompt": "Uygulamaları gen aktarımı ve ıslah diye ayır.", "data": {"bins": ["Gen aktarımı", "Islah"], "items": [["Bakteriden alınan genle zararlılara dayanıklı bitki elde etmek", 0], ["En verimli inekleri seçip çiftleştirmek", 1], ["İnsan insülin genini bakteriye aktarmak", 0], ["En tatlı meyveli ağaçları seçerek çoğaltmak", 1], ["Soğuğa dayanıklı balık genini domatese aktarmak", 0]]}, "textPlain": "Uygulamaları gen aktarımı ve ıslah diye ayır. (Gen aktarımı / Islah) Kartlar: Bakteriden alınan genle zararlılara dayanıklı bitki elde etmek; En verimli inekleri seçip çiftleştirmek; İnsan insülin genini bakteriye aktarmak; En tatlı meyveli ağaçları seçerek çoğaltmak; Soğuğa dayanıklı balık genini domatese aktarmak.", "correctAnswer": "Gen aktarımı: Bakteriden alınan genle zararlılara dayanıklı bitki elde etmek, İnsan insülin genini bakteriye aktarmak, Soğuğa dayanıklı balık genini domatese aktarmak. Islah: En verimli inekleri seçip çiftleştirmek, En tatlı meyveli ağaçları seçerek çoğaltmak.", "explanation": "Gen aktarımında bir canlıya başka bir canlının geni eklenir; ıslahta istenen bireyler seçilerek çoğaltılır."}, {"questionId": "boss-a13-f2-20", "grade": 8, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: DNA ve Genetik Kod", "topic": "Mavi gözlü çocuk", "outcome": "Kalıtımla ilgili kavramları kullanarak tek karakter çaprazlamalarının sonuçlarını tahmin eder.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Kahverengi göz (K) baskın, mavi göz (k) çekiniktir. Kahverengi gözlü anne ve babanın mavi gözlü bir çocuğu oldu. Anne ve babanın genotipi nedir?", "data": {"options": ["İkisi de Kk", "İkisi de KK", "Biri KK, diğeri kk"]}, "textPlain": "Kahverengi göz (K) baskın, mavi göz (k) çekiniktir. Kahverengi gözlü anne ve babanın mavi gözlü bir çocuğu oldu. Anne ve babanın genotipi nedir? Seçenekler: İkisi de Kk / İkisi de KK / Biri KK, diğeri kk", "correctAnswer": "İkisi de Kk", "explanation": "Mavi gözlü çocuk kk’dir; k genini anne ve babanın her birinden almıştır. Kahverengi gözlü oldukları için ikisi de Kk’dir."}, {"questionId": "boss-a13-m1-01", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Çarpan sayısı", "outcome": "Verilen pozitif tam sayıların pozitif tam sayı çarpanlarını bulur; pozitif tam sayıların asal çarpanlarını üslü ifadelerin çarpımı şeklinde yazar.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "num", "prompt": "36 sayısının kaç tane pozitif tam sayı çarpanı vardır?", "data": {"answer": 9, "digits": 1, "unit": ""}, "textPlain": "36 sayısının kaç tane pozitif tam sayı çarpanı vardır?", "correctAnswer": "9", "explanation": "36’nın çarpanları: 1, 2, 3, 4, 6, 9, 12, 18, 36 → 9 tane."}, {"questionId": "boss-a13-m1-02", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Asal çarpanlar", "outcome": "Verilen pozitif tam sayıların pozitif tam sayı çarpanlarını bulur; pozitif tam sayıların asal çarpanlarını üslü ifadelerin çarpımı şeklinde yazar.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "choice", "prompt": "60 sayısının asal çarpanlarına ayrılmış biçimi hangisidir?", "data": {"options": ["2² · 3 · 5", "2 · 3 · 10", "4 · 15"]}, "textPlain": "60 sayısının asal çarpanlarına ayrılmış biçimi hangisidir? Seçenekler: 2² · 3 · 5 / 2 · 3 · 10 / 4 · 15", "correctAnswer": "2² · 3 · 5", "explanation": "60 = 2 · 2 · 3 · 5 = 2² · 3 · 5. 10 ve 4 asal değildir."}, {"questionId": "boss-a13-m1-03", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EBOB", "outcome": "İki doğal sayının EBOB’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "num", "prompt": "12 ve 18 sayılarının EBOB’u kaçtır?", "data": {"answer": 6, "digits": 1, "unit": ""}, "textPlain": "12 ve 18 sayılarının EBOB’u kaçtır?", "correctAnswer": "6", "explanation": "12 = 2² · 3, 18 = 2 · 3². Ortak asal çarpanların en küçük üslüleri: 2 · 3 = 6."}, {"questionId": "boss-a13-m1-04", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EKOK", "outcome": "İki doğal sayının EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "num", "prompt": "4 ve 6 sayılarının EKOK’u kaçtır?", "data": {"answer": 12, "digits": 2, "unit": ""}, "textPlain": "4 ve 6 sayılarının EKOK’u kaçtır?", "correctAnswer": "12", "explanation": "4 = 2², 6 = 2 · 3. EKOK = 2² · 3 = 12."}, {"questionId": "boss-a13-m1-05", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Aralarında asal", "outcome": "Verilen iki doğal sayının aralarında asal olup olmadığını belirler.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "tf", "prompt": "8 ve 9 sayıları aralarında asaldır.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? 8 ve 9 sayıları aralarında asaldır.", "correctAnswer": "Doğru", "explanation": "8 ile 9’un 1’den başka ortak böleni yoktur; asal olmasalar da aralarında asaldırlar."}, {"questionId": "boss-a13-m1-06", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Aralarında asal mı", "outcome": "Verilen iki doğal sayının aralarında asal olup olmadığını belirler.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "sort2", "prompt": "Sayı çiftlerini ayır.", "data": {"bins": ["Aralarında asal", "Aralarında asal değil"], "items": [["8 ve 15", 0], ["6 ve 9", 1], ["7 ve 20", 0], ["10 ve 25", 1], ["14 ve 21", 1]]}, "textPlain": "Sayı çiftlerini ayır. (Aralarında asal / Aralarında asal değil) Kartlar: 8 ve 15; 6 ve 9; 7 ve 20; 10 ve 25; 14 ve 21.", "correctAnswer": "Aralarında asal: 8 ve 15, 7 ve 20. Aralarında asal değil: 6 ve 9, 10 ve 25, 14 ve 21.", "explanation": "Ortak bölenleri yalnızca 1 olan sayılar aralarında asaldır. 6–9 (3), 10–25 (5), 14–21 (7) ortak bölen taşır."}, {"questionId": "boss-a13-m1-07", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Asal sayı", "outcome": "Verilen pozitif tam sayıların pozitif tam sayı çarpanlarını bulur; pozitif tam sayıların asal çarpanlarını üslü ifadelerin çarpımı şeklinde yazar.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "choice", "prompt": "Hangisi asal sayıdır?", "data": {"options": ["29", "27", "39"]}, "textPlain": "Hangisi asal sayıdır? Seçenekler: 29 / 27 / 39", "correctAnswer": "29", "explanation": "27 = 3 · 9 ve 39 = 3 · 13’tür. 29’un 1 ve kendisinden başka böleni yoktur."}, {"questionId": "boss-a13-m1-08", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Kurdeleler", "outcome": "İki doğal sayının EBOB ve EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "num", "prompt": "24 cm ve 36 cm uzunluğundaki iki kurdele, hiç artmayacak biçimde birbirine eşit ve olabildiğince uzun parçalara kesiliyor. Toplam kaç parça elde edilir?", "data": {"answer": 5, "digits": 1, "unit": ""}, "textPlain": "24 cm ve 36 cm uzunluğundaki iki kurdele, hiç artmayacak biçimde birbirine eşit ve olabildiğince uzun parçalara kesiliyor. Toplam kaç parça elde edilir?", "correctAnswer": "5", "explanation": "Parça uzunluğu EBOB(24, 36) = 12 cm. 24 ÷ 12 = 2, 36 ÷ 12 = 3; toplam 5 parça."}, {"questionId": "boss-a13-m1-09", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Otobüsler", "outcome": "İki doğal sayının EBOB ve EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "num", "prompt": "İki otobüs 12 ve 18 dakikada bir kalkıyor. Saat 08.00’de birlikte kalktılar. En az kaç dakika sonra yeniden birlikte kalkarlar?", "data": {"answer": 36, "digits": 2, "unit": "dk"}, "textPlain": "İki otobüs 12 ve 18 dakikada bir kalkıyor. Saat 08.00’de birlikte kalktılar. En az kaç dakika sonra yeniden birlikte kalkarlar?", "correctAnswer": "36 dk", "explanation": "EKOK(12, 18) = 36 dakika sonra."}, {"questionId": "boss-a13-m1-10", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EBOB ve EKOK ilişkisi", "outcome": "İki doğal sayının EBOB’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "choice", "prompt": "İki sayının EBOB’u 6, EKOK’u 72’dir. Sayılardan biri 18 ise diğeri kaçtır?", "data": {"options": ["24", "12", "36"]}, "textPlain": "İki sayının EBOB’u 6, EKOK’u 72’dir. Sayılardan biri 18 ise diğeri kaçtır? Seçenekler: 24 / 12 / 36", "correctAnswer": "24", "explanation": "İki sayının çarpımı EBOB · EKOK’a eşittir: 18 · x = 6 · 72 = 432 → x = 24."}, {"questionId": "boss-a13-m1-11", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EKOK yanılgısı", "outcome": "İki doğal sayının EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "tf", "prompt": "İki sayının EKOK’u her zaman bu iki sayının çarpımına eşittir.", "data": {"truth": false}, "textPlain": "Doğru mu yanlış mı? İki sayının EKOK’u her zaman bu iki sayının çarpımına eşittir.", "correctAnswer": "Yanlış", "explanation": "Bu yalnızca sayılar aralarında asalsa doğrudur. Örneğin EKOK(4, 6) = 12’dir, 4 · 6 = 24 değildir."}, {"questionId": "boss-a13-m1-12", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Asal çarpanlara ayırma", "outcome": "Verilen pozitif tam sayıların pozitif tam sayı çarpanlarını bulur; pozitif tam sayıların asal çarpanlarını üslü ifadelerin çarpımı şeklinde yazar.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "match", "prompt": "Sayıları asal çarpanlara ayrılmış biçimleriyle eşleştir.", "data": {"pairs": [["18", "2 · 3²"], ["20", "2² · 5"], ["45", "3² · 5"]]}, "textPlain": "Sayıları asal çarpanlara ayrılmış biçimleriyle eşleştir. Sol: 18; 20; 45. Sağ: 2 · 3²; 2² · 5; 3² · 5.", "correctAnswer": "18 = 2 · 3²; 20 = 2² · 5; 45 = 3² · 5", "explanation": "18 = 2 · 9, 20 = 4 · 5, 45 = 9 · 5."}, {"questionId": "boss-a13-m1-13", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EBOB(48, 60)", "outcome": "İki doğal sayının EBOB’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "num", "prompt": "48 ve 60 sayılarının EBOB’u kaçtır?", "data": {"answer": 12, "digits": 2, "unit": ""}, "textPlain": "48 ve 60 sayılarının EBOB’u kaçtır?", "correctAnswer": "12", "explanation": "48 = 2⁴ · 3, 60 = 2² · 3 · 5. EBOB = 2² · 3 = 12."}, {"questionId": "boss-a13-m1-14", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Aralarında asalların EBOB’u", "outcome": "Verilen iki doğal sayının aralarında asal olup olmadığını belirler.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "orta", "group": "m1", "rank": 2, "type": "choice", "prompt": "Aralarında asal iki sayının EBOB’u kaçtır?", "data": {"options": ["1", "0", "Sayıların çarpımı"]}, "textPlain": "Aralarında asal iki sayının EBOB’u kaçtır? Seçenekler: 1 / 0 / Sayıların çarpımı", "correctAnswer": "1", "explanation": "Aralarında asal sayıların tek ortak böleni 1’dir; EBOB’ları 1, EKOK’ları çarpımlarıdır."}, {"questionId": "boss-a13-m1-15", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Kare parseller", "outcome": "İki doğal sayının EBOB ve EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "zor", "group": "m1", "rank": 3, "type": "num", "prompt": "60 m’ye 84 m’lik dikdörtgen bir arazi, hiç artmayacak biçimde eşit ve olabildiğince büyük kare parsellere bölünüyor. Kaç parsel elde edilir?", "data": {"answer": 35, "digits": 2, "unit": ""}, "textPlain": "60 m’ye 84 m’lik dikdörtgen bir arazi, hiç artmayacak biçimde eşit ve olabildiğince büyük kare parsellere bölünüyor. Kaç parsel elde edilir?", "correctAnswer": "35", "explanation": "Kare kenarı EBOB(60, 84) = 12 m. 60 ÷ 12 = 5, 84 ÷ 12 = 7; 5 · 7 = 35 parsel."}, {"questionId": "boss-a13-m1-16", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Bir kişi artıyor", "outcome": "İki doğal sayının EBOB ve EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "zor", "group": "m1", "rank": 3, "type": "num", "prompt": "Bir gruptaki kişiler 4’erli, 6’şarlı ya da 9’arlı takımlara ayrıldığında her seferinde 1 kişi artıyor. Gruptaki kişi sayısı 40’tan az olduğuna göre kaçtır?", "data": {"answer": 37, "digits": 2, "unit": ""}, "textPlain": "Bir gruptaki kişiler 4’erli, 6’şarlı ya da 9’arlı takımlara ayrıldığında her seferinde 1 kişi artıyor. Gruptaki kişi sayısı 40’tan az olduğuna göre kaçtır?", "correctAnswer": "37", "explanation": "EKOK(4, 6, 9) = 36; her seferinde 1 kişi arttığına göre 36 + 1 = 37."}, {"questionId": "boss-a13-m1-17", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EKOK’tan sayı bulma", "outcome": "İki doğal sayının EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "zor", "group": "m1", "rank": 3, "type": "choice", "prompt": "EKOK(a, 15) = 45’tir. a sayısı hangisi olabilir?", "data": {"options": ["9", "5", "30"]}, "textPlain": "EKOK(a, 15) = 45’tir. a sayısı hangisi olabilir? Seçenekler: 9 / 5 / 30", "correctAnswer": "9", "explanation": "EKOK(9, 15) = 45’tir. EKOK(5, 15) = 15, EKOK(30, 15) = 30 olur."}, {"questionId": "boss-a13-m1-18", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Asal çarpanlar", "outcome": "Verilen pozitif tam sayıların pozitif tam sayı çarpanlarını bulur; pozitif tam sayıların asal çarpanlarını üslü ifadelerin çarpımı şeklinde yazar.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "zor", "group": "m1", "rank": 3, "type": "tf", "prompt": "Asal çarpanları yalnızca 2, 3 ve 5 olan her sayı 30’un katıdır.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Asal çarpanları yalnızca 2, 3 ve 5 olan her sayı 30’un katıdır.", "correctAnswer": "Doğru", "explanation": "Sayı 2, 3 ve 5’in her birine bölünür; bu üç asal sayının çarpımı 30 olduğundan sayı 30’un katıdır."}, {"questionId": "boss-a13-m1-19", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "EBOB mu EKOK mu", "outcome": "İki doğal sayının EBOB’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "zor", "group": "m1", "rank": 3, "type": "sort2", "prompt": "Problemleri çözüm yoluna göre ayır.", "data": {"bins": ["EBOB ile çözülür", "EKOK ile çözülür"], "items": [["Kumaşları artmadan en büyük eşit parçalara bölmek", 0], ["Farklı aralıklarla yanan lambaların birlikte yanacağı anı bulmak", 1], ["Dikdörtgen zemine en büyük kare karoları döşemek", 0], ["Hem 3’erli hem 5’erli sıralanabilen en küçük grubu bulmak", 1], ["Elma ve armutları eşit, en kalabalık paketlere ayırmak", 0]]}, "textPlain": "Problemleri çözüm yoluna göre ayır. (EBOB ile çözülür / EKOK ile çözülür) Kartlar: Kumaşları artmadan en büyük eşit parçalara bölmek; Farklı aralıklarla yanan lambaların birlikte yanacağı anı bulmak; Dikdörtgen zemine en büyük kare karoları döşemek; Hem 3’erli hem 5’erli sıralanabilen en küçük grubu bulmak; Elma ve armutları eşit, en kalabalık paketlere ayırmak.", "correctAnswer": "EBOB ile çözülür: Kumaşları artmadan en büyük eşit parçalara bölmek, Dikdörtgen zemine en büyük kare karoları döşemek, Elma ve armutları eşit, en kalabalık paketlere ayırmak. EKOK ile çözülür: Farklı aralıklarla yanan lambaların birlikte yanacağı anı bulmak, Hem 3’erli hem 5’erli sıralanabilen en küçük grubu bulmak.", "explanation": "Parçalama ve paylaştırma (en büyük ortak parça) EBOB, birlikte tekrar etme ve ortak kat bulma EKOK ile çözülür."}, {"questionId": "boss-a13-m1-20", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "1. Ünite: Çarpanlar ve Katlar", "topic": "Üç zil", "outcome": "İki doğal sayının EBOB ve EKOK’unu hesaplar, ilgili problemleri çözer.", "sourceRef": "8. Sınıf Öğretim Programı, 1. Ünite “Çarpanlar ve Katlar”", "difficulty": "zor", "group": "m1", "rank": 3, "type": "choice", "prompt": "Üç zil 10, 15 ve 20 dakikada bir çalıyor. Saat 09.00’da birlikte çaldılar. Bir sonraki birlikte çalış saat kaçta olur?", "data": {"options": ["10.00", "09.30", "10.30"]}, "textPlain": "Üç zil 10, 15 ve 20 dakikada bir çalıyor. Saat 09.00’da birlikte çaldılar. Bir sonraki birlikte çalış saat kaçta olur? Seçenekler: 10.00 / 09.30 / 10.30", "correctAnswer": "10.00", "explanation": "EKOK(10, 15, 20) = 60 dakika; 09.00 + 60 dk = 10.00."}, {"questionId": "boss-a13-m2-01", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "2. Ünite: Üslü İfadeler", "topic": "Negatif tabanın çift kuvveti", "outcome": "Tam sayıların, tam sayı kuvvetlerini hesaplar; üslü ifadelerle ilgili temel kuralları anlar, birbirine denk ifadeler oluşturur.", "sourceRef": "8. Sınıf Öğretim Programı, 2. Ünite “Üslü İfadeler”", "difficulty": "kolay", "group": "m2", "rank": 1, "type": "num", "prompt": "(−2)⁴ ifadesinin değeri kaçtır?", "data": {"answer": 16, "digits": 2, "unit": ""}, "textPlain": "(−2)⁴ ifadesinin değeri kaçtır?", "correctAnswer": "16", "explanation": "(−2)⁴ = (−2)(−2)(−2)(−2) = 16. Negatif sayının çift kuvveti pozitiftir."}, {"questionId": "boss-a13-m2-02", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "2. Ünite: Üslü İfadeler", "topic": "Negatif üs", "outcome": "Tam sayıların, tam sayı kuvvetlerini hesaplar; üslü ifadelerle ilgili temel kuralları anlar, birbirine denk ifadeler oluşturur.", "sourceR <script>
"use strict";
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),BOSS=JSON.parse($('boss-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;
const SUBJ={science:['🔬','Fen'],math:['📐','Matematik'],turkish:['📖','Türkçe']},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};

const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}

function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}

function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}

function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}

function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});
  const cnt=[0,0,0,0];al.forEach(a=>a.ranks.forEach(r=>cnt[r]++));const d=Math.abs(cnt[1]-4)+Math.abs(cnt[2]-4)+Math.abs(cnt[3]-4);if(d<bd){bd=d;best=al;}if(d===0)break;}
 return best;}
function buildDeck(){const rec=new Set(recent()),plan=deckPlan();
 let chosen=null,cs=-1;for(let t=0;t<80;t++){const c=[];let fr=0;plan.forEach(a=>a.ranks.forEach(r=>{const pool=BANK.filter(q=>q.group===a.u&&q.rank===r&&!c.includes(q));const fresh=pool.filter(q=>!rec.has(q.questionId));const q=shuffle(t<40&&fresh.length?fresh:pool)[0];if(!rec.has(q.questionId))fr++;c.push(q);}));
  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
 let best=null,bs=1e9;
 for(let t=0;t<400;t++){const seq=[1,2,3].flatMap(r=>shuffle(chosen.filter(q=>q.rank===r)));let s=0;for(let i=1;i<seq.length;i++){if(seq[i].subjectId===seq[i-1].subjectId)s+=3;if(seq[i].type===seq[i-1].type)s+=1;}if(s<bs){bs=s;best=seq;}if(s===0)break;}
 return best;}

 return {el,check:()=>({ok:val()===d.answer,student:(dec?(val()/10**dec).toFixed(dec).replace('.',','):fmt(val()))+(d.unit?(d.unit==='°'?'°':' '+d.unit):'')}),reveal:()=>{const p=document.createElement('div');p.className='numans';p.innerHTML='Doğru cevap: '+rich(q.correctAnswer);el.appendChild(p);},
  auto:ok=>{const s=String(ok?d.answer:d.answer+1).padStart(n,'0').slice(-n);s.split('').forEach((c,i)=>v[i]=+c);touched=true;draw();}};};

function start(){if(state!=='ready')return;state='playing';deck=buildDeck();remember(deck.map(q=>q.questionId));pos=0;answers=[];okCount=0;badCount=0;defeated=false;activeMs=0;lastTick=performance.now();setupScene();
 $('intro').classList.add('hidden');$('app').removeAttribute('aria-hidden');const g=$('gate');$('gateText').textContent=BOSS.gate;g.classList.remove('on');void g.offsetWidth;if(!reduced()){g.classList.add('on');sfx('roar');}show();}
function show(){checked=false;cur=deck[pos];const q=cur;$('prog').textContent=`${pos+1}/${TOTAL}`;$('fb').classList.add('hidden');$('next').classList.add('hidden');const go=$('go');go.classList.remove('hidden');go.disabled=true;go.textContent=BOSS.attack;
 const C=$('card');C.scrollTop=0;C.innerHTML=`${q.data.passage?`<div class="passage">${rich(q.data.passage)}</div>`:''}${fig(q.data.fig)}<div class="prompt">${rich(q.prompt)}</div>`;
 cur.r=R[q.type](q);C.appendChild(cur.r.el);}

 const a=r.ok?{questionId:q.questionId,isCorrect:true,subjectId:q.subjectId}:{questionId:q.questionId,isCorrect:false,subjectId:q.subjectId,questionText:plain(q.textPlain),studentAnswer:r.student,correctAnswer:plain(q.correctAnswer),unit:q.unit,topic:q.topic,outcome:q.outcome,sourceRef:q.sourceRef,explanation:plain(q.explanation)};
 answers.push(a);cur.r.reveal();$('go').classList.add('hidden');
 const fb=$('fb');fb.className=r.ok?'ok':'bad';
 if(r.ok){sfx('ok');hitBoss();fly(defeated&&okCount>WIN?'+ Bonus':'+1 💥',$('next'));fb.innerHTML=`<h3>✓ ${esc(pickMsg(BOSS.okMsgs))}</h3>${okCount>WIN?esc(BOSS.bonusMsg||'Bonus puan!'):''}`;}
 else{sfx('bad');missBoss();fb.innerHTML=`<h3>✗ ${esc(pickMsg(BOSS.badMsgs))}</h3><div><b>Doğru cevap:</b> ${rich(q.correctAnswer)}</div><div style="margin-top:4px">${rich(q.explanation)}</div>`;}
 $('live').textContent=r.ok?'Doğru':'Yanlış. Doğru cevap: '+plain(q.correctAnswer);
 $('next').classList.remove('hidden');$('next').textContent=pos===TOTAL-1?'Sonucu Gör 🏁':'Devam ▶';$('next').focus({preventScroll:true});}

$('go').onclick=()=>{unlockAudio();check();};

 if(n<WIN){const b=$('boss');b.classList.remove('hit','laugh');b.classList.add('gone');sfx('splat');}

function complete(){if(sent||result||answers.length!==TOTAL)return;state='completed';const n=answers.filter(a=>a.isCorrect).length,st=stars(n),win=n>=WIN;
 result={bridgeVersion:'1.0',type:'game.completed',messageId:uid('result'),runId:ctx.runId,nonce:ctx.nonce,payload:{gameId:ctx.gameId,gameVersion:ctx.gameVersion,grade:ctx.grade,gameName:GAME_NAME,subjectId:ctx.subjectId||'mixed',subjectName:ctx.subjectName||'Karışık',stars:st,correctCount:n,wrongCount:TOTAL-n,totalQuestions:TOTAL,durationMs:Math.max(0,Math.round(activeMs)),answers:structuredClone(answers)}};
 const title=win?(n===TOTAL?BOSS.endPerfect:BOSS.endWin):n>=8?BOSS.endClose:BOSS.endLose;
 const body=`<div class="ct">${esc(BOSS.arena.toLocaleUpperCase('tr-TR'))}</div><img class="endimg" src="${win?BOSS.img.def:BOSS.img.idle}" alt="" style="${win?'':'opacity:.85;filter:saturate(.7)'}"><h2 id="sheetTitle">${esc(title)}</h2><div class="stars3" aria-label="${st} yıldız">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}" style="animation-delay:${.2+i*.2}s">★</span>`).join('')}</div><div class="pearls" aria-hidden="true">${answers.map(a=>`<i class="${a.isCorrect?'':'x'}"></i>`).join('')}</div><div class="stats"><div><b>${n}/${TOTAL}</b><span>doğru</span></div><div><b>${Math.round(activeMs/1000)} sn</b><span>süre</span></div></div><p class="fine">${win?esc(BOSS.winNote):`Canavarı yenmek için ${WIN} doğru gerekiyor.`}</p>`;
 if(nativeMode){openSheet(body+`<p id="saveStatus" class="status" role="status">Sonucun uygulamaya iletiliyor…</p>`);if(!sent)sent=send(result);if(!sent)$('saveStatus').textContent='Sonuç uygulamaya iletilemedi. Uygulamadan oyunu yeniden açmayı dene.';}
 else{sent=true;openSheet(body+`<p id="saveStatus" class="fine">Deneme modu: Sonuç uygulamaya kaydedilmedi.</p><button class="primary" id="retry">YENİDEN SAVAŞ ⚔️</button>`);$('retry').onclick=()=>{unlockAudio();closeSheet();if(demoInit())start();};}
 if(win){sfx('win');confetti(reduced()?0:60);}}

 auto(ok){cur.r.auto(ok);},check,
 deckTest(n){const out=[];for(let i=0;i<n;i++){const d=buildDeck();const allU=(BOSS.split?BOSS.split.flatMap(g=>g.units):BOSS.units);const sub={};d.forEach(q=>sub[q.subjectId]=(sub[q.subjectId]||0)+1);out.push({ranks:d.map(q=>q.rank).join(''),units:new Set(d.map(q=>q.group)).size,allUnits:allU.length,subj:sub,perUnit:Math.min(...allU.map(u=>d.filter(q=>q.group===u).length)),adjSubj:d.filter((q,i)=>i&&q.subjectId===d[i-1].subjectId).length,types:new Set(d.map(q=>q.type)).size});}return out;}};
