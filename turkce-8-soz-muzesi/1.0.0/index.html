<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Söz Müzesi</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}

.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}

#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}

.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}
#go:disabled{filter:grayscale(.8);opacity:.5;box-shadow:0 3px 0 #6a0a3e}
#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}

#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}

.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}

.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}

.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}

.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:linear-gradient(180deg,#2a1230 0,#4a1f44 58%,#d8cfc4 58%,#b8aea2 100%)}
.marble{position:absolute;left:0;right:0;bottom:0;height:42%;background:repeating-linear-gradient(135deg,#ffffff22 0 2px,transparent 2px 60px),repeating-linear-gradient(45deg,#00000010 0 1px,transparent 1px 80px)}
.blk{position:absolute;inset:0;background:#05020a;z-index:5;pointer-events:none}
#gate.on .blk{animation:blk8 2.4s .3s forwards}@keyframes blk8{0%{opacity:1;-webkit-mask:radial-gradient(circle at 10% 50%,transparent 0 50px,#000 90px);mask:radial-gradient(circle at 10% 50%,transparent 0 50px,#000 90px)}40%{opacity:1;-webkit-mask:radial-gradient(circle at 80% 30%,transparent 0 60px,#000 100px);mask:radial-gradient(circle at 80% 30%,transparent 0 60px,#000 100px)}70%{opacity:1;-webkit-mask:radial-gradient(circle at 40% 40%,transparent 0 70px,#000 110px);mask:radial-gradient(circle at 40% 40%,transparent 0 70px,#000 110px)}100%{opacity:0;-webkit-mask:none;mask:none}}
.gfr{position:absolute;top:16%;width:24%;aspect-ratio:3/4;border:7px solid #c8a050;outline:2px solid #7a5a20;background:#3a2a40;display:grid;place-items:center;font-size:clamp(24px,8vw,36px);z-index:2;box-shadow:0 10px 18px #0008}
.gfr::before{content:"";position:absolute;left:50%;top:-60%;width:140%;height:70%;margin-left:-70%;background:linear-gradient(180deg,transparent,#ffe8a855);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);opacity:0}
#gate.on .gfr::before{animation:fin .4s var(--d) forwards}@keyframes fin{to{opacity:1}}
.rope{position:absolute;left:4%;right:4%;top:62%;height:14px;border-radius:7px;background:repeating-linear-gradient(45deg,#a8202a 0 8px,#7a1018 8px 16px);z-index:3;transform-origin:0 50%}

.post{position:absolute;top:58%;width:14px;height:22%;background:linear-gradient(90deg,#c8a050,#f8d878,#a8802a);border-radius:7px 7px 2px 2px;z-index:3}
.plaque{position:absolute;left:50%;top:70%;transform:translate(-50%,0) scale(.3);opacity:0;z-index:4;font:900 clamp(22px,7.4vw,32px)/1 Georgia,serif;letter-spacing:2px;color:#3a2410;background:linear-gradient(180deg,#f8e0a0,#c8a050);border:3px solid #7a5a20;border-radius:6px;padding:10px 18px;white-space:nowrap;box-shadow:0 8px 20px #0008}

.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#fff4d8 40%,#c8a050 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#3a2410;background:linear-gradient(180deg,#fff0b8,#e8c060 55%,#b8902a);box-shadow:0 6px 0 #6a4a10;margin-top:6px}

.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}

#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,#2a1230 0,#4a1f44 58%,#d8cfc4 58%,#b8aea2 100%)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}
.otitle{position:absolute;left:50%;top:4%;transform:translateX(-50%);white-space:nowrap;z-index:7;font:900 clamp(20px,6.6vw,28px)/1 Georgia,serif;letter-spacing:2px;color:#3a2410;background:linear-gradient(180deg,#f8e0a0,#c8a050);border:3px solid #7a5a20;border-radius:6px;padding:8px 14px}
.gwall{position:absolute;left:5%;right:5%;top:15%;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);gap:4%}
.of{aspect-ratio:3/4;border:5px solid #c8a050;outline:1px solid #7a5a20;background:#1a0e20;display:grid;place-items:center;font-size:clamp(18px,6vw,28px);opacity:.25;box-shadow:0 6px 12px #0008}
.of.x{border-color:#8a8070;background:repeating-linear-gradient(45deg,#e8e0d0 0 6px,#d8d0c0 6px 12px)}
#outro.open .of{animation:ofi .35s var(--d) forwards}@keyframes ofi{to{opacity:1}}

/* Söz Müzesi teması */
:root{--mag:#7a1f5a;--mag2:#4a1038;--cyan:#c8a050;--cyan2:#7a5a20;--yel:#f8d878;--yel2:#a8802a;--ink:#2a1430;--ink2:#5a4060;--panel:#fffaf0}
#app{background:linear-gradient(180deg,#e8d8e4 0,#dccad8 70%,#cdb8c8 100%)}
#app::before{background-image:repeating-linear-gradient(90deg,#ffffff22 0 2px,transparent 2px 46px);opacity:1}
#app::after{display:none}
.chips{display:none!important}
.logo{font-family:Georgia,serif;font-style:normal;font-weight:900;color:#4a1038;letter-spacing:.5px;font-size:clamp(13px,4vw,18px);white-space:nowrap}
.logo b{color:#a8802a}
#card{box-shadow:0 0 0 3px #c8a050,0 0 0 6px #7a5a20,0 8px 18px #0003;background:var(--panel)}
#go{background:linear-gradient(180deg,#a83a7a,#7a1f5a 55%,#4a1038);color:#fff;box-shadow:0 5px 0 #2a0820}
#go:disabled{box-shadow:0 3px 0 #a898a8;color:#e8d0e0}
#next{background:linear-gradient(180deg,#f8e0a0,#c8a050);box-shadow:0 4px 0 #6a4a10;color:#3a2410}
.opt{box-shadow:0 3px 0 #d8c8d8}.opt.sel{background:#fff4e0;border-color:#c8a050}
.tok{box-shadow:0 3px 0 #d8c8d8,0 4px 8px #0002}.tok.used{opacity:.5}
.tray{border-color:#7a1f5a;background:#ffffffaa}
.prow{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}.prow .opt{padding:8px 12px}
.hint2{text-align:center;font-size:12px;font-weight:800;color:#6a4a6a}
.xtag{align-self:center;text-align:center;font:900 12.5px/1.2 var(--show);letter-spacing:.5px;color:#fff8e0;background:#7a1f5a;border-radius:999px;padding:7px 14px}
/* spot */
.canvas8{position:relative;border:8px solid #c8a050;outline:2px solid #7a5a20;background:linear-gradient(135deg,#f8ecd8,#e8d4b8);padding:22px 10px;overflow:hidden;user-select:none;cursor:crosshair;min-height:130px;display:grid;place-items:center}
.cvw{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.cch{font:800 clamp(17px,5.2vw,21px)/1.2 Georgia,serif;color:#2a1430;padding:6px 6px;border-radius:8px;transition:background .15s}
.cch.lit{background:#fff4b0;box-shadow:0 0 0 2px #e8b830}.cch.ok{background:#c8f0d0;box-shadow:0 0 0 3px #2a8a4a}.cch.bad{background:#ffd0d8;box-shadow:0 0 0 3px #c83a4a}.cch.want{box-shadow:0 0 0 3px #2a8a4a}
.dark8{position:absolute;inset:0;pointer-events:none;background:#0a0614e8;transition:opacity .3s}.dark8.off{opacity:0}
/* heykel */
.statue{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:16px 8px;border-radius:12px 12px 4px 4px;background:linear-gradient(180deg,#f4f0ea,#d8d0c4);border-bottom:10px solid #a89c8c;box-shadow:0 6px 12px #0002}
.marb{font:800 17px/1.2 Georgia,serif;color:#3a3028;padding:6px 4px}
.hole{min-width:72px;min-height:44px;border:2px dashed #8a7a6a;border-radius:6px;background:#e8e0d4;font:800 16px/1.1 Georgia,serif;color:#2a1430;padding:4px 8px;position:relative}
.hole::before{content:attr(data-r);position:absolute;left:50%;top:-9px;transform:translateX(-50%);font:900 8.5px/1 var(--show);background:#7a1f5a;color:#fff;border-radius:999px;padding:2px 6px;white-space:nowrap}
.hole.full{border-style:solid;background:#fff}.hole.ok{background:#c8f0d0;border-color:#2a8a4a}.hole.bad{background:#ffd0d8;border-color:#c83a4a}
.shards{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.shard{border:0;font:800 15.5px/1.1 Georgia,serif;color:#2a1430;background:linear-gradient(135deg,#ffffff,#d8d0c4);padding:11px 14px;min-height:44px;clip-path:polygon(6% 0,100% 8%,94% 100%,0 90%);box-shadow:0 3px 0 #a89c8c}
.shard.used{opacity:.3}
/* kadran */
.plinth{text-align:center;font:800 17px/1.4 Georgia,serif;color:#2a1430;background:#fffaf0;border:2px solid #c8a050;border-bottom:8px solid #a8802a;border-radius:8px;padding:10px}
/* rehber + plan */
.guide{display:flex;gap:8px;align-items:flex-start;background:#2a1430;color:#fff8e0;border-radius:12px;padding:10px;border:2px solid #c8a050}
.gic{font-size:24px;line-height:1}.gtx{font:700 14.5px/1.4 Georgia,serif;max-height:30vh;overflow:auto}.gtx p{margin:0 0 3px}
.plan{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:4px solid #4a1f44;border-radius:6px;background:#4a1f44}
.room{position:relative;border:0;outline:2px solid #4a1f44;background:#fffaf0;min-height:58px;font:900 13.5px/1.1 var(--show);color:#4a1038;padding:6px 3px}
.room .vis{position:absolute;right:3px;bottom:2px;font-style:normal;font-size:16px;opacity:0;transition:opacity .2s}
.room.sel{background:#fff0c0}.room.sel .vis{opacity:1;animation:wlk .4s}@keyframes wlk{from{transform:translateX(-20px)}}
.room.ok{background:#c8f0d0}.room.bad{background:#ffd0d8}.room.want{box-shadow:inset 0 0 0 3px #2a8a4a}
/* bilet */
.ticket{font:700 15px/1.45 Georgia,serif;color:#2a1430;background:#fff4dc;border:2px dashed #c8a050;border-radius:10px;padding:10px 12px}
.reelm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:linear-gradient(180deg,#7a1f5a,#4a1038);border-radius:14px;padding:8px;box-shadow:0 5px 0 #2a0820}.reelm.r4{grid-template-columns:repeat(2,1fr)}
.reel{display:flex;flex-direction:column;align-items:stretch;gap:3px}
.rlab{text-align:center;font:900 11px/1 var(--show);color:#f8d878;letter-spacing:1px}
.rarr{border:0;background:#c8a050;color:#3a2410;border-radius:6px;min-height:30px;font-size:13px}
.rwin{min-height:48px;background:#fffaf0;border-radius:6px;display:grid;place-items:center;text-align:center;font:800 13.5px/1.15 Georgia,serif;color:#2a1430;padding:4px;box-shadow:inset 0 4px 6px #0003}
.rwin.spin{animation:rsp .18s}@keyframes rsp{from{transform:translateY(-10px);opacity:.3}}
.rwin.ok{background:#c8f0d0}.rwin.bad{background:#ffd0d8}
/* şiir */
.poem{background:#fffaf0;border:2px solid #c8a050;border-radius:6px;padding:12px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 12px #0002}
.pl{font:italic 700 clamp(15px,4.6vw,18px)/1.3 Georgia,serif;color:#2a1430;display:flex;align-items:center;flex-wrap:wrap}
.pe{border:2px solid #d8c0d0;background:#fff;border-radius:999px;font:italic 900 clamp(15px,4.6vw,18px)/1 Georgia,serif;color:#4a1038;padding:8px 10px;min-height:40px;margin-left:2px}
.pe.tgt{background:#f8d878;border-color:#a8802a;box-shadow:0 0 12px #f8d878}
.pe.on{background:#7a1f5a;color:#fff;border-color:#4a1038}.pe.ok{background:#2a8a4a;color:#fff;border-color:#1a5a2a}.pe.bad{background:#c83a4a;color:#fff}.pe.want{box-shadow:0 0 0 3px #2a8a4a}
/* tablolar */
.wall8{display:flex;flex-direction:column;gap:9px}
.frm{border:6px solid #c8a050;outline:1px solid #7a5a20;background:#fffaf0;padding:10px 10px;text-align:left;font:700 14.5px/1.35 Georgia,serif;color:#2a1430;min-height:48px;display:flex;flex-direction:column;filter:brightness(.82);transition:filter .2s,box-shadow .2s}
.frm.lit{filter:none;box-shadow:0 0 0 3px #f8d878,0 0 24px #f8d878aa}.frm.ok{border-color:#2a8a4a;filter:none}.frm.bad{border-color:#c83a4a;filter:none}.frm.want{border-color:#2a8a4a;filter:none}
/* salonlar (bin) */
.vz{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:10px}.vz.v4{grid-template-columns:repeat(2,minmax(0,1fr))}
.vreg{border-radius:40px 40px 6px 6px;padding:18px 5px 6px;min-height:70px;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 #0002;position:relative}
.vreg.r0{background:#f8e8f0;border:2px solid #7a1f5a}.vreg.r1{background:#fff4dc;border:2px solid #a8802a}.vreg.r2{background:#e4eef8;border:2px solid #2a5a8a}.vreg.r3{background:#e8f5dc;border:2px solid #4a8a2a}
.vreg .bl{font:900 12px/1.15 var(--show);color:#2a1430;text-align:center}.vreg .ld{display:flex;flex-direction:column;gap:4px}.vreg .tok{font-size:12px;padding:4px 6px}
.sofr2{margin:6px 0 8px;padding:7px;border-radius:12px;background:#2a1430;color:#fff;border:2px solid #c8a050;text-align:center;animation:fbin .4s;display:flex;flex-direction:column;gap:5px;align-items:center}
.sofr2 .opt{padding:6px 12px;font:900 13.5px/1.1 var(--show)}.vt1{font:900 13px/1.3 var(--show);color:#f8d878}.vt2{font-size:12.5px;font-weight:800;color:#fff;margin-top:3px}
#app.rev #fb{max-height:44vh}#app.rev .shards,#app.rev .stage>.hint2{display:none}

 .canvas8{padding:12px 6px;min-height:100px;border-width:6px}.cch{font-size:15px;padding:4px}.statue{padding:12px 6px}.marb,.hole{font-size:14px}.hole{min-height:38px;min-width:60px}.shard{padding:8px 10px;font-size:14px;min-height:38px}
 .plinth{font-size:14.5px;padding:7px}.gtx{font-size:13px;max-height:24vh}.room{min-height:44px;font-size:12px}.ticket{font-size:13px;padding:7px 9px}.rwin{min-height:40px;font-size:12px}.rarr{min-height:26px}
 .pl,.pe{font-size:14px}.pe{min-height:34px;padding:6px 8px}.poem{padding:8px 8px;gap:3px}.frm{font-size:13px;padding:7px 8px}.wall8{gap:6px}}

 → hafif → Benzetme yönü","explanation":"Benzetme, aralarında ortak özellik bulunan iki varlıktan güçsüz olanı güçlü olana benzetmektir. Ögeleri: benzeyen (güçsüz olan), benzetilen (özelliği güçlü olan), benzetme yönü (ortak özellik), benzetme edatı (gibi, kadar, sanki…). Benzeyen ve benzetilenin bulunduğu, edat ve yönün söylenmediği benzetmeye güçlü benzetme denir."},{"questionId":"tr8u8-benzetme-018","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Benzetme ve benzetmenin ögeleri","outcome":"Metindeki söz sanatlarını (benzetme) tespit eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"zor","group":"benzetme","rank":3,"type":"bin","prompt":"Benzetmeleri ögelerine göre ayır.","data":{"L":["🖼️ Dört öge de var","💎 Güçlü benzetme"],"r":[["Öğretmenim bir çınardı.",1],["Göl ayna gibi dümdüzdü.",0],["Sen bir aslansın.",1],["Elleri buz gibi soğuktu.",0],["Annem evimizin güneşidir.",1],["Su, kristal gibi berraktı.",0]]},"textPlain":"Benzetmeleri ögelerine göre ayır. Salonlar: Dört öge de var, Güçlü benzetme. Kartlar: Öğretmenim bir çınardı. / Göl ayna gibi dümdüzdü. / Sen bir aslansın. / Elleri buz gibi soğuktu. / Annem evimizin güneşidir. / Su, kristal gibi berraktı..","correctAnswer":"Öğretmenim bir çınardı. → Güçlü benzetme | Göl ayna gibi dümdüzdü. → Dört öge de var | Sen bir aslansın. → Güçlü benzetme | Elleri buz gibi soğuktu. → Dört öge de var | Annem evimizin güneşidir. → Güçlü benzetme | Su, kristal gibi berraktı. → Dört öge de var","explanation":"Benzetme, aralarında ortak özellik bulunan iki varlıktan güçsüz olanı güçlü olana benzetmektir. Ögeleri: benzeyen (güçsüz olan), benzetilen (özelliği güçlü olan), benzetme yönü (ortak özellik), benzetme edatı (gibi, kadar, sanki…). Benzeyen ve benzetilenin bulunduğu, edat ve yönün söylenmediği benzetmeye güçlü benzetme denir."},{"questionId":"tr8u8-benzetme-019","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Benzetme ve benzetmenin ögeleri","outcome":"Metindeki söz sanatlarını (benzetme) tespit eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"kolay","group":"benzetme","rank":1,"type":"frames","prompt":"Işığı yak: Hangi tabloda benzetme var?","data":{"o":["Kedimin tüyleri beyaz ve uzundur.","Kedim bütün gün uyudu.","Kedimin tüyleri ipek gibi yumuşak."],"a":2},"textPlain":"Işığı yak: Hangi tabloda benzetme var? Tablolar: Kedimin tüyleri beyaz ve uzundur. / Kedim bütün gün uyudu. / Kedimin tüyleri ipek gibi yumuşak.","correctAnswer":"Kedimin tüyleri ipek gibi yumuşak.","explanation":"Benzetme, aralarında ortak özellik bulunan iki varlıktan güçsüz olanı güçlü olana benzetmektir. Ögeleri: benzeyen (güçsüz olan), benzetilen (özelliği güçlü olan), benzetme yönü (ortak özellik), benzetme edatı (gibi, kadar, sanki…). Benzeyen ve benzetilenin bulunduğu, edat ve yönün söylenmediği benzetmeye güçlü benzetme denir."},{"questionId":"tr8u8-benzetme-020","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Benzetme ve benzetmenin ögeleri","outcome":"Metindeki söz sanatlarını (benzetme) tespit eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"zor","group":"benzetme","rank":3,"type":"frames","prompt":"Işığı yak: Hangi tabloda güçlü benzetme (yalnızca benzeyen ve benzetilen) var?","data":{"o":["Babam direk gibi dimdik durdu.","Babam evin direğini boyadı.","Babam evimizin direğidir."],"a":2},"textPlain":"Işığı yak: Hangi tabloda güçlü benzetme (yalnızca benzeyen ve benzetilen) var? Tablolar: Babam direk gibi dimdik durdu. / Babam evin direğini boyadı. / Babam evimizin direğidir.","correctAnswer":"Babam evimizin direğidir.","explanation":"Benzetme, aralarında ortak özellik bulunan iki varlıktan güçsüz olanı güçlü olana benzetmektir. Ögeleri: benzeyen (güç çti?), yer (nerede?), zaman (ne zaman?). Olay örgüsü giriş, gelişme ve sonuç bölümlerinden oluşur. Anlatıcı “ben” diyorsa birinci kişili, “o” diyorsa üçüncü kişili anlatımdır."},{"questionId":"tr8u8-unsur-002","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"kolay","group":"unsur","rank":1,"type":"reels","prompt":"Bilet makinesi: Makaraları çevirerek hikâyenin unsurlarını eşleştir.","data":{"t":"Pazar sabahı Efe ile babası sahilde uçurtma uçurdu.","p":["sahil","Efe ile babası","pazar sabahı"],"L":["Kişi","Yer","Zaman"],"a":[1,0,2]},"textPlain":"Bilet makinesi: Makaraları çevirerek hikâyenin unsurlarını eşleştir. Metin: “Pazar sabahı Efe ile babası sahilde uçurtma uçurdu.” Makaralar: Kişi, Yer, Zaman. Parçalar: sahil, Efe ile babası, pazar sabahı","correctAnswer":"Kişi: Efe ile babası | Yer: sahil | Zaman: pazar sabahı","explanation":"Hikâyenin unsurları: olay (ne oldu?), kişiler (kimin başından geçti?), yer (nerede?), zaman (ne zaman?). Olay örgüsü giriş, gelişme ve sonuç bölümlerinden oluşur. Anlatıcı “ben” diyorsa birinci kişili, “o” diyorsa üçüncü kişili anlatımdır."},{"questionId":"tr8u8-unsur-003","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"kolay","group":"unsur","rank":1,"type":"reels","prompt":"Bilet makinesi: Makaraları çevirerek hikâyenin unsurlarını eşleştir.","data":{"t":"Akşam yemeğinden sonra annem mutfakta bize masal anlattı.","p":["annem","akşam yemeğinden sonra","mutfak"],"L":["Kişi","Yer", . Parlayan: akar gider,","correctAnswer":"kök salar gider,, uçar gider.","explanation":"Ahenk: Dize sonlarındaki ses benzerliğine uyak (kafiye), dize sonlarında tekrarlanan aynı görevli ek ya da sözcüğe redif denir. Ses benzerliği taşıyan dize sonları birbiriyle kafiyelidir. “-ar gider” dize sonlarında tekrarlanıyor: “gider” redif."},{"questionId":"tr8u8-unsur-015","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"zor","group":"unsur","rank":3,"type":"rhyme","prompt":"Ahenk avı: Parlayan dize sonuyla ses benzerliği taşıyan dize sonlarına dokun.","data":{"l":[["Bir yanda dağlar ","duman,"],["Bir yanda ovalar ","yeşil,"],["Yolcu, nereye bu ","kervan?"],["Sabret, yol uzun ","değil."]],"t":0,"a":[2]},"textPlain":"Ahenk avı: Parlayan dize sonuyla ses benzerliği taşıyan dize sonlarına dokun. Şiir: Bir yanda dağlar duman, / Bir yanda ovalar yeşil, / Yolcu, nereye bu kervan? / Sabret, yol uzun değil. Parlayan: duman,","correctAnswer":"kervan?","explanation":"Ahenk: Dize sonlarındaki ses benzerliğine uyak (kafiye), dize sonlarında tekrarlanan aynı görevli ek ya da sözcüğe redif denir. Ses benzerliği taşıyan dize sonları birbiriyle kafiyelidir. “duman – kervan” sesleri benzeşiyor; “yeşil – değil” ise kendi arasında kafiyelidir."},{"questionId":"tr8u8-unsur-016","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"kolay","group":"unsur","rank":1,"type":"bin","prompt":"Kartları salonlara yerleştir.","data":{"L":["📏 Dize","🧱 Kıt o” diyorsa üçüncü kişili anlatımdır."},{"questionId":"tr8u8-unsur-018","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"orta","group":"unsur","rank":2,"type":"bin","prompt":"Parçaları anlatıcıya göre ayır.","data":{"L":["🙋 Birinci kişili anlatıcı","👀 Üçüncü kişili anlatıcı"],"r":[["O sabah erkenden kalktım ve pencereyi açtım.",0],["Ali o sabah erkenden kalktı ve pencereyi açtı.",1],["Yolda yürürken birden ayağım kaydı.",0],["Kız, yolda yürürken birden ayağı kaydı.",1],["Annemin sesini duyunca koştum.",0],["Çocuk, annesinin sesini duyunca koştu.",1]]},"textPlain":"Parçaları anlatıcıya göre ayır. Salonlar: Birinci kişili anlatıcı, Üçüncü kişili anlatıcı. Kartlar: O sabah erkenden kalktım ve pencereyi açtım. / Ali o sabah erkenden kalktı ve pencereyi açtı. / Yolda yürürken birden ayağım kaydı. / Kız, yolda yürürken birden ayağı kaydı. / Annemin sesini duyunca koştum. / Çocuk, annesinin sesini duyunca koştu..","correctAnswer":"O sabah erkenden kalktım ve pencereyi açtım. → Birinci kişili anlatıcı | Ali o sabah erkenden kalktı ve pencereyi açtı. → Üçüncü kişili anlatıcı | Yolda yürürken birden ayağım kaydı. → Birinci kişili anlatıcı | Kız, yolda yürürken birden ayağı kaydı. → Üçüncü kişili anlatıcı | Annemin sesini duyunca koştum. → Birinci kişili anlatıcı | Çocuk, annesinin sesini duyunca koştu. → Üçüncü kişili anlatıcı","explanation":"Hikâyenin unsurları: olay (ne oldu?), kişiler (kimin başından geçti?), yer (nerede?), zaman (ne zaman?). Olay örgüsü giriş, gelişme ve sonuç bölümlerinden oluşur. Anlatıcı “ben” diyorsa birinci kişili, “o” diyorsa üçüncü kişili anlatımdır."},{"questionId":"tr8u8-unsur-019","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"zor","group":"unsur","rank":3,"type":"bin","prompt":"Ses benzerliklerini ayır.","data":{"L":["🎵 Uyak","🔁 Redif"],"r":[["“ağ” — dağda / bağda",0],["“-da” — dağda / bağda",1],["“gider” — akar gider / uçar gider",1],["“an” — duman / kervan",0],["“-ler” — güller / bülbüller",1],["“ül” — güller / bülbüller",0]]},"textPlain":"Ses benzerliklerini ayır. Salonlar: Uyak, Redif. Kartlar: “ağ” — dağda / bağda / “-da” — dağda / bağda / “gider” — akar gider / uçar gider / “an” — duman / kervan / “-ler” — güller / bülbüller / “ül” — güller / bülbüller.","correctAnswer":"“ağ” — dağda / bağda → Uyak | “-da” — dağda / bağda → Redif | “gider” — akar gider / uçar gider → Redif | “an” — duman / kervan → Uyak | “-ler” — güller / bülbüller → Redif | “ül” — güller / bülbüller → Uyak","explanation":"Ahenk: Dize sonlarındaki ses benzerliğine uyak (kafiye), dize sonlarında tekrarlanan aynı görevli ek ya da sözcüğe redif denir. Ses benzerliği taşıyan dize sonları birbiriyle kafiyelidir. Ek ya da sözcük aynı görevle tekrarlanıyorsa redif, geriye kalan ses benzerliği uyaktır."},{"questionId":"tr8u8-unsur-020","grade":8,"subject":"Türkçe","unit":"Söz Sanatları, Metin Türleri, Hikâye ve Şiir Unsurları","topic":"Hikâye unsurları ve şiir yapısı","outcome":"Metnin hikâye unsurlarını belirler; şiirin yapı ve ahenk unsurlarını tanır.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz sanatları, metin türleri, metnin unsurları","difficulty":"zor","group":"unsur","rank":3,"type":"bin","prompt":"Olay örgüsü kartlarını sırasına göre ayır.","data":{"L":["🚪 Giriş","🌀 Gelişme","🏁 Sonuç"],"r":[["Kahramanlar tanıtılır.",0],["Olaylar karmaşıklaşır.",1],["Sorun çözülür.",2],["Köy ve köylüler tanıtılır.",0],["Kayıp çocuk aranır.",1],["Çocuk evine döner.",2]]},"textPlain":"Olay örgüsü kartlarını sırasına göre ayır. Salonlar: Giriş, Gelişme, Sonuç. Kartlar: Kahramanlar tanıtılır. / Olaylar karmaşıklaşır. / Sorun çözülür. / Köy ve köylüler tanıtılır. / Kayıp çocuk aranır. / Çocuk evine döner..","correctAnswer":"Kahramanlar tanıtılır. → Giriş | Olaylar karmaşıklaşır. → Gelişme | Sorun çözülür. → Sonuç | Köy ve köylüler tanıtılır. → Giriş | Kayıp çocuk aranır. → Gelişme | Çocuk evine döner. → Sonuç","explanation":"Hikâyenin unsurları: olay (ne oldu?), kişiler (kimin başından geçti?), yer (nerede?), zaman (ne zaman?). Olay örgüsü giriş, gelişme ve sonuç bölümlerinden oluşur. Anlatıcı “ben” diyorsa birinci kişili, “o” diyorsa üçüncü kişili anlatımdır."}]</script>
