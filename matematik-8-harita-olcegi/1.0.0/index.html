<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Harita Ölçeği</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}
.logo b{color:var(--yel);text-shadow:0 0 8px var(--yel2)}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}
.pill.gold{background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;border-color:#fff}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
#sound{width:34px;height:30px;border-radius:10px;border:1px solid #29d3ff77;background:#0a0820cc;color:#fff;font-size:15px;padding:0}
#track{height:38px;margin:0 8px}
#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}
.chip{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#1b13471a;color:var(--ink2)}
.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}
#go:disabled{filter:grayscale(.8);opacity:.5;box-shadow:0 3px 0 #6a0a3e}
#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}
#fb b{display:block;font:900 19px/1.2 var(--show);margin-bottom:3px}
#fb .ca{display:block;margin:4px 0;padding:4px 8px;border-radius:8px;background:#ff4d5e1a;font-weight:800}
#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}
.blank.ok{background:#c9f5dc;box-shadow:0 2px 0 #146b3e}.blank.bad{background:#ffd0d5;box-shadow:0 2px 0 #7a1420;text-decoration:line-through}
.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}
.frow .fn{font-size:12.5px;font-weight:800;color:#fff;line-height:1.15}
.frow .fn.r{text-align:right}
.frow .mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.frow .mid svg{width:96px;height:16px}
.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}
.evr .n{flex:1 1 auto}.evr .pc{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#e8e2ff;color:#4a3a6a}
.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}
.slot .sb .tok{font-size:12px;padding:4px 8px}
.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:radial-gradient(circle at 50% 40%,#7a4a2a,#4a2a14 70%,#2a160a)}
.wood{position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 38px,#0000001a 38px 40px);opacity:.8}
.parch{position:absolute;left:7%;right:7%;top:18%;bottom:20%;background:radial-gradient(circle at 50% 50%,#fbf0d4,#ecd6a2 80%,#d8b878);border-radius:6px;box-shadow:0 10px 30px #0008,inset 0 0 30px #b8904a;transform:scaleX(.04);transform-origin:50% 50%;z-index:2;overflow:hidden}
#gate.on .parch{animation:unroll .9s .2s cubic-bezier(.3,1.2,.5,1) forwards}@keyframes unroll{to{transform:none}}
.parch::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#c8a86a33 1px,transparent 1px),linear-gradient(90deg,#c8a86a33 1px,transparent 1px);background-size:26px 26px}
.isl{position:absolute;font-size:30px;opacity:0}
#gate.on .isl{animation:ip .4s var(--d) forwards}@keyframes ip{to{opacity:1}}
.route{position:absolute;inset:0;width:100%;height:100%}
.route path{stroke-dasharray:6 8;stroke-dashoffset:0;opacity:0}
#gate.on .route path{animation:rp .3s 1.2s forwards}@keyframes rp{to{opacity:1}}
.ship{position:absolute;left:8%;top:72%;font-size:30px;opacity:0;z-index:3}
#gate.on .ship{animation:ship 2.4s 1.3s ease-in-out forwards}@keyframes ship{0%{opacity:1;left:8%;top:72%}35%{left:36%;top:44%}70%{left:62%;top:62%}100%{opacity:1;left:80%;top:28%}}
.rose{position:absolute;right:6%;bottom:6%;width:min(26vw,110px);aspect-ratio:1;z-index:4;opacity:0}
#gate.on .rose{animation:rose 2.6s .9s ease-out forwards}@keyframes rose{0%{opacity:0;transform:rotate(-200deg) scale(.4)}40%{opacity:1}100%{opacity:1;transform:none}}
.sign11{position:absolute;left:50%;top:4%;width:min(82vw,310px);margin-left:calc(min(82vw,310px)/-2);z-index:7;text-align:center;padding:8px;border-radius:10px;background:#3a2a1a;border:3px solid #d8a84a;box-shadow:0 8px 20px #0006}
.sign11 b{display:block;white-space:nowrap;font:900 clamp(22px,7.6vw,32px)/1 var(--show);letter-spacing:1px;color:#f8d88a;padding:4px 0}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#fff8e0,#fbf0d4 40%,#d8a84a 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#3a2a1a;background:linear-gradient(180deg,#f8e08a,#d8a84a 55%,#a8782a);box-shadow:0 6px 0 #5a3a10;margin-top:6px}
.primary:disabled{opacity:.55;box-shadow:none}
.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}
.status{font-size:13px!important;color:#fff;background:#000a;border-radius:10px;padding:6px 8px}.fine{font-size:12.5px!important}
#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 50% 40%,#7a4a2a,#4a2a14 70%,#2a160a)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}
#outro .parch{transform:none;top:14%;bottom:30%}
.isles{position:absolute;inset:0;z-index:3}
.ii{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;display:grid;place-items:center;font-size:28px;opacity:0;transform:scale(.3)}
.ii b{position:absolute;right:-4px;top:-4px;font:900 13px/1 var(--show);color:#2a8a3a;background:#fff8e0;border-radius:50%;width:18px;height:18px;display:grid;place-items:center}
.ii.x{filter:grayscale(1);opacity:.6}.ii.x b{color:#a83a2a}
#outro.open .ii{animation:iii .35s var(--d) cubic-bezier(.3,1.4,.5,1) forwards}@keyframes iii{to{opacity:1;transform:none}}
#outro.open .ii.x{animation:iix .35s var(--d) forwards}@keyframes iix{to{opacity:.55;transform:none}}
.medal{position:absolute;left:50%;top:80%;width:136px;margin:-68px 0 0 -68px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#fff8e0,#f8d88a 62%,#c8902a);border:6px solid #3a2a1a;box-shadow:0 0 0 4px #d8a84a,0 10px 30px #0006;transform:scale(2.5) rotate(-20deg);opacity:0;z-index:6}
.medal div{font:900 10.5px/1.2 var(--show);letter-spacing:1px;color:#3a2a1a}.medal b{display:block;margin:2px 0;font:900 34px/1 var(--show);color:#3a2a1a}
#outro.stamp .medal{animation:stamp8 .6s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes stamp8{to{transform:rotate(-6deg);opacity:1}}
.vstat{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);z-index:6;white-space:nowrap;font:900 clamp(13px,4.2vw,17px)/1 var(--show);color:#f8d88a;background:#3a2a1a;padding:8px 14px;border-radius:999px;opacity:0}
#outro.stamp .vstat{opacity:1;transition:opacity .4s .3s}
#sheet{z-index:50}
.card2{background:var(--panel);border-radius:22px;box-shadow:0 0 0 4px var(--mag),0 0 0 8px var(--cyan),0 14px 40px #000c;padding:12px 16px 16px;text-align:center;width:min(380px,100%);max-height:100%;overflow:auto;position:relative}
.card2 .ct{font:900 26px/1 var(--show);font-style:italic;letter-spacing:1px;color:var(--mag2)}
.card2 .sub{font:900 11.5px/1 var(--show);letter-spacing:2px;color:var(--cyan2);margin:5px 0 6px}
