<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Özdeşlik Yapbozu</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}

.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}
.pill.gold{background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;border-color:#fff}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
#sound{width:34px;height:30px;border-radius:10px;border:1px solid #29d3ff77;background:#0a0820cc;color:#fff;font-size:15px;padding:0}
#track{height:38px;margin:0 8px}
#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}
.chip{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#1b13471a;color:var(--ink2)}
.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}

#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}

#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}
.blank.ok{background:#c9f5dc;box-shadow:0 2px 0 #146b3e}.blank.bad{background:#ffd0d5;box-shadow:0 2px 0 #7a1420;text-decoration:line-through}
.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}
.frow .fn{font-size:12.5px;font-weight:800;color:#fff;line-height:1.15}

.frow .mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.frow .mid svg{width:96px;height:16px}
.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}
.evr .n{flex:1 1 auto}.evr .pc{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#e8e2ff;color:#4a3a6a}
.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}
.slot .sb .tok{font-size:12px;padding:4px 8px}
.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:linear-gradient(180deg,#e8c898 0,#c8904a 100%)}
#gate::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 60px,#a8703a22 60px 62px)}
.board{position:absolute;left:16%;right:16%;top:24%;height:42%;border-radius:12px;background:#f6e2c0;box-shadow:inset 0 0 0 4px #a8703a,0 10px 24px #0004;z-index:2}
.pp{position:absolute;width:21%;aspect-ratio:1;z-index:3;transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:.9}
#gate.on .pp{animation:pin2 .55s var(--d) cubic-bezier(.3,1.3,.5,1) forwards}@keyframes pin2{to{transform:none;opacity:1}}
.eqn{position:absolute;left:50%;top:70%;transform:translateX(-50%);z-index:5;white-space:nowrap;font:900 clamp(17px,5.4vw,23px)/1 var(--show);color:#3a2410;background:#fff8ec;padding:8px 14px;border-radius:12px;box-shadow:0 4px 0 #a8703a;opacity:0}
#gate.on .eqn{animation:eqi .5s 2.1s forwards}@keyframes eqi{to{opacity:1}}
.sign11{position:absolute;left:50%;top:4%;width:min(84vw,320px);margin-left:calc(min(84vw,320px)/-2);z-index:7;text-align:center;padding:8px;border-radius:14px;background:#4a8ae8;border:4px solid #fff8ec;box-shadow:0 0 0 3px #4a8ae8,0 8px 20px #0004}
.sign11 b{display:block;white-space:nowrap;font:900 clamp(20px,6.4vw,28px)/1 var(--show);letter-spacing:.5px;color:#fff;padding:4px 0}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#fff6c8 40%,#f0c838 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#7aaaff,#4a8ae8 55%,#2a5ab8);box-shadow:0 6px 0 #1a3a7a;margin-top:6px}
.primary:disabled{opacity:.55;box-shadow:none}
.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}
.status{font-size:13px!important;color:#fff;background:#000a;border-radius:10px;padding:6px 8px}.fine{font-size:12.5px!important}
#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,#e8c898 0,#c8904a 100%)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}
.opz{position:absolute;left:8%;right:8%;top:20%;display:grid;grid-template-columns:repeat(5,1fr);gap:0;padding:10px;border-radius:12px;background:#f6e2c0;box-shadow:inset 0 0 0 4px #a8703a;z-index:3}
.op{aspect-ratio:1;opacity:0;transform:translateY(-50vh) rotate(40deg)}
#outro.open .op.ok{animation:opi .5s var(--d) cubic-bezier(.3,1.3,.5,1) forwards}@keyframes opi{to{opacity:1;transform:none}}
#outro.open .op.x{animation:opx .3s var(--d) forwards}@keyframes opx{to{opacity:.35;transform:none}}
.medal{position:absolute;left:50%;top:64%;width:136px;margin:-68px 0 0 -68px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#ffffff,#d8e8ff 62%,#7aaaff);border:6px solid #4a8ae8;box-shadow:0 0 0 4px #fff8ec,0 10px 30px #0004;transform:scale(2.5) rotate(-20deg);opacity:0;z-index:6}
.medal div{font:900 10.5px/1.2 var(--show);letter-spacing:1px;color:#1a2a5a}.medal b{display:block;margin:2px 0;font:900 34px/1 var(--show);color:#1a2a5a}
#outro.stamp .medal{animation:stamp8 .6s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes stamp8{to{transform:rotate(-6deg);opacity:1}}
.vstat{position:absolute;left:50%;bottom:4%;transform:translateX(-50%);z-index:6;white-space:nowrap;font:900 clamp(13px,4.2vw,17px)/1 var(--show);color:#fff;background:#4a8ae8;padding:8px 14px;border-radius:999px;opacity:0}
#outro.stamp .vstat{opacity:1;transition:opacity .4s .3s}
#sheet{z-index:50}
.card2{background:var(--panel);border-radius:22px;box-shadow:0 0 0 4px var(--mag),0 0 0 8px var(--cyan),0 14px 40px #000c;padding:12px 16px 16px;text-align:center;width:min(380px,100%);max-height:100%;overflow:auto;position:relative}
.card2 .ct{font:900 26px/1 var(--show);font-style:italic;letter-spacing:1px;color:var(--mag2)}
.card2 .sub{font:900 11.5px/1 var(--show);letter-spacing:2px;color:var(--cyan2);margin:5px 0 6px}
.card2 h2{margin:6px 0 2px;font:900 21px/1.15 var(--show);color:var(--ink)}
.card2 .reward{font:900 26px/1 var(--show);color:#9a6a00;margin:4px 0}
.ports{display:flex;justify-content:center;gap:3px;margin:6px 0;flex-wrap:wrap}
.ports i{font-style:normal;font-size:20px}
.stars3{font-size:42px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:#ffb21a;text-shadow:0 3px 0 #c27a00;animation:pop2 .5s both}.stars3 span.off{color:#d9cde8;text-shadow:none}
@keyframes pop2{from{transform:scale(0) rotate(-40deg)}}
.stats{display:flex;justify-content:center;gap:16px;margin:6px 0}
.stats div{display:flex;flex-direction:column}.stats b{font-size:20px}.stats span{font-size:12px;color:var(--ink2);font-weight:700}
.conf{position:fixed;pointer-events:none;z-index:55;animation:fall var(--t) linear var(--dl) forwards;opacity:0;font-size:22px}
@keyframes fall{0%{opacity:1;transform:translate(0,-20px) rotate(0)}100%{opacity:0;transform:translate(var(--dx),105vh) rotate(var(--r))}}

:"mat8u6-ifade-009","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ifade","rank":2,"type":"tiles","prompt":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla.","data":{"p":[2,2,0],"m":[1,3,2],"a":[1,-1,-2]},"textPlain":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla. Pozitif karolar: 2 x², 2 x, 0 birim; negatif karolar: 1 x², 3 x, 2 birim.","correctAnswer":"x² − x − 2","explanation":"Cebir karolarında büyük kare x², uzun dikdörtgen x, küçük kare 1’i gösterir; kırmızı karolar negatiftir. Bir pozitif ve bir negatif aynı karo birbirini götürür (sıfır çifti)."},{"questionId":"mat8u6-ifade-010","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ifade","rank":3,"type":"tiles","prompt":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla.","data":{"p":[3,1,4],"m":[2,4,4],"a":[1,-3,0]},"textPlain":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla. Pozitif karolar: 3 x², 1 x, 4 birim; negatif karolar: 2 x², 4 x, 4 birim.","correctAnswer":"x² − 3x","explanation":"Cebir karolarında büyük kare x², uzun dikdörtgen x, küçük kare 1’i gösterir; kırmızı karolar negatiftir. Bir pozitif ve bir negatif aynı karo birbirini götürür (sıfır çifti)."},{"questionId":"mat8u6-ifade-011","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ifade","rank":3,"type":"tiles","prompt":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla.","data":{"p":[1,0,6],"m":[2,3,1],"a":[-1,-3,5]},"textPlain":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla. Pozitif karolar: 1 x², 0 x, 6 birim; negatif karolar: 2 x², 3 x, 1 birim.","correctAnswer":"−x² − 3x + 5","explanation":"Cebir karolarında büyük kare x², uzun dikdörtgen x, küçük kare 1’i gösterir; kırmızı karolar negatiftir. Bir pozitif ve bir negatif aynı karo birbirini götürür (sıfır çifti)."},{"questionId":"mat8u6-problem-001","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"problem","rank":1,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"rect","s":["x + 2","x + 5"],"q":"A","a":[1,7,10]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: dikdörtgen, kenarlar: x + 2, x + 5.","correctAnswer":"x² + 7x + 10","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır."},{"questionId":"mat8u6-problem-002","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"problem","rank":1,"type":"geo","prompt":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla.","data":{"k":"rect","s":["x + 3","2x"],"q":"P","a":[0,6,6]},"textPlain":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla. Şekil: dikdörtgen, kenarlar: x + 3, 2x.","correctAnswer":"6x + 6","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır."},{"questionId":"mat8u6-problem-003","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"problem","rank":1,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"sq","s":["x + 4"],"q":"A","a":[1,8,16]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: kare, kenarlar: x + 4.","correctAnswer":"x² + 8x + 16","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır. Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-problem-004","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"problem","rank":2,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"rect","s":["2x − 1","x + 3"],"q":"A","a":[2,5,-3]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: dikdörtgen, kenarlar: 2x − 1, x + 3.","correctAnswer":"2x² + 5x − 3","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır."},{"questionId":"mat8u6-problem-005","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"problem","rank":2,"type":"geo","prompt":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla.","data":{"k":"sq","s":["2x + 3"],"q":"P","a":[0,8,12]},"textPlain":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla. Şekil: kare, kenarlar: 2x + 3.","correctAnswer":"8x + 12","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır. Karenin çevresi 4 × kenar."},{"questionId":"mat8u6-problem-006","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"problem","rank":2,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"L","s":["x","3"],"q":"A","a":[1,0,-9]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: büyük kareden küçük kare çıkarılmış şekil, kenarlar: x, 3.","correctAnswer":"x² − 9","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur. Kenarı x olan kareden kenarı 3 olan kare çıkarılınca kalan alan x² − 9 = (x − 3)(x + 3) olur."},{"questionId":"mat8u6-problem-007","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"problem","rank":3,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"sq","s":["3x − 2"],"q":"A","a":[9,-12,4]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: kare, kenarlar: 3x − 2.","correctAnswer":"9x² − 12x + 4","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır. Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-problem-008","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"problem","rank":3,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"L","s":["x + 2","x"],"q":"A","a":[0,4,4]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: büyük kareden küçük kare çıkarılmış şekil, kenarlar: x + 2, x.","correctAnswer":"4x + 4","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur. (x + 2)² − x² = 4x + 4."},{"questionId":"mat8u6-problem-009","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"problem","rank":3,"type":"geo","prompt":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla.","data":{"k":"rect","s":["x + 5","x − 5"],"q":"P","a":[0,4,0]},"textPlain":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla. Şekil: dikdörtgen, kenarlar: x + 5, x − 5.","correctAnswer":"4x","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır. Çevre 2 × (x + 5 + x − 5) = 4x."},{"questionId":"mat8u6-carpim-008","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpim","rank":1,"type":"box","prompt":"(x + 3)(x + 2) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle.","data":{"r":["x","3"],"c":["x","2"],"g":[["x²","2x"],["3x","6"]],"x":["5x","5"]},"textPlain":"(x + 3)(x + 2) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: x, 3; sütunlar: x, 2.","correctAnswer":"Hücreler: x·x = x², x·2 = 2x, 3·x = 3x, 3·2 = 6; sonuç x² + 5x + 6","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-009","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpim","rank":1,"type":"box","prompt":"(x + 4)(x + 1) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle.","data":{"r":["x","4"],"c":["x","1"],"g":[["x²","x"],["4x","4"]],"x":["5","4x²"]},"textPlain":"(x + 4)(x + 1) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: x, 4; sütunlar: x, 1.","correctAnswer":"Hücreler: x·x = x², x·1 = x, 4·x = 4x, 4·1 = 4; sonuç x² + 5x + 4","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-010","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpim","rank":2,"type":"box","prompt":"(2x + 1)(x − 3) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle.","data":{"r":["2x","1"],"c":["x","−3"],"g":[["2x²","−6x"],["x","−3"]],"x":["6x","3"]},"textPlain":"(2x + 1)(x − 3) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: 2x, 1; sütunlar: x, −3.","correctAnswer":"Hücreler: 2x·x = 2x², 2x·−3 = −6x, 1·x = x, 1·−3 = −3; sonuç 2x² − 5x − 3","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-011","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpim","rank":2,"type":"box","prompt":"(x − 5)(x − 2) çarpımı için tablonun hücrelerine doğru teri in":"(2x − 3)(2x + 3) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: 2x, −3; sütunlar: 2x, 3.","correctAnswer":"Hücreler: 2x·2x = 4x², 2x·3 = 6x, −3·2x = −6x, −3·3 = −9; sonuç 4x² − 9","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-ozdeslik-007","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ozdeslik","rank":2,"type":"box","prompt":"(x + 6)(x + 6) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle.","data":{"r":["x","6"],"c":["x","6"],"g":[["x²","6x"],["6x","36"]],"x":["12x","12"]},"textPlain":"(x + 6)(x + 6) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: x, 6; sütunlar: x, 6.","correctAnswer":"Hücreler: x·x = x², x·6 = 6x, 6·x = 6x, 6·6 = 36; sonuç x² + 12x + 36","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-ozdeslik-008","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"ozdeslik","rank":1,"type":"model","prompt":"(a + b)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"sq","a":"a","b":"b","c":["a²","ab","ab","b²","2a","a + b"],"ans":["a²","ab","ab","b²"]},"textPlain":"(a + b)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı a + b olan kare.","correctAnswer":"Bölgeler: 1) a², 2) ab, 3) ab, 4) b²","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-ozdeslik-009","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"ozdeslik","rank":1,"type":"model","prompt":"(x + 2)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"sq","a":"x","b":"2","c":["x²","2x","2x","4","x + 2","2"],"ans":["x²","2x","2x","4"]},"textPlain":"(x + 2)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı x + 2 olan kare.","correctAnswer":"Bölgeler: 1) x², 2) 2x, 3) 2x, 4) 4","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-ozdeslik-010","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ozdeslik","rank":2,"type":"model","prompt":"(x + 5)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"sq","a":"x","b":"5","c":["x²","5x","5x","25","10","x²"],"ans":["x²","5x","5x","25"]},"textPlain":"(x + 5)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı x + 5 olan kare.","correctAnswer":"Bölgeler: 1) x², 2) 5x, 3) 5x, 4) 25","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-ozdeslik-011","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ozdeslik","rank":2,"type":"model","prompt":"a² − b² modeli: kareden küçük kare çıkarıldı. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"diff","a":"a","b":"b","c":["a(a − b)","b(a − b)","b²","ab"],"ans":["a(a − b)","b(a − b)"]},"textPlain":"a² − b² modeli: kareden küçük kare çıkarıldı. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı a olan kareden kenarı b olan kare çıkarılmış.","correctAnswer":"Bölgeler: 1) a(a − b), 2) b(a − b)","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-ozdeslik-012","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ozdeslik","rank":3,"type":"model","prompt":"x² − 9 modeli: kareden küçük kare çıkarıldı. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"diff","a":"x","b":"3","c":["x(x − 3)","3(x − 3)","9","3x"],"ans":["x(x − 3)","3(x − 3)"]},"textPlain":"x² − 9 modeli: kareden küçük kare çıkarıldı. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı x olan kareden kenarı 3 olan kare çıkarılmış.","correctAnswer":"Bölgeler: 1) x(x − 3), 2) 3(x − 3)","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-ozdeslik-013","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ozdeslik","rank":3,"type":"model","prompt":"(2x + 3)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"sq","a":"2x","b":"3","c":["4x²","6x","6x","9","2x²","5x"],"ans":["4x²","6x","6x","9"]},"textPlain":"(2x + 3)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı 2x + 3 olan kare.","correctAnswer":"Bölgeler: 1) 4x², 2) 6x, 3) 6x, 4) 9","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-ozdeslik-014","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"ozdeslik","rank":1,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["(x + 1)²","x² + 2x + 1"],["(x − 1)²","x² − 2x + 1"],["(x − 1)(x + 1)","x² − 1"]],"x":[]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: (x + 1)², (x − 1)², (x − 1)(x + 1). Parçalar: x² + 2x + 1, x² − 2x + 1, x² − 1.","correctAnswer":"(x + 1)² = x² + 2x + 1 | (x − 1)² = x² − 2x + 1 | (x − 1)(x + 1) = x² − 1","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-ozdeslik-015","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ozdeslik","rank":2,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["(x + 4)²","x² + 8x + 16"],["(x − 4)²","x² − 8x + 16"],["(x − 4)(x + 4)","x² − 16"]],"x":["x² + 16"]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: (x + 4)², (x − 4)², (x − 4)(x + 4). Parçalar: x² + 8x + 16, x² − 8x + 16, x² − 16, x² + 16.","correctAnswer":"(x + 4)² = x² + 8x + 16 | (x − 4)² = x² − 8x + 16 | (x − 4)(x + 4) = x² − 16","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-ozdeslik-016","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ozdeslik","rank":3,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["(2x − 3)²","4x² − 12x + 9"],["(2x + 3)²","4x² + 12x + 9"],["(2x − 3)(2x + 3)","4x² − 9"]],"x":["4x² − 6x + 9"]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: (2x − 3)², (2x + 3)², (2x − 3)(2x + 3). Parçalar: 4x² − 12x + 9, 4x² + 12x + 9, 4x² − 9, 4x² − 6x + 9.","correctAnswer":"(2x − 3)² = 4x² − 12x + 9 | (2x + 3)² = 4x² + 12x + 9 | (2x − 3)(2x + 3) = 4x² − 9","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-carpan-001","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpan","rank":1,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["3x + 12","3(x + 4)"],["5x − 10","5(x − 2)"],["x² + 7x","x(x + 7)"]],"x":[]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: 3x + 12, 5x − 10, x² + 7x. Parçalar: 3(x + 4), 5(x − 2), x(x + 7).","correctAnswer":"3x + 12 = 3(x + 4) | 5x − 10 = 5(x − 2) | x² + 7x = x(x + 7)","explanation":"Ortak çarpan parantezine alınırken her terimde ortak olan çarpan dışarı yazılır."},{"questionId":"mat8u6-carpan-002","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpan","rank":2,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["x² − 49","(x − 7)(x + 7)"],["x² + 6x + 9","(x + 3)²"],["x² − 10x + 25","(x − 5)²"]],"x":["(x − 3)²"]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: x² − 49, x² + 6x + 9, x² − 10x + 25. Parçalar: (x − 7)(x + 7), (x + 3)², (x − 5)², (x − 3)².","correctAnswer":"x² − 49 = (x − 7)(x + 7) | x² + 6x + 9 = (x + 3)² | x² − 10x + 25 = (x − 5)²","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-carpan-003","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"carpan","rank":3,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["9x² − 1","(3x − 1)(3x + 1)"],["4x² + 4x + 1","(2x + 1)²"],["2x² − 8","2(x − 2)(x + 2)"]],"x":["(2x − 4)(x + 2)"]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: 9x² − 1, 4x² + 4x + 1, 2x² − 8. Parçalar: (3x − 1)(3x + 1), (2x + 1)², 2(x − 2)(x + 2), (2x − 4)(x + 2).","correctAnswer":"9x² − 1 = (3x − 1)(3x + 1) | 4x² + 4x + 1 = (2x + 1)² | 2x² − 8 = 2(x − 2)(x + 2)","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur. 2x² − 8 = 2(x² − 4) = 2(x − 2)(x + 2)."},{"questionId":"mat8u6-carpan-004","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpan","rank":1,"type":"factor","prompt":"4x + 8 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla.","data":{"t":[0,4,8],"f":"k","v":{"k":4,"m":2}},"textPlain":"4x + 8 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla. Hedef: 4x + 8. Kalıplar: k(x + m), kx(x + m), (px + m)², (px − m)(px + m).","correctAnswer":"4x + 8 = 4(x + 2)","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-carpan-005","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırm  | 3x² ve 3x → Benzer değil | 5 ve −1 → Benzer terim | x² ve 4x² → Benzer terim | 2x ve 2 → Benzer değil","explanation":"Benzer terimler (aynı değişkenin aynı kuvveti) toplanıp çıkarılarak ifade sadeleştirilir; katsayılar toplanır, değişken kısmı aynı kalır."},{"questionId":"mat8u6-ozdeslik-017","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ozdeslik","rank":2,"type":"bin","prompt":"Eşitlikleri ayır.","data":{"L":["✅ Özdeşlik","❌ Özdeşlik değil"],"r":[["(x + 2)² = x² + 4x + 4",0],["(x + 2)² = x² + 4",1],["(x − 3)(x + 3) = x² − 9",0],["(x − 3)² = x² − 9",1]]},"textPlain":"Eşitlikleri ayır. Bölmeler: Özdeşlik, Özdeşlik değil. Kartlar: (x + 2)² = x² + 4x + 4, (x + 2)² = x² + 4, (x − 3)(x + 3) = x² − 9, (x − 3)² = x² − 9.","correctAnswer":"(x + 2)² = x² + 4x + 4 → Özdeşlik | (x + 2)² = x² + 4 → Özdeşlik değil | (x − 3)(x + 3) = x² − 9 → Özdeşlik | (x − 3)² = x² − 9 → Özdeşlik değil","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur. (a + b)² ≠ a² + b²: 2ab terimi unutulmamalıdır."},{"questionId":"mat8u6-ozdeslik-018","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ozdeslik","rank":3,"type":"bin","prompt":"Eşitlikleri ayır.","data":{"L":["✅ Özdeşlik","❌ Özdeşlik değil"],"r":[["(2x)² = 4x²",0],["(x + 1)(x − 1) = x² − 1",0],["(x − 5)² = x² − 10x − 25",1],["x² + 6x + 9 = (x + 3)²",0],["2(x + 4) = 2x + 4",1]]},"textPlain":"Eşitlikleri ayır. Bölmeler: Özdeşlik, Özdeşlik değil. Kartlar: (2x)² = 4x², (x + 1)(x − 1) = x² − 1, (x − 5)² = x² − 10x − 25, x² + 6x + 9 = (x + 3)², 2(x + 4) = 2x + 4.","correctAnswer":"(2x)² = 4x² → Özdeşlik | (x + 1)(x − 1) = x² − 1 → Özdeşlik | (x − 5)² = x² − 10x − 25 → Özdeşlik değil | x² + 6x + 9 = (x + 3)² → Özdeşlik | 2(x + 4) = 2x + 4 → Özdeşlik değil","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-carpan-015","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpan","rank":2,"type":"bin","prompt":"İfadeleri çarpanlara ayırmada kullanılacak yönteme göre ayır.","data":{"L":["📦 Ortak çarpan","🟰 İki kare farkı","🔲 Tam kare"],"r":[["5x − 15",0],["x² − 81",1],["x² + 14x + 49",2],["x² − 4x",0],["16 − x²",1],["x² − 2x + 1",2]]},"textPlain":"İfadeleri çarpanlara ayırmada kullanılacak yönteme göre ayır. Bölmeler: Ortak çarpan, İki kare farkı, Tam kare. Kartlar: 5x − 15, x² − 81, x² + 14x + 49, x² − 4x, 16 − x², x² − 2x + 1.","correctAnswer":"5x − 15 → Ortak çarpan | x² − 81 → İki kare farkı | x² + 14x + 49 → Tam kare | x² − 4x → Ortak çarpan | 16 − x² → İki kare farkı | x² − 2x + 1 → Tam kare","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-ifade-014","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"ifade","rank":1,"type":"key","prompt":"x = 3 için 2x + 5 ifadesinin değeri kaçtır?","data":{"a":11,"u":""},"textPlain":"x = 3 için 2x + 5 ifadesinin değeri kaçtır?","correctAnswer":"11","explanation":"2 · 3 + 5 = 11."},{"questionId":"mat8u6-ifade-015","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ifade","rank":2,"type":"key","prompt":"x = 4 için x² − 3x + 2 ifadesinin değeri kaçtır?","data":{"a":6,"u":""},"textPlain":"x = 4 için x² − 3x + 2 ifadesinin değeri kaçtır?","correctAnswer":"6","explanation":"16 − 12 + 2 = 6."},{"questionId":"mat8u6-ifade-016","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ifade","rank":3,"type":"key","prompt":"a = 5 ve b = 2 için (a − b)(a + b) ifadesinin değeri kaçtır?","data":{"a":21,"u":""},"textPlain":"a = 5 ve b = 2 için (a − b)(a + b) ifadesinin değeri kaçtır?","correctAnswer":"21","explanation":"a² − b² = 25 − 4 = 21."},{"questionId":"mat8u6-ozdeslik-019","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"ozdeslik","rank":3,"type":"key","prompt":"99 · 101 işlemini özdeşlikle hesapla: sonuç kaçtır?","data":{"a":9999,"u":""},"textPlain":"99 · 101 işlemini özdeşlikle hesapla: sonuç kaçtır?","correctAnswer":"9999","explanation":"(100 − 1)(100 + 1) = 100² − 1² = 9999."},{"questionId":"mat8u6-problem-010","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"problem","rank":2,"type":"key","prompt":"x + y = 7 ve x · y = 10 ise x² + y² kaçtır?","data":{"a":29,"u":""},"textPlain":"x + y = 7 ve x · y = 10 ise x² + y² kaçtır?","correctAnswer":"29","explanation":"(x + y)² = x² + 2xy + y² → 49 = x² + y² + 20 → x² + y² = 29."},{"questionId":"mat8u6-problem-011","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"problem","rank":3,"type":"key","prompt":"a − b = 3 ve a + b = 11 ise a² − b² kaçtır?","data":{"a":33,"u":""},"textPlain":"a − b = 3 ve a + b = 11 ise a² − b² kaçtır?","correctAnswer":"33","explanation":"a² − b² = (a − b)(a + b) = 3 · 11 = 33."},{"questionId":"mat8u6-problem-012","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"problem","rank":3,"type":"key","prompt":"51² − 49² işleminin sonucu kaçtır?","data":{"a":200,"u":""},"textPlain":"51² − 49² işleminin sonucu kaçtır?","correctAnswer":"200","explanation":"(51 − 49)(51 + 49) = 2 · 100 = 200."},{"questionId":"mat8u6-carpim-014","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpim","rank":1,"type":"key","prompt":"(x + 2)(x + 3) çarpımında x’in katsayısı kaçtır?","data":{"a":5,"u":""},"textPlain":"(x + 2)(x + 3) çarpımında x’in katsayısı kaçtır?","correctAnswer":"5","explanation":"x · 3 + 2 · x = 5x."},{"questionId":"mat8u6-ifade-017","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"ifade","rank":1,"type":"poly","prompt":"7x − 3x + 2 ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla.","data":{"e":"7x − 3x + 2","a":[0,4,2]},"textPlain":"7x − 3x + 2 ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla. İfade: 7x − 3x + 2.","correctAnswer":"7x − 3x + 2 = 4x + 2","explanation":"Benzer terimler (aynı değişkenin aynı kuvveti) toplanıp çıkarılarak ifade sadeleştirilir; katsayılar toplanır, değişken kısmı aynı kalır."},{"questionId":"mat8u6-ifade-018","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ifade","rank":2,"type":"poly","prompt":"−(x² − 2x) + 3x² − x ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla.","data":{"e":"−(x² − 2x) + 3x² − x","a":[2,1,0]},"textPlain":"−(x² − 2x) + 3x² − x ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla. İfade: −(x² − 2x) + 3x² − x.","correctAnswer":"−(x² − 2x) + 3x² − x = 2x² + x","explanation":"Benzer terimler (aynı değişkenin aynı kuvveti) toplanıp çıkarılarak ifade sadeleştirilir; katsayılar toplanır, değişken kısmı aynı kalır. Parantezin önündeki eksi, içindeki her terimin işaretini değiştirir."},{"questionId":"mat8u6-ifade-019","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ifade","rank":2,"type":"tiles","prompt":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla.","data":{"p":[0,3,2],"m":[1,1,0],"a":[-1,2,2]},"textPlain":"Masadaki cebir karolarının gösterdiği ifadeyi sadeleştirerek katsayıları ayarla. Pozitif karolar: 0 x², 3 x, 2 birim; negatif karolar: 1 x², 1 x, 0 birim.","correctAnswer":"−x² + 2x + 2","explanation":"Cebir karolarında büyük kare x², uzun dikdörtgen x, küçük kare 1’i gösterir; kırmızı karolar negatiftir. Bir pozitif ve bir negatif aynı karo birbirini götürür (sıfır çifti)."},{"questionId":"mat8u6-ifade-020","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ifade","rank":2,"type":"match","prompt":"Sözel ifadeleri cebirsel ifadelerle eşleştir.","data":{"p":[["Bir sayının 3 katının 2 eksiği","3x − 2"],["Bir sayının 2 eksiğinin 3 katı","3(x − 2)"],["Bir sayının karesinin 5 fazlası","x² + 5"]],"x":["3x + 2"]},"textPlain":"Sözel ifadeleri cebirsel ifadelerle eşleştir. Sol: Bir sayının 3 katının 2 eksiği, Bir sayının 2 eksiğinin 3 katı, Bir sayının karesinin 5 fazlası. Parçalar: 3x − 2, 3(x − 2), x² + 5, 3x + 2.","correctAnswer":"Bir sayının 3 katının 2 eksiği = 3x − 2 | Bir sayının 2 eksiğinin 3 katı = 3(x − 2) | Bir sayının karesinin 5 fazlası = x² + 5","explanation":"Sözel ifadeler cebirsel ifadeye çevrilirken işlem sırası korunur: “2 eksiğinin 3 katı” önce çıkarma, sonra çarpma demektir."},{"questionId":"mat8u6-ifade-021","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Basit cebirsel ifadeler, benzer terimler ve değer hesaplama","outcome":"Basit cebirsel ifadeleri anlar ve farklı biçimlerde yazar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ifade","rank":2,"type":"key","prompt":"x = −2 için 3x² + x ifadesinin değeri kaçtır?","data":{"a":10,"u":""},"textPlain":"x = −2 için 3x² + x ifadesinin değeri kaçtır?","correctAnswer":"10","explanation":"3 · 4 + (−2) = 10. Negatif sayının karesi pozitiftir."},{"questionId":"mat8u6-carpim-015","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpim","rank":1,"type":"poly","prompt":"2x(x + 3) ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla.","data":{"e":"2x(x + 3)","a":[2,6,0]},"textPlain":"2x(x + 3) ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla. İfade: 2x(x + 3).","correctAnswer":"2x(x + 3) = 2x² + 6x","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-016","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpim","rank":2,"type":"poly","prompt":"(x + 6)(x − 1) ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla.","data":{"e":"(x + 6)(x − 1)","a":[1,5,-6]},"textPlain":"(x + 6)(x − 1) ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla. İfade: (x + 6)(x − 1).","correctAnswer":"(x + 6)(x − 1) = x² + 5x − 6","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-017","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"zor","group":"carpim","rank":3,"type":"poly","prompt":"(4x + 1)(x − 2) ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla.","data":{"e":"(4x + 1)(x − 2)","a":[4,-7,-2]},"textPlain":"(4x + 1)(x − 2) ifadesini sadeleştir: x², x ve sayı katsayılarını ayarla. İfade: (4x + 1)(x − 2).","correctAnswer":"(4x + 1)(x − 2) = 4x² − 7x − 2","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-018","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpim","rank":1,"type":"box","prompt":"(x + 5)(x + 3) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle.","data":{"r":["x","5"],"c":["x","3"],"g":[["x²","3x"],["5x","15"]],"x":["8x","8"]},"textPlain":"(x + 5)(x + 3) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: x, 5; sütunlar: x, 3.","correctAnswer":"Hücreler: x·x = x², x·3 = 3x, 5·x = 5x, 5·3 = 15; sonuç x² + 8x + 15","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-019","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpim","rank":2,"type":"box","prompt":"(x − 4)(2x + 1) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle.","data":{"r":["x","−4"],"c":["2x","1"],"g":[["2x²","x"],["−8x","−4"]],"x":["−7x","4"]},"textPlain":"(x − 4)(2x + 1) çarpımı için tablonun hücrelerine doğru terim karolarını sürükle. Satırlar: x, −4; sütunlar: 2x, 1.","correctAnswer":"Hücreler: x·2x = 2x², x·1 = x, −4·2x = −8x, −4·1 = −4; sonuç 2x² − 7x − 4","explanation":"Dağılma özelliği: a(b + c) = ab + ac. İki terimli iki ifade çarpılırken birinci ifadenin her terimi ikincinin her terimiyle çarpılır, sonra benzer terimler toplanır."},{"questionId":"mat8u6-carpim-020","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerin çarpımı","outcome":"Cebirsel ifadelerin çarpımını yapar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpim","rank":2,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"rect","s":["3x","x − 2"],"q":"A","a":[3,-6,0]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: dikdörtgen, kenarlar: 3x, x − 2.","correctAnswer":"3x² − 6x","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır."},{"questionId":"mat8u6-ozdeslik-020","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Özdeşlikler ve modellerle açıklanması","outcome":"Özdeşlikleri modellerle açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"ozdeslik","rank":2,"type":"model","prompt":"(x + 4)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle.","data":{"k":"sq","a":"x","b":"4","c":["x²","4x","4x","16","8","8x"],"ans":["x²","4x","4x","16"]},"textPlain":"(x + 4)² modeli. Alan modelindeki numaralı bölgelere doğru alan karolarını sürükle. Model: kenarı x + 4 olan kare.","correctAnswer":"Bölgeler: 1) x², 2) 4x, 3) 4x, 4) 16","explanation":"Özdeşlikler alan modelleriyle gösterilir: kenarı a + b olan kare; a², b² ve iki tane ab parçasından oluşur. Kenarı a olan kareden kenarı b olan kare çıkarılırsa kalan parça (a − b)(a + b) dikdörtgenine dönüştürülebilir."},{"questionId":"mat8u6-carpan-016","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpan","rank":1,"type":"factor","prompt":"5x − 20 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla.","data":{"t":[0,5,-20],"f":"k","v":{"k":5,"m":-4}},"textPlain":"5x − 20 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla. Hedef: 5x − 20. Kalıplar: k(x + m), kx(x + m), (px + m)², (px − m)(px + m).","correctAnswer":"5x − 20 = 5(x − 4)","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-carpan-017","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpan","rank":2,"type":"factor","prompt":"2x² + 8x ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla.","data":{"t":[2,8,0],"f":"kx","v":{"k":2,"m":4}},"textPlain":"2x² + 8x ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla. Hedef: 2x² + 8x. Kalıplar: k(x + m), kx(x + m), (px + m)², (px − m)(px + m).","correctAnswer":"2x² + 8x = 2x(x + 4)","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-carpan-018","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"carpan","rank":1,"type":"factor","prompt":"x² − 2x + 1 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla.","data":{"t":[1,-2,1],"f":"sq","v":{"p":1,"m":-1}},"textPlain":"x² − 2x + 1 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla. Hedef: x² − 2x + 1. Kalıplar: k(x + m), kx(x + m), (px + m)², (px − m)(px + m).","correctAnswer":"x² − 2x + 1 = (x − 1)²","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-carpan-019","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpan","rank":2,"type":"factor","prompt":"x² − 100 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla.","data":{"t":[1,0,-100],"f":"diff","v":{"p":1,"m":10}},"textPlain":"x² − 100 ifadesini çarpanlarına ayır: kalıbı seç ve sayıları ayarla. Hedef: x² − 100. Kalıplar: k(x + m), kx(x + m), (px + m)², (px − m)(px + m).","correctAnswer":"x² − 100 = (x − 10)(x + 10)","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-carpan-020","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadeleri çarpanlarına ayırma","outcome":"Cebirsel ifadeleri çarpanlara ayırır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"carpan","rank":2,"type":"match","prompt":"Her ifadenin eşini yapboz parçasıyla yerleştir.","data":{"p":[["6x + 9","3(2x + 3)"],["x² − 36","(x − 6)(x + 6)"],["4x − x²","x(4 − x)"]],"x":["(x − 6)²"]},"textPlain":"Her ifadenin eşini yapboz parçasıyla yerleştir. Sol: 6x + 9, x² − 36, 4x − x². Parçalar: 3(2x + 3), (x − 6)(x + 6), x(4 − x), (x − 6)².","correctAnswer":"6x + 9 = 3(2x + 3) | x² − 36 = (x − 6)(x + 6) | 4x − x² = x(4 − x)","explanation":"Çarpanlara ayırırken önce ortak çarpan aranır; sonra ifade a² − b² ya da a² ± 2ab + b² kalıbına uyuyorsa özdeşlikle yazılır."},{"questionId":"mat8u6-problem-013","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"kolay","group":"problem","rank":1,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"rect","s":["x","x + 6"],"q":"A","a":[1,6,0]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: dikdörtgen, kenarlar: x, x + 6.","correctAnswer":"x² + 6x","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır."},{"questionId":"mat8u6-problem-014","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"problem","rank":2,"type":"geo","prompt":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla.","data":{"k":"sq","s":["x − 1"],"q":"P","a":[0,4,-4]},"textPlain":"Şeklin çevresini gösteren ifadenin katsayılarını ayarla. Şekil: kare, kenarlar: x − 1.","correctAnswer":"4x − 4","explanation":"Dikdörtgenin alanı kısa kenar × uzun kenar, çevresi 2 × (kısa kenar + uzun kenar) ile bulunur; ifadeler dağılma özelliğiyle açılır. Karenin çevresi 4 × kenar."},{"questionId":"mat8u6-problem-015","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”","difficulty":"orta","group":"problem","rank":2,"type":"geo","prompt":"Şeklin alanını gösteren ifadenin katsayılarını ayarla.","data":{"k":"L","s":["x","1"],"q":"A","a":[1,0,-1]},"textPlain":"Şeklin alanını gösteren ifadenin katsayılarını ayarla. Şekil: büyük kareden küçük kare çıkarılmış şekil, kenarlar: x, 1.","correctAnswer":"x² − 1","explanation":"Özdeşlikler: (a + b)² = a² + 2ab + b²; (a − b)² = a² − 2ab + b²; (a − b)(a + b) = a² − b². Bu eşitlikler değişkenin her değeri için doğrudur."},{"questionId":"mat8u6-problem-016","grade":8,"subject":"Matematik","unit":"6. Ünite: Cebirsel İfadeler ve Özdeşlikler","topic":"Cebirsel ifadelerle alan ve çevre problemleri","outcome":"Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.","sourceRef":
