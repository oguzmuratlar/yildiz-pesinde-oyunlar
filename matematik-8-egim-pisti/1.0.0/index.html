<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Eğim Pisti</title>
<style>

ralarında doğrusal ilişki bulunan iki değişkenden birinin diğerine bağlı olarak nasıl değiştiğini tablo ve grafikle gösterir; doğrusal denklemlerin grafiğini çizer.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"orta","group":"iliski","rank":2,"type":"gmatch","prompt":"y = 3x − 1 denkleminin grafiğine dokun.","data":{"o":[[-3,1,-1],[3,1,1],[3,1,-1]],"a":2,"e":"y = 3x − 1"},"textPlain":"y = 3x − 1 denkleminin grafiğine dokun. Seçenekler: y = 3x − 1, y = −3x − 1, y = 3x + 1 grafikleri.","correctAnswer":"C grafiği","explanation":"Grafik seçilirken doğrunun y eksenini kestiği nokta (n) ve eğimi (m) denklemle karşılaştırılır."},{"questionId":"mat8u7-egim-020","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrunun eğimi","outcome":"Doğrunun eğimini modellerle açıklar; doğrusal denklemlerin grafiğini eğimle ilişkilendirir.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"orta","group":"egim","rank":2,"type":"slope","prompt":"Grafikteki doğrunun eğimini pay ve paydayla kur (işaret düğmesiyle eksi yapılabilir).","data":{"P":[[-6,-3],[6,3]],"s":[1,2]},"textPlain":"Grafikteki doğrunun eğimini pay ve paydayla kur (işaret düğmesiyle eksi yapılabilir). Doğru (−6, −3) ve (6, 3) noktalarından geçiyor.","correctAnswer":"Eğim 1/2","explanation":"Eğim = dikey değişim ÷ yatay değişim. Soldan sağa yükselen doğrunun eğimi pozitif, alçalanın negatiftir; yatay doğrunun eğimi 0’dır. Eğimin mutlak değeri büyüdükçe doğru dikleşir."},{"questionId":"mat8u7-problem-014","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"kolay","group":"problem","rank":1,"type":"model","prompt":"Kumbarada 30 TL var; her gün 5 TL ekleniyor. y: para, x: gün. Denklemi kur: eğimi (m) ve başlangıç değerini (n) ayarla.","data":{"m":5,"n":30},"textPlain":"Kumbarada 30 TL var; her gün 5 TL ekleniyor. y: para, x: gün. Denklemi kur: eğimi (m) ve başlangıç değerini (n) ayarla.","correctAnswer":"y = 5x + 30 (örnek: x = 6 için y = 60)","explanation":"Sabit bir başlangıç değeri ve birim başına düzgün artış/azalış olan durumlar y = mx + n ile modellenir: m birim başına değişim (eğim), n başlangıç değeridir."},{"questionId":"mat8u7-problem-015","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"orta","group":"problem","rank":2,"type":"model","prompt":"Telefonun şarjı %100 ve her saat %8 azalıyor. y: şarj, x: saat. Denklemi kur: eğimi (m) ve başlangıç değerini (n) ayarla.","data":{"m":-8,"n":100},"textPlain":"Telefonun şarjı %100 ve her saat %8 azalıyor. y: şarj, x: saat. Denklemi kur: eğimi (m) ve başlangıç değerini (n) ayarla.","correctAnswer":"y = −8x + 100 (örnek: x = 5 için y = 60)","explanation":"Sabit bir başlangıç değeri ve birim başına düzgün artış/azalış olan durumlar y = mx + n ile modellenir: m birim başına değişim (eğim), n başlangıç değeridir."},{"questionId":"mat8u7-problem-016","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"zor","group":"problem","rank":3,"type":"model","prompt":"Bir mumun boyu 24 cm ve her saat 2 cm kısalıyor. y: boy, x: saat. Denklemi kur: eğimi (m) ve başlangıç değerini (n) ayarla.","data":{"m":-2,"n":24},"textPlain":"Bir mumun boyu 24 cm ve her saat 2 cm kısalıyor. y: boy, x: saat. Denklemi kur: eğimi (m) ve başlangıç değerini (n) ayarla.","correctAnswer":"y = −2x + 24 (örnek: x = 6 için y = 12)","explanation":"Sabit bir başlangıç değeri ve birim başına düzgün artış/azalış olan durumlar y = mx + n ile modellenir: m birim başına değişim (eğim), n başlangıç değeridir."},{"questionId":"mat8u7-problem-017","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"orta","group":"problem","rank":2,"type":"gmatch","prompt":"y = 2x − 2 denkleminin grafiğine dokun.","data":{"o":[[2,1,-2],[2,1,2],[-2,1,-2]],"a":0,"e":"y = 2x − 2"},"textPlain":"y = 2x − 2 denkleminin grafiğine dokun. Seçenekler: y = 2x − 2, y = −2x − 2, y = 2x + 2 grafikleri.","correctAnswer":"A grafiği","explanation":"Grafik seçilirken doğrunun y eksenini kestiği nokta (n) ve eğimi (m) denklemle karşılaştırılır."},{"questionId":"mat8u7-problem-018","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"kolay","group":"problem","rank":1,"type":"table","prompt":"Bir kayakçı saniyede 10 m ilerliyor. y = 10x için tablodaki y değerlerini ayarla.","data":{"m":[10,1],"n":0,"xs":[1,2,3,5],"ys":[10,20,30,50]},"textPlain":"Bir kayakçı saniyede 10 m ilerliyor. y = 10x için tablodaki y değerlerini ayarla. x değerleri: 1, 2, 3, 5.","correctAnswer":"y değerleri: 10, 20, 30, 50","explanation":"Doğrusal denklemde x yerine verilen değer konarak y bulunur; bulunan sıralı ikililer koordinat düzleminde bir doğru üzerinde sıralanır."},{"questionId":"mat8u7-problem-019","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"kolay","group":"problem","rank":1,"type":"key","prompt":"Bir otopark ilk saat için 20 TL, sonraki her saat için 10 TL alıyor: y = 10x + 20 (x: ek saat). 3 ek saat için kaç TL ödenir?","data":{"a":50,"u":"TL"},"textPlain":"Bir otopark ilk saat için 20 TL, sonraki her saat için 10 TL alıyor: y = 10x + 20 (x: ek saat). 3 ek saat için kaç TL ödenir?","correctAnswer":"50 TL","explanation":"y = 10 · 3 + 20 = 50."},{"questionId":"mat8u7-problem-020","grade":8,"subject":"Matematik","unit":"7. Ünite: Doğrusal Denklemler","topic":"Doğrusal ilişki içeren gerçek hayat durumları","outcome":"Doğrusal ilişki içeren gerçek hayat durumlarına ait denklem, tablo ve grafiği oluşturur ve yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Doğrusal Denklemler”","difficulty":"zor","group":"problem","rank":3,"type":"key","prompt":"y = −2x + 10 doğrusunun x eksenini kestiği noktanın x koordinatı kaçtır?","data":{"a":5,"u":""},"textPlain":"y = −2x + 10 doğrusunun x eksenini kestiği noktanın x koordinatı kaçtır?","correctAnswer":"5","explanation":"y = 0 → −2x + 10 = 0 → x = 5."}]</script>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:'matematik-8-egim-pisti',gameVersion:'1.0.0',grade:8,subjectId:'math',subjectName:'Matematik',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([8]),TOTAL=10,RECENT_KEY='mat8-egim-pisti-recent',GAME_NAME='Eğim Pisti';
const GROUP_LABEL={denklem:'d',koordinat:'k',iliski:'i',egim:'e',problem:'p'},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,sessionRecent=[],reviewAt=0,okCount=0,points=0,cur=null,timers=[];
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function stars(n){return n>=9?3:n>=7?2:n>=5?1:0;}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='Uygulamaya bağlanıyor';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='Bu tarayıcı denemesi uygulamaya sonuç kaydetmez.';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();$('card').classList.add('hidden');$('stage').classList.add('hidden');$('dock').classList.add('hidden');$('intro').classList.remove('hidden');$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function osc(f,t0,dur,type,vol,slide){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sfx(kind){if(muted||!audio||document.hidden)return;try{
 if(kind==='tap')osc(640,0,.05,'sine',.05);
 else if(kind==='tick')osc(1150,0,.02,'square',.015);
 else if(kind==='plop')osc(520,0,.08,'sine',.07,880);
 else if(kind==='drop')osc(300,0,.12,'triangle',.06,180);
 else if(kind==='drum'){for(let i=0;i<10;i++)osc(110+rnd()*30,i*.045,.05,'square',.025);}
 else if(kind==='lo'){[784,988,1319].forEach((f,i)=>osc(f,.45+i*.07,.18,'triangle',.07));}
 else if(kind==='hi'){osc(392,.45,.35,'sawtooth',.04,196);osc(330,.6,.4,'triangle',.05,165);}
 else if(kind==='ring'){for(let i=0;i<4;i++){osc(880,i*.22,.09,'square',.03);osc(1100,i*.22+.1,.09,'square',.03);}}
 else if(kind==='cash'){osc(1568,0,.08,'square',.04);osc(2093,.07,.25,'triangle',.06);}
 else if(kind==='ok'){[659,880,1175].forEach((f,i)=>osc(f,i*.08,.18,'triangle',.07));}
 else if(kind==='miss'){osc(330,0,.18,'square',.03,220);osc(247,.14,.22,'triangle',.05);}
 else if(kind==='win'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>osc(f,i*.13,.36,'triangle',.08));}
 else if(kind==='creak'){osc(220,0,.4,'sawtooth',.015,160);osc(330,.1,.3,'triangle',.02,250);}
 else if(kind==='zip'){for(let i=0;i<10;i++)osc(1800+rnd()*900,i*.025,.02,'square',.012);}
 else if(kind==='stitch'){for(let i=0;i<5;i++)osc(900,i*.07,.03,'triangle',.03,600);}
 else if(kind==='clip'){osc(1500,0,.04,'square',.03);osc(700,.04,.05,'square',.02);}
 else if(kind==='flame'){osc(180,0,.5,'sawtooth',.015,90);osc(700,0,.4,'sine',.02,1100);}
 else if(kind==='door'){osc(120,0,.3,'square',.03,70);osc(400,.1,.2,'triangle',.03,200);}
 else if(kind==='splash'){for(let i=0;i<8;i++)osc(500+rnd()*900,i*.04,.08,'sine',.03,200);}
 else if(kind==='paper'){for(let i=0;i<6;i++)osc(2000+rnd()*2000,i*.04,.03,'square',.008);}
 else if(kind==='beam'){osc(500,0,.5,'sine',.03,1400);}
 else if(kind==='thunder'){const n=Math.floor(audio.sampleRate*1.2),bf=audio.createBuffer(1,n,audio.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++){d[i]=(rnd()*2-1)*Math.pow(1-i/n,2);}const src=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=400;g.gain.value=.25;src.buffer=bf;src.connect(f);f.connect(g);g.connect(master);src.start();}
 else if(kind==='lamp'){[523,659,784,1047].forEach((f,i)=>osc(f,i*.08,.4,'sine',.04));}
