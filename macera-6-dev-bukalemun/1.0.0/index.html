<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Dev Bukalemun</title>
<style>
:root{--c1:#1fa35a;--c2:#d24ab8;--deep:#0b2e1c;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:normal;text-align:center;width:92%;font-size:clamp(20px,6.6vw,26px);line-height:1.15}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.bin{border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
#boss.cam{opacity:var(--vis,.3);filter:hue-rotate(var(--hue,0deg)) saturate(.8) drop-shadow(0 6px 8px rgba(0,0,0,.25));transition:opacity .7s,filter .7s}
#boss.cam.shift{animation:bob 3s ease-in-out infinite,hue 1.6s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
.jar{position:absolute;width:9%;height:13%;transform:translate(-50%,-50%);z-index:3;border-radius:30% 30% 40% 40%;background:rgba(255,255,255,.35);border:2.5px solid rgba(255,255,255,.9);box-shadow:0 2px 4px rgba(0,0,0,.35);overflow:hidden}
.jar::before{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--fill,80%);background:var(--col);transition:height .6s}
.jar::after{content:"";position:absolute;left:18%;top:10%;width:18%;height:45%;border-radius:4px;background:rgba(255,255,255,.55)}
.jar.used{--fill:0%}
.blob{position:absolute;width:8%;aspect-ratio:1;border-radius:50%;z-index:4;pointer-events:none;transform:translate(-50%,-50%);animation:throw .55s ease-in forwards}
@keyframes throw{to{left:50%;top:40%;transform:translate(-50%,-50%) scale(2.2);opacity:.15}}
.leaf{position:absolute;z-index:20;font-size:28px;pointer-events:none;animation:blow 1s ease-in forwards}
@keyframes blow{from{transform:translateX(-60px) rotate(0)}to{transform:translateX(460px) rotate(540deg);opacity:.2}}
#splat{position:absolute;inset:0;z-index:19;pointer-events:none;opacity:0;background:linear-gradient(90deg,rgba(30,120,50,.0),rgba(30,140,60,.55) 40%,rgba(30,120,50,0))}
#splat.on{animation:sweep .9s ease forwards}
@keyframes sweep{0%{opacity:0;transform:translateX(-100%)}30%{opacity:1}100%{opacity:0;transform:translateX(100%)}}
#boss.cam.gone{opacity:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>
<div id="conf" aria-hidden="true"></div>

ik", "unit": "4. Tema: İstatistiksel Araştırma Süreci", "topic": "Ortanca", "outcome": "Aritmetik ortalama, ortanca, tepe değer ve açıklığı bulabilme.", "sourceRef": "MEB Matematik 6. Sınıf Ders Kitabı 1. Kitap, 4. Tema “İstatistiksel Araştırma Süreci”, s. 186 (veri ekranda verilir)", "difficulty": "orta", "group": "m4", "rank": 2, "type": "num", "prompt": "3, 8, 5, 10 veri grubunun ortancası kaçtır?", "data": {"answer": 65, "digits": 2, "unit": "", "dec": 1}, "textPlain": "3, 8, 5, 10 veri grubunun ortancası kaçtır?", "correctAnswer": "6,5", "explanation": "Sıralı veri: 3, 5, 8, 10. Veri sayısı çift olduğundan ortadaki iki değerin ortalaması alınır: (5 + 8) ÷ 2 = 6,5."}, {"questionId": "boss-a06-m4-12", "grade": 6, "subjectId": "math", "subject": "Matematik", "unit": "4. Tema: İstatistiksel Araştırma Süreci", "topic": "Karşılaştırma sorusu", "outcome": "Kategorik veya nicel (kesikli) veriye dayalı, karşılaştırma gerektiren araştırma soruları oluşturabilme.", "sourceRef": "MEB Matematik 6. Sınıf Ders Kitabı 1. Kitap, 4. Tema “İstatistiksel Araştırma Süreci”, s. 169", "difficulty": "orta", "group": "m4", "rank": 2, "type": "choice", "prompt": "Hangisi karşılaştırma gerektiren bir istatistiksel araştırma sorusudur?", "data": {"options": ["6. ve 7. sınıf öğrencilerinin haftalık kitap okuma süreleri arasında fark var mıdır?", "Okulumuzun adı nedir?", "Benim boyum kaç santimetredir?"]}, "textPlain": "Hangisi karşılaştırma gerektiren bir istatistiksel araştırma sorusudur? Seçenekler: 6. ve 7. sınıf öğrencilerinin haftalık kitap okuma süreleri arasında fark var mıdır? / Okulumuzun adı nedir? / Benim boyum kaç santimetredir?", "correctAnswer": "6. ve 7. sınıf öğrencilerinin haftalık kitap okuma süreleri arasında fark var mıdır?", "explanation": "İki grubun verilerini karşılaştırmayı gerektiren ve farklı cevapları olabilen soru istatistiksel araştırma sorusudur."}, {"questionId": "boss-a06-m4-13", "grade": 6, "subjectId": "math", "subject": "Matematik", "unit": "4. Tema: İstatistiksel Araştırma Süreci", "topic": "Planlama", "outcome": "İstatistiksel araştırma sürecini planlayabilme; ölçütlere uygun ve yanlı olmayan araştırma/anket soruları ile uygun veri kaynaklarını belirleyebilme.", "sourceRef": "MEB Matematik 6. Sınıf Ders Kitabı 1. Kitap, 4. Tema “İstatistiksel Araştırma Süreci”, s. 174", "difficulty": "orta", "group": "m4", "rank": 2, "type": "choice", "prompt": "Bir istatistiksel araştırma planlanırken ilk yapılması gereken nedir?", "data": {"options": ["Araştırma sorusunu belirlemek", "Grafik çizmek", "Sonucu yazmak"]}, "textPlain": "Bir istatistiksel araştırma planlanırken ilk yapılması gereken nedir? Seçenekler: Araştırma sorusunu belirlemek / Grafik çizmek / Sonucu yazmak", "correctAnswer": "Araştırma sorusunu belirlemek", "explanation": "Araştırma, soru belirlenerek başlar; veri toplama ve analiz bundan sonra gelir."}, {"questionId": "boss-a06-m4-14", "grade": 6, "subjectId": "math", "subject": "Matematik", "unit": "4. Tema: İstatistiksel Araştırma Süreci", "topic": "Merkezî eğilim ölçüleri", "outcome": "Veri setini en iyi temsil eden merkezî eğilim ölçüsünü seçebilme; sonuç ve yorumları veriye dayanarak tartışabilme.", "sourceRef": "MEB Matematik 6. Sınıf Ders Kitabı 1. Kitap, 4. Tema “İstatistiksel Araştırma Süreci”, s. 189", "difficulty": "orta", "group": "m4", "rank": 2, "type": "match", "prompt": "Her ölçüyü tanımıyla eşleştir.", "data": {"pairs": [["Tepe değer", "En çok tekrar eden değer"], ["Ortanca", "Sıralı verinin ortasındaki değer"], ["Aritmetik ortalama", "Veri toplamının veri sayısına bölümü"]]}, "textPlain": "Her ölçüyü tanımıyla eşleştir. Sol: Tepe değer; Ortanca; Aritmetik ortalama. Sağ: En çok tekrar eden değer; Sıralı verinin ortasındaki değer; Veri toplamının veri sayısına bölümü.", "correctAnswer": "Tepe değer = En çok tekrar eden değer; Ortanca = Sıralı verinin ortasındaki değer; Aritmetik ortalama = Veri toplamının veri sayısına bölümü", "explanation": "Tepe değer en sık görülen değer; ortanca sıralı ve <script>
"use strict";
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),BOSS=JSON.parse($('boss-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;
const SUBJ={science:['🔬','Fen'],math:['📐','Matematik'],turkish:['📖','Türkçe']},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,cur=null,okCount=0,badCount=0,defeated=false,checked=false;
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();showIntro();$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}
function sfx(k){({tap:()=>tone(660,.06,'triangle',.1),pick:()=>tone(520,.07,'triangle',.12,0,120),
 ok:()=>{tone(523,.12,'triangle',.16);tone(784,.16,'triangle',.16,.09);tone(1046,.22,'sine',.12,.18);},
 bad:()=>{tone(220,.28,'sawtooth',.08,0,-90);noise(.25,.12,.05,500);},
 splat:()=>{noise(.35,.28,0,700);tone(140,.3,'sine',.12,0,-60);},
 bubble:()=>{for(let i=0;i<5;i++)tone(400+i*120,.07,'sine',.08,i*.06,200);},
 free:()=>{tone(880,.1,'sine',.12);tone(1320,.18,'sine',.1,.08);},
 roar:()=>{tone(90,.6,'sawtooth',.1,0,60);noise(.6,.12,0,400);},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12));},
 gate:()=>{tone(196,.25,'square',.06);tone(294,.35,'square',.06,.2);}}[k]||(()=>{}))();}
$('mute').onclick=()=>{muted=!muted;unlockAudio();if(master)master.gain.value=muted?0:.8;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');};
/* ---------- Deste ---------- */
function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}
function remember(ids){try{localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent()].slice(0,30)));}catch(e){}}
function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});
  const cnt=[0,0,0,0];al.forEach(a=>a.ranks.forEach(r=>cnt[r]++));const d=Math.abs(cnt[1]-4)+Math.abs(cnt[2]-4)+Math.abs(cnt[3]-4);if(d<bd){bd=d;best=al;}if(d===0)break;}
 return best;}
function buildDeck(){const rec=new Set(recent()),plan=deckPlan();
 let chosen=null,cs=-1;for(let t=0;t<80;t++){const c=[];let fr=0;plan.forEach(a=>a.ranks.forEach(r=>{const pool=BANK.filter(q=>q.group===a.u&&q.rank===r&&!c.includes(q));const fresh=pool.filter(q=>!rec.has(q.questionId));const q=shuffle(t<40&&fresh.length?fresh:pool)[0];if(!rec.has(q.questionId))fr++;c.push(q);}));
  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
 let best=null,bs=1e9;
 for(let t=0;t<400;t++){const seq=[1,2,3].flatMap(r=>shuffle(chosen.filter(q=>q.rank===r)));let s=0;for(let i=1;i<seq.length;i++){if(seq[i].subjectId===seq[i-1].subjectId)s+=3;if(seq[i].type===seq[i-1].type)s+=1;}if(s<bs){bs=s;best=seq;}if(s===0)break;}
 return best;}
/* ---------- Sahne ---------- */
function setupScene(){const rig=$('rig');rig.querySelectorAll('.mx').forEach(e=>e.remove());$('boss').src=BOSS.img.idle;$('boss').className='';MECH.setup(rig);meter();}
function meter(){$('mArms').textContent=defeated?'🏆 '+BOSS.defeatShort:MECH.label(okCount);
 const left=Math.max(0,(TOTAL-WIN)-badCount);$('mLife').textContent=defeated?'🏁 Tur tamam':badCount>TOTAL-WIN?'💫 Yıldız için devam':`🛡️ Hata hakkı ${left}`;}
function banner(t){const b=$('banner');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
function hitBoss(){okCount++;if(!defeated)MECH.hit(okCount);
 const b=$('boss');b.classList.remove('hit','laugh');void b.offsetWidth;b.classList.add('hit');
 if(okCount===WIN&&!defeated){defeated=true;setTimeout(()=>{b.src=BOSS.img.def;b.classList.remove('hit');MECH.defeat&&MECH.defeat();sfx('win');banner(BOSS.defeatBanner);confetti(reduced()?0:50);meter();},reduced()?0:600);}
 meter();}
function missBoss(){badCount++;const b=$('boss');b.classList.remove('hit','laugh');void b.offsetWidth;if(!defeated)b.classList.add('laugh');
 MECH.miss(badCount);if(badCount===TOTAL-WIN+1&&!defeated)banner(BOSS.escapeBanner);meter();}
function fxPulse(id){const s=$(id);if(!s)return;s.classList.remove('on');void s.offsetWidth;if(!reduced())s.classList.add('on');}
const MECH={
 N:10,
 COL:['#e2425c','#ff8a2a','#ffcf3f','#9ad83a','#1fa37a','#18b8c9','#2f6fe0','#7b4dff','#d24ab8','#ff6f91'],
 setup(rig){const b=$('boss');b.classList.add('cam');b.style.setProperty('--vis','.28');b.style.setProperty('--hue','110deg');
  for(let i=0;i<this.N;i++){const th=Math.PI-(i*(Math.PI/(this.N-1))),x=50+46*Math.cos(th),y=50+42*Math.sin(th);const j=document.createElement('div');j.className='jar mx';j.style.left=x+'%';j.style.top=y+'%';j.style.setProperty('--col',this.COL[i]);rig.appendChild(j);}},
 label(n){return `🎨 ${BOSS.armLabel} ${Math.min(n,this.N)}/${this.N}`;},
 hit(n){const js=[...document.querySelectorAll('.jar')],j=js[n-1];if(!j)return;j.classList.add('used');
  if(!reduced()){const bl=document.createElement('div');bl.className='blob mx';bl.style.left=j.style.left;bl.style.top=j.style.top;bl.style.background=this.COL[n-1];$('rig').appendChild(bl);setTimeout(()=>bl.remove(),600);}
  tone(700,.06,'sine',.1);noise(.2,.12,.08,2500);tone(420,.15,'triangle',.08,.12);
  const b=$('boss');b.style.setProperty('--vis',String(Math.min(1,.28+n*.072)));b.style.setProperty('--hue',String(Math.round(110*(1-n/this.N)))+'deg');
  if(n===5){b.classList.add('shift');setTimeout(()=>{b.classList.remove('shift');banner(BOSS.inkBanner);},reduced()?0:900);}},
 defeat(){const b=$('boss');b.classList.remove('shift','cam');b.style.setProperty('--vis','1');b.style.setProperty('--hue','0deg');},
 miss(){fxPulse('splat');const b=$('boss');const v=b.style.getPropertyValue('--vis');b.style.setProperty('--vis','.08');setTimeout(()=>b.style.setProperty('--vis',v),reduced()?0:700);
  if(!reduced()){for(let k=0;k<4;k++){const l=document.createElement('div');l.className='leaf mx';l.textContent='🍃';l.style.top=(15+k*20)+'%';l.style.left='0';l.style.animationDelay=(k*.08)+'s';$('scene').appendChild(l);setTimeout(()=>l.remove(),1300);}}
  noise(.5,.12,0,3000);}
};

function confetti(n){const c=$('conf'),cols=['#ffcf3f','#ff6f91','#3ee0c8','#9b7bff','#fff'];for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=rnd()*100+'%';e.style.background=cols[i%5];e.style.animationDuration=(1.4+rnd()*1.6)+'s';e.style.animationDelay=rnd()*.5+'s';c.appendChild(e);setTimeout(()=>e.remove(),3800);}}
function fly(t,el){if(reduced())return;const r=(el||$('go')).getBoundingClientRect(),f=document.createElement('div');f.className='flyup';f.textContent=t;f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1100);}
/* ---------- Şekiller ---------- */
function svg(w,h,inner,label){return `<svg class="fig" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(label||'Şekil')}">${inner}</svg>`;}

 if(k==='dyn'){const top=22,bot=196,y=v=>top+(bot-top)*v/f.max;let ticks='';for(let v=0;v<=f.max;v++)ticks+=`<line x1="96" x2="${v%5?108:114}" y1="${y(v)}" y2="${y(v)}" stroke="#333" stroke-width="2"/><text x="122" y="${y(v)+4}" font-size="11" font-weight="700">${v}</text>`;
  return svg(240,250,`<rect x="86" y="10" width="60" height="196" rx="10" fill="#f4f0e6" stroke="#8a7a5a" stroke-width="3"/><line x1="110" y1="0" x2="110" y2="10" stroke="#666" stroke-width="4"/>${ticks}<rect x="74" y="${y(f.v)-3}" width="34" height="6" rx="3" fill="#e2425c"/><line x1="80" y1="${y(f.v)}" x2="80" y2="232" stroke="#777" stroke-width="3"/><path d="M80 232 q-12 6 0 14" fill="none" stroke="#777" stroke-width="3"/><rect x="48" y="214" width="26" height="28" rx="5" fill="#9b7bff"/><text x="160" y="30" font-size="13" font-weight="800">N</text>`,'0–10 N dinamometre');}
 if(k==='angle'){const r=a=>a*Math.PI/180,L=100,cx=120,cy=130,x2=cx+L*Math.cos(-r(f.d)),y2=cy+L*Math.sin(-r(f.d));

 if(k==='rect'){const sc=Math.min(170/f.w,100/f.h),W=f.w*sc,H=f.h*sc,x=(240-W)/2,y=(150-H)/2;return svg(240,150,`<rect x="${x}" y="${y}" width="${W}" height="${H}" fill="#e8f0ff" stroke="#2f6fe0" stroke-width="4"/><text x="120" y="${y-6}" text-anchor="middle" font-size="14" font-weight="800">${f.w} ${f.u}</text><text x="${x+W+6}" y="${y+H/2+5}" font-size="14" font-weight="800">${f.h} ${f.u}</text>`,'Dikdörtgen');}
 if(k==='grid'||k==='cells'){const cells=f.cells||Array.from({length:f.w*f.h},(_,i)=>[i%f.w,Math.floor(i/f.w)]);const c=Math.min(200/f.w,130/f.h),ox=(240-f.w*c)/2,oy=(150-f.h*c)/2;let g='';for(let i=0;i<=f.w;i++)g+=`<line x1="${ox+i*c}" y1="${oy}" x2="${ox+i*c}" y2="${oy+f.h*c}" stroke="#d6dbea"/>`;for(let j=0;j<=f.h;j++)g+=`<line x1="${ox}" y1="${oy+j*c}" x2="${ox+f.w*c}" y2="${oy+j*c}" stroke="#d6dbea"/>`;

  cell:`<line x1="40" y1="60" x2="112" y2="60" stroke="#222" stroke-width="4"/><line x1="112" y1="25" x2="112" y2="95" stroke="#222" stroke-width="5"/><line x1="128" y1="42" x2="128" y2="78" stroke="#222" stroke-width="9"/><line x1="128" y1="60" x2="200" y2="60" stroke="#222" stroke-width="4"/>`};return svg(240,120,S[f.s],'Devre sembolü');}
 if(k==='circuit'){let x=30,parts='';const cell=x0=>`<line x1="${x0}" y1="22" x2="${x0}" y2="58" stroke="#222" stroke-width="4"/><line x1="${x0+10}" y1="31" x2="${x0+10}" y2="49" stroke="#222" stroke-width="8"/>`;

 if(k==='tally'){let g='';f.rows.forEach(([lab,n],j)=>{const y=20+j*48;if(lab)g+=`<text x="12" y="${y+26}" font-size="14" font-weight="800">${esc(lab)}</text>`;let x=lab?92:60;for(let i=0;i<n;i++){const grp=Math.floor(i/5),k2=i%5;if(k2<4)g+=`<line x1="${x+grp*44+k2*9}" y1="${y}" x2="${x+grp*44+k2*9}" y2="${y+34}" stroke="#333" stroke-width="3" stroke-linecap="round"/>`;else g+=`<line x1="${x+grp*44-5}" y1="${y+28}" x2="${x+grp*44+33}" y2="${y+6}" stroke="#e2425c" stroke-width="3" stroke-linecap="round"/>`;}});return svg(240,24+f.rows.length*48,g,'Çetele');}
 if(k==='scale'){const pan=(items,cx)=>{let g=`<path d="M${cx-48} 92 Q${cx} 118 ${cx+48} 92Z" fill="#c9d6ea" stroke="#4a5a78" stroke-width="3"/><line x1="${cx}" y1="62" x2="${cx-44}" y2="92" stroke="#4a5a78" stroke-width="2"/><line x1="${cx}" y1="62" x2="${cx+44}" y2="92" stroke="#4a5a78" stroke-width="2"/>`;const w=Math.min(34,92/items.length);items.forEach((t,i)=>{const x=cx-items.length*w/2+i*w;g+=`<rect x="${x+1}" y="66" width="${w-2}" height="24" rx="4" fill="${t==='?'?'#ffcf3f':'#9b7bff'}" stroke="#4a3a78" stroke-width="1.5"/><text x="${x+w/2}" y="82" text-anchor="middle" font-size="${t.length>4?9:11}" font-weight="900" fill="${t==='?'?'#3b2500':'#fff'}">${esc(t)}</text>`;});return g;};
