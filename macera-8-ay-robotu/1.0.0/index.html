<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ay Robotu</title>
<style>
:root{--c1:#8a93a3;--c2:#ff8a3d;--deep:#2a2f3a;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:normal;text-align:center;width:92%;font-size:clamp(20px,6.6vw,26px);line-height:1.15}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}
.bin{min-width:0;border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px;max-width:100%;overflow-wrap:anywhere}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.pcell{position:absolute;width:7.6%;transform:translate(-50%,-50%) rotate(var(--r));z-index:3;pointer-events:none;filter:drop-shadow(0 0 1.5px #1a2236) drop-shadow(0 3px 4px rgba(10,14,30,.55))}
.pcell svg{display:block;width:100%;height:auto}
.pcell .lvl rect{transition:fill .2s,opacity .2s}
.pcell.drain .lvl rect:nth-child(1){fill:#ff5a5a;opacity:.25;transition-delay:0s}
.pcell.drain .lvl rect:nth-child(2){fill:#ff5a5a;opacity:.25;transition-delay:.08s}
.pcell.drain .lvl rect:nth-child(3){fill:#ff5a5a;opacity:.25;transition-delay:.16s}
.pcell.drain{animation:pdrop 1.1s .3s ease-in forwards}
@keyframes pdrop{0%{transform:translate(-50%,-50%) rotate(var(--r))}25%{transform:translate(-50%,-75%) rotate(calc(var(--r) + 20deg))}100%{transform:translate(-50%,160%) rotate(calc(var(--r) + 120deg));opacity:0}}
.bspark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffe36a;box-shadow:0 0 6px #4ad8ff,0 0 2px #fff;z-index:4;pointer-events:none;transform:translate(-50%,-50%);opacity:0;animation:bspark .6s ease-out forwards}
@keyframes bspark{0%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)));opacity:0}}
#boss.glitch{animation:bglitch 1.6s steps(1) infinite}
@keyframes bglitch{0%,100%{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}8%{filter:hue-rotate(160deg) drop-shadow(3px 0 0 #ff4a6a) drop-shadow(-3px 0 0 #4ad8ff)}12%{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}54%{filter:hue-rotate(-90deg) drop-shadow(-2px 0 0 #ff4a6a) drop-shadow(2px 0 0 #4ad8ff)}58%{filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}}
.scanfx{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 2px,transparent 2px 4px),rgba(40,200,255,.12)}
.scanfx i{position:absolute;left:0;right:0;top:-10%;height:8px;background:linear-gradient(transparent,#7ae8ff,transparent);box-shadow:0 0 16px #4ad8ff}
.scanfx.on{animation:scanfx 1.1s ease forwards}.scanfx.on i{animation:scanbar 1s linear forwards}
@keyframes scanfx{0%{opacity:0}15%,75%{opacity:1}100%{opacity:0}}
@keyframes scanbar{to{top:105%}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>

ştur. En az okuyan Can’dır (4)."}, {"questionId": "boss-a14-m4-12", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Tablodan sıralama", "outcome": "Verileri sütun grafiği ile gösterir ve yorumlar.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "orta", "group": "m4", "rank": 2, "type": "order", "prompt": "Bir kantinin haftalık satışları: tost 18, simit 25, poğaça 12, börek 20. Ürünleri satışa göre ÇOKTAN AZA sırala.", "data": {"items": ["Simit", "Börek", "Tost", "Poğaça"]}, "textPlain": "Bir kantinin haftalık satışları: tost 18, simit 25, poğaça 12, börek 20. Ürünleri satışa göre ÇOKTAN AZA sırala. Kartlar: Tost; Simit; Börek; Poğaça.", "correctAnswer": "Simit → Börek → Tost → Poğaça", "explanation": "25 > 20 > 18 > 12."}, {"questionId": "boss-a14-m4-13", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Gösterimler", "outcome": "Verileri sütun, daire veya çizgi grafiği ile gösterir ve bu gösterimler arasında uygun dönüşümler yapar.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "orta", "group": "m4", "rank": 2, "type": "tf", "prompt": "Aynı veri hem sütun grafiğiyle hem de daire grafiğiyle gösterilebilir.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Aynı veri hem sütun grafiğiyle hem de daire grafiğiyle gösterilebilir.", "correctAnswer": "Doğru", "explanation": "Kategorilere ayrılmış bir veri hem sütunlarla (karşılaştırma) hem dilimlerle (bütün içindeki pay) gösterilebilir."}, {"questionId": "boss-a14-m4-14", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "İki sınıf", "outcome": "Çizgi ve sütun grafiklerini yorumlar; iki veri grubunu karşılaştırır.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "orta", "group": "m4", "rank": 2, "type": "choice", "prompt": "8/A sınıfının dört aylık kitap okuma sayıları 12, 15, 18, 21; 8/B sınıfınınki 20, 18, 16, 14’tür. Hangisi doğrudur?", "data": {"options": ["8/A’nın sayıları düzenli artarken 8/B’ninki düzenli azalmıştır.", "İki sınıfın sayıları da her ay artmıştır.", "8/B sınıfı dört ayın her birinde 8/A’dan daha fazla kitap okumuştur."]}, "textPlain": "8/A sınıfının dört aylık kitap okuma sayıları 12, 15, 18, 21; 8/B sınıfınınki 20, 18, 16, 14’tür. Hangisi doğrudur? Seçenekler: 8/A’nın sayıları düzenli artarken 8/B’ninki düzenli azalmıştır. / İki sınıfın sayıları da her ay artmıştır. / 8/B sınıfı dört ayın her birinde 8/A’dan daha fazla kitap okumuştur.", "correctAnswer": "8/A’nın sayıları düzenli artarken 8/B’ninki düzenli azalmıştır.", "explanation": "8/A her ay 3 artmış, 8/B her ay 2 azalmıştır. Son ayda 8/A (21) daha fazladır."}, {"questionId": "boss-a14-m4-15", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Bütçe", "outcome": "Verileri daire grafiği ile gösterir ve yorumlar.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "zor", "group": "m4", "rank": 3, "type": "num", "prompt": "Bir ailenin aylık 12 000 TL’lik bütçesi daire grafiğiyle gösterilmiştir. Kira dilimi 120° ise kiraya kaç TL ayrılmıştır?", "data": {"answer": 4000, "digits": 4, "unit": "TL"}, "textPlain": "Bir ailenin aylık 12 000 TL’lik bütçesi daire grafiğiyle gösterilmiştir. Kira dilimi 120° ise kiraya kaç TL ayrılmıştır?", "correctAnswer": "4000 TL", "explanation": "120° bütünün 1/3’üdür; 12 000 ÷ 3 = 4000 TL."}, {"questionId": "boss-a14-m4-16", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Kesişen çizgiler", "outcome": "Çizgi ve sütun grafiklerini yorumlar; iki veri grubunu karşılaştırır.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "zor", "group": "m4", "rank": 3, "type": "choice", "prompt": "A şehrinde pazartesiden perşembeye sıcaklıklar 6, 9, 12, 15 °C; B şehrinde 15, 13, 12, 10 °C’dir. İki çizgi grafiği hangi gün kesişir (sıcaklıklar eşit olur)?", "data": {"options": ["Çarşamba", "Salı", "Perşembe"]}, "textPlain": "A şehrinde pazartesiden perşembeye sıcaklıklar 6, 9, 12, 15 °C; B şehrinde 15, 13, 12, 10 °C’dir. İki çizgi grafiği hangi gün kesişir (sıcaklıklar eşit olur)? Seçenekler: Çarşamba / Salı / Perşembe", "correctAnswer": "Çarşamba", "explanation": "Çarşamba günü iki şehrin sıcaklığı da 12 °C’dir."}, {"questionId": "boss-a14-m4-17", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Eksik sütun", "outcome": "Verileri sütun grafiği ile gösterir ve yorumlar.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "zor", "group": "m4", "rank": 3, "type": "num", "prompt": "Bir sütun grafiğinde dört haftalık satışlar 12, 18, 15 ve x’tir. Haftalık satışların ortalaması 16 ise x kaçtır?", "data": {"answer": 19, "digits": 2, "unit": ""}, "textPlain": "Bir sütun grafiğinde dört haftalık satışlar 12, 18, 15 ve x’tir. Haftalık satışların ortalaması 16 ise x kaçtır?", "correctAnswer": "19", "explanation": "Toplam 4 · 16 = 64; 64 − (12 + 18 + 15) = 19."}, {"questionId": "boss-a14-m4-18", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "İki amaç", "outcome": "Verileri sütun, daire veya çizgi grafiği ile gösterir ve bu gösterimler arasında uygun dönüşümler yapar.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "zor", "group": "m4", "rank": 3, "type": "choice", "prompt": "Ece, okuldaki dört kulübün üye sayılarını hem karşılaştırmak hem de her kulübün toplam içindeki payını göstermek istiyor. Hangi iki grafiği kullanmalıdır?", "data": {"options": ["Sütun ve daire grafiği", "Çizgi ve çizgi grafiği", "Yalnızca çizgi grafiği"]}, "textPlain": "Ece, okuldaki dört kulübün üye sayılarını hem karşılaştırmak hem de her kulübün toplam içindeki payını göstermek istiyor. Hangi iki grafiği kullanmalıdır? Seçenekler: Sütun ve daire grafiği / Çizgi ve çizgi grafiği / Yalnızca çizgi grafiği", "correctAnswer": "Sütun ve daire grafiği", "explanation": "Karşılaştırma için sütun, bütün içindeki pay için daire grafiği uygundur."}, {"questionId": "boss-a14-m4-19", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Açıdan yüzde", "outcome": "Verileri daire grafiği ile gösterir ve yorumlar.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "zor", "group": "m4", "rank": 3, "type": "tf", "prompt": "Bir daire grafiğinde 72°’lik dilim bütünün %20’sini gösterir.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Bir daire grafiğinde 72°’lik dilim bütünün %20’sini gösterir.", "correctAnswer": "Doğru", "explanation": "72 ÷ 360 = 0,2 = %20."}, {"questionId": "boss-a14-m4-20", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "4. Ünite: Veri Analizi", "topic": "Çoklu veri", "outcome": "Çizgi ve sütun grafiklerini yorumlar; iki veri grubunu karşılaştırır.", "sourceRef": "8. Sınıf Öğretim Programı, 4. Ünite “Veri Analizi”", "difficulty": "zor", "group": "m4", "rank": 3, "type": "sort2", "prompt": "Bir kantinde ocak–nisan tost satışları 40, 35, 30, 25; simit satışları 20, 30, 40, 50’dir. İfadeleri doğru ve yanlış diye ayır.", "data": {"bins": ["Doğru", "Yanlış"], "items": [["Tost satışları her ay 5 azalmıştır.", 0], ["Simit satışları her ay 10 artmıştır.", 0], ["Şubatta tost, simitten fazla satılmıştır.", 0], ["Martta simit, tosttan az satılmıştır.", 1], ["Nisanda iki ürünün satış toplamı 80’dir.", 1]]}, "textPlain": "Bir kantinde ocak–nisan tost satışları 40, 35, 30, 25; simit satışları 20, 30, 40, 50’dir. İfadeleri doğru ve yanlış diye ayır. (Doğru / Yanlış) Kartlar: Tost satışları her ay 5 azalmıştır.; Simit satışları her ay 10 artmıştır.; Şubatta tost, simitten fazla satılmıştır.; Martta simit, tosttan az satılmıştır.; Nisanda iki ürünün satış toplamı 80’dir..", "correctAnswer": "Doğru: Tost satışları her ay 5 azalmıştır., Simit satışları her ay 10 artmıştır., Şubatta tost, simitten fazla satılmıştır.. Yanlış: Martta simit, tosttan az satılmıştır., Nisanda iki ürünün satış toplamı 80’dir..", "explanation": "Martta simit 40, tost 30’dur; nisanda toplam 25 + 50 = 75’tir."}, {"questionId": "boss-a14-m5-01", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "5. Ünite: Basit Olayların Olma Olasılığı", "topic": "Zarın durumları", "outcome": "Bir olaya ait olası durumları belirler.", "sourceRef": "8. Sınıf Öğretim Programı, 5. Ünite “Basit Olayların Olma Olasılığı”", "difficulty": "kolay", "group": "m5", "rank": 1, "type": "num", "prompt": "Bir zar atıldığında kaç farklı olası durum vardır?", "data": {"answer": 6, "digits": 1, "unit": ""}, "textPlain": "Bir zar atıldığında kaç farklı olası durum vardır?", "correctAnswer": "6", "explanation": "Zarın yüzlerinde 1, 2, 3, 4, 5 ve 6 bulunur: 6 olası durum."}, {"questionId": "boss-a14-m5-02", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "5. Ünite: Basit Olayların Olma Olasılığı", "topic": "Kesin olay", "outcome": "Eşit şansa sahip olaylarda her bir çıktının olasılık değerinin eşit olduğunu ve bu değerin 1/n olduğunu açıklar; olasılık değerinin 0 ile 1 arasında olduğunu anlar.", "sourceRef": "8. Sınıf Öğretim Programı, 5. Ünite “Basit Olayların Olma Olasılığı”", "difficulty": "kolay", "group": "m5", "rank": 1, "type": "choice", "prompt": "Bir torbada yalnızca kırmızı bilyeler vardır. Torbadan kırmızı bilye çekme olasılığı nedir?", "data": {"options": ["1 (kesin olay)", "0 (imkânsız olay)", "{1/2}"]}, "textPlain": "Bir torbada yalnızca kırmızı bilyeler vardır. Torbadan kırmızı bilye çekme olasılığı nedir? Seçenekler: 1 (kesin olay) / 0 (imkânsız olay) / {1/2}", "correctAnswer": "1 (kesin olay)", "explanation": "Torbadaki bütün bilyeler kırmızı olduğundan kırmızı çekmek kesindir; olasılık 1’dir."}, {"questionId": "boss-a14-m5-03", "grade": 8, "subjectI e": "choice", "prompt": "(a + b)² ifadesinin açılımı hangisidir?", "data": {"options": ["a² + 2ab + b²", "a² + b²", "a² + 2ab + 2b²"]}, "textPlain": "(a + b)² ifadesinin açılımı hangisidir? Seçenekler: a² + 2ab + b² / a² + b² / a² + 2ab + 2b²", "correctAnswer": "a² + 2ab + b²", "explanation": "(a + b)² = (a + b)(a + b) = a² + 2ab + b²."}, {"questionId": "boss-a14-m6-07", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "6. Ünite: Cebirsel İfadeler ve Özdeşlikler", "topic": "Çarpımlar", "outcome": "Cebirsel ifadelerin çarpımını yapar.", "sourceRef": "8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”", "difficulty": "kolay", "group": "m6", "rank": 1, "type": "match", "prompt": "İfadeleri eşitleriyle eşleştir.", "data": {"pairs": [["3(x + 2)", "3x + 6"], ["x(x + 1)", "x² + x"], ["2(x − 4)", "2x − 8"]]}, "textPlain": "İfadeleri eşitleriyle eşleştir. Sol: 3(x + 2); x(x + 1); 2(x − 4). Sağ: 3x + 6; x² + x; 2x − 8.", "correctAnswer": "3(x + 2) = 3x + 6; x(x + 1) = x² + x; 2(x − 4) = 2x − 8", "explanation": "Parantezin önündeki terim içerideki her terimle çarpılır."}, {"questionId": "boss-a14-m6-08", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "6. Ünite: Cebirsel İfadeler ve Özdeşlikler", "topic": "İki terimli çarpım", "outcome": "Cebirsel ifadelerin çarpımını yapar.", "sourceRef": "8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”", "difficulty": "orta", "group": "m6", "rank": 2, "type": "choice", "prompt": "(x + 2)(x + 3) ifadesi hangisine eşittir?", "data": {"options": ["x² + 5x + 6", "x² + 6x + 5", "x² + 6"]}, "textPlain": "(x + 2)(x + 3) ifadesi hangisine eşittir? Seçenekler: x² + 5x + 6 / x² + 6x + 5 / x² + 6", "correctAnswer": "x² + 5x + 6", "explanation": "x² + 3x + 2x + 6 = x² + 5x + 6."}, {"questionId": "boss-a14-m6-09", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "6. Ünite: Cebirsel İfadeler ve Özdeşlikler", "topic": "Zihinden kare", "outcome": "Özdeşlikleri modell nite: Cebirsel İfadeler ve Özdeşlikler", "topic": "Çarpım", "outcome": "Cebirsel ifadelerin çarpımını yapar.", "sourceRef": "8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”", "difficulty": "zor", "group": "m6", "rank": 3, "type": "tf", "prompt": "(2x + 1)(x − 3) = 2x² − 5x − 3’tür.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? (2x + 1)(x − 3) = 2x² − 5x − 3’tür.", "correctAnswer": "Doğru", "explanation": "2x² − 6x + x − 3 = 2x² − 5x − 3."}, {"questionId": "boss-a14-m6-19", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "6. Ünite: Cebirsel İfadeler ve Özdeşlikler", "topic": "Dikdörtgen alanı", "outcome": "Cebirsel ifadelerin çarpımını yapar ve özdeşlikleri alan modelleriyle problemlerde kullanır.", "sourceRef": "8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”", "difficulty": "zor", "group": "m6", "rank": 3, "type": "num", "prompt": "Kenarları (x + 2) cm ve (x − 2) cm olan bir dikdörtgenin alanı x² − a ise a kaçtır?", "data": {"answer": 4, "digits": 1, "unit": ""}, "textPlain": "Kenarları (x + 2) cm ve (x − 2) cm olan bir dikdörtgenin alanı x² − a ise a kaçtır?", "correctAnswer": "4", "explanation": "(x + 2)(x − 2) = x² − 4."}, {"questionId": "boss-a14-m6-20", "grade": 8, "subjectId": "math", "subject": "Matematik", "unit": "6. Ünite: Cebirsel İfadeler ve Özdeşlikler", "topic": "(x + 2) çarpanı", "outcome": "Cebirsel ifadeleri çarpanlara ayırır.", "sourceRef": "8. Sınıf Öğretim Programı, 6. Ünite “Cebirsel İfadeler ve Özdeşlikler”", "difficulty": "zor", "group": "m6", "rank": 3, "type": "sort2", "prompt": "İfadeleri (x + 2) çarpanını taşıyanlar ve taşımayanlar diye ayır.", "data": {"bins": ["(x + 2) çarpanı var", "(x + 2) çarpanı yok"], "items": [["x² − 4", 0], ["x² + 4x + 4", 0], ["x² + 2x", 0], ["x² − 4x + 4", 1], ["x² + 4", 1]]}, "textPlain": "İfadeleri (x + 2) çarpanını taşıyanlar ve taşımayanlar diye ayır. ((x + 2) çarpanı var / (x + 2) çarpanı yok) Kartlar: x² − 4; x² + 4x + 4; x² + 2x; x² − 4x + 4; x² + 4.", "correctAnswer": "(x + 2) çarpanı var: x² − 4, x² + 4x + 4, x² + 2x. (x + 2) çarpanı yok: x² − 4x + 4, x² + 4.", "explanation": "x² − 4 = (x − 2)(x + 2); x² + 4x + 4 = (x + 2)²; x² + 2x = x(x + 2). x² − 4x + 4 = (x − 2)²; x² + 4 çarpanlarına ayrılmaz."}, {"questionId": "boss-a14-t3-01", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf I: Konu, Ana Düşünce, Başlık", "topic": "Ana düşünce", "outcome": "Metnin ana fikrini/ana duygusunu belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)", "difficulty": "kolay", "group": "t3", "rank": 1, "type": "choice", "prompt": "Bu paragrafın ana düşüncesi hangisidir?", "data": {"options": ["Okumak, insanın başkalarını anlama yeteneğini geliştirir.", "Kitaplar pahalı olduğu için kütüphaneler önemlidir.", "Çocuklar her gün okuldan sonra en az bir saat kitap okumalıdır."], "passage": "Kitap okumak yalnızca bilgi edinmek demek değildir. Okuyan kişi farklı hayatlara konuk olur, başka insanların duygularını anlamayı öğrenir. Bu yüzden düzenli okuyan çocuklar çevrelerindeki insanlara karşı daha anlayışlı olur. Okumak, insanın kalbini de büyüten bir alışkanlıktır."}, "textPlain": "Metin: Kitap okumak yalnızca bilgi edinmek demek değildir. Okuyan kişi farklı hayatlara konuk olur, başka insanların duygularını anlamayı öğrenir. Bu yüzden düzenli okuyan çocuklar çevrelerindeki insanlara karşı daha anlayışlı olur. Okumak, insanın kalbini de büyüten bir alışkanlıktır. Soru: Bu paragrafın ana düşüncesi hangisidir? Seçenekler: Okumak, insanın başkalarını anlama yeteneğini geliştirir. / Kitaplar pahalı olduğu için kütüphaneler önemlidir. / Çocuklar her gün okuldan sonra en az bir saat kitap okumalıdır.", "correctAnswer": "Okumak, insanın başkalarını anlama yeteneğini geliştirir.", "explanation": "Paragraf, okumanın insanı başkalarına karşı daha anlayışlı yaptığını vurgular."}, {"questionId": "boss-a14-t3-02", "grade": 8, "subjectId": "turkish", "subject": " gösterme, düşünceyi güvenilir bir kişinin sözüyle destekler."}, {"questionId": "boss-a14-t4-04", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Giriş cümlesi", "outcome": "Paragrafın giriş, gelişme ve sonuç bölümlerini belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)", "difficulty": "kolay", "group": "t4", "rank": 1, "type": "choice", "prompt": "Hangisi bir paragrafın giriş cümlesi olmaya en uygundur?", "data": {"options": ["Su, canlılığın temel kaynağıdır.", "Bu nedenle suyu tasarruflu kullanmalıyız.", "Üstelik bu oran her geçen gün azalıyor."]}, "textPlain": "Hangisi bir paragrafın giriş cümlesi olmaya en uygundur? Seçenekler: Su, canlılığın temel kaynağıdır. / Bu nedenle suyu tasarruflu kullanmalıyız. / Üstelik bu oran her geçen gün azalıyor.", "correctAnswer": "Su, canlılığın temel kaynağıdır.", "explanation": "Giriş cümlesi kendinden önce bir cümle gerektirmez; “bu nedenle, üstelik” gibi bağlayıcılarla başlamaz."}, {"questionId": "boss-a14-t4-05", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Düşünceyi geliştirme", "outcome": "Metinde kullanılan düşünceyi geliştirme yollarını belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)", "difficulty": "kolay", "group": "t4", "rank": 1, "type": "match", "prompt": "Cümleleri kullanılan düşünceyi geliştirme yoluyla eşleştir.", "data": {"pairs": [["Ali’nin boyu kardeşininkinden uzundur.", "Karşılaştırma"], ["Uzmanlara göre günde sekiz bardak su içilmelidir.", "Tanık gösterme"], ["Ülkemizde her yıl yaklaşık üç milyon fidan dikiliyor.", "Sayısal verilerden yararlanma"]]}, "textPlain": "Cümleleri kullanılan düşünceyi geliştirme yoluyla eşleştir. Sol: Ali’nin boyu kardeşininkinden uzundur.; Uzmanlara göre günde sekiz bardak su içilmelidir.; Ülkemizde her yı ctId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Cümle ekleme", "outcome": "Paragrafın akışına uygun cümleyi belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)", "difficulty": "kolay", "group": "t4", "rank": 1, "type": "choice", "prompt": "Paragraftaki boşluğa ( ) akışa en uygun düşen cümle hangisidir?", "data": {"options": ["Balkonlara konan yem kapları onlara büyük destek olur.", "Yaz aylarında kuşlar çok neşelidir.", "Kuşların tüyleri yaz ve kış aylarında farklı renklerde olabilir."], "passage": "Kış geldiğinde kuşlar yiyecek bulmakta zorlanır. ( ) Böylece kuşlar soğuk günleri daha kolay atlatır."}, "textPlain": "Metin: Kış geldiğinde kuşlar yiyecek bulmakta zorlanır. ( ) Böylece kuşlar soğuk günleri daha kolay atlatır. Soru: Paragraftaki boşluğa ( ) akışa en uygun düşen cümle hangisidir? Seçenekler: Balkonlara konan yem kapları onlara büyük destek olur. / Yaz aylarında kuşlar çok neşelidir. / Kuşların tüyleri yaz ve kış aylarında farklı renklerde olabilir.", "correctAnswer": "Balkonlara konan yem kapları onlara büyük destek olur.", "explanation": "Boşluktan sonra gelen “Böylece” ifadesi, kuşlara yardım eden bir davranışın anlatılmasını gerektirir."}, {"questionId": "boss-a14-t4-08", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Akışı bozan cümle", "outcome": "Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)", "difficulty": "orta", "group": "t4", "rank": 2, "type": "choice", "prompt": "Bu paragrafta hangi cümle düşüncenin akışını bozmaktadır?", "data": {"options": ["III. cümle", "II. cümle", "IV. cümle"], "passage": "(I) Bisiklet hem çevre dostu hem de sağlıklı bir ulaşım aracıdır. (II) Yakıt kullanmadığı için havayı kirletmez. (III) Bisiklet 19. yüzyılda icat edilmiştir. (IV) Düzenli bisiklet sürmek kalbi ve kasları güçlendirir."}, "textPlain": "Metin: (I) Bisiklet hem çevre dostu hem de sağlıklı bir ulaşım aracıdır. (II) Yakıt kullanmadığı için havayı kirletmez. (III) Bisiklet 19. yüzyılda icat edilmiştir. (IV) Düzenli bisiklet sürmek kalbi ve kasları güçlendirir. Soru: Bu paragrafta hangi cümle düşüncenin akışını bozmaktadır? Seçenekler: III. cümle / II. cümle / IV. cümle", "correctAnswer": "III. cümle", "explanation": "Paragraf bisikletin yararlarını anlatır; III. cümle ise bisikletin icat tarihinden söz eder."}, {"questionId": "boss-a14-t4-09", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "İkiye bölme", "outcome": "Paragrafın akışına göre metni bölümlere ayırır; cümleler arasındaki geçişleri sağlayan ifadeleri belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)", "difficulty": "orta", "group": "t4", "rank": 2, "type": "choice", "prompt": "Bu paragraf iki paragrafa ayrılmak istenirse ikinci paragraf hangi cümleyle başlar?", "data": {"options": ["III. cümle", "II. cümle", "IV. cümle"], "passage": "(I) Çay, Türkiye’de en çok tüketilen içeceklerden biridir. (II) Özellikle Karadeniz Bölgesi’nde yetiştirilir. (III) Kahve ise ülkemize 16. yüzyılda gelmiştir. (IV) Kahvehaneler kısa sürede sohbet mekânlarına dönüşmüştür."}, "textPlain": "Metin: (I) Çay, Türkiye’de en çok tüketilen içeceklerden biridir. (II) Özellikle Karadeniz Bölgesi’nde yetiştirilir. (III) Kahve ise ülkemize 16. yüzyılda gelmiştir. (IV) Kahvehaneler kısa sürede sohbet mekânlarına dönüşmüştür. Soru: Bu paragraf iki paragrafa ayrılmak istenirse ikinci paragraf hangi cümleyle başlar? Seçenekler: III. cümle / II. cümle / IV. cümle", "correctAnswer": "III. cümle", "explanation": "I ve II. cümleler çaydan, III ve IV. cümleler kahveden söz eder."}, {"questionId": "boss-a14-t4-10", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Karşılaştırma", "outcome": "Metinde kullanılan düşünceyi geliştirme yollarını belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)", "difficulty": "orta", "group": "t4", "rank": 2, "type": "choice", "prompt": "“Kediler, köpeklere göre daha bağımsız hayvanlardır.” cümlesinde hangi düşünceyi geliştirme yolu kullanılmıştır?", "data": {"options": ["Karşılaştırma", "Örnekleme", "Tanımlama"]}, "textPlain": "“Kediler, köpeklere göre daha bağımsız hayvanlardır.” cümlesinde hangi düşünceyi geliştirme yolu kullanılmıştır? Seçenekler: Karşılaştırma / Örnekleme / Tanımlama", "correctAnswer": "Karşılaştırma", "explanation": "“-e göre daha” ifadesi iki varlığı kıyaslar."}, {"questionId": "boss-a14-t4-11", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Fidan dikimi", "outcome": "Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)", "difficulty": "orta", "group": "t4", "rank": 2, "type": "order", "prompt": "Cümleleri anlamlı bir paragraf oluşturacak biçimde sırala.", "data": {"items": ["Önce toprağı belleyip yumuşattık.", "Ardından fidanları çukurlara yerleştirdik.", "Çukurların etrafını toprakla doldurduk.", "Son olarak fidanlara bol su verdik."]}, "textPlain": "Cümleleri anlamlı bir paragraf oluşturacak biçimde sırala. Kartlar: Son olarak fidanlara bol su verdik.; Çukurların etrafını toprakla doldurduk.; Önce toprağı belleyip yumuşattık.; Ardından fidanları çukurlara yerleştirdik..", "correctAnswer": "Önce toprağı belleyip yumuşattık. → Ardından fidanları çukurlara yerleştirdik. → Çukurların etrafını toprakla doldurduk. → Son olarak fidanlara bol su verdik.", "explanation": "“Önce, ardından, son olarak” gibi sözcükler sıral en cümle hangisidir?", "data": {"options": ["Çünkü egzersiz sırasında vücut, insanı rahatlatan maddeler salgılar.", "Futbol, dünyada en çok izlenen spordur.", "Spor yaparken giyilen ayakkabılar bazen çok pahalı olabilir ve herkes alamayabilir."], "passage": "Spor yapmak yalnızca bedeni değil ruhu da güçlendirir. Düzenli egzersiz yapan kişiler kendilerini daha mutlu hisseder. ( ) Bu yüzden hangi yaşta olursak olalım hayatımızda spora yer açmalıyız."}, "textPlain": "Metin: Spor yapmak yalnızca bedeni değil ruhu da güçlendirir. Düzenli egzersiz yapan kişiler kendilerini daha mutlu hisseder. ( ) Bu yüzden hangi yaşta olursak olalım hayatımızda spora yer açmalıyız. Soru: Paragraftaki boşluğa ( ) akışa en uygun düşen cümle hangisidir? Seçenekler: Çünkü egzersiz sırasında vücut, insanı rahatlatan maddeler salgılar. / Futbol, dünyada en çok izlenen spordur. / Spor yaparken giyilen ayakkabılar bazen çok pahalı olabilir ve herkes alamayabilir.", "correctAnswer": "Çünkü egzersiz sırasında vücut, insanı rahatlatan maddeler salgılar.", "explanation": "Boşluk, egzersizin insanı neden mutlu ettiğini açıklayan bir cümle gerektirir."}, {"questionId": "boss-a14-t4-16", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Akışı bozan cümle", "outcome": "Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)", "difficulty": "zor", "group": "t4", "rank": 3, "type": "choice", "prompt": "Bu paragrafta hangi cümle düşüncenin akışını bozmaktadır?", "data": {"options": ["IV. cümle", "III. cümle", "V. cümle"], "passage": "(I) Deniz kirliliği, canlı yaşamını tehdit eden büyük bir sorundur. (II) Denize atılan plastikler yüzlerce yılda ancak çözünür. (III) Bu plastikleri yiyen balıklar zarar görür. (IV) Yazın deniz kenarında tatil yapmak çok keyiflidir. (V) Kirlilik, sonunda bizim sofralarımıza kadar ulaşır."}, "textPlain": "Metin: (I) Deniz kirliliği, canlı yaşamını tehdit eden büyük bir sorundur. (II) Denize atılan plastikler yüzlerce yılda ancak çözünür. (III) Bu plastikleri yiyen balıklar zarar görür. (IV) Yazın deniz kenarında tatil yapmak çok keyiflidir. (V) Kirlilik, sonunda bizim sofralarımıza kadar ulaşır. Soru: Bu paragrafta hangi cümle düşüncenin akışını bozmaktadır? Seçenekler: IV. cümle / III. cümle / V. cümle", "correctAnswer": "IV. cümle", "explanation": "Paragraf deniz kirliliğini anlatır; IV. cümle tatilin keyfinden söz eder."}, {"questionId": "boss-a14-t4-17", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Anlatım biçimi", "outcome": "Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.", "sourceRef": "8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)", "difficulty": "zor", "group": "t4", "rank": 3, "type": "choice", "prompt": "Bu paragrafta hangi anlatım biçimi ağır basmaktadır?", "data": {"options": ["Açıklama", "Betimleme", "Öyküleme"], "passage": "Ozon tabakası, Güneş’ten gelen zararlı ışınları süzen bir kalkandır. Bu tabaka incelirse cilt hastalıkları artar, bitkilerin büyümesi yavaşlar. Bu nedenle ozona zarar veren gazların kullanımı sınırlandırılmıştır."}, "textPlain": "Metin: Ozon tabakası, Güneş’ten gelen zararlı ışınları süzen bir kalkandır. Bu tabaka incelirse cilt hastalıkları artar, bitkilerin büyümesi yavaşlar. Bu nedenle ozona zarar veren gazların kullanımı sınırlandırılmıştır. Soru: Bu paragrafta hangi anlatım biçimi ağır basmaktadır? Seçenekler: Açıklama / Betimleme / Öyküleme", "correctAnswer": "Açıklama", "explanation": "Paragraf okura bilgi verir, bir konuyu öğretir: açıklama."}, {"questionId": "boss-a14-t4-18", "grade": 8, "subjectId": "turkish", "subject": "Türkçe", "unit": "Paragraf II: Akış, Cümle Ekleme, Düşünceyi Geliştirme", "topic": "Düşünceyi geliştirme", "outcome": "Metinde <script>
"use strict";
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),BOSS=JSON.parse($('boss-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;
const SUBJ={science:['🔬','Fen'],math:['📐','Matematik'],turkish:['📖','Türkçe']},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,cur=null,okCount=0,badCount=0,defeated=false,checked=false;
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();showIntro();$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}
function sfx(k){({tap:()=>tone(660,.06,'triangle',.1),pick:()=>tone(520,.07,'triangle',.12,0,120),
 ok:()=>{tone(523,.12,'triangle',.16);tone(784,.16,'triangle',.16,.09);tone(1046,.22,'sine',.12,.18);},
 bad:()=>{tone(220,.28,'sawtooth',.08,0,-90);noise(.25,.12,.05,500);},
 splat:()=>{noise(.35,.28,0,700);tone(140,.3,'sine',.12,0,-60);},
 bubble:()=>{for(let i=0;i<5;i++)tone(400+i*120,.07,'sine',.08,i*.06,200);},
 free:()=>{tone(880,.1,'sine',.12);tone(1320,.18,'sine',.1,.08);},
 roar:()=>{tone(90,.6,'sawtooth',.1,0,60);noise(.6,.12,0,400);},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12));},
 gate:()=>{tone(196,.25,'square',.06);tone(294,.35,'square',.06,.2);}}[k]||(()=>{}))();}
$('mute').onclick=()=>{muted=!muted;unlockAudio();if(master)master.gain.value=muted?0:.8;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');};
/* ---------- Deste ---------- */
function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}
function remember(ids){try{localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent()].slice(0,30)));}catch(e){}}
function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});
  const cnt=[0,0,0,0];al.forEach(a=>a.ranks.forEach(r=>cnt[r]++));const d=Math.abs(cnt[1]-4)+Math.abs(cnt[2]-4)+Math.abs(cnt[3]-4);if(d<bd){bd=d;best=al;}if(d===0)break;}
 return best;}
function buildDeck(){const rec=new Set(recent()),plan=deckPlan();
 let chosen=null,cs=-1;for(let t=0;t<80;t++){const c=[];let fr=0;plan.forEach(a=>a.ranks.forEach(r=>{const pool=BANK.filter(q=>q.group===a.u&&q.rank===r&&!c.includes(q));const fresh=pool.filter(q=>!rec.has(q.questionId));const q=shuffle(t<40&&fresh.length?fresh:pool)[0];if(!rec.has(q.questionId))fr++;c.push(q);}));
  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
 let best=null,bs=1e9;
 for(let t=0;t<400;t++){const seq=[1,2,3].flatMap(r=>shuffle(chosen.filter(q=>q.rank===r)));let s=0;for(let i=1;i<seq.length;i++){if(seq[i].subjectId===seq[i-1].subjectId)s+=3;if(seq[i].type===seq[i-1].type)s+=1;}if(s<bs){bs=s;best=seq;}if(s===0)break;}
 return best;}
