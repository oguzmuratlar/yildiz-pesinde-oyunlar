<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Sarmal Fermuar</title>
<style>

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}

. zincirde C",4]]},"textPlain":"Bilgilere göre sayaçları doğru sayılara getir. Bilgiler: Bir DNA’nın 1. zincirinde 7 A, 5 T, 4 G, 9 C var.","correctAnswer":"2. zincirde A: 5, 2. zincirde T: 7, 2. zincirde G: 9, 2. zincirde C: 4","explanation":"Karşılıklı zincirlerde A’nın karşısına T, G’nin karşısına C gelir. Bu yüzden 1. zincirdeki A sayısı 2. zincirdeki T sayısına, 1. zincirdeki G sayısı 2. zincirdeki C sayısına eşittir.","twin":""},{"questionId":"fen8u2-eslenme-009","grade":8,"subject":"Fen Bilimleri","unit":"2. Ünite: DNA ve Genetik Kod","topic":"DNA’nın kendini eşlemesi ve nükleotit sayıları","outcome":"DNA’nın kendini nasıl eşlediğini ifade eder; baz eşleşme kuralını kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”","difficulty":"zor","group":"eslenme","rank":3,"type":"count","prompt":"Bilgilere göre sayaçları doğru sayılara getir.","data":{"info":["Çift zincirli bir DNA kendini bir kez eşliyor.","Başlangıçtaki DNA’da 15 A ve 25 G var."],"r":[["Yeni DNA sayısı",2],["Her yeni DNA’da A",15],["Her yeni DNA’da C",25],["Kullanılan yeni nükleotit",80]]},"textPlain":"Bilgilere göre sayaçları doğru sayılara getir. Bilgiler: Çift zincirli bir DNA kendini bir kez eşliyor. Başlangıçtaki DNA’da 15 A ve 25 G var.","correctAnswer":"Yeni DNA sayısı: 2, Her yeni DNA’da A: 15, Her yeni DNA’da C: 25, Kullanılan yeni nükleotit: 80","explanation":"Eşleme sonunda başlangıçtakiyle aynı iki DNA oluşur; her birinde 15 A ve 25 G (dolayısıyla 25 C) bulunur. Başlangıçtaki DNA’da 2×(15+25) = 80 nükleotit vardır; eşlemede her eski zincirin karşısına yeni zincir kurulduğu için 80 yeni nükleotit kullanılır.","twin":""},{"questionId":"fen8u2-eslenme-010","grade":8,"subject":"Fen Bilimleri","unit":"2. Ünite: DNA ve Genetik Kod","topic":"DNA’nın kendini eşlemesi ve nükleotit sayıları","outcome":"DNA’nın kendini nasıl eşlediğini ifade eder; baz eşleşme kuralını kullanır.","sourceRef":"8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”","difficulty":"zor","g k → 1:1, saf baskın × herhangi → hepsi baskın.","twin":"2023-S1"},{"questionId":"fen8u2-kalitim-002","grade":8,"subject":"Fen Bilimleri","unit":"2. Ünite: DNA ve Genetik Kod","topic":"Kalıtım: Mendel çaprazlamaları, baskın-çekinik, genotip-fenotip, saf döl-melez","outcome":"Kalıtımla ilgili kavramları kullanarak tek karakter çaprazlamalarının sonuçlarını tahmin eder.","sourceRef":"8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”","difficulty":"kolay","group":"kalitim","rank":1,"type":"cross","prompt":"Tohum rengi için S baskın (sarı), s çekinik (yeşil). Ebeveynleri ayarla: yavruların hepsi sarı olsun. İkinci ebeveyn yeşil tohumlu.","data":{"t":"tr","P":[["AA","Aa","aa"],["aa"]],"g":["ratio",[4,0]]},"textPlain":"Tohum rengi için S baskın (sarı), s çekinik (yeşil). Ebeveynleri ayarla: yavruların hepsi sarı olsun. İkinci ebeveyn yeşil tohumlu. 1. ebeveyn: genotipi seçilecek; 2. ebeveyn: ss (yeşil).","correctAnswer":"Uygun bir çaprazlama: SS × ss","explanation":"S baskın alel olduğundan SS ve Ss bireyler sarı, ss bireyler yeşil olur. Her ebeveyn yavruya alellerinden birini verir; 2×2 tablo dört eşit olasılıklı yavruyu gösterir. Melez × melez → 3:1, melez × çekinik → 1:1, saf baskın × herhangi → hepsi baskın.","twin":""},{"questionId":"fen8u2-kalitim-003","grade":8,"subject":"Fen Bilimleri","unit":"2. Ünite: DNA ve Genetik Kod","topic":"Kalıtım: Mendel çaprazlamaları, baskın-çekinik, genotip-fenotip, saf döl-melez","outcome":"Kalıtımla ilgili kavramları kullanarak tek karakter çaprazlamalarının sonuçlarını tahmin eder.","sourceRef":"8. Sınıf Öğretim Programı, 2. Ünite “DNA ve Genetik Kod”","difficulty":"kolay","group":"kalitim","rank":1,"type":"cross","prompt":"Tohum şekli için D baskın (düzgün), d çekinik (buruşuk). Ebeveynleri ayarla: yavruların hepsi buruşuk olsun.","data":{"t":"ts","P":[["AA","Aa","aa"],["AA","Aa","aa"]],"g":["ratio",[0,4]]},"textPlain":"Tohum şekli için D baskın (düzgün), d çekinik (buruşuk). Ebeveynleri ayarla: yavruların hepsi buruşuk olsu
