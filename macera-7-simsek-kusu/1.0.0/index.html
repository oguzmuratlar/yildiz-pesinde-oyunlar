<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Şimşek Kuşu</title>
<style>
:root{--c1:#8a6fe0;--c2:#f2a13b;--deep:#231a4a;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:normal;text-align:center;width:92%;font-size:clamp(20px,6.6vw,26px);line-height:1.15}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}
.bin{min-width:0;border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px;max-width:100%;overflow-wrap:anywhere}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.scloud{position:absolute;width:16%;transform:translate(-50%,-50%);z-index:3;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(30,20,60,.55));animation:sfloat 2.6s ease-in-out infinite}
.scloud svg{display:block;width:100%;height:auto}
@keyframes sfloat{0%,100%{margin-top:0}50%{margin-top:-4px}}
.scloud.drain{animation:sdrain 1s ease forwards}
@keyframes sdrain{0%{filter:brightness(1.8) drop-shadow(0 0 8px #ffe36b)}40%{filter:brightness(2.2) drop-shadow(0 0 10px #fff)}100%{transform:translate(-50%,-80%) scale(.6);opacity:0}}
.bolt{position:absolute;width:4%;transform:translate(-50%,0);z-index:4;pointer-events:none;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 0 6px #ffd23a);animation:bolt .6s ease-out forwards}
.bolt svg{display:block;width:100%}
@keyframes bolt{0%{opacity:0;transform:translate(-50%,-10%) scaleY(.3)}20%{opacity:1;transform:translate(-50%,0) scaleY(1)}100%{opacity:0}}
#boss.charge{filter:drop-shadow(0 0 10px #ffd23a) drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.zap{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(255,250,210,.55),rgba(90,70,160,.35) 70%)}
.zap svg{position:absolute;left:30%;top:0;width:40%;height:100%;filter:drop-shadow(0 0 6px #fff)}
.zap.on{animation:zapf .9s ease forwards}
@keyframes zapf{0%{opacity:0}10%{opacity:1}22%{opacity:.25}34%{opacity:.9}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>
<div id="conf" aria-hidden="true"></div>

on veren atom 2+ yüklü iyon olur."}, {"questionId": "boss-a11-f6-01", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Aynı yükler", "outcome": "Cisimlerin yük durumlarını ve yüklü cisimler arasındaki itme-çekme etkileşimini açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–119", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "tf", "prompt": "Aynı cins elektrik yüküyle yüklü iki cisim birbirini çeker.", "data": {"truth": false}, "textPlain": "Doğru mu yanlış mı? Aynı cins elektrik yüküyle yüklü iki cisim birbirini çeker.", "correctAnswer": "Yanlış", "explanation": "Aynı yüklü cisimler birbirini iter, zıt yüklü cisimler birbirini çeker."}, {"questionId": "boss-a11-f6-02", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Yer değiştiren yük", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–117", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "choice", "prompt": "Cisimler elektriklenirken hangi tanecikler bir cisimden diğerine geçer?", "data": {"options": ["Elektronlar (negatif yükler)", "Protonlar (pozitif yükler)", "Nötronlar (yüksüz tanecikler)"]}, "textPlain": "Cisimler elektriklenirken hangi tanecikler bir cisimden diğerine geçer? Seçenekler: Elektronlar (negatif yükler) / Protonlar (pozitif yükler) / Nötronlar (yüksüz tanecikler)", "correctAnswer": "Elektronlar (negatif yükler)", "explanation": "Elektriklenme, negatif yüklü elektronların yer değiştirmesiyle olur."}, {"questionId": "boss-a11-f6-03", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Şimşek", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 114, 120, 122", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "choice", "prompt": "İki bulut arasındaki elektrik yükü aktarımıyla oluşan olaya ne ad verilir?", "data": {"options": ["Şimşek", "Yıldırım", "Gökkuşağı"]}, "textPlain": "İki bulut arasındaki elektrik yükü aktarımıyla oluşan olaya ne ad verilir? Seçenekler: Şimşek / Yıldırım / Gökkuşağı", "correctAnswer": "Şimşek", "explanation": "Bulutlar arasındaki yük aktarımı şimşek, bulut ile yeryüzü arasındaki yük aktarımı yıldırımdır."}, {"questionId": "boss-a11-f6-04", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Paratoner", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 114, 120, 122", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "choice", "prompt": "Binaları yıldırımın zararından korumak için binaların tepesine yerleştirilen araç hangisidir?", "data": {"options": ["Paratoner", "Televizyon anteni", "Güneş paneli"]}, "textPlain": "Binaları yıldırımın zararından korumak için binaların tepesine yerleştirilen araç hangisidir? Seçenekler: Paratoner / Televizyon anteni / Güneş paneli", "correctAnswer": "Paratoner", "explanation": "Paratoner yıldırımın yükünü güvenli bir şekilde toprağa iletir."}, {"questionId": "boss-a11-f6-05", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Yük etkileşimi", "outcome": "Cisimlerin yük durumlarını ve yüklü cisimler arasındaki itme-çekme etkileşimini açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–119", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "match", "prompt": "Her cisim çiftini aralarındaki etkileşimle eşleştir.", "data": {"pairs": [["(+) ile (+)", "Birbirini iter"], ["(+) ile (−)", "Birbirini çeker"], ["Nötr ile (−)", "Nötr cisim çekilir"]]}, "textPlain": "Her cisim çiftini aralarındaki etkileşimle eşleştir. Sol: (+) ile (+); (+) ile (−); Nötr ile (−). Sağ: Birbirini iter; Birbirini çeker; Nötr cisim çekilir.", "correctAnswer": "(+) ile (+) = Birbirini iter; (+) ile (−) = Birbirini çeker; Nötr ile (−) = Nötr cisim çekilir", "explanation": "Aynı yükler iter, zıt yükler çeker; yüklü cisim nötr cismi de çeker."}, {"questionId": "boss-a11-f6-06", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Teknolojide elektriklenme", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 109, 124", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "sort2", "prompt": "Araçları çalışmasında elektriklenmeden yararlanılıp yararlanılmamasına göre ayır.", "data": {"bins": ["Yararlanılır", "Yararlanılmaz"], "items": [["Lazer yazıcı", 0], ["Elektrostatik baca filtresi", 0], ["Sanayide boya püskürtme", 0], ["Bisiklet freni", 1], ["Cam termometre", 1]]}, "textPlain": "Araçları çalışmasında elektriklenmeden yararlanılıp yararlanılmamasına göre ayır. (Yararlanılır / Yararlanılmaz) Kartlar: Lazer yazıcı; Elektrostatik baca filtresi; Sanayide boya püskürtme; Bisiklet freni; Cam termometre.", "correctAnswer": "Yararlanılır: Lazer yazıcı, Elektrostatik baca filtresi, Sanayide boya püskürtme. Yararlanılmaz: Bisiklet freni, Cam termometre.", "explanation": "Lazer yazıcı, baca filtresi ve elektrostatik boyamada elektriklenmeden yararlanılır; bisiklet freni ve termometre başka ilkelerle çalışır."}, {"questionId": "boss-a11-f6-07", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Tarak", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–117", "difficulty": "kolay", "group": "f6", "rank": 1, "type": "tf", "prompt": "Kuru saça sürtülen plastik tarak, küçük kâğıt parçalarını çekebilir.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Kuru saça sürtülen plastik tarak, küçük kâğıt parçalarını çekebilir.", "correctAnswer": "Doğru", "explanation": "Tarak sürtünmeyle elektriklenir; yüklü cisim nötr kâğıt parçalarını çeker."}, {"questionId": "boss-a11-f6-08", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Yünün yükü", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–117", "difficulty": "orta", "group": "f6", "rank": 2, "type": "choice", "prompt": "Plastik çubuk yün kumaşa sürtülünce çubuk (−) yükleniyor. Yün kumaş için hangisi doğrudur?", "data": {"options": ["(+) yüklenir, çünkü elektron kaybetmiştir.", "(−) yüklenir, çünkü elektron kazanmıştır.", "Nötr kalır, çünkü yük alışverişi olmaz."]}, "textPlain": "Plastik çubuk yün kumaşa sürtülünce çubuk (−) yükleniyor. Yün kumaş için hangisi doğrudur? Seçenekler: (+) yüklenir, çünkü elektron kaybetmiştir. / (−) yüklenir, çünkü elektron kazanmıştır. / Nötr kalır, çünkü yük alışverişi olmaz.", "correctAnswer": "(+) yüklenir, çünkü elektron kaybetmiştir.", "explanation": "Yündeki bazı elektronlar çubuğa geçer; elektron kaybeden yün (+) yüklenir."}, {"questionId": "boss-a11-f6-09", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Dokunma", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 118–119", "difficulty": "orta", "group": "f6", "rank": 2, "type": "choice", "prompt": "(−) yüklü bir iletken küre, nötr bir iletken küreye dokunduruluyor ve ayrılıyor. Kürelerin son durumu nedir?", "data": {"options": ["İkisi de (−) yüklüdür.", "İkisi de nötrdür.", "Biri (+), diğeri (−) yüklüdür."]}, "textPlain": "(−) yüklü bir iletken küre, nötr bir iletken küreye dokunduruluyor ve ayrılıyor. Kürelerin son durumu nedir? Seçenekler: İkisi de (−) yüklüdür. / İkisi de nötrdür. / Biri (+), diğeri (−) yüklüdür.", "correctAnswer": "İkisi de (−) yüklüdür.", "explanation": "Dokunma ile elektriklenmede yük paylaşılır; iki küre de aynı cins (−) yükle yüklenir."}, {"questionId": "boss-a11-f6-10", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Yıldırım", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 114, 120, 122", "difficulty": "orta", "group": "f6", "rank": 2, "type": "choice", "prompt": "Yıldırım nasıl oluşur?", "data": {"options": ["Bulut ile yeryüzü arasındaki yük aktarımıyla", "İki bulut arasındaki yük aktarımıyla", "Bulutların çarpışmasından çıkan sesle"]}, "textPlain": "Yıldırım nasıl oluşur? Seçenekler: Bulut ile yeryüzü arasındaki yük aktarımıyla / İki bulut arasındaki yük aktarımıyla / Bulutların çarpışmasından çıkan sesle", "correctAnswer": "Bulut ile yeryüzü arasındaki yük aktarımıyla", "explanation": "Bulutlarla yeryüzü arasındaki yük aktarımıyla yıldırım oluşur."}, {"questionId": "boss-a11-f6-11", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Balon deneyi", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–117", "difficulty": "orta", "group": "f6", "rank": 2, "type": "order", "prompt": "Sürtünme ile elektriklenmeyi gözlemlemek için deneyin adımlarını sırala.", "data": {"items": ["Balonu yün kumaşa sürt.", "Balonu küçük kâğıt parçalarına yaklaştır.", "Kâğıtların balona çekildiğini gözle."]}, "textPlain": "Sürtünme ile elektriklenmeyi gözlemlemek için deneyin adımlarını sırala. Kartlar: Balonu küçük kâğıt parçalarına yaklaştır.; Kâğıtların balona çekildiğini gözle.; Balonu yün kumaşa sürt..", "correctAnswer": "Balonu yün kumaşa sürt. → Balonu küçük kâğıt parçalarına yaklaştır. → Kâğıtların balona çekildiğini gözle.", "explanation": "Önce balon sürtünmeyle elektriklenir, sonra nötr kâğıtlara yaklaştırılınca onları çeker."}, {"questionId": "boss-a11-f6-12", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Etki ile elektriklenme", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 118–119", "difficulty": "orta", "group": "f6", "rank": 2, "type": "tf", "prompt": "Etki ile (temassız) elektriklenmede cisimler birbirine dokunmaz.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Etki ile (temassız) elektriklenmede cisimler birbirine dokunmaz.", "correctAnswer": "Doğru", "explanation": "Etki ile elektriklenmede yüklü cisim yalnızca yaklaştırılır; yükler cismin içinde yer değiştirir."}, {"questionId": "boss-a11-f6-13", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Elektrik kelimesi", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 114, 120, 122", "difficulty": "orta", "group": "f6", "rank": 2, "type": "choice", "prompt": "“Elektrik” kelimesi, Yunancada hangi anlama gelen “elektron” sözcüğünden türemiştir?", "data": {"options": ["Kehribar", "Şimşek", "Mıknatıs"]}, "textPlain": "“Elektrik” kelimesi, Yunancada hangi anlama gelen “elektron” sözcüğünden türemiştir? Seçenekler: Kehribar / Şimşek / Mıknatıs", "correctAnswer": "Kehribar", "explanation": "Thales yüne sürtülen kehribarın kırıntıları çektiğini gözledi; elektrik kelimesi kehribar anlamındaki “elektron”dan gelir."}, {"questionId": "boss-a11-f6-14", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Çeker mi iter mi", "outcome": "Cisimlerin yük durumlarını ve yüklü cisimler arasındaki itme-çekme etkileşimini açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–119", "difficulty": "orta", "group": "f6", "rank": 2, "type": "sort2", "prompt": "Cisim çiftlerini birbirini çekenler ve itenler diye ayır.", "data": {"bins": ["Çeker", "İter"], "items": [["(+) ile (−)", 0], ["Nötr ile (+)", 0], ["Nötr ile (−)", 0], ["(−) ile (−)", 1], ["(+) ile (+)", 1]]}, "textPlain": "Cisim çiftlerini birbirini çekenler ve itenler diye ayır. (Çeker / İter) Kartlar: (+) ile (−); Nötr ile (+); Nötr ile (−); (−) ile (−); (+) ile (+).", "correctAnswer": "Çeker: (+) ile (−), Nötr ile (+), Nötr ile (−). İter: (−) ile (−), (+) ile (+).", "explanation": "Zıt yükler ve yüklü-nötr çiftleri çeker; aynı yükler iter."}, {"questionId": "boss-a11-f6-15", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Etki ile yük dağılımı", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 118–119", "difficulty": "zor", "group": "f6", "rank": 3, "type": "choice", "prompt": "Nötr bir iletken küreye (+) yüklü bir çubuk dokundurulmadan yaklaştırılıyor. Kürenin çubuğa yakın tarafı için hangisi doğrudur?", "data": {"options": ["Negatif yükler bu tarafa toplanır, burası (−) olur.", "Pozitif yükler çubuğa doğru akar, burası (+) olur.", "Hiçbir yük hareket etmez, küre her yerde nötr kalır."]}, "textPlain": "Nötr bir iletken küreye (+) yüklü bir çubuk dokundurulmadan yaklaştırılıyor. Kürenin çubuğa yakın tarafı için hangisi doğrudur? Seçenekler: Negatif yükler bu tarafa toplanır, burası (−) olur. / Pozitif yükler çubuğa doğru akar, burası (+) olur. / Hiçbir yük hareket etmez, küre her yerde nötr kalır.", "correctAnswer": "Negatif yükler bu tarafa toplanır, burası (−) olur.", "explanation": "(+) çubuk küredeki negatif yükleri (elektronları) kendine yakın tarafa çeker."}, {"questionId": "boss-a11-f6-16", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Franklin", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 114, 120, 122", "difficulty": "zor", "group": "f6", "rank": 3, "type": "choice", "prompt": "Benjamin Franklin’in elektriklenmeyle ilgili çalışması hangisidir?", "data": {"options": ["Uçurtma deneyiyle yıldırımın elektrik olduğunu gösterip paratoneri buldu.", "Kehribarı yüne sürterek kıl ve kırıntıları çektiğini ilk kez gözlemledi.", "Atomun çekirdeğini keşfedip atom modelini yeniden çizdi ve elektronu buldu."]}, "textPlain": "Benjamin Franklin’in elektriklenmeyle ilgili çalışması hangisidir? Seçenekler: Uçurtma deneyiyle yıldırımın elektrik olduğunu gösterip paratoneri buldu. / Kehribarı yüne sürterek kıl ve kırıntıları çektiğini ilk kez gözlemledi. / Atomun çekirdeğini keşfedip atom modelini yeniden çizdi ve elektronu buldu.", "correctAnswer": "Uçurtma deneyiyle yıldırımın elektrik olduğunu gösterip paratoneri buldu.", "explanation": "Franklin uçurtma deneyiyle yıldırımın yük ilettiğini doğruladı ve paratoneri icat etti. Kehribar gözlemi Thales’e aittir."}, {"questionId": "boss-a11-f6-17", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Paratonerin yapısı", "outcome": "Elektriklenme çeşitlerini ve elektriklenmenin teknolojideki kullanımını deney yaparak açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 114, 120, 122", "difficulty": "zor", "group": "f6", "rank": 3, "type": "choice", "prompt": "Paratoner için hangisi doğrudur?", "data": {"options": ["Binanın en yüksek yerine konur ve toprağa bağlanır.", "Binanın bodrumuna konur ve toprakla hiçbir bağlantısı olmaz.", "Bulutlara sürekli yük göndererek yıldırımı başka bir yere iter."]}, "textPlain": "Paratoner için hangisi doğrudur? Seçenekler: Binanın en yüksek yerine konur ve toprağa bağlanır. / Binanın bodrumuna konur ve toprakla hiçbir bağlantısı olmaz. / Bulutlara sürekli yük göndererek yıldırımı başka bir yere iter.", "correctAnswer": "Binanın en yüksek yerine konur ve toprağa bağlanır.", "explanation": "Paratoner binanın tepesine konur ve yıldırımın yükünü toprağa iletmek için toprağa bağlanır."}, {"questionId": "boss-a11-f6-18", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "6. Ünite: Elektriklenme", "topic": "Yük çıkarımı", "outcome": "Cisimlerin yük durumlarını ve yüklü cisimler arasındaki itme-çekme etkileşimini açıklar.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (2. kitap), 6. Ünite “Elektriklenme”, s. 116–119", "difficulty": "zor", "group": "f6", "rank": 3, "type": "choice", "prompt": "A cismi B’yi itiyor, B cismi C’yi çekiyor. A’nın (+) yüklü olduğu biliniyorsa C için kesin olarak ne söylenebilir?", "data": {"options": ["(+) yüklü değildir.", "Kesinlikle (−) yüklüdür.", "Kesinlikle nötrdür."]}, "textPlain": "A cismi B’yi itiyor, B cismi C’yi çekiyor. A’nın (+) yüklü olduğu biliniyorsa C için kesin olarak ne söylenebilir? Seçenekler: (+) yüklü değildir. / Kesinlikle (−) yüklüdür. / Kesinlikle nötrdür.", wer": "Doğru", "explanation": "Yol arttıkça yakıt da aynı oranda artar; bu doğru orantıdır."}, {"questionId": "boss-a11-m6-04", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "6. Tema: Sayılar ve Nicelikler (2)", "topic": "Denk oran", "outcome": "Gerçek yaşam bağlamları üzerinden oran ilişkilerine yönelik muhakeme yapabilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sayılar ve Nicelikler (2)”, s. 47–48", "difficulty": "kolay", "group": "m6", "rank": 1, "type": "choice", "prompt": "Hangisi {2/5} oranına denktir?", "data": {"options": ["{6/15}", "{4/15}", "{5/2}"]}, "textPlain": "Hangisi {2/5} oranına denktir? Seçenekler: {6/15} / {4/15} / {5/2}", "correctAnswer": "{6/15}", "explanation": "{2/5} oranının pay ve paydası 3 ile genişletilirse {6/15} elde edilir."}, {"questionId": "boss-a11-m6-05", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "6. Tema: Sayılar ve Nicelikler (2)", "topic": "Birimli oran", "outcome": "Gerçek yaşam bağlamları üzerinden oran ilişkilerine yönelik muhakeme yapabilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sayılar ve Nicelikler (2)”, s. 69", "difficulty": "kolay", "group": "m6", "rank": 1, "type": "choice", "prompt": "120 km yolu 2 saatte alan bir aracın saatteki hızı kaç km’dir?", "data": {"options": ["60 km", "240 km", "122 km"]}, "textPlain": "120 km yolu 2 saatte alan bir aracın saatteki hızı kaç km’dir? Seçenekler: 60 km / 240 km / 122 km", "correctAnswer": "60 km", "explanation": "120 ÷ 2 = 60 km/sa."}, {"questionId": "boss-a11-m6-06", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "6. Tema: Sayılar ve Nicelikler (2)", "topic": "Doğru orantı", "outcome": "Gerçek yaşam durumları üzerinden doğru orantılı durumlara ilişkin problemleri çözebilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sayılar ve Nicelikler (2)”, s. 62", "difficulty": "kolay", "group": "m6", "rank": 1, "type": "num", "prompt": "3 deft ifficulty": "orta", "group": "m6", "rank": 2, "type": "num", "prompt": "4 işçi bir işi 6 günde bitiriyor. Aynı hızda çalışan 8 işçi bu işi kaç günde bitirir?", "data": {"answer": 3, "digits": 1, "unit": "gün"}, "textPlain": "4 işçi bir işi 6 günde bitiriyor. Aynı hızda çalışan 8 işçi bu işi kaç günde bitirir?", "correctAnswer": "3 gün", "explanation": "İşçi sayısı 2 katına çıkınca süre yarıya iner: 6 ÷ 2 = 3 gün."}, {"questionId": "boss-a11-m6-09", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "6. Tema: Sayılar ve Nicelikler (2)", "topic": "En ekonomik", "outcome": "Gerçek yaşam bağlamları üzerinden oran ilişkilerine yönelik muhakeme yapabilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sayılar ve Nicelikler (2)”, s. 70 (veri/şekil ekranda verilir)", "difficulty": "orta", "group": "m6", "rank": 2, "type": "choice", "prompt": "Aynı peynir üç farklı pakette satılıyor. Hangisi en ekonomiktir?", "data": {"options": ["1 kg’lık paket 70 TL", "500 g’lık paket 40 TL", "250 g’lık paket 22 TL"]}, "textPlain": "Aynı peynir üç farklı pakette satılıyor. Hangisi en ekonomiktir? Seçenekler: 1 kg’lık paket 70 TL / 500 g’lık paket 40 TL / 250 g’lık paket 22 TL", "correctAnswer": "1 kg’lık paket 70 TL", "explanation": "1 kg’ın fiyatı: 70 TL; 500 g’lık ile 80 TL; 250 g’lık ile 88 TL. En ucuzu 1 kg’lık pakettir."}, {"questionId": "boss-a11-m6-10", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "6. Tema: Sayılar ve Nicelikler (2)", "topic": "Tarif", "outcome": "Gerçek yaşam durumları üzerinden doğru orantılı durumlara ilişkin problemleri çözebilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sayılar ve Nicelikler (2)”, s. 62", "difficulty": "orta", "group": "m6", "rank": 2, "type": "num", "prompt": "Bir kek tarifinde 2 su bardağı una 3 yumurta konuyor. 8 su bardağı un kullanılırsa kaç yumurta gerekir?", "data": {"answer": 12, "digits": 2, "unit": "yumurta"}, "textPlain": "Bir kek tarifinde 2 su bar . Tema: Türk Sanatı", "topic": "Kök boya", "outcome": "Metinlerden ve görsellerden geleneksel Türk sanatlarına ilişkin önemli bilgileri belirler.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 14, s. 54", "difficulty": "kolay", "group": "t4", "rank": 1, "type": "tf", "prompt": "Kilim ve halıların renkleri geleneksel olarak kök boyalardan elde edilir.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Kilim ve halıların renkleri geleneksel olarak kök boyalardan elde edilir.", "correctAnswer": "Doğru", "explanation": "Geleneksel dokumalarda bitkilerden elde edilen kök boyalar kullanılır."}, {"questionId": "boss-a11-t4-04", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "Ebru", "outcome": "Metinlerden ve görsellerden geleneksel Türk sanatlarına ilişkin önemli bilgileri belirler.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 14, s. 54", "difficulty": "kolay", "group": "t4", "rank": 1, "type": "choice", "prompt": "Özel bir su üzerine boyalarla desen yapılıp bu desenin kâğıda aktarıldığı sanat hangisidir?", "data": {"options": ["Ebru", "Çini", "Minyatür"]}, "textPlain": "Özel bir su üzerine boyalarla desen yapılıp bu desenin kâğıda aktarıldığı sanat hangisidir? Seçenekler: Ebru / Çini / Minyatür", "correctAnswer": "Ebru", "explanation": "Ebru, su yüzeyindeki boyaların kâğıda aktarılmasıyla yapılır."}, {"questionId": "boss-a11-t4-05", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "El sanatları", "outcome": "Metinlerden ve görsellerden geleneksel Türk sanatlarına ilişkin önemli bilgileri belirler.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 14, s. 54", "difficulty": "kolay", "group": "t4", "rank": 1, "type": "match", "prompt": "Her sanatı açıklamasıyla eşleştir.", "data": {"pairs": [["Çini", "Desenli, sırlı seramik karo"], ["Minyatür", "Geleneksel kü  kilim neye benzetilmiştir? Seçenekler: Okunmayı bekleyen bir mektuba / Çiçeklerle dolu bir bahçeye / Duvarda asılı bir tabloya", "correctAnswer": "Okunmayı bekleyen bir mektuba", "explanation": "“Okunmayı bekleyen renkli bir mektup gibidir” ifadesiyle kilim mektuba benzetilmiştir."}, {"questionId": "boss-a11-t4-12", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "Zıtlık bildirmeyen", "outcome": "Zıtlık işlevli söz varlıklarını ve noktalama işaretlerini işlevlerine uygun kullanır; söz sanatlarını, metin yapılarını ve düşünceyi geliştirme yollarını belirler.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 32, s. 44, s. 52", "difficulty": "orta", "group": "t4", "rank": 2, "type": "choice", "prompt": "Aşağıdaki bağlayıcı ifadelerden hangisi zıtlık BİLDİRMEZ?", "data": {"options": ["çünkü", "oysa", "ama"]}, "textPlain": "Aşağıdaki bağlayıcı ifadelerden hangisi zıtlık BİLDİRMEZ? Seçenekler: çünkü / oysa / ama", "correctAnswer": "çünkü", "explanation": "“Oysa” ve “ama” zıt durumları bağlar; “çünkü” sebep bildirir."}, {"questionId": "boss-a11-t4-13", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "Zıtlık ifadeleri", "outcome": "Zıtlık işlevli söz varlıklarını ve noktalama işaretlerini işlevlerine uygun kullanır; söz sanatlarını, metin yapılarını ve düşünceyi geliştirme yollarını belirler.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 32, s. 44, s. 52", "difficulty": "orta", "group": "t4", "rank": 2, "type": "sort2", "prompt": "İfadeleri zıtlık bildirenler ve bildirmeyenler diye ayır.", "data": {"bins": ["Zıtlık bildirir", "Zıtlık bildirmez"], "items": [["ama", 0], ["oysa", 0], ["fakat", 0], ["çünkü", 1], ["bu yüzden", 1]]}, "textPlain": "İfadeleri zıtlık bildirenler ve bildirmeyenler diye ayır. (Zıtlık bildirir / Zıtlık bildirmez) Kartlar: ama; oysa; fakat; çünkü; bu yüzden.", "correctAnswer": "Zıtlı  yapıyı korumak / Savaş zamanları için gizli kaçış yolları oluşturmak / Yağmur suyunu depolayıp yapının temizliğinde kullanmak", "correctAnswer": "Topraktaki nemi dışarı atarak yapıyı korumak", "explanation": "Metinde dehlizlerin nemi dışarı atarak binanın sağlam kalmasına yardım ettiği söyleniyor."}, {"questionId": "boss-a11-t4-16", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "Kişileştirme", "outcome": "Kelimelerin anlamlarını bağlamdan ve sözlükten belirler.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 25–26, s. 39, s. 47–48", "difficulty": "zor", "group": "t4", "rank": 3, "type": "choice", "prompt": "Aşağıdaki cümlelerin hangisinde kişileştirme vardır?", "data": {"options": ["Eski kilim, onu dokuyan elleri hâlâ hatırlıyordu.", "Kilim, çiçek bahçesi gibi rengârenkti.", "Bu kilimi dokumak tam iki yıl sürdü."]}, "textPlain": "Aşağıdaki cümlelerin hangisinde kişileştirme vardır? Seçenekler: Eski kilim, onu dokuyan elleri hâlâ hatırlıyordu. / Kilim, çiçek bahçesi gibi rengârenkti. / Bu kilimi dokumak tam iki yıl sürdü.", "correctAnswer": "Eski kilim, onu dokuyan elleri hâlâ hatırlıyordu.", "explanation": "Hatırlamak insana özgüdür; kilime bu özellik verilmiştir."}, {"questionId": "boss-a11-t4-17", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "Tekerleme", "outcome": "Geleneksel Türk tiyatrosu ve müziğine ilişkin bilgileri karşılaştırır ve sınıflandırır.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 23, s. 25", "difficulty": "zor", "group": "t4", "rank": 3, "type": "choice", "prompt": "Ortaoyununda Kavuklu’nun, başından geçmiş gibi anlattığı hayalî ve eğlenceli olaylardan oluşan bölüme ne ad verilir?", "data": {"options": ["Tekerleme", "Perde gazeli", "Bitiş"]}, "textPlain": "Ortaoyununda Kavuklu’nun, başından geçmiş gibi anlattığı hayalî ve eğlenceli olaylardan oluşan bölüme ne ad verilir  "textPlain": "Aşağıdaki cümlelerin hangisinde yay ayraç doğum ve ölüm yıllarını göstermek için kullanılmıştır? Seçenekler: Halı ustası Ahmet Usta (1920-1995) desenler üzerine bir kitap yazdı. / Kilim (yün ipliklerle dokunan yer örtüsü) evin baş köşesine serildi. / Halı sergisi yarın (pazartesi) öğleden sonra açılacak.", "correctAnswer": "Halı ustası Ahmet Usta (1920-1995) desenler üzerine bir kitap yazdı.", "explanation": "Yay ayraç doğum-ölüm yıllarını ve açıklamaları göstermek için kullanılır; ilk cümlede yıllar verilmiştir."}, {"questionId": "boss-a11-t4-20", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "4. Tema: Türk Sanatı", "topic": "Çalgılar", "outcome": "Geleneksel Türk tiyatrosu ve müziğine ilişkin bilgileri karşılaştırır ve sınıflandırır.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 4. Tema “Türk Sanatı”, s. 23, s. 25", "difficulty": "zor", "group": "t4", "rank": 3, "type": "match", "prompt": "Her çalgıyı türüyle eşleştir.", "data": {"pairs": [["Kanun", "Telli çalgı"], ["Davul", "Vurmalı çalgı"], ["Zurna", "Üflemeli çalgı"]]}, "textPlain": "Her çalgıyı türüyle eşleştir. Sol: Kanun; Davul; Zurna. Sağ: Telli çalgı; Vurmalı çalgı; Üflemeli çalgı.", "correctAnswer": "Kanun = Telli çalgı; Davul = Vurmalı çalgı; Zurna = Üflemeli çalgı", "explanation": "Kanun telleriyle, davul vurularak, zurna üflenerek çalınır."}, {"questionId": "boss-a11-t5-01", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "5. Tema: Okuma Kültürü", "topic": "Zaman zarfı", "outcome": "Zarfların cümleye kattığı anlamı belirler ve zarfları türlerine göre sınıflandırır.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 2. Kitap, 5. Tema “Okuma Kültürü”, s. 73", "difficulty": "kolay", "group": "t5", "rank": 1, "type": "choice", "prompt": "“Yarın kütüphaneye gideceğim.” cümlesinde zaman bildiren zarf hangisidir?", "data": {"options": ["Yarın", "kütüphaneye", "gideceğim"]}, "textPlain": "“Yarın kütüphaneye gideceğim.” cümlesinde zaman bildiren zarf h <script>
"use strict";
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),BOSS=JSON.parse($('boss-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;
const SUBJ={science:['🔬','Fen'],math:['📐','Matematik'],turkish:['📖','Türkçe']},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,cur=null,okCount=0,badCount=0,defeated=false,checked=false;
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();showIntro();$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}
function sfx(k){({tap:()=>tone(660,.06,'triangle',.1),pick:()=>tone(520,.07,'triangle',.12,0,120),
 ok:()=>{tone(523,.12,'triangle',.16);tone(784,.16,'triangle',.16,.09);tone(1046,.22,'sine',.12,.18);},
 bad:()=>{tone(220,.28,'sawtooth',.08,0,-90);noise(.25,.12,.05,500);},
 splat:()=>{noise(.35,.28,0,700);tone(140,.3,'sine',.12,0,-60);},
 bubble:()=>{for(let i=0;i<5;i++)tone(400+i*120,.07,'sine',.08,i*.06,200);},
 free:()=>{tone(880,.1,'sine',.12);tone(1320,.18,'sine',.1,.08);},
 roar:()=>{tone(90,.6,'sawtooth',.1,0,60);noise(.6,.12,0,400);},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12));},
 gate:()=>{tone(196,.25,'square',.06);tone(294,.35,'square',.06,.2);}}[k]||(()=>{}))();}
$('mute').onclick=()=>{muted=!muted;unlockAudio();if(master)master.gain.value=muted?0:.8;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');};
/* ---------- Deste ---------- */
function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}
function remember(ids){try{localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent()].slice(0,30)));}catch(e){}}
function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});

function buildDeck(){const rec=new Set(recent()),plan=deckPlan();

  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
