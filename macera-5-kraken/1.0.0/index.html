<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Kraken</title>
<style>
:root{--c1:#1b8fd0;--c2:#16b39a;--deep:#06324d;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:nowrap}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.bin{border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.wave{position:absolute;width:17%;height:15%;transform:translate(-50%,-50%) rotate(var(--r));z-index:3;transition:opacity .4s}
.wave svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 2px 3px rgba(0,30,60,.6))}
.wave.big{animation:wb 1.2s ease-in-out infinite}
@keyframes wb{50%{transform:translate(-50%,-50%) rotate(var(--r)) scale(1.18)}}
.wave.back{animation:wback 1.1s ease-in forwards}
@keyframes wback{0%{filter:brightness(1.8)}100%{transform:translate(-50%,-50%) rotate(var(--r)) translateY(70px) scale(.3);opacity:0}}
.foam{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 6px #bff;z-index:6;pointer-events:none;animation:fm .8s ease-out forwards}
@keyframes fm{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.boat{position:absolute;left:9%;bottom:34px;font-size:30px;transform:translate(-50%,calc(var(--lift,0) * -1px));z-index:5;transition:transform .6s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.4));animation:bt 2.4s ease-in-out infinite;pointer-events:none}
@keyframes bt{50%{rotate:6deg}}
.boat.rock{animation:rk .7s ease}
@keyframes rk{25%{rotate:-22deg}60%{rotate:16deg}}
#splat{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:linear-gradient(0deg,rgba(20,120,200,.92),rgba(80,200,255,.75) 45%,rgba(255,255,255,.5) 62%,transparent 70%);transform:translateY(100%)}
#splat.on{animation:surge 1s ease-out forwards}
@keyframes surge{0%{opacity:1;transform:translateY(100%)}35%{opacity:1;transform:translateY(5%)}100%{opacity:0;transform:translateY(-20%)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>
<div id="conf" aria-hidden="true"></div>

 yüzde kaçtır?", "correctAnswer": "%50", "explanation": "{1/2} = 50/100 = %50."}, {"questionId": "boss-a04-m7-12", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Az olası", "outcome": "Olayların olasılıklarını az veya çok olasılıklı şeklinde ortaya koyabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 174 (şekil ekranda verilir)", "difficulty": "orta", "group": "m7", "rank": 2, "type": "choice", "prompt": "Torbada 1 yeşil ve 9 sarı bilye var. Bakmadan çekilen bilyenin yeşil olması için hangisi söylenebilir?", "data": {"options": ["Az olasıdır.", "Kesindir.", "İmkânsızdır."], "fig": {"k": "bag", "c": [["#1fa37a", 1], ["#ffcf3f", 9]]}}, "textPlain": "[Torba: 1 yeşil, 9 sarı bilye] Torbada 1 yeşil ve 9 sarı bilye var. Bakmadan çekilen bilyenin yeşil olması için hangisi söylenebilir? Seçenekler: Az olasıdır. / Kesindir. / İmkânsızdır.", "correctAnswer": "Az olasıdır.", "explanation": "Yeşil bilye sayısı çok az olduğu için yeşil çekmek az olasıdır ama imkânsız değildir."}, {"questionId": "boss-a04-m7-13", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Olasılık ifadeleri", "outcome": "Bir olayın olasılık değerinin 0 ile 1 arasında (0 ve 1 dâhil) olduğunu yorumlayabilme; olasılığı kesir, ondalık ve yüzde ile ifade edebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 170", "difficulty": "orta", "group": "m7", "rank": 2, "type": "match", "prompt": "Her olayı olasılığıyla eşleştir.", "data": {"pairs": [["Zarda 0 gelmesi", "İmkânsız"], ["Parada yazı gelmesi", "Eşit olasılıklı"], ["Zarda 6’dan küçük gelmesi", "Çok olası"]]}, "textPlain": "Her olayı olasılığıyla eşleştir. Sol: Zarda 0 gelmesi; Parada yazı gelmesi; Zarda 6’dan küçük gelmesi. Sağ: İmkânsız; Eşit olasılıklı; Çok olası.", "correctAnswer": "Zarda 0 gelmesi = İmkânsız; Parada yazı gelmesi = Eşit olasılıklı; Zarda 6’dan küçük gelmesi = Çok olası", "explanation": "Zarda 0 yoktur (imkânsız); parada yazı ve tura eşittir; zarda 1–5 gelmesi 6 durumun 5’i olduğu için çok olasıdır."}, {"questionId": "boss-a04-m7-14", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Adil oyun", "outcome": "Adil olan ve adil olmayan oyunları olasılık yönünden değerlendirebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 175 (şekil ekranda verilir)", "difficulty": "orta", "group": "m7", "rank": 2, "type": "choice", "prompt": "Ece ile Can zar atıyor. Çift sayı gelirse Ece, tek sayı gelirse Can kazanıyor. Bu oyun için ne söylenebilir?", "data": {"options": ["Adildir; ikisinin kazanma olasılığı eşittir.", "Ece’nin kazanma olasılığı daha fazladır.", "Can’ın kazanma olasılığı daha fazladır."]}, "textPlain": "Ece ile Can zar atıyor. Çift sayı gelirse Ece, tek sayı gelirse Can kazanıyor. Bu oyun için ne söylenebilir? Seçenekler: Adildir; ikisinin kazanma olasılığı eşittir. / Ece’nin kazanma olasılığı daha fazladır. / Can’ın kazanma olasılığı daha fazladır.", "correctAnswer": "Adildir; ikisinin kazanma olasılığı eşittir.", "explanation": "Zarda 3 çift (2, 4, 6) ve 3 tek (1, 3, 5) sayı vardır; kazanma olasılıkları eşit olduğundan oyun adildir."}, {"questionId": "boss-a04-m7-15", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Adil oyun", "outcome": "Adil olan ve adil olmayan oyunları olasılık yönünden değerlendirebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 175 (şekil ekranda verilir)", "difficulty": "zor", "group": "m7", "rank": 3, "type": "choice", "prompt": "Çark 4 eş parçalı: 3 parça mavi, 1 parça kırmızı. Mavi gelirse Ali, kırmızı gelirse Ayşe kazanıyor. Oyunu adil yapmak için ne yapılmalıdır?", "data": {"options": ["Çarkı 2 mavi, 2 kırmızı parça olacak şekilde boyamak", "Mavi parçaları daha koyu boyamak", "Çarkı daha hızlı çevirmek"], "fig": {"k": "spin", "s": [["#2f6fe0", "Mavi"], ["#2f6fe0", "Mavi"], ["#2f6fe0", "Mavi"], ["#e2425c", "Kırmızı"]]}}, "textPlain": "[Çark: 3 mavi, 1 kırmızı eş parça] Çark 4 eş parçalı: 3 parça mavi, 1 parça kırmızı. Mavi gelirse Ali, kırmızı gelirse Ayşe kazanıyor. Oyunu adil yapmak için ne yapılmalıdır? Seçenekler: Çarkı 2 mavi, 2 kırmızı parça olacak şekilde boyamak / Mavi parçaları daha koyu boyamak / Çarkı daha hızlı çevirmek", "correctAnswer": "Çarkı 2 mavi, 2 kırmızı parça olacak şekilde boyamak", "explanation": "Oyunun adil olması için iki oyuncunun kazanma olasılığı eşit olmalıdır; parça sayıları eşitlenmelidir."}, {"questionId": "boss-a04-m7-16", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Veriye dayalı tahmin", "outcome": "Verilere ve gerekçelere dayanarak olasılık tahmininde bulunabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 178 (şekil ekranda verilir)", "difficulty": "zor", "group": "m7", "rank": 3, "type": "choice", "prompt": "Tabloya göre haziran ayında yağmur yağma olasılığı en yüksek olan şehir hangisidir?", "data": {"options": ["Rize", "Konya", "İzmir"], "fig": {"k": "table", "h": ["Şehir", "Hazirandaki yağışlı gün (ort.)"], "r": [["Rize", "14"], ["Konya", "5"], ["İzmir", "2"]]}}, "textPlain": "[Tablo: Haziranda ortalama yağışlı gün — Rize 14, Konya 5, İzmir 2] Tabloya göre haziran ayında yağmur yağma olasılığı en yüksek olan şehir hangisidir? Seçenekler: Rize / Konya / İzmir", "correctAnswer": "Rize", "explanation": "Geçmiş yıllarda yağışlı gün sayısı en fazla olan Rize’dir; tahmin veriye dayanır."}, {"questionId": "boss-a04-m7-17", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Veriye dayalı tahmin", "outcome": "Verilere ve gerekçelere dayanarak olasılık tahmininde bulunabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 178 (şekil ekranda verilir)", "difficulty": "zor", "group": "m7", "rank": 3, "type": "choice", "prompt": "Bir basketbolcu son 20 atışının 18’ini sayıya çevirdi. Bir sonraki atış için hangisi söylenebilir?", "data": {"options": ["Sayı olması çok olasıdır.", "Sayı olması kesindir.", "Sayı olması imkânsızdır."]}, "textPlain": "Bir basketbolcu son 20 atışının 18’ini sayıya çevirdi. Bir sonraki atış için hangisi söylenebilir? Seçenekler: Sayı olması çok olasıdır. / Sayı olması kesindir. / Sayı olması imkânsızdır.", "correctAnswer": "Sayı olması çok olasıdır.", "explanation": "Önceki veriler isabetin çok sık olduğunu gösterir; yine de kesin değildir."}, {"questionId": "boss-a04-m7-18", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Torba", "outcome": "Olayların olasılıklarını az veya çok olasılıklı şeklinde ortaya koyabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 174 (şekil ekranda verilir)", "difficulty": "zor", "group": "m7", "rank": 3, "type": "order", "prompt": "Torbada 5 kırmızı, 3 mavi ve 1 sarı top var. Renkleri bakmadan çekilme olasılığına göre EN ÇOKTAN EN AZA sırala.", "data": {"items": ["Kırmızı", "Mavi", "Sarı"]}, "textPlain": "Torbada 5 kırmızı, 3 mavi ve 1 sarı top var. Renkleri bakmadan çekilme olasılığına göre EN ÇOKTAN EN AZA sırala. Kartlar: Kırmızı; Sarı; Mavi.", "correctAnswer": "Kırmızı → Mavi → Sarı", "explanation": "Sayısı en çok olan rengi çekmek en olasıdır: 5 kırmızı > 3 mavi > 1 sarı."}, {"questionId": "boss-a04-m7-19", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "7. Tema: Veriden Olasılığa", "topic": "Öznel olasılık", "outcome": "Verilere ve gerekçelere dayanarak olasılık tahmininde bulunabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 2. Kitap, 7. Tema “Veriden Olasılığa”, s. 171", "difficulty": "zor", "group": "m7", "rank": 3, "type": "choice", "prompt": "“ , "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Soru işareti", "outcome": "Noktalama işaretlerini, büyük harfleri ve sayıların yazımını kurallara uygun kullanır.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 144", "difficulty": "kolay", "group": "t6", "rank": 1, "type": "tf", "prompt": "“Spor yapmayı seviyor musun?” cümlesinin sonuna soru işareti konur.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? “Spor yapmayı seviyor musun?” cümlesinin sonuna soru işareti konur.", "correctAnswer": "Doğru", "explanation": "Soru bildiren cümlelerin sonuna soru işareti konur."}, {"questionId": "boss-a04-t6-07", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Kelime anlamı", "outcome": "Kelimelerin anlamlarını bağlamdan ve sözlükten belirler.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 124, 126", "difficulty": "kolay", "group": "t6", "rank": 1, "type": "choice", "prompt": "“Rota” kelimesinin anlamı hangisidir?", "data": {"options": ["Gidilecek yolun önceden belirlenmiş çizgisi", "Dağın en yüksek yeri", "Yürüyüşte kullanılan ayakkabı"]}, "textPlain": "“Rota” kelimesinin anlamı hangisidir? Seçenekler: Gidilecek yolun önceden belirlenmiş çizgisi / Dağın en yüksek yeri / Yürüyüşte kullanılan ayakkabı", "correctAnswer": "Gidilecek yolun önceden belirlenmiş çizgisi", "explanation": "Rota, gidilecek yolun önceden belirlenmiş çizgisidir."}, {"questionId": "boss-a04-t6-08", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Karşılaştırma", "outcome": "Düşünceyi geliştirme yollarını, karşılaştırma ve örnekleme ifadelerini, niteleyen ve ismin yerini tutan kelimeleri belirler; metin türlerini ayırt eder.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 145", "difficulty": "orta", "group": "t6", "rank": 2, "type": "choice", "prompt": "Hangi cümlede karşılaştırma bildiren bir ifade vardır?", "data": {"options": ["Yürüyüş, koşu kadar faydalı bir egzersizdir.", "Her sabah parkta yürüyoruz.", "Yürüyüş ayakkabılarımı aldım."]}, "textPlain": "Hangi cümlede karşılaştırma bildiren bir ifade vardır? Seçenekler: Yürüyüş, koşu kadar faydalı bir egzersizdir. / Her sabah parkta yürüyoruz. / Yürüyüş ayakkabılarımı aldım.", "correctAnswer": "Yürüyüş, koşu kadar faydalı bir egzersizdir.", "explanation": "“Kadar” sözcüğü iki şeyi karşılaştırır ve eşitlik bildirir."}, {"questionId": "boss-a04-t6-09", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Örnek bildiren ifade", "outcome": "Düşünceyi geliştirme yollarını, karşılaştırma ve örnekleme ifadelerini, niteleyen ve ismin yerini tutan kelimeleri belirler; metin türlerini ayırt eder.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 145", "difficulty": "orta", "group": "t6", "rank": 2, "type": "choice", "prompt": "Hangi cümlede örnek bildiren bir ifade kullanılmıştır?", "data": {"options": ["Kış meyvelerini, örneğin portakal ve mandalinayı, bol bol yemeliyiz.", "Kışın meyve yemeliyiz.", "Kış meyveleri çok sağlıklıdır."]}, "textPlain": "Hangi cümlede örnek bildiren bir ifade kullanılmıştır? Seçenekler: Kış meyvelerini, örneğin portakal ve mandalinayı, bol bol yemeliyiz. / Kışın meyve yemeliyiz. / Kış meyveleri çok sağlıklıdır.", "correctAnswer": "Kış meyvelerini, örneğin portakal ve mandalinayı, bol bol yemeliyiz.", "explanation": "“Örneğin” ifadesi düşünceyi örneklerle destekler."}, {"questionId": "boss-a04-t6-10", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Deyim", "outcome": "Eş ve zıt anlamlı kelimeleri, yabancı kelimelerin Türkçe karşılıklarını, deyim ve atasözlerini bağlama uygun kullanır.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 117", "difficulty": "orta", "group": "t6", "rank": 2, "type": "choice", "prompt": "“Kaşla göz arasında” deyiminin anlamı hangisidir?", "data": {"options": ["Çok kısa bir sürede, kimse fark etmeden", "Yüzün ortasında", "Çok uzun bir zamanda"]}, "textPlain": "“Kaşla göz arasında” deyiminin anlamı hangisidir? Seçenekler: Çok kısa bir sürede, kimse fark etmeden / Yüzün ortasında / Çok uzun bir zamanda", "correctAnswer": "Çok kısa bir sürede, kimse fark etmeden", "explanation": "Deyim, çok kısa bir süre içinde ve fark ettirmeden yapılan işleri anlatır."}, {"questionId": "boss-a04-t6-11", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Yabancı kelimeler", "outcome": "Eş ve zıt anlamlı kelimeleri, yabancı kelimelerin Türkçe karşılıklarını, deyim ve atasözlerini bağlama uygun kullanır.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 117", "difficulty": "orta", "group": "t6", "rank": 2, "type": "match", "prompt": "Her yabancı kelimeyi Türkçe karşılığıyla eşleştir.", "data": {"pairs": [["Fast food", "Hazır yemek"], ["Online", "Çevrim içi"], ["Mouse", "Fare"]]}, "textPlain": "Her yabancı kelimeyi Türkçe karşılığıyla eşleştir. Sol: Fast food; Online; Mouse. Sağ: Hazır yemek; Çevrim içi; Fare.", "correctAnswer": "Fast food = Hazır yemek; Online = Çevrim içi; Mouse = Fare", "explanation": "Yabancı kelimeler yerine Türkçe karşılıkları kullanılmalıdır: fast food – hazır yemek, online – çevrim içi, mouse – fare."}, {"questionId": "boss-a04-t6-12", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Niteleyen kelime", "outcome": "Düşünceyi geliştirme yollarını, karşılaştırma ve örnekleme ifadelerini, niteleyen ve ismin yerini tutan kelimeleri belirler; metin türlerini ayırt eder.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 145", "difficulty": "orta", "group": "t6", "rank": 2, "type": "choice", "prompt": "“Taze sebzeler vücudumuza güç verir.” cümlesinde ismi niteleyen kelime hangisidir?", "data": {"options": ["taze", "sebzeler", "güç"]}, "textPlain": "“Taze sebzeler vücudumuza güç verir.” cümlesinde ismi niteleyen kelime hangisidir? Seçenekler: taze / sebzeler / güç", "correctAnswer": "taze", "explanation": "“Taze” kelimesi sebzelerin nasıl olduğunu anlatır; ismi niteler."}, {"questionId": "boss-a04-t6-13", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Tırnak işareti", "outcome": "Noktalama işaretlerini, büyük harfleri ve sayıların yazımını kurallara uygun kullanır.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 144", "difficulty": "orta", "group": "t6", "rank": 2, "type": "choice", "prompt": "Hangi cümlede noktalama doğru kullanılmıştır?", "data": {"options": ["Doktor “Her gün meyve yiyin.” dedi.", "Doktor Her gün meyve yiyin dedi.", "Doktor, “her gün meyve yiyin” dedi?"]}, "textPlain": "Hangi cümlede noktalama doğru kullanılmıştır? Seçenekler: Doktor “Her gün meyve yiyin.” dedi. / Doktor Her gün meyve yiyin dedi. / Doktor, “her gün meyve yiyin” dedi?", "correctAnswer": "Doktor “Her gün meyve yiyin.” dedi.", "explanation": "Aynen aktarılan söz tırnak içine alınır ve büyük harfle başlar."}, {"questionId": "boss-a04-t6-14", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Metin türü", "outcome": "Düşünceyi geliştirme yollarını, karşılaştırma ve örnekleme ifadelerini, niteleyen ve ismin yerini tutan kelimeleri belirler; metin türlerini ayırt eder.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 145", "difficulty": "orta", "group": "t6", "rank": 2, "type": "tf", "prompt": "Sağlıklı beslenme hakkında bilgi vermek için yazılan bir metin öyküleyici metindir.", "data": {"truth": false}, "textPlain": "Doğru mu yanlış mı? Sağlıklı beslenme hakkında bilgi vermek için yazılan bir metin öyküleyici metindir.", "correctAnswer": "Yanlış", "explanation": "Bir konu hakkında bilgi veren metin bilgilendirici metindir; öyküleyici metin kişilerin başından geçen olayları anlatır."}, {"questionId": "boss-a04-t6-15", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Önemli bilgi", "outcome": "Bilgilendirici ve öyküleyici metinlerde önemli bilgileri belirler, metinden çıkarım yapar.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 115 (metin ekranda verilir)", "difficulty": "zor", "group": "t6", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metne göre ciritin oyunculara katkısı nedir?", "data": {"options": ["Bedeni ve dikkati güçlendirmesi", "Oyuncuları zengin yapması", "Atları yorması"], "passage": "Cirit, atlı oyuncuların karşılıklı iki takım hâlinde oynadığı geleneksel bir sporumuzdur. Oyuncular, rakip takımdaki bir oyuncuya ucu yuvarlatılmış tahta çubuğu fırlatır. Çubuktan kaçmak ve onu yakalamak hem çeviklik hem de dikkat ister. Bu nedenle cirit, binicilerin hem bedenini hem de dikkatini güçlendirir."}, "textPlain": "Metin: Cirit, atlı oyuncuların karşılıklı iki takım hâlinde oynadığı geleneksel bir sporumuzdur. Oyuncular, rakip takımdaki bir oyuncuya ucu yuvarlatılmış tahta çubuğu fırlatır. Çubuktan kaçmak ve onu yakalamak hem çeviklik hem de dikkat ister. Bu nedenle cirit, binicilerin hem bedenini hem de dikkatini güçlendirir. Soru: Yukarıdaki metne göre ciritin oyunculara katkısı nedir? Seçenekler: Bedeni ve dikkati güçlendirmesi / Oyuncuları zengin yapması / Atları yorması", "correctAnswer": "Bedeni ve dikkati güçlendirmesi", "explanation": "Metnin son cümlesinde ciritin binicilerin bedenini ve dikkatini güçlendirdiği belirtilir."}, {"questionId": "boss-a04-t6-16", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Çıkarım", "outcome": "Bilgilendirici ve öyküleyici metinlerde önemli bilgileri belirler, metinden çıkarım yapar.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 115 (metin ekranda verilir)", "difficulty": "zor", "group": "t6", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metinden hangi çıkarım yapılabilir?", "data": {"options": ["Cirit oynamak için ata binmeyi bilmek gerekir.", "Cirit yalnızca tek kişiyle oynanır.", "Ciritte demir çubuk kullanılır."], "passage": "Cirit, atlı oyuncuların karşılıklı iki takım hâlinde oynadığı geleneksel bir sporumuzdur. Oyuncular, rakip takımdaki bir oyuncuya ucu yuvarlatılmış tahta çubuğu fırlatır. Çubuktan kaçmak ve onu yakalamak hem çeviklik hem de dikkat ister. Bu nedenle cirit, binicilerin hem bedenini hem de dikkatini güçlendirir."}, "textPlain": "Metin: Cirit, atlı oyuncuların karşılıklı iki takım hâlinde oynadığı geleneksel bir sporumuzdur. Oyuncular, rakip takımdaki bir oyuncuya ucu yuvarlatılmış tahta çubuğu fırlatır. Çubuktan kaçmak ve onu yakalamak hem çeviklik hem de dikkat ister. Bu nedenle cirit, binicilerin hem bedenini hem de dikkatini güçlendirir. Soru: Yukarıdaki metinden hangi çıkarım yapılabilir? Seçenekler: Cirit oynamak için ata binmeyi bilmek gerekir. / Cirit yalnızca tek kişiyle oynanır. / Ciritte demir çubuk kullanılır.", "correctAnswer": "Cirit oynamak için ata binmeyi bilmek gerekir.", "explanation": "Metinde oyuncuların atlı olduğu söylenir; bu yüzden ata binmeyi bilmek gerekir. Oyun iki takımla ve tahta çubukla oynanır."}, {"questionId": "boss-a04-t6-17", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Düşünceyi geliştirme", "outcome": "Düşünceyi geliştirme yollarını, karşılaştırma ve örnekleme ifadelerini, niteleyen ve ismin yerini tutan kelimeleri belirler; metin türlerini ayırt eder.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 145", "difficulty": "zor", "group": "t6", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metinde düşünceyi geliştirmek için hangi yol kullanılmıştır?", "data": {"options": ["Örneklendirme", "Tanık gösterme", "Benzetme"], "passage": "Şeker, kısa sürede enerji veren bir besindir. Ancak fazla şeker tüketmek dişlerimize ve sağlığımıza zarar verir. Örneğin gazlı içecekler ve paketli tatlılar çok şeker içerir. Bunların yerine meyve yemek hem tatlı ihtiyacımızı karşılar hem de vücudumuza vitamin kazandırır."}, "textPlain": "Metin: Şeker, kısa sürede enerji veren bir besindir. Ancak fazla şeker tüketmek dişlerimize ve sağlığımıza zarar verir. Örneğin gazlı içecekler ve paketli tatlılar çok şeker içerir. Bunların yerine meyve yemek hem tatlı ihtiyacımızı karşılar hem de vücudumuza vitamin kazandırır. Soru: Yukarıdaki metinde düşünceyi geliştirmek için hangi yol kullanılmıştır? Seçenekler: Örneklendirme / Tanık gösterme / Benzetme", "correctAnswer": "Örneklendirme", "explanation": "Yazar “örneğin” diyerek çok şeker içeren yiyeceklerden örnekler vermiştir."}, {"questionId": "boss-a04-t6-18", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "6. Tema: Sağlıklı Yaşıyorum", "topic": "Ana fikir", "outcome": "Bilgilendirici ve öyküleyici metinlerde önemli bilgileri belirler, metinden çıkarım yapar.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 2. Kitap, 6. Tema “Sağlıklı Yaşıyorum”, s. 115 (metin ekranda verilir)", "difficulty": "zor", "group": "t6", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metnin asıl anlatmak istediği nedir?", "data": {"options": ["Fazla şekerden kaçınıp meyveyi tercih etmeliyiz.", "Gazlı içecekler en iyi enerji kaynağıdır.", "Meyvelerde hiç şeker yoktur."], "passage": "Şeker, kısa sürede enerji veren bir besindir. Ancak fazla şeker tüketmek dişlerimize ve sağlığımıza zarar verir. Örneğin gazlı içecekler ve paketli tatlılar çok şeker içerir. Bunların yerine meyve yemek hem tatlı ihtiyacımızı karşılar hem de vücudumuza vitamin kazandırır."}, "textPlain": "Metin: Şeker, kısa sürede enerji ve <script>
"use strict";
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),BOSS=JSON.parse($('boss-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;
const SUBJ={science:['🔬','Fen'],math:['📐','Matematik'],turkish:['📖','Türkçe']},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,cur=null,okCount=0,badCount=0,defeated=false,checked=false;
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();showIntro();$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}
function sfx(k){({tap:()=>tone(660,.06,'triangle',.1),pick:()=>tone(520,.07,'triangle',.12,0,120),
 ok:()=>{tone(523,.12,'triangle',.16);tone(784,.16,'triangle',.16,.09);tone(1046,.22,'sine',.12,.18);},
 bad:()=>{tone(220,.28,'sawtooth',.08,0,-90);noise(.25,.12,.05,500);},
 splat:()=>{noise(.35,.28,0,700);tone(140,.3,'sine',.12,0,-60);},
 bubble:()=>{for(let i=0;i<5;i++)tone(400+i*120,.07,'sine',.08,i*.06,200);},
 free:()=>{tone(880,.1,'sine',.12);tone(1320,.18,'sine',.1,.08);},
 roar:()=>{tone(90,.6,'sawtooth',.1,0,60);noise(.6,.12,0,400);},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12));},
 gate:()=>{tone(196,.25,'square',.06);tone(294,.35,'square',.06,.2);}}[k]||(()=>{}))();}
$('mute').onclick=()=>{muted=!muted;unlockAudio();if(master)master.gain.value=muted?0:.8;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');};
/* ---------- Deste ---------- */
function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}
function remember(ids){try{localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent()].slice(0,30)));}catch(e){}}
function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});
  const cnt=[0,0,0,0];al.forEach(a=>a.ranks.forEach(r=>cnt[r]++));const d=Math.abs(cnt[1]-4)+Math.abs(cnt[2]-4)+Math.abs(cnt[3]-4);if(d<bd){bd=d;best=al;}if(d===0)break;}
 return best;}
function buildDeck(){const rec=new Set(recent()),plan=deckPlan();
 let chosen=null,cs=-1;for(let t=0;t<80;t++){const c=[];let fr=0;plan.forEach(a=>a.ranks.forEach(r=>{const pool=BANK.filter(q=>q.group===a.u&&q.rank===r&&!c.includes(q));const fresh=pool.filter(q=>!rec.has(q.questionId));const q=shuffle(t<40&&fresh.length?fresh:pool)[0];if(!rec.has(q.questionId))fr++;c.push(q);}));
  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
 let best=null,bs=1e9;
 for(let t=0;t<400;t++){const seq=[1,2,3].flatMap(r=>shuffle(chosen.filter(q=>q.rank===r)));let s=0;for(let i=1;i<seq.length;i++){if(seq[i].subjectId===seq[i-1].subjectId)s+=3;if(seq[i].type===seq[i-1].type)s+=1;}if(s<bs){bs=s;best=seq;}if(s===0)break;}
 return best;}
/* ---------- Sahne ---------- */
function setupScene(){const rig=$('rig');rig.querySelectorAll('.mx').forEach(e=>e.remove());$('boss').src=BOSS.img.idle;$('boss').className='';MECH.setup(rig);meter();}
function meter(){$('mArms').textContent=defeated?'🏆 '+BOSS.defeatShort:MECH.label(okCount);
 const left=Math.max(0,(TOTAL-WIN)-badCount);$('mLife').textContent=defeated?'⭐ Bonus':badCount>TOTAL-WIN?'💫 Yıldız için devam':`🛡️ Hata hakkı ${left}`;}
function banner(t){const b=$('banner');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
function hitBoss(){okCount++;if(!defeated)MECH.hit(okCount);
 const b=$('boss');b.classList.remove('hit','laugh');void b.offsetWidth;b.classList.add('hit');
 if(okCount===WIN&&!defeated){defeated=true;setTimeout(()=>{b.src=BOSS.img.def;b.classList.remove('hit');MECH.defeat&&MECH.defeat();sfx('win');banner(BOSS.defeatBanner);confetti(reduced()?0:50);meter();},reduced()?0:600);}

 return {el:wrap,get:()=>sel,mark:(right)=>btns.forEach((b,i)=>{const t=list[i];const mk=b.querySelector('.mk');if(t===right){b.classList.add('right');if(mk)mk.textContent='✓';}else if(t===sel){b.classList.add('wrong');if(mk)mk.textContent='✗';}}),btns};}
R.choice=q=>{const list=shuffle(q.data.options),o=opts(q,list);return {el:o.el,check:()=>({ok:o.get()===q.data.options[0],student:plain(o.get()||'')}),reveal:()=>o.mark(q.data.options[0]),auto:ok=>{const t=ok?q.data.options[0]:list.find(x=>x!==q.data.options[0]);o.btns[list.indexOf(t)].click();}};};
R.tf=q=>{const list=['✓ Doğru','✗ Yanlış'],right=q.data.truth?list[0]:list[1],o=opts(q,list,true);return {el:o.el,check:()=>({ok:o.get()===right,student:o.get()?o.get().slice(2):''}),reveal:()=>o.mark(right),auto:ok=>o.btns[list.indexOf(ok?right:list.find(x=>x!==right))].click()};};
R.order=q=>{const items=q.data.items;let mix;do{mix=shuffle(items);}while(mix.join()===items.join());const placed=[];const el=document.createElement('div');
 el.innerHTML='<div class="slots"></div><div class="chips"></div>';const sl=el.firstChild,tray=el.lastChild;
 const draw=()=>{sl.innerHTML='';items.forEach((_,i)=>{const b=document.createElement('button');b.className='oslot'+(placed[i]?' full':'');b.innerHTML=`<b>${i+1}</b><span>${placed[i]?rich(placed[i]):'…'}</span>`;b.onclick=()=>{if(checked||!placed[i])return;sfx('tap');placed.splice(i,1);draw();};sl.appendChild(b);});
  tray.innerHTML='';mix.forEach(t=>{const c=document.createElement('button');c.className='chip'+(placed.includes(t)?' used':'');c.innerHTML=rich(t);c.disabled=placed.includes(t);c.onclick=()=>{if(checked)return;sfx('pick');placed.push(t);draw();};tray.appendChild(c);});
  $('go').disabled=placed.length!==items.length;};draw();
 return {el,check:()=>({ok:placed.join('|')===items.join('|'),student:plain(placed.join(' → '))}),reveal:()=>[...sl.children].forEach((b,i)=>b.classList.add(placed[i]===items[i]?'right':'wrong')),auto:ok=>{placed.length=0;(ok?items:[items[1],items[0],...items.slice(2)]).forEach(t=>placed.push(t));draw();}};};
R.match=q=>{const pairs=q.data.pairs,rights=shuffle(pairs.map(p=>p[1])),asg=pairs.map(()=>null);let act=0;const el=document.createElement('div');el.innerHTML='<div class="slots"></div><div class="chips"></div>';const sl=el.firstChild,tray=el.lastChild;
 const draw=()=>{sl.innerHTML='';pairs.forEach((p,i)=>{const r=document.createElement('div');r.className='mrow'+(i===act&&!checked?' act':'');const b=document.createElement('button');b.className='oslot'+(asg[i]?' full':'');b.innerHTML=asg[i]?rich(asg[i]):'Buraya…';b.onclick=()=>{if(checked)return;sfx('tap');if(asg[i])asg[i]=null;act=i;draw();};r.innerHTML=`<div class="l">${rich(p[0])}</div>`;r.appendChild(b);r.firstChild.onclick=()=>{if(checked)return;act=i;draw();};sl.appendChild(r);});
  tray.innerHTML='';rights.forEach(t=>{const used=asg.includes(t),c=document.createElement('button');c.className='chip'+(used?' used':'');c.innerHTML=rich(t);c.disabled=used;c.onclick=()=>{if(checked)return;sfx('pick');let i=asg[act]===null?act:asg.indexOf(null);if(i<0)return;asg[i]=t;const n=asg.indexOf(null);act=n<0?i:n;draw();};tray.appendChild(c);});
  $('go').disabled=asg.includes(null);};draw();
 return {el,check:()=>({ok:pairs.every((p,i)=>asg[i]===p[1]),student:plain(pairs.map((p,i)=>`${p[0]} = ${asg[i]||'—'}`).join('; '))}),reveal:()=>{draw();[...sl.querySelectorAll('.oslot')].forEach((b,i)=>{b.classList.add(asg[i]===pairs[i][1]?'right':'wrong');if(asg[i]!==pairs[i][1])b.innerHTML=`${asg[i]?rich(asg[i]):'—'} → ✓ ${rich(pairs[i][1])}`;});},auto:ok=>{pairs.forEach((p,i)=>asg[i]=p[1]);if(!ok)[asg[0],asg[1]]=[asg[1],asg[0]];draw();}};};
R.sort2=q=>{const d=q.data,items=shuffle(d.items),where=new Map(items.map(it=>[it[0],-1]));let sel=null;const el=document.createElement('div');el.innerHTML='<div class="chips"></div><div class="bins"></div>';const tray=el.firstChild,bins=el.lastChild;
 const draw=()=>{tray.innerHTML='';bins.innerHTML='';const mk=(it)=>{const c=document.createElement('button');c.className='chip'+(sel===it[0]?' sel':'');c.innerHTML=rich(it[0]);c.dataset.t=it[0];c.onclick=e=>{e.stopPropagation();if(checked)return;sfx('tap');const w=where.get(it[0]);if(w>=0){if(sel!==null){where.set(sel,w);sel=null;}else where.set(it[0],-1);}else sel=sel===it[0]?null:it[0];draw();};return c;};
  items.filter(it=>where.get(it[0])<0).forEach(it=>tray.appendChild(mk(it)));if(!tray.children.length)tray.innerHTML='<span style="align-self:center;font-weight:700;color:#7a6c8f">Hepsi yerleşti ✓</span>';
  d.bins.forEach((name,bi)=>{const b=document.createElement('button');b.className='bin b'+bi;b.innerHTML=`<span>${rich(name)}</span>`;b.onclick=()=>{if(checked)return;if(sel===null){const f=items.find(it=>where.get(it[0])<0);if(!f)return;sel=f[0];}sfx('pick');where.set(sel,bi);sel=null;draw();};items.filter(it=>where.get(it[0])===bi).forEach(it=>b.appendChild(mk(it)));bins.appendChild(b);});
  $('go').disabled=[...where.values()].includes(-1);};draw();
 return {el,check:()=>({ok:items.every(it=>where.get(it[0])===it[1]),student:plain(d.bins.map((n,bi)=>`${n}: ${items.filter(it=>where.get(it[0])===bi).map(it=>it[0]).join(', ')||'—'}`).join('. '))}),
  reveal:()=>{bins.querySelectorAll('.chip').forEach(c=>{const it=items.find(x=>x[0]===c.dataset.t);c.classList.add(where.get(it[0])===it[1]?'right':'wrong');});},
  auto:ok=>{items.forEach(it=>where.set(it[0],it[1]));if(!ok)where.set(items[0][0],1-items[0][1]);draw();}};};
R.num=q=>{const d=q.data,n=d.digits,v=Array(n).fill(0);let touched=false;const el=document.createElement('div');const w=document.createElement('div');w.className='wheels';el.appendChild(w);
 const val=()=>parseInt(v.join(''),10);const fmt=x=>String(x).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
 const draw=()=>{w.innerHTML='';v.forEach((x,i)=>{const c=document.createElement('div');c.className='wheel'+((n-i)%3===0&&i>0?' gap':'');const up=document.createElement('button'),dn=document.createElement('button'),o=document.createElement('output');up.textContent='▲';dn.textContent='▼';up.setAttribute('aria-label',(i+1)+'. rakamı artır');dn.setAttribute('aria-label',(i+1)+'. rakamı azalt');o.textContent=x;
  up.onclick=()=>{if(checked)return;sfx('tap');v[i]=(v[i]+1)%10;touched=true;draw();};dn.onclick=()=>{if(checked)return;sfx('tap');v[i]=(v[i]+9)%10;touched=true;draw();};c.append(up,o,dn);w.appendChild(c);});
  if(d.unit){const u=document.createElement('span');u.className='unit';u.textContent=d.unit;w.appendChild(u);}$('go').disabled=!touched;};draw();
 return {el,check:()=>({ok:val()===d.answer,student:fmt(val())+(d.unit?(d.unit==='°'?'°':' '+d.unit):'')}),reveal:()=>{const p=document.createElement('div');p.className='numans';p.innerHTML='Doğru cevap: '+rich(q.correctAnswer);el.appendChild(p);},
  auto:ok=>{const s=String(ok?d.answer:d.answer+1).padStart(n,'0').slice(-n);s.split('').forEach((c,i)=>v[i]=+c);touched=true;draw();}};};
/* ---------- Akış ---------- */
function tick(){const now=performance.now();if(state==='playing'&&lastTick&&!document.hidden)activeMs+=Math.min(now-lastTick,1000);lastTick=now;}
setInterval(tick,250);
function showIntro(){const I=$('intro');I.classList.remove('hidden');I.classList.remove('show');$('app').setAttribute('aria-hidden','true');requestAnimationFrame(()=>requestAnimationFrame(()=>I.classList.add('show')));if(!reduced())setTimeout(()=>sfx('bubble'),300);}
function start(){if(state!=='ready')return;state='playing';deck=buildDeck();remember(deck.map(q=>q.questionId));pos=0;answers=[];okCount=0;badCount=0;defeated=false;activeMs=0;lastTick=performance.now();setupScene();
 $('intro').classList.add('hidden');$('app').removeAttribute('aria-hidden');const g=$('gate');$('gateText').textContent=BOSS.gate;g.classList.remove('on');void g.offsetWidth;if(!reduced()){g.classList.add('on');sfx('roar');}show();}
function show(){checked=false;cur=deck[pos];const q=cur;$('prog').textContent=`${pos+1}/${TOTAL}`;$('fb').classList.add('hidden');$('next').classList.add('hidden');const go=$('go');go.classList.remove('hidden');go.disabled=true;go.textContent=BOSS.attack;
 const C=$('card');C.scrollTop=0;C.innerHTML=`${q.data.passage?`<div class="passage">${rich(q.data.passage)}</div>`:''}${fig(q.data.fig)}<div class="prompt">${rich(q.prompt)}</div>`;
 cur.r=R[q.type](q);C.appendChild(cur.r.el);}
function check(){if(checked||state!=='playing')return;const r=cur.r.check();checked=true;const q=cur;
 const a=r.ok?{questionId:q.questionId,isCorrect:true,subjectId:q.subjectId}:{questionId:q.questionId,isCorrect:false,subjectId:q.subjectId,questionText:plain(q.textPlain),studentAnswer:r.student,correctAnswer:plain(q.correctAnswer),unit:q.unit,topic:q.topic,outcome:q.outcome,sourceRef:q.sourceRef,explanation:plain(q.explanation)};
 answers.push(a);cur.r.reveal();$('go').classList.add('hidden');
 const fb=$('fb');fb.className=r.ok?'ok':'bad';
 if(r.ok){sfx('ok');hitBoss();fly(defeated&&okCount>WIN?'+ Bonus':'+1 💥',$('next'));fb.innerHTML=`<h3>✓ ${esc(pickMsg(BOSS.okMsgs))}</h3>${okCount>WIN?esc(BOSS.bonusMsg||'Bonus puan!'):''}`;}
 else{sfx('bad');missBoss();fb.innerHTML=`<h3>✗ ${esc(pickMsg(BOSS.badMsgs))}</h3><div><b>Doğru cevap:</b> ${rich(q.correctAnswer)}</div><div style="margin-top:4px">${rich(q.explanation)}</div>`;}
 $('live').textContent=r.ok?'Doğru':'Yanlış. Doğru cevap: '+plain(q.correctAnswer);
 $('next').classList.remove('hidden');$('next').textContent=pos===TOTAL-1?'Sonucu Gör 🏁':'Devam ▶';$('next').focus({preventScroll:true});}
function pickMsg(a){return a[Math.floor(rnd()*a.length)];}
$('go').onclick=()=>{unlockAudio();check();};
$('next').onclick=()=>{if(state!=='playing'||!checked)return;sfx('tap');pos++;if(pos>=TOTAL)finish();else show();};
function finish(){state='ending';tick();const n=answers.filter(a=>a.isCorrect).length,R2=reduced();
 if(n<WIN){const b=$('boss');b.classList.remove('hit','laugh');b.classList.add('gone');sfx('splat');}
 setTimeout(()=>complete(),R2?0:(n<WIN?1500:900));}
function complete(){if(sent||result||answers.length!==TOTAL)return;state='completed';const n=answers.filter(a=>a.isCorrect).length,st=stars(n),win=n>=WIN;
 result={bridgeVersion:'1.0',type:'game.completed',messageId:uid('result'),runId:ctx.runId,nonce:ctx.nonce,payload:{gameId:ctx.gameId,gameVersion:ctx.gameVersion,grade:ctx.grade,gameName:GAME_NAME,subjectId:ctx.subjectId||'mixed',subjectName:ctx.subjectName||'Karışık',stars:st,correctCount:n,wrongCount:TOTAL-n,totalQuestions:TOTAL,durationMs:Math.max(0,Math.round(activeMs)),answers:structuredClone(answers)}};
 const title=win?(n===TOTAL?BOSS.endPerfect:BOSS.endWin):n>=8?BOSS.endClose:BOSS.endLose;
 const body=`<div class="ct">${esc(BOSS.arena.toLocaleUpperCase('tr-TR'))}</div><img class="endimg" src="${win?BOSS.img.def:BOSS.img.idle}" alt="" style="${win?'':'opacity:.85;filter:saturate(.7)'}"><h2 id="sheetTitle">${esc(title)}</h2><div class="stars3" aria-label="${st} yıldız">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}" style="animation-delay:${.2+i*.2}s">★</span>`).join('')}</div><div class="pearls" aria-hidden="true">${answers.map(a=>`<i class="${a.isCorrect?'':'x'}"></i>`).join('')}</div><div class="stats"><div><b>${n}/${TOTAL}</b><span>doğru</span></div><div><b>${Math.round(activeMs/1000)} sn</b><span>süre</span></div></div><p class="fine">${win?esc(BOSS.winNote):`Canavarı yenmek için ${WIN} doğru gerekiyor.`}</p>`;
 if(nativeMode){openSheet(body+`<p id="saveStatus" class="status" role="status">Sonucun uygulamaya iletiliyor…</p>`);if(!sent)sent=send(result);if(!sent)$('saveStatus').textContent='Sonuç uygulamaya iletilemedi. Uygulamadan oyunu yeniden açmayı dene.';}
 else{sent=true;openSheet(body+`<p id="saveStatus" class="fine">Deneme modu: Sonuç uygulamaya kaydedilmedi.</p><button class="primary" id="retry">YENİDEN SAVAŞ ⚔️</button>`);$('retry').onclick=()=>{unlockAudio();closeSheet();if(demoInit())start();};}
 if(win){sfx('win');confetti(reduced()?0:60);}}
function openSheet(h){$('sheetBox').innerHTML=h;$('sheet').classList.add('open');}
function closeSheet(){$('sheet').classList.remove('open');}
/* ---------- Başlat ---------- */
document.documentElement.style.setProperty('--c1',BOSS.c1);
$('bossName').textContent=BOSS.name;$('introTitle').textContent=BOSS.name.toLocaleUpperCase('tr-TR');$('start').textContent=BOSS.startLabel;
$('introBoss').src=BOSS.img.idle;$('intro').style.backgroundImage=`url(${BOSS.img.bg})`;$('scene').style.backgroundImage=`url(${BOSS.img.bg})`;

if(motion.matches)document.documentElement.classList.add('rm');

showIntro();handshake();
if(window.__TEST__)window.__T={get state(){return state;},BANK,get answers(){return answers;},get deck(){return deck;},get okCount(){return okCount;},
 load(id){const q=BANK.find(x=>x.questionId===id);if(state!=='playing'){if(state==='waiting')demoInit();start();}deck[pos]=q;show();return !!q;},
 auto(ok){cur.r.auto(ok);},check,
 deckTest(n){const out=[];for(let i=0;i<n;i++){const d=buildDeck();const allU=(BOSS.split?BOSS.split.flatMap(g=>g.units):BOSS.units);const sub={};d.forEach(q=>sub[q.subjectId]=(sub[q.subjectId]||0)+1);out.push({ranks:d.map(q=>q.rank).join(''),units:new Set(d.map(q=>q.group)).size,allUnits:allU.length,subj:sub,perUnit:Math.min(...allU.map(u=>d.filter(q=>q.group===u).length)),adjSubj:d.filter((q,i)=>i&&q.subjectId===d[i-1].subjectId).length,types:new Set(d.map(q=>q.type)).size});}return out;}};
