<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Usta Düellosu</title>
<style>
:root{--me:#18b6c9;--me2:#0c7d9c;--op:#ff8a3d;--op2:#e2457a;--ink:#1d2340;--card:#fffdf7;--ok:#22a85a;--bad:#e2445c;--gold:#ffcf3f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#0d1630}
button{font:inherit;color:inherit;cursor:pointer}
#bg{position:fixed;inset:0;background-size:cover;background-position:center bottom;z-index:0}
#bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,40,.28),rgba(10,18,40,0) 30%,rgba(10,18,40,.18))}
.screen{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
.hidden{display:none!important}
#mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:10px;z-index:30;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
#demo{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:10px;z-index:30;background:rgba(255,255,255,.88);border-radius:12px;padding:4px 9px;font-size:12px;font-weight:700}
/* oyuncular */
.av{position:relative;width:62px;height:62px;flex:none}
.av img.pic{position:absolute;left:15%;top:15%;width:70%;height:70%;border-radius:50%;object-fit:cover;background:#fff}
.av img.frm{position:absolute;inset:0;width:100%;height:100%}
.av .badge{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:14px;font-weight:900;color:#fff;transform:scale(0);transition:transform .25s}
.av .badge.on{transform:scale(1)}.av .badge.ok{background:var(--ok)}.av .badge.bad{background:var(--bad)}.av .badge.wait{background:#5b6b8a}
.nm{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6);max-width:96px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
/* üst bar */
#top{display:flex;align-items:center;gap:6px;margin-top:22px}
#top .pl{display:flex;flex-direction:column;align-items:center;gap:2px;width:86px}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
#ref{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 3px 4px rgba(0,0,0,.35))}
#ref.cheer{animation:cheer .5s ease}
@keyframes cheer{40%{transform:translateY(-8px) scale(1.08)}}
#score{display:flex;gap:8px;align-items:center;font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6)}
#score .me{color:#bff6ff}#score .op{color:#ffe0c8}
#barWrap{position:relative;margin:8px 4px 0;height:22px}
#bar{position:absolute;inset:0;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);background:var(--op)}
#barMe{position:absolute;left:0;top:0;bottom:0;width:50%;background:linear-gradient(90deg,var(--me2),var(--me));transition:width .7s cubic-bezier(.3,1.4,.5,1)}
#barOp{position:absolute;inset:0;background:linear-gradient(90deg,var(--op),var(--op2))}
#barMe{z-index:1}
#spark{position:absolute;top:50%;left:50%;width:46px;height:46px;transform:translate(-50%,-50%);z-index:2;transition:left .7s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
#spark img{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
#spark.pulse img{animation:sp .5s ease}
@keyframes sp{50%{transform:scale(1.35)}}
/* tur */
#roundRow{display:flex;align-items:center;justify-content:space-between;margin:12px 4px 8px;gap:8px}
#rinfo{background:rgba(255,255,255,.9);border-radius:14px;padding:5px 10px;font-size:13px;font-weight:800;display:flex;gap:6px;align-items:center}
#timer{position:relative;width:54px;height:54px;flex:none}
#timer svg{width:100%;height:100%;transform:rotate(-90deg)}
#timer circle{fill:none;stroke-width:6}
#timer .tb{stroke:rgba(255,255,255,.55)}#timer .tf{stroke:#3ee08a;stroke-linecap:round;transition:stroke .3s}
#timer.warn .tf{stroke:#ffb020}#timer.crit .tf{stroke:#ff4b5c}
#timer b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:900;background:rgba(255,255,255,.92);border-radius:50%;margin:7px}
#timer.crit b{animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.12)}}
#oppNote{font-size:12px;font-weight:800;color:#fff;background:rgba(226,69,122,.88);border-radius:12px;padding:4px 9px;opacity:0;transition:opacity .25s;white-space:nowrap}
#oppNote.on{opacity:1}
/* kart */
#card{flex:0 1 auto;min-height:0;overflow:auto;background:var(--card);border-radius:20px;padding:14px 14px 12px;box-shadow:0 8px 24px rgba(0,0,0,.28);display:flex;flex-direction:column;gap:10px}
#card>*{flex-shrink:0}
#card.pop{animation:pop .35s ease}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}
.subj{align-self:flex-start;font-size:12px;font-weight:800;padding:3px 9px;border-radius:10px;background:#eef1ff;color:#3b4aa8}
.subj.science{background:#e4f8ee;color:#16774a}.subj.math{background:#e8f0ff;color:#2d4fb0}.subj.turkish{background:#fff0e3;color:#a6501a}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:9px 11px;font-size:15px;line-height:1.45}
.prompt{font-size:17px;font-weight:700;line-height:1.38}
.fig{display:block;margin:0 auto;width:min(100%,250px);height:auto;max-height:min(200px,24vh)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}
.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.opts{display:grid;gap:8px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;min-height:50px;padding:9px 12px;border-radius:14px;border:2.5px solid #dfe3f0;background:#fff;font-size:16px;font-weight:600;line-height:1.3}
.opt .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eef1ff;font-weight:900;font-size:14px}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.opt.sel{border-color:var(--me);background:#e6fbff}
.opt.right{border-color:var(--ok);background:#e5f8ec}.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fde8ec}.opt.wrong .k{background:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;font-weight:800;min-height:60px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.mt .col{display:grid;gap:8px;align-content:start}
.mi{min-height:48px;padding:8px 10px;border-radius:12px;border:2.5px solid #dfe3f0;background:#fff;font-size:14.5px;font-weight:700;text-align:left;line-height:1.25;position:relative}
.mi.sel{border-color:var(--me);background:#e6fbff}
.mi.done{border-style:dashed}
.mi .tag{position:absolute;top:-8px;right:-6px;min-width:22px;height:22px;border-radius:11px;color:#fff;font-size:12px;font-weight:900;display:grid;place-items:center;padding:0 5px}
.mi.right{border-color:var(--ok);background:#e5f8ec}.mi.wrong{border-color:var(--bad);background:#fde8ec}
.hint{font-size:12.5px;color:#5b6380;font-weight:600}
#fb{min-height:0;font-size:14px;font-weight:700;border-radius:12px;padding:0 10px;max-height:0;overflow:hidden;transition:max-height .3s,padding .3s}
#fb.on{max-height:200px;padding:8px 10px}
#fb.ok{background:#e5f8ec;color:#11683a}#fb.bad{background:#fde8ec;color:#a3172e}#fb.wait{background:#eef1ff;color:#334}
/* katmanlar */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;color:#fff}
.ov.dim{background:rgba(8,14,34,.78);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ov h1{margin:0;font-size:30px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.55)}
.ov p{margin:0;font-size:16px;font-weight:700;text-shadow:0 2px 5px rgba(0,0,0,.6);max-width:330px}
.btn{border:0;border-radius:18px;padding:14px 26px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(180deg,#ffb23d,#ff7a1f);box-shadow:0 5px 0 #c4580e,0 8px 16px rgba(0,0,0,.3);min-width:150px}
.btn.alt{background:linear-gradient(180deg,#7d8bb8,#55618e);box-shadow:0 5px 0 #39436a,0 8px 16px rgba(0,0,0,.3)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #c4580e}
.vs{display:flex;align-items:center;gap:6px;justify-content:center}
.vs .av{width:96px;height:96px}
.vs .em{width:84px;height:84px}
.vs .em img{width:100%;height:100%}
.vs .q{position:absolute;left:15%;top:15%;width:70%;height:70%;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:34px;font-weight:900;color:#e2457a;animation:beat 1s infinite}
#lbRef{width:min(44vw,180px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));animation:float 2.6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
#count{font-size:120px;font-weight:900;color:#fff;text-shadow:0 6px 16px rgba(0,0,0,.6)}
#count.go{animation:cnt .8s ease}
@keyframes cnt{from{transform:scale(2.2);opacity:0}30%{opacity:1}to{transform:scale(1)}}
#banner{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.6);z-index:25;opacity:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:6px;background:rgba(20,26,60,.88);border:3px solid #ffd54a;border-radius:22px;padding:14px 22px;color:#fff;font-weight:900;font-size:22px;text-align:center;width:min(86vw,340px)}
#banner img{width:84px;height:84px}
#banner small{font-size:14px;font-weight:700}
#banner.on{animation:ban 2.2s ease forwards}
@keyframes ban{12%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}to{opacity:0;transform:translate(-50%,-50%) scale(1)}}
#end .ref{width:min(52vw,220px);height:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#end .rozet{width:110px;height:110px;margin-top:-30px}
#end .big{font-size:44px;font-weight:900;text-shadow:0 3px 8px rgba(0,0,0,.6)}
#end .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#endBox{display:flex;flex-direction:column;align-items:center;gap:10px;animation:pop .5s ease;max-width:360px}
#end h1{font-size:27px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:26;overflow:hidden}
#conf i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#err{background:rgba(8,14,34,.82)}
@media (max-height:620px){#top{margin-top:30px}#top .av{width:44px;height:44px}#top .nm{display:none}#ref{width:42px;height:42px}#score{font-size:18px}#barWrap{margin-top:4px;height:18px}#spark{width:36px;height:36px}#roundRow{margin:6px 4px 6px}#timer{width:44px;height:44px}#timer b{font-size:16px;margin:6px}#card{padding:10px 11px;gap:7px}.passage{font-size:13.5px;padding:7px 9px;line-height:1.38}.prompt{font-size:15px}.opt{min-height:44px;font-size:14.5px;padding:6px 10px}.opt .k{width:24px;height:24px;font-size:12px}.tf .opt{min-height:50px}.mi{min-height:44px;font-size:13.5px}#count{font-size:90px}.fig{max-height:120px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="bg"></div>
<button id="mute" aria-label="Sesi kapat">🔊</button>
<div id="demo" class="hidden">Deneme modu · kayıt yok</div>

<!-- Oyun ekranı -->
<div id="game" class="screen hidden" aria-live="polite">
 <div id="top">
  <div class="pl"><div class="av" id="avMe"><img class="pic" alt=""><img class="frm" alt=""><span class="badge"></span></div><div class="nm" id="nmMe"></div></div>
  <div id="mid"><img id="ref" alt="Hakem"><div id="score"><span class="me" id="scMe">0</span><span>–</span><span class="op" id="scOp">0</span></div></div>
  <div class="pl"><div class="av" id="avOp"><img class="pic" alt=""><img class="frm" alt=""><span class="badge"></span></div><div class="nm" id="nmOp"></div></div>
 </div>
 <div id="barWrap" role="img" aria-label="Güç barı"><div id="bar"><div id="barOp"></div><div id="barMe"></div></div><div id="spark"><img alt=""></div></div>
 <div id="roundRow"><div id="rinfo"><span id="rno">Tur 1/12</span></div><div id="oppNote">Rakip cevapladı</div><div id="timer" aria-label="Kalan süre"><svg viewBox="0 0 54 54"><circle class="tb" cx="27" cy="27" r="23"/><circle class="tf" cx="27" cy="27" r="23" stroke-dasharray="144.5" stroke-dashoffset="0"/></svg><b id="tsec">30</b></div></div>
 <div id="card"></div>
</div>

<!-- Bekleme / başlangıç -->
<div id="lobby" class="ov hidden">
 <img id="lbRef" alt="Hakem"><div class="vs"><div class="av" id="lbMe"><img class="pic" alt=""><img class="frm" alt=""></div><div class="em"><img id="lbEm" alt=""></div><div class="av" id="lbOp"><img class="pic" alt=""><img class="frm" alt=""><div class="q" id="lbQ">?</div></div></div>
 <h1 id="lbTitle">Rakip bekleniyor…</h1>
 <p id="lbText"></p>
 <div id="count" class="hidden">3</div>
 <button class="btn alt" id="lbCancel">Vazgeç</button>
</div>

<div id="end" class="ov dim hidden"><div id="endBox"></div></div>
<div id="err" class="ov hidden"><h1>⚠️</h1><p id="errText"></p></div>
<div id="banner"><img id="banImg" alt=""><span id="banText"></span><small id="banSub"></small></div>
<div id="conf"></div>

sleniyor. Bazı şehirlerde ise sokak kedileri için mahalle sakinleri küçük kulübeler yapıyor.","u":13,"oc":55,"sr":110},{"id":"dus-t-053","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metin hangi türde yazılmıştır?","x":"Metin bir konu hakkında bilgi verir.","tp":"Açıklayıcı metin","o":["Bilgilendirici metin","Şiir","Olağanüstü masal","Hayvan fablı"],"p":"Kediler çok eski çağlardan beri insanlarla birlikte yaşıyor. Eski Mısır’da tahıl ambarlarını farelerden koruyan kediler çok değerliydi. Bugün de dünyanın birçok yerinde kediler evcil hayvan olarak besleniyor. Bazı şehirlerde ise sokak kedileri için mahalle sakinleri küçük kulübeler yapıyor.","u":13,"oc":52,"sr":111},{"id":"dus-t-054","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metinden Emre ile ilgili hangisi çıkarılabilir?","x":"Her gece ışığı açık uyuması karanlıktan korktuğunu gösterir.","tp":"Çıkarım","o":["Karanlıktan korkmaktadır.","Uyumayı sevmez.","Ablasını kıskanır.","Resim yapmayı sevmez."],"p":"Elif’in kardeşi Emre her gece ışığı açık uyuyordu. Bir gün Elif, kardeşine küçük bir gece lambası yaptı. Lambanın üstüne yıldızlar çizip “Bunlar seni koruyacak.” dedi. O geceden sonra Emre, ışığı kapatıp yalnızca yıldızlı lambasıyla uyumaya başladı.","u":15,"oc":56,"sr":112},{"id":"dus-t-055","s":"turkish","d":"m","t":"c","q":"Yukarıdaki metinde Elif’in davranışı en iyi hangi kelimeyle anlatılır?","x":"Elif kardeşinin korkusunu anlayıp ona yardım etmiştir.","tp":"Çıkarım","o":["Şefkatli","Kıskanç","Sabırsız","Bencil"],"p":"Elif’in kardeşi Emre her gece ışığı açık uyuyordu. Bir gün Elif, kardeşine küçük bir gece lambası yaptı. Lambanın üstüne yıldızlar çizip “Bunlar seni koruyacak.” dedi. O geceden sonra Emre, ışığı kapatıp yalnızca yıldızlı lambasıyla uyumaya başladı.","u":15,"oc":56,"sr":112},{"id":"dus-t-056","s":"turkish","d":"m","t":"tf","q":"Yukarıdaki metinde Emre, lambayı aldıktan sonra da ışığı açık uyumaya devam etmiştir.","x":"Metne göre Emre o geceden sonra ışığı kapatmıştır.","tp":"Olay örgüsü","v":fa "Rengi"]],"u":15,"oc":51,"sr":98},{"id":"dus-t-198","s":"turkish","d":"m","t":"mt","q":"Türemiş kelimeleri anlamlarıyla eşleştir.","x":"Yapım ekleri yeni anlamlı kelimeler türetir.","tp":"Kelime türetme","pr":[["Yolcu","Yolculuk yapan kişi"],["Tuzluk","Tuz konan kap"],["Bilgisayarcı","Bilgisayar onaran ya da satan kişi"]],"u":13,"oc":47,"sr":138},{"id":"dus-t-199","s":"turkish","d":"m","t":"mt","q":"“ki”leri türleriyle eşleştir.","x":"Bağlaç olan ki ayrı, ek olan -ki bitişik yazılır.","tp":"ki","pr":[["Duydum ki gelmişsin.","Bağlaç, ayrı yazılır."],["Masadaki kalem","Ek, bitişik yazılır."],["Seninki daha güzel.","Zamir eki, bitişik yazılır."]],"u":13,"oc":49,"sr":109},{"id":"dus-t-200","s":"turkish","d":"h","t":"tf","q":"Maniler genellikle dört dizeden oluşur.","x":"Mani, dört dizelik halk şiiridir.","tp":"Halk edebiyatı","v":true,"u":13,"oc":52,"sr":130}];
const TABLES={"u":["1. Ünite: Güneş Sistemi ve Tutulmalar","3. Ünite: Canlılarda Sistemler","4. Ünite: Işığın Yansıması ve Renkler","5. Ünite: Maddenin Ayırt Edici Özellikleri","6. Ünite: Elektriğin İletimi ve Direnç","7. Ünite: Sürdürülebilir Yaşam ve Etkileşim","1. Tema: Sayılar ve Nicelikler (1)","6. Tema: İşlemlerle Cebirsel Düşünme ve Değişimler","5. Tema: Geometrik Şekiller","7. Tema: Geometrik Nicelikler","4. Tema: İstatistiksel Araştırma Süreci","2. Tema: Veriden Olasılığa","3. Tema: Sayılar ve Nicelikler (2)","1. Tema: Dilimizin Zenginliği","2. Tema: Bağımsızlık Yolu","3. Tema: Farklı Dünyalar","6. Tema: Lider Ruhlar","4. Tema: İletişim ve Sosyal İlişkiler","5. Tema: Bilim ve Teknoloji"],"o":["Güneş sistemi ile ilgili bilimsel model oluşturur.","Güneş sistemindeki gezegenleri niteliklerine göre sınıflandırır.","Güneş ve Ay tutulması ile ilgili bilimsel çıkarım yapar.","Güneş ve Ay tutulması ile ilgili bilimsel model oluşturur.","Canlılarda eşeyli ve eşeysiz üremeyi karşılaştırır.","Denetleyici ve düzenleyici sistemlerin (sinir sistemi, iç salgı bezleri) görevlerini açıklar.","Tohumun çimlenmesine etki eden faktörlere ilişkin deney yapar.","Bitki ve hayvanlarda üreme, büyüme ve gelişme süreçlerini açıklar.","Ergenlik dönemindeki değişimleri ve bu dönemde sağlığı korumak için yapılması gerekenleri açıklar.","Işığın farklı yüzeylerdeki yansıma olaylarına ilişkin bilimsel çıkarım yapar.","Günlük hayattaki ayna çeşitlerine ilişkin bilimsel çıkarım yapar.","Cisimlerin siyah, beyaz ve renkli görünmesini bilimsel olarak gözlemler; beyaz ışığın tüm ışık renklerinin bileşiminden oluştuğuna ilişkin bilimsel çıkarım yapar.","Işığın yansımasında gelen ışın, yansıyan ışın ve yüzeyin normali arasındaki ilişkiyi kanıt kullanarak açıklar.","Işığın madde ile etkileşimi sonucunda soğurulabileceğini bilimsel olarak gözlemler; güneş enerjisinin günlük hayat ve teknolojideki uygulamalarına ilişkin eleştirel düşünür.","Isı etkisiyle maddelerin genleşip büzülmesine yönelik bilimsel gözleme dayalı tahminler yapar.","Yoğunluğa ilişkin hesaplamalar yaparak bilimsel veriye dayalı tahmin eder.","Maddelerin erime, donma ve kaynama noktası ile ilgili deneyler yapar.","Deneyler sonucunda çeşitli maddelerin yoğunluklarına ilişkin tümdengelimsel akıl yürütür; suyun katı ve sıvı hâllerinin yoğunluklarını karşılaştırarak canlılar için önemi hakkında bilimsel çıkarım yapar.","Maddelerin elektriği iletme durumlarını gösteren deney yapar.","Elektrik devresindeki ampulün parlaklığının bağlı olduğu değişkenlerin neler olduğunu belirlemeye yönelik deney yapar.","Ayarlanabilir direncin ampulün parlaklığına etkilerine yönelik bilimsel çıkarım yapar.","Biyoçeşitliliğin doğal yaşam için önemini sorgular.","Yakın çevresindeki veya ülkemizdeki bir çevre problemini çözer.","Isınma amaçlı yakıt kullanımının insan ve çevre üzerine etkilerini tartışır.","Biyoçeşitliliği tehdit eden faktörleri araştırma verilerine dayalı tahmin eder.","Bir doğal sayının asal olma durumunu ve asal çarpanlarını çözümleyebilme.","Bölünebilme kriterlerine (2, 3, 4, 5, 6, 9, 10) ilişkin çıkarımda bulunabilme.","Cebirsel ifadelerin anlamına (değişken, katsayı, sabit terim) yönelik çıkarımda bulunabilme ve değişkenin değerine göre ifadenin değerini hesaplayabilme.","Yamuk, paralelkenar, eşkenar dörtgen, dikdörtgen ve karenin kenar, açı ve köşegen özelliklerini ifade edebilme; üçgen ve dörtgenlerle ilgili problemleri çözebilme.","Üçgenin iç ve dış açılarının özelliklerine dair çıkarım yapabilme.","Çemberin uzunluğu ile çapı arasındaki ilişkiyi (pi sayısı) kullanarak çemberin uzunluğunu ve yarıçapını hesaplayabilme.","Kategorik veya nicel (kesikli) veriye dayalı, karşılaştırma gerektiren araştırma soruları oluşturabilme.","Deney, çıktı ve olay kavramlarını örnekler üzerinden ayırt edebilme.","Kesir, ondalık gösterim ve yüzde ile ilgili dört işlem gerektiren problemleri çözebilme.","Günlük hayat problemleri ya da matematiksel durumlar üzerinden ortak kat ve ortak böleni yorumlayabilme.","Kesir ve bölme işlemi arasındaki ilişkiye yönelik tümevarımsal akıl yürütebilme (sonlu ve devirli ondalık gösterimler).","Alan ölçme birimlerini tanıyabilme, birbirine dönüştürebilme ve alan problemlerinde kullanabilme.","Aritmetik ortalama, ortanca, tepe değer ve açıklığı bulabilme.","İstatistiksel araştırma sürecini planlayabilme; ölçütlere uygun ve yanlı olmayan araştırma/anket soruları ile uygun veri kaynaklarını belirleyebilme.","Bir olayın göreli sıklığını ve deneysel olasılığını kesir ve yüzde ile ifade edebilme.","Problem durumlarında bir doğal sayının çarpan ve kat ilişkisine yönelik muhakeme yapabilme.","Günlük hayat ya da matematiksel durumlarda uzunluk ölçme birimlerini inceleyerek değerlendirebilme.","Gerçek yaşam durumlarındaki bilinmeyen nicelikleri değişkenle temsil ederek sözel ifadelere uygun cebirsel ifadeler yazabilme.","Düzlemde iki paralel doğru ve bir kesenle oluşan açıları (yöndeş, iç ters, dış ters, bütünler) sınıflandırabilme ve ölçülerini bulabilme.","Bir kenara ait yüksekliği belirleyerek paralelkenar ve üçgenin alanını hesaplayabilme; alan problemlerini çözebilme.","Merkez açının ölçüsü ile gördüğü yayın uzunluğu arasındaki ilişkiyi kullanarak problem çözebilme.","Sayı ve şekil örüntülerinin kuralını cebirsel ifadeyle yazabilme ve istenen adımdaki terimi bulabilme.","Söz varlığı unsurlarının (kelime, deyim, atasözü, kalıp söz) anlamını belirleyip bağlama uygun kullanabilme.","Dil yapılarını (kök, yapım ve çekim ekleri, karşılaştırma ifadeleri) tanıyabilme.","Yazım kurallarını ve noktalama işaretlerini doğru kullanabilme.","Söz sanatlarını belirleyip anlama katkısını açıklayabilme.","Ses olaylarını tanıyıp kelimeleri ses olaylarına uygun yazabilme.","Metin türlerinin ve metin yapılarının özelliklerini belirleyebilme.","Metinlerde tanıtılan kişilerin başarılarını ve topluma katkılarını belirler.","İletişimle ilgili kavramları tanır ve açıklar.","Metnin yüzey anlamını belirleyebilme.","Metnin derin anlamına yönelik çıkarım yapabilme.","Metindeki olayları sıralar, önemli bilgileri belirler ve metinden çıkarım yapar.","Kısaltmalara ekleri doğru getirir; kısa çizgi ve eğik çizgiyi işlevine uygun kullanır; özne-yüklem uyumuna ve şart işlevli söz varlıklarına dikkat eder.","Söz sanatlarını, metin yapılarını, geçiş ve bağlantı ifadelerini, işlevli söz varlıklarını ve düşünceyi geliştirme yollarını belirler.","Okuma, dinleme ve yazma stratejilerini kullanabilme.","Kalıp ifadeleri, deyim ve atasözlerini anlamına ve iletişim durumuna uygun kullanır.","Olumsuzluk ve benzerlik işlevli söz varlıklarını belirler; noktalama işaretlerini işlevlerine uygun kullanır.","Kelimelerin ve deyimlerin anlamlarını bağlamdan ve sözlükten belirler.","Okuduğu metindeki önemli bilgileri belirler, metinden çıkarım yapar."],"s":["MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Güneş Sistemi ve Tutulmalar”, s. 20–23","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Güneş Sistemi ve Tutulmalar”, s. 21, 25","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Güneş Sistemi ve Tutulmalar”, s. 34–35","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Güneş Sistemi ve Tutulmalar”, s. 23","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Güneş Sistemi ve Tutulmalar”, s. 34","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 84–85","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 83–86","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 111","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 94–96","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 100–101","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 88–91","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Canlılarda Sistemler”, s. 91–93","MEB Fen Bilimleri 6. Sınıf Ders Kitabı (1. kitap), 3. Ünite “Ca const FAST=TEST_HOOKS&&/fast/.test(location.hash);
function LocalHost(){const H={},seed='demo-'+Date.now(),plan=[];let my=0,op=0,round=0,mine=null,botT=0,roundT=0,botAns=null;
 function roundPlan(){const subs=['turkish','science','math'],r=prng(seed+'|plan');const mk=d=>sshuffle(subs,r).map(s=>({s,d}));let seq=[...mk('easy'),...sshuffle([...subs,...subs],r).map(s=>({s,d:'medium'})),...mk('hard')];
  for(let k=0;k<50;k++){let okk=true;for(let i=1;i<seq.length;i++)if(seq[i].s===seq[i-1].s&&seq[i].d===seq[i-1].d||seq[i].s===seq[i-1].s){okk=false;const j=i+1+Math.floor(r()*(seq.length-i-1));if(j<seq.length&&seq[j].d===seq[i].d)[seq[i],seq[j]]=[seq[j],seq[i]];}if(okk)break;}return seq;}
 const seq=roundPlan(),dur=LEVEL.roundSeconds*1000;
 function to(type,payload){setTimeout(()=>receive({bridgeVersion:'1.0',type,messageId:uid('h'),runId:'demo',nonce:'demo',payload}),0);}
 function next(){round++;let r;if(round<=12)r=seq[round-1];else{if(my!==op){return end();}r={s:['turkish','science','math'][(round-13)%3],d:'medium'};}
  if(round>12&&my!==op)return end();mine=null;botAns=null;to('duel.round',{roundNo:round,isExtra:round>12,subjectId:r.s,difficulty:r.d,durationMs:dur,remainingMs:dur});
  clearTimeout(botT);botT=setTimeout(()=>{botAns=Math.random()<(FAST&&/win/.test(location.hash)?0.2:0.62);to('duel.opponentAnswered',{roundNo:round});maybeClose();},FAST?150+Math.random()*300:2500+Math.random()*(dur*0.55));clearTimeout(roundT);roundT=setTimeout(()=>close(),dur+1000);}
 function maybeClose(){if(mine!==null&&botAns!==null)close();}
 let closing=false;
 function close(){if(closing)return;closing=true;clearTimeout(roundT);clearTimeout(botT);const mOk=mine===true,oOk=botAns===true;if(mOk)my++;if(oOk)op++;to('duel.score',{roundNo:round,me:{correct:my,lastCorrect:mOk},opp:{correct:op,lastCorrect:oOk}});
  setTimeout(()=>{closing=false;if(round>=12&&my!==op&&(round===12||mOk!==oOk))end();else next();},FAST?350:reduced()?600:2600);}
 function end(){to('duel.end',{result:my>op?'win':'lose',myCorrect:my,oppCorrect:op,extraRounds:Math.max(0,round-12),reason:'normal'});}
 H.fromGame=m=>{if(m.type==='duel.ready'){to('duel.state',{state:'accepted'});setTimeout(()=>to('duel.state',{state:'starting',countdownMs:3000}),FAST?100:900);setTimeout(next,FAST?3300:900+3600);}
  else if(m.type==='duel.answer'){if(m.payload.roundNo===round){mine=m.payload.correct;if(window.__T)window.__T.answers.push(m.payload);maybeClose();}}
  else if(m.type==='duel.rematch'||m.type==='duel.exit'){if(window.__T)window.__T.events.push(m.type);}
  else if(m.type==='duel.cancel'){to('duel.state',{state:'cancelled'});}};
 H.start=()=>{ctx={runId:'demo',nonce:'demo',reducedMotion:false};setupDuel({mode:'duel',side:'A',seed,me:{displayName:'Sen'},opponent:{displayName:'Bot Yıldız'},state:'waiting',inviteExpiresInMs:120000,levelName:LEVEL.name});};
 H.seq=seq;return H;}
/* ---------- açılış ---------- */
function boot(){$('bg').style.backgroundImage=`url(${IMG.bg})`;$('ref').src=IMG.ref;$('spark').querySelector('img').src=IMG.vs;$('lbEm').src=IMG.vs;$('lbRef').src=IMG.ref;
 if(transport()){native=true;handshake();}
 else{$('demo').classList.remove('hidden');host=LocalHost();setTimeout(()=>host.start(),TEST_HOOKS?0:400);}}
if(TEST_HOOKS){window.__T={BANK,LEVEL,answers:[],events:[],get cur(){return cur;},get duel(){return duel;},pickQuestion,roundType,auto:ok=>cur&&cur.r&&!answered&&cur.r.auto(ok),receive,
 render:id=>{const q=BANK.find(x=>x.id===id);showGame();curRound={roundNo:1,total:30000};answered=false;locked=false;cur={q,start:performance.now()};deadline=performance.now()+30000;render(q);return !!q;},
 reveal:()=>cur.r.reveal(),score:()=>({myCorrect,opCorrect})};}
boot();
