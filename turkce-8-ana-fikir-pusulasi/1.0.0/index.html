 → Sayısal veri","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-017","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"gelistirme","rank":2,"type":"bin","prompt":"Cümleleri kullanılan yola göre ayır.","data":{"L":["⚖️ Karşılaştırma","🧩 Örnekleme"],"r":[["Kediler bağımsız, köpekler ise sahiplerine bağlıdır.",0],["Örneğin ayçiçeği yüzünü hep güneşe döner.",1],["Kitap, ekrandan daha az göz yorar.",0],["Sözgelimi papatya, çayı yapılan bir bitkidir.",1]]},"textPlain":"Cümleleri kullanılan yola göre ayır. Bölmeler: Karşılaştırma, Örnekleme. Kartlar: Kediler bağımsız, köpekler ise sahiplerine bağlıdır. / Örneğin ayçiçeği yüzünü hep güneşe döner. / Kitap, ekrandan daha az göz yorar. / Sözgelimi papatya, çayı yapılan bir bitkidir..","correctAnswer":"Kediler bağımsız, köpekler ise sahiplerine bağlıdır. → Karşılaştırma | Örneğin ayçiçeği yüzünü hep güneşe döner. → Örnekleme | Kitap, ekrandan daha az göz yorar. → Karşılaştırma | Sözgelimi papatya, çayı yapılan bir bitkidir. → Örnekleme","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-yardimci-019","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"yardimci","rank":1,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Dişlerimizi günde iki kez fırçalamalıyız.","Düzenli fırçalama, diş çürüklerini önler.","Diş macunu tüpleri çoğunlukla plastikten yapılır.","Altı ayda bir diş hekimine gitmek de ağız sağlığını korur."],"k":2},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Dişlerimizi günde iki kez fırçalamalıyız. (2) Düzenli fırçalama, diş çürüklerini önler. (3) Diş macunu tüpleri çoğunlukla plastikten yapılır. (4) Altı ayda bir diş hekimine gitmek de ağız sağlığını korur.","correctAnswer":"3. cümle: Diş macunu tüpleri çoğunlukla plastikten yapılır.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir."},{"questionId":"tr8u3-yardimci-020","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"yardimci","rank":3,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Yunus Emre, şiirlerinde sade bir Türkçe kullanmıştır.","Halkın anlayacağı bir dille sevgiyi, hoşgörüyü anlatmıştır.","Onun döneminde Anadolu’da pek çok beylik vardı.","Bu yüzden şiirleri yüzyıllardır dilden dile dolaşır."],"k":2},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Yunus Emre, şiirlerinde sade bir Türkçe kullanmıştır. (2) Halkın anlayacağı bir dille sevgiyi, hoşgörüyü anlatmıştır. (3) Onun döneminde Anadolu’da pek çok beylik vardı. (4) Bu yüzden şiirleri yüzyıllardır dilden dile dolaşır.","correctAnswer":"3. cümle: Onun döneminde Anadolu’da pek çok beylik vardı.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir. Dönemin siyasi durumu, şairin dili ve etkisiyle ilgili akışı bozuyor."},{"questionId":"tr8u3-cikarim-020","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Kentimizde yeni bir metro hattı açıldı.","Hat, on iki istasyondan oluşuyor.","Seferler sabah altıda başlayıp gece yarısı sona eriyor."],"a":1,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Kentimizde yeni bir metro hattı açıldı. (2) Hat, on iki istasyondan oluşuyor. (3) Seferler sabah altıda başlayıp gece yarısı sona eriyor.","correctAnswer":"Tarafsız","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır. Bu paragraf yalnızca bilgi veriyor."},{"questionId":"tr8u3-gelistirme-018","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"gelistirme","rank":1,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta tanımlamanın yapıldığı veren cümleyi göster.","data":{"S":["Kelebek, kanatları renkli pullarla kaplı, uçabilen bir böcektir.","Yaşamına tırtıl olarak başlar.","Koza döneminden sonra kanatlanır."],"a":[0]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta tanımlamanın yapıldığı veren cümleyi göster. Paragraf: (1) Kelebek, kanatları renkli pullarla kaplı, uçabilen bir böcektir. (2) Yaşamına tırtıl olarak başlar. (3) Koza döneminden sonra kanatlanır.","correctAnswer":"1. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-019","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"gelistirme","rank":1,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta karşılaştırmanın yapıldığı veren cümleyi göster.","data":{"S":["Yazın günler uzun, geceler kısadır.","Kışın ise geceler günlerden daha uzundur.","Bu durum Dünya’nın eksen eğikliğinden kaynaklanır."],"a":[0,1]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta karşılaştırmanın yapıldığı veren cümleyi göster. Paragraf: (1) Yazın günler uzun, geceler kısadır. (2) Kışın ise geceler günlerden daha uzundur. (3) Bu durum Dünya’nın eksen eğikliğinden kaynaklanır.","correctAnswer":"1. cümle / 2. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-020","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"gelistirme","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta örneklemenin kullanıldığı veren cümleyi göster.","data":{"S":["Atık kâğıtlar yeniden kullanılabilir.","Gazeteler, defterler ve kartonlar geri dönüşümle yeni kâğıda dönüşür.","Böylece daha az ağaç kesilir."],"a":[1]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta örneklemenin kullanıldığı veren cümleyi göster. Paragraf: (1) Atık kâğıtlar yeniden kullanılabilir. (2) Gazeteler, defterler ve kartonlar geri dönüşümle yeni kâğıda dönüşür. (3) Böylece daha az ağaç kesilir.","correctAnswer":"2. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."}]</script>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:'turkce-8-ana-fikir-pusulasi',gameVersion:'1.0.0',grade:8,subjectId:'turkish',subjectName:'Türkçe',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([8]),TOTAL=10,RECENT_KEY='tr8-ana-fikir-pusulasi-recent',GAME_NAME='Ana Fikir Pusulası';
const GROUP_LABEL={anafikir:'a',yardimci:'y',konu:'k',cikarim:'c',gelistirme:'g'},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,sessionRecent=[],reviewAt=0,okCount=0,points=0,cur=null,timers=[];
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function stars(n){return n>=9?3:n>=7?2:n>=5?1:0;}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='Uygulamaya bağlanıyor';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='Bu tarayıcı denemesi uygulamaya sonuç kaydetmez.';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();$('card').classList.add('hidden');$('stage').classList.add('hidden');$('dock').classList.add('hidden');$('intro').classList.remove('hidden');$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function osc(f,t0,dur,type,vol,slide){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sfx(kind){if(muted||!audio||document.hidden)return;try{
 if(kind==='tap')osc(640,0,.05,'sine',.05);
 else if(kind==='tick')osc(1150,0,.02,'square',.015);
 else if(kind==='plop')osc(520,0,.08,'sine',.07,880);
