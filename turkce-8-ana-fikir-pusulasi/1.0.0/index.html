 oyundur. → Değinilmiş | Halk oyunları okullarda zorunludur. → Değinilmemiş | Kıyafetler bölgenin yaşayışını anlatır. → Değinilmiş | Zeybek en eski halk oyunudur. → Değinilmemiş","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-yardimci-018","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"yardimci","rank":1,"type":"bin","prompt":"Yukarıdaki paragrafta değinilen ve değinilmeyen düşünceleri ayır.","data":{"L":["✅ Değinilmiş","❌ Değinilmemiş"],"r":[["Takım arkadaşına göre konum alınır.",0],["Goller çoğu zaman pasla gelir.",0],["Maç bütün takımın başarısıdır.",0],["Antrenmanlar her gün yapılır.",1]],"S":["Takım sporları, çocuklara iş birliği yapmayı öğretir.","Sahada her oyuncu, takım arkadaşının hareketine göre konum alır.","Bir golün arkasında çoğu zaman birkaç kişinin pası vardır.","Kazanılan maç, tek bir kişinin değil bütün takımın başarısıdır."]},"textPlain":"Yukarıdaki paragrafta değinilen ve değinilmeyen düşünceleri ayır. Paragraf: (1) Takım sporları, çocuklara iş birliği yapmayı öğretir. (2) Sahada her oyuncu, takım arkadaşının hareketine göre konum alır. (3) Bir golün arkasında çoğu zaman birkaç kişinin pası vardır. (4) Kazanılan maç, tek bir kişinin değil bütün takımın başarısıdır. Bölmeler: Değinilmiş, Değinilmemiş. Kartlar: Takım arkadaşına göre konum alınır. / Goller çoğu zaman pasla gelir. / Maç bütün takımın başarısıdır. / Antrenmanlar her gün yapılır..","correctAnswer":"Takım arkadaşına göre konum alınır. → Değinilmiş | Goller çoğu zaman pasla gelir. → Değinilmiş | Maç bütün takımın başarısıdır. → Değinilmiş | Antrenmanlar her gün yapılır. → Değinilmemiş","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-konu-001","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"konu","rank":1,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Arılar, doğadaki dengenin en önemli parçalarından biridir.","Çiçekten çiçeğe konarak bitkilerin tozlaşmasını sağlarlar.","Yediğimiz meyve ve sebzelerin büyük bölümü bu sayede oluşur.","Arıların azalması, sofralarımızdaki ürünlerin de azalması demektir."],"o":["Çiçek yetiştirme","Arıların doğadaki önemi","Böceklerin yaşamı","Bal üretimi"],"a":1},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Arılar, doğadaki dengenin en önemli parçalarından biridir. (2) Çiçekten çiçeğe konarak bitkilerin tozlaşmasını sağlarlar. (3) Yediğimiz meyve ve sebzelerin büyük bölümü bu sayede oluşur. (4) Arıların azalması, sofralarımızdaki ürünlerin de azalması demektir. Yönler: Çiçek yetiştirme / Arıların doğadaki önemi / Böceklerin yaşamı / Bal üretimi.","correctAnswer":"Arıların doğadaki önemi","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-002","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"konu","rank":1,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Köyün iki yakasını birleştiren taş köprü, yüz yıldır ayakta.","Kemerleri öyle ustaca örülmüş ki sel suları bile ona zarar verememiş.","Köylüler bu köprüyü bir anıt gibi korur.","Her bahar taşlarının arasını temizler, çevresine çiçek dikerler."],"o":["Sel felaketleri","Bahar temizliği","Köydeki taş köprü","Köy hayatının zorlukları"],"a":2},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Köyün iki yakasını birleştiren taş köprü, yüz yıldır ayakta. (2) Kemerleri öyle ustaca örülmüş ki sel suları bile ona zarar verememiş. (3) Köylüler bu köprüyü bir anıt gibi korur. (4) Her bahar taşlarının arasını temizler, çevresine çiçek dikerler. Yönler: Sel felaketleri / Bahar temizliği / Köydeki taş köprü / Köy hayatının zorlukları.","correctAnswer":"Köydeki taş köprü","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-003","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"konu","rank":2,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Halk oyunları, bir yörenin kültürünü yansıtan canlı bir aynadır.","Karadeniz’in hızlı horonunda dalgaların coşkusu, Ege’nin zeybeğinde efelerin vakarı görülür.","Kıyafetler, müzik ve figürler o bölgenin yaşayışını anlatır.","Bu oyunları yaşatmak, geçmişimizi geleceğe taşımaktır."],"o":["Yöresel kıyafetlerin dikimi","Karadeniz’in dalgaları","Müzik aletleri","Halk oyunlarının kültürü yansıtması"],"a":3},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Halk oyunları, bir yörenin kültürünü yansıtan canlı bir aynadır. (2) Karadeniz’in hızlı horonunda dalgaların coşkusu, Ege’nin zeybeğinde efelerin vakarı görülür. (3) Kıyafetler, müzik ve figürler o bölgenin yaşayışını anlatır. (4) Bu oyunları yaşatmak, geçmişimizi geleceğe taşımaktır. Yönler: Yöresel kıyafetlerin dikimi / Karadeniz’in dalgaları / Müzik aletleri / Halk oyunlarının kültürü yansıtması.","correctAnswer":"Halk oyunlarının kültürü yansıtması","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-004","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"konu","rank":2,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Annemin dolabında, dedemin askerdeyken yazdığı mektuplar duruyor.","Sararmış kâğıtlara dökülen satırlarda özlem, umut ve sevgi var.","Her mektubun sonunda “Sizi çok özledim.” cümlesi yazıyor.","O mektupları okurken dedemi daha yakından tanıdığımı hissediyorum."],"o":["Annenin dolabı","Dedenin mektupları","Askerlik anıları","Kâğıdın sararması"],"a":1},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Annemin dolabında, dedemin askerdeyken yazdığı mektuplar duruyor. (2) Sararmış kâğıtlara dökülen satırlarda özlem, umut ve sevgi var. (3) Her mektubun sonunda “Sizi çok özledim.” cümlesi yazıyor. (4) O mektupları okurken dedemi daha yakından tanıdığımı hissediyorum. Yönler: Annenin dolabı / Dedenin mektupları / Askerlik anıları / Kâğıdın sararması.","correctAnswer":"Dedenin mektupları","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-005","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"konu","rank":3,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Düzenli uyku, öğrenmenin en önemli destekçisidir.","Uyurken beynimiz gün içinde öğrendiklerini düzenler ve kalıcı hâle getirir.","Yapılan bir araştırmada yeterince uyuyan öğrencilerin daha başarılı olduğu görülmüş.","Bu nedenle ders çalışmak kadar dinlenmeye de zaman ayırmalıyız."],"o":["Uykunun öğrenmeye etkisi","Araştırma yöntemleri","Beynin yapısı","Gece çalışmanın yararları"],"a":0},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Düzenli uyku, öğrenmenin en önemli destekçisidir. (2) Uyurken beynimiz gün içinde öğrendiklerini düzenler ve kalıcı hâle getirir. (3) Yapılan bir araştırmada yeterince uyuyan öğrencilerin daha başarılı olduğu görülmüş. (4) Bu nedenle ders çalışmak kadar dinlenmeye de zaman ayırmalıyız. Yönler: Uykunun öğrenmeye etkisi / Araştırma yöntemleri / Beynin yapısı / Gece çalışmanın yararları.","correctAnswer":"Uykunun öğrenmeye etkisi","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-006","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"konu","rank":3,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Güneş enerjisi, tükenmeyen bir enerji kaynağıdır.","Çatılara kurulan panellerle evler kendi elektriğini üretebilir.","Bu sayede hem faturalar azalır hem de doğa daha az kirlenir.","Ülkemiz bol güneş alan bir coğrafyada olduğu için bu enerjiden daha çok yararlanmalıyız."],"o":["Ülkemizin iklim bölgeleri","Güneş enerjisinden yararlanma","Elektrik faturaları","Çatı tamiri"],"a":1},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Güneş enerjisi, tükenmeyen bir enerji kaynağıdır. (2) Çatılara kurulan panellerle evler kendi elektriğini üretebilir. (3) Bu sayede hem faturalar azalır hem de doğa daha az kirlenir. (4) Ülkemiz bol güneş alan bir coğrafyada olduğu için bu enerjiden daha çok yararlanmalıyız. Yönler: Ülkemizin iklim bölgeleri / Güneş enerjisinden yararlanma / Elektrik faturaları / Çatı tamiri.","correctAnswer":"Güneş enerjisinden yararlanma","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-007","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"konu","rank":2,"type":"dial","prompt":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir.","data":{"S":["Dedem bahçesindeki her ağacı tek tek kendi elleriyle dikmişti.","Sabahları erkenden kalkar, fidanlara su taşırdı.","Kurumaya yüz tutan bir dalı görse günlerce onunla ilgilenirdi.","Ona göre toprağa emek veren, ondan her zaman karşılığını alırdı."],"o":["Dedenin ağaç sevgisi ve emeği","Kuraklık","Sabah sporu","Fidan satışı"],"a":0},"textPlain":"Pusulayı çevir: paragrafın konusunu kuzeye (K) getir. Paragraf: (1) Dedem bahçesindeki her ağacı tek tek kendi elleriyle dikmişti. (2) Sabahları erkenden kalkar, fidanlara su taşırdı. (3) Kurumaya yüz tutan bir dalı görse günlerce onunla ilgilenirdi. (4) Ona göre toprağa emek veren, ondan her zaman karşılığını alırdı. Yönler: Dedenin ağaç sevgisi ve emeği / Kuraklık / Sabah sporu / Fidan satışı.","correctAnswer":"Dedenin ağaç sevgisi ve emeği","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-008","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"konu","rank":1,"type":"flag","prompt":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak.","data":{"S":["Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir.","Yakıt gerektirmez, havayı kirletmez.","Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır.","Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir."],"o":["Spor Salonları","Şehrin Akıllı Aracı: Bisiklet","Benzin Fiyatları","Trafik Cezaları"],"a":1},"textPlain":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak. Paragraf: (1) Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir. (2) Yakıt gerektirmez, havayı kirletmez. (3) Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır. (4) Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir. Bayraklar: Spor Salonları / Şehrin Akıllı Aracı: Bisiklet / Benzin Fiyatları / Trafik Cezaları.","correctAnswer":"Şehrin Akıllı Aracı: Bisiklet","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-009","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"konu","rank":1,"type":"flag","prompt":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak.","data":{"S":["Denizlerdeki plastik atıklar her yıl artıyor.","Kıyıya atılan bir şişe, yüzlerce yıl boyunca doğada kalabiliyor.","Balıklar ve kaplumbağalar bu atıkları yiyecek sanarak yutuyor.","Tek kullanımlık ürünleri azaltmak, denizleri korumanın ilk adımıdır."],"o":["Yaz Tatili","Balıkçılık Teknikleri","Kaplumbağaların Göçü","Mavi Sularda Plastik Tehlikesi"],"a":3},"textPlain":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak. Paragraf: (1) Denizlerdeki plastik atıklar her yıl artıyor. (2) Kıyıya atılan bir şişe, yüzlerce yıl boyunca doğada kalabiliyor. (3) Balıklar ve kaplumbağalar bu atıkları yiyecek sanarak yutuyor. (4) Tek kullanımlık ürünleri azaltmak, denizleri korumanın ilk adımıdır. Bayraklar: Yaz Tatili / Balıkçılık Teknikleri / Kaplumbağaların Göçü / Mavi Sularda Plastik Tehlikesi.","correctAnswer":"Mavi Sularda Plastik Tehlikesi","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-010","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"konu","rank":2,"type":"flag","prompt":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak.","data":{"S":["Mahallemizdeki küçük kitapçı, yalnızca kitap satılan bir yer değildi.","Sahibi Hasan Amca, her gelene okuyacağı kitabı seçmesinde yardım ederdi.","Çocuklar için masalar kurmuş, cumartesileri masal saati düzenlerdi.","Kitapçı kapandığında mahalle, bir dostunu kaybetmiş gibi oldu."],"o":["Mahallenin Dostu: Küçük Kitapçı","Kapanan Dükkânlar","Masalların Tarihi","Kitap Fiyatları"],"a":0},"textPlain":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak. Paragraf: (1) Mahallemizdeki küçük kitapçı, yalnızca kitap satılan bir yer değildi. (2) Sahibi Hasan Amca, her gelene okuyacağı kitabı seçmesinde yardım ederdi. (3) Çocuklar için masalar kurmuş, cumartesileri masal saati düzenlerdi. (4) Kitapçı kapandığında mahalle, bir dostunu kaybetmiş gibi oldu. Bayraklar: Mahallenin Dostu: Küçük Kitapçı / Kapanan Dükkânlar / Masalların Tarihi / Kitap Fiyatları.","correctAnswer":"Mahallenin Dostu: Küçük Kitapçı","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-011","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"konu","rank":2,"type":"flag","prompt":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak.","data":{"S":["Geçen hafta sınıfça şehrimizdeki arkeoloji müzesini gezdik.","Binlerce yıl önce yapılmış toprak kaplar, süs eşyaları ve sikkeler gördük.","Rehberimiz her eserin hangi dönemden kaldığını anlattı.","Müzeden çıkarken geçmişin bugünü anlamak için bir anahtar olduğunu düşündüm."],"o":["Toprak Kapların Yapımı","Rehberlik Mesleği","Okul Kuralları","Geçmişe Açılan Kapı"],"a":3},"textPlain":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak. Paragraf: (1) Geçen hafta sınıfça şehrimizdeki arkeoloji müzesini gezdik. (2) Binlerce yıl önce yapılmış toprak kaplar, süs eşyaları ve sikkeler gördük. (3) Rehberimiz her eserin hangi dönemden kaldığını anlattı. (4) Müzeden çıkarken geçmişin bugünü anlamak için bir anahtar olduğunu düşündüm. Bayraklar: Toprak Kapların Yapımı / Rehberlik Mesleği / Okul Kuralları / Geçmişe Açılan Kapı.","correctAnswer":"Geçmişe Açılan Kapı","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır. Başlık, paragrafın ana düşüncesini de yansıtabilir: müze, geçmişi anlamak için bir anahtardır."},{"questionId":"tr8u3-konu-012","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"konu","rank":3,"type":"flag","prompt":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak.","data":{"S":["Çocukluğumuzun sokak oyunları, yerini ekran oyunlarına bıraktı.","Eskiden saklambaç, yakar top, ip atlama oynayan çocuklar, akşam olunca zorla eve çağrılırdı.","Şimdi aynı sokaklar sessiz, çocuklar ise ekranların başında.","Bu değişimle birlikte çocukların birbiriyle kurduğu bağ da zayıflıyor."],"o":["Sessizleşen Sokaklar","Saklambacın Kuralları","Yeni Çıkan Oyunlar","Akşam Yemekleri"],"a":0},"textPlain":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak. Paragraf: (1) Çocukluğumuzun sokak oyunları, yerini ekran oyunlarına bıraktı. (2) Eskiden saklambaç, yakar top, ip atlama oynayan çocuklar, akşam olunca zorla eve çağrılırdı. (3) Şimdi aynı sokaklar sessiz, çocuklar ise ekranların başında. (4) Bu değişimle birlikte çocukların birbiriyle kurduğu bağ da zayıflıyor. Bayraklar: Sessizleşen Sokaklar / Saklambacın Kuralları / Yeni Çıkan Oyunlar / Akşam Yemekleri.","correctAnswer":"Sessizleşen Sokaklar","explanation":"Paragrafın konusu “ne anlatılıyor?”, ana düşüncesi ise “yazar bu konuda ne demek istiyor?” sorusunun cevabıdır. Başlık, konuyu kısa ve kapsayıcı biçimde yansıtır."},{"questionId":"tr8u3-konu-013","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın konusu, başlığı ve anahtar sözcüğü","outcome":"Metnin konusunu belirler; metne uygun başlık belirler; anahtar kavramları belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"konu","rank":3,"type":"flag","prompt":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak.","data":{"S":["Hata yapmaktan korkmamalıyız.","Bisiklet sürmeyi öğrenen bir çocuk defalarca düşer ama her düşüşte dengeyi biraz daha öğrenir.","Bilim insanları da sayısız denemeden sonra doğru sonuca ulaşır.","Hatalar, başarıya giden yolda atılmış basamaklardır."],"o":["Bilim İnsanlarının Hayatı","Düşmemenin Yolları","Hatalar Başarının Basamaklarıdır","Bisiklet Kazaları"],"a":2},"textPlain":"Zirveye bayrak dik: Yukarıdaki paragrafa en uygun başlığın bayrağını sürükleyip zirveye bırak. Paragraf: (1) Hata yapmaktan korkmamalıyız. (2) Bisiklet sürmeyi öğrenen bir çocuk defalarca düşer ama her düşüşte dengeyi biraz daha öğrenir. (3) Bilim insanları da sayısız denemeden sonra doğru sonuca ulaşır. (4) Hatalar, başarıya giden yolda atılmış basamaklardır. Bayraklar: Bilim İnsanlarının Hayatı / Düşmemenin Yolları / Hatalar Başarının Basamaklarıdır / Bisiklet Kazaları.","correctAnswer":"Hatalar Başarının  ve konuyu taşıyan sözcüktür; çoğu zaman konuyu da gösterir. “Kar” sözcüğü “karda”, “kardan”, “karın” biçimlerinde de geçiyor."},{"questionId":"tr8u3-cikarim-001","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"cikarim","rank":1,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Dedem bahçesindeki her ağacı tek tek kendi elleriyle dikmişti.","Sabahları erkenden kalkar, fidanlara su taşırdı.","Kurumaya yüz tutan bir dalı görse günlerce onunla ilgilenirdi.","Ona göre toprağa emek veren, ondan her zaman karşılığını alırdı."],"r":[["Dede emeğe değer verirdi.",0],["Dede bahçesine özenle bakardı.",0],["Dede ağaçlarını satardı.",1],["Dede erken kalkardı.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Dedem bahçesindeki her ağacı tek tek kendi elleriyle dikmişti. (2) Sabahları erkenden kalkar, fidanlara su taşırdı. (3) Kurumaya yüz tutan bir dalı görse günlerce onunla ilgilenirdi. (4) Ona göre toprağa emek veren, ondan her zaman karşılığını alırdı. Tahtalar: Dede emeğe değer verirdi. / Dede bahçesine özenle bakardı. / Dede ağaçlarını satardı. / Dede erken kalkardı..","correctAnswer":"Dede emeğe değer verirdi. → sağlam | Dede bahçesine özenle bakardı. → sağlam | Dede ağaçlarını satardı. → kırık | Dede erken kalkardı. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-cikarim-002","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"cikarim","rank":1,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Bir damla su bile boşa akmamalı.","Dişlerimizi fırçalarken musluğu kapatmak, her gün litrelerce suyu korur.","Damlayan bir musluk, bir yılda bir küveti dolduracak kadar suyu israf eder.","Suyu korumak, gelecek kuşaklara bırakacağımız en değerli mirastır."],"r":[["Su israf edilmemeli.",0],["Musluğu kapatmak su tasarrufu sağlar.",0],["Su kaynakları sınırsızdır.",1],["Damlayan musluk suyu boşa harcar.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Bir damla su bile boşa akmamalı. (2) Dişlerimizi fırçalarken musluğu kapatmak, her gün litrelerce suyu korur. (3) Damlayan bir musluk, bir yılda bir küveti dolduracak kadar suyu israf eder. (4) Suyu korumak, gelecek kuşaklara bırakacağımız en değerli mirastır. Tahtalar: Su israf edilmemeli. / Musluğu kapatmak su tasarrufu sağlar. / Su kaynakları sınırsızdır. / Damlayan musluk suyu boşa harcar..","correctAnswer":"Su israf edilmemeli. → sağlam | Musluğu kapatmak su tasarrufu sağlar. → sağlam | Su kaynakları sınırsızdır. → kırık | Damlayan musluk suyu boşa harcar. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-cikarim-003","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Köyün iki yakasını birleştiren taş köprü, yüz yıldır ayakta.","Kemerleri öyle ustaca örülmüş ki sel suları bile ona zarar verememiş.","Köylüler bu köprüyü bir anıt gibi korur.","Her bahar taşlarının arasını temizler, çevresine çiçek dikerler."],"r":[["Köprü sağlam yapılmıştır.",0],["Köylüler köprüye değer verir.",0],["Köprüden her gün araçlar geçer.",1],["Köprü çok eskidir.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Köyün iki yakasını birleştiren taş köprü, yüz yıldır ayakta. (2) Kemerleri öyle ustaca örülmüş ki sel suları bile ona zarar verememiş. (3) Köylüler bu köprüyü bir anıt gibi korur. (4) Her bahar taşlarının arasını temizler, çevresine çiçek dikerler. Tahtalar: Köprü sağlam yapılmıştır. / Köylüler köprüye değer verir. / Köprüden her gün araçlar geçer. / Köprü çok eskidir..","correctAnswer":"Köprü sağlam yapılmıştır. → sağlam | Köylüler köprüye değer verir. → sağlam | Köprüden her gün araçlar geçer. → kırık | Köprü çok eskidir. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-cikarim-004","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Annemin dolabında, dedemin askerdeyken yazdığı mektuplar duruyor.","Sararmış kâğıtlara dökülen satırlarda özlem, umut ve sevgi var.","Her mektubun sonunda “Sizi çok özledim.” cümlesi yazıyor.","O mektupları okurken dedemi daha yakından tanıdığımı hissediyorum."],"r":[["Dede askerdeyken ailesini özlemiştir.",0],["Mektuplar uzun süre saklanmıştır.",0],["Dede sık sık telefon ederdi.",1],["Anlatıcı mektuplarla dedesini daha iyi tanımıştır.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Annemin dolabında, dedemin askerdeyken yazdığı mektuplar duruyor. (2) Sararmış kâğıtlara dökülen satırlarda özlem, umut ve sevgi var. (3) Her mektubun sonunda “Sizi çok özledim.” cümlesi yazıyor. (4) O mektupları okurken dedemi daha yakından tanıdığımı hissediyorum. Tahtalar: Dede askerdeyken ailesini özlemiştir. / Mektuplar uzun süre saklanmıştır. / Dede sık sık telefon ederdi. / Anlatıcı mektuplarla dedesini daha iyi tanımıştır..","correctAnswer":"Dede askerdeyken ailesini özlemiştir. → sağlam | Mektuplar uzun süre saklanmıştır. → sağlam | Dede sık sık telefon ederdi. → kırık | Anlatıcı mektuplarla dedesini daha iyi tanımıştır. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-cikarim-005","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"cikarim","rank":3,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Çocukluğumuzun sokak oyunları, yerini ekran oyunlarına bıraktı.","Eskiden saklambaç, yakar top, ip atlama oynayan çocuklar, akşam olunca zorla eve çağrılırdı.","Şimdi aynı sokaklar sessiz, çocuklar ise ekranların başında.","Bu değişimle birlikte çocukların birbiriyle kurduğu bağ da zayıflıyor."],"r":[["Çocukların oyun alışkanlıkları değişmiştir.",0],["Eskiden çocuklar sokakta daha çok vakit geçirirdi.",0],["Ekran oyunları hiç oynanmamalıdır.",1],["Çocuklar arasındaki bağ zayıflamaktadır.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Çocukluğumuzun sokak oyunları, yerini ekran oyunlarına bıraktı. (2) Eskiden saklambaç, yakar top, ip atlama oynayan çocuklar, akşam olunca zorla eve çağrılırdı. (3) Şimdi aynı sokaklar sessiz, çocuklar ise ekranların başında. (4) Bu değişimle birlikte çocukların birbiriyle kurduğu bağ da zayıflıyor. Tahtalar: Çocukların oyun alışkanlıkları değişmiştir. / Eskiden çocuklar sokakta daha çok vakit geçirirdi. / Ekran oyunları hiç oynanmamalıdır. / Çocuklar arasındaki bağ zayıflamaktadır..","correctAnswer":"Çocukların oyun alışkanlıkları değişmiştir. → sağlam | Eskiden çocuklar sokakta daha çok vakit geçirirdi. → sağlam | Ekran oyunları hiç oynanmamalıdır. → kırık | Çocuklar arasındaki bağ zayıflamaktadır. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz. Yazar bir değişimi anlatıyor; ekran oyunlarının hiç oynanmaması gerektiğini söylemiyor."},{"questionId":"tr8u3-cikarim-006","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"cikarim","rank":3,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Düzenli uyku, öğrenmenin en önemli destekçisidir.","Uyurken beynimiz gün içinde öğrendiklerini düzenler ve kalıcı hâle getirir.","Yapılan bir araştırmada yeterince uyuyan öğrencilerin daha başarılı olduğu görülmüş.","Bu nedenle ders çalışmak kadar dinlenmeye de zaman ayırmalıyız."],"r":[["Uyku, öğrenileni kalıcı kılar.",0],["Dinlenmek de çalışmanın parçasıdır.",0],["Az uyuyan öğrenciler hiç öğrenemez.",1],["Yeterince uyuyan öğrenciler daha başarılı olabilir.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Düzenli uyku, öğrenmenin en önemli destekçisidir. (2) Uyurken beynimiz gün içinde öğrendiklerini düzenler ve kalıcı hâle getirir. (3) Yapılan bir araştırmada yeterince uyuyan öğrencilerin daha başarılı olduğu görülmüş. (4) Bu nedenle ders çalışmak kadar dinlenmeye de zaman ayırmalıyız. Tahtalar: Uyku, öğrenileni kalıcı kılar. / Dinlenmek de çalışmanın parçasıdır. / Az uyuyan öğrenciler hiç öğrenemez. / Yeterince uyuyan öğrenciler daha başarılı olabilir..","correctAnswer":"Uyku, öğrenileni kalıcı kılar. → sağlam | Dinlenmek de çalışmanın parçasıdır. → sağlam | Az uyuyan öğrenciler hiç öğrenemez. → kırık | Yeterince uyuyan öğrenciler daha başarılı olabilir. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz. “Hiç öğrenemez” paragrafta söylenmeyen aşırı bir genellemedir."},{"questionId":"tr8u3-cikarim-007","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"bridge","prompt":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç.","data":{"S":["Geçen hafta sınıfça şehrimizdeki arkeoloji müzesini gezdik.","Binlerce yıl önce yapılmış toprak kaplar, süs eşyaları ve sikkeler gördük.","Rehberimiz her eserin hangi dönemden kaldığını anlattı.","Müzeden çıkarken geçmişin bugünü anlamak için bir anahtar olduğunu düşündüm."],"r":[["Müzede eski eserler sergileniyor.",0],["Anlatıcı geziden etkilenmiştir.",0],["Müze yeni açılmıştır.",1],["Rehber eserler hakkında bilgi vermiştir.",0]]},"textPlain":"Yukarıdaki paragraftan çıkarılabilecek yargıların tahtasını sağlam bırak, çıkarılamayanları kır; sonra köprüden geç. Paragraf: (1) Geçen hafta sınıfça şehrimizdeki arkeoloji müzesini gezdik. (2) Binlerce yıl önce yapılmış toprak kaplar, süs eşyaları ve sikkeler gördük. (3) Rehberimiz her eserin hangi dönemden kaldığını anlattı. (4) Müzeden çıkarken geçmişin bugünü anlamak için bir anahtar olduğunu düşündüm. Tahtalar: Müzede eski eserler sergileniyor. / Anlatıcı geziden etkilenmiştir. / Müze yeni açılmıştır. / Rehber eserler hakkında bilgi vermiştir..","correctAnswer":"Müzede eski eserler sergileniyor. → sağlam | Anlatıcı geziden etkilenmiştir. → sağlam | Müze yeni açılmıştır. → kırık | Rehber eserler hakkında bilgi vermiştir. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-cikarim-008","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"cikarim","rank":1,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Bu kitap, sade ve akıcı diliyle okuru ilk sayfadan yakalıyor.","Yazar, karakterlerini öyle canlı çizmiş ki onları tanıyormuş gibi oluyoruz.","Bence bu yılın en başarılı romanı."],"a":2,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Bu kitap, sade ve akıcı diliyle okuru ilk sayfadan yakalıyor. (2) Yazar, karakterlerini öyle canlı çizmiş ki onları tanıyormuş gibi oluyoruz. (3) Bence bu yılın en başarılı romanı.","correctAnswer":"Övgü dolu","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır."},{"questionId":"tr8u3-cikarim-009","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"cikarim","rank":1,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Film, 2019 yılında çekilmiştir.","Çekimler İstanbul ve Kapadokya’da yapılmıştır.","Filmin süresi yaklaşık iki saattir."],"a":1,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Film, 2019 yılında çekilmiştir. (2) Çekimler İstanbul ve Kapadokya’da yapılmıştır. (3) Filmin süresi yaklaşık iki saattir.","correctAnswer":"Tarafsız","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır. Bu paragraf yalnızca bilgi veriyor."},{"questionId":"tr8u3-cikarim-010","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Ne yazık ki şehrin parkları bakımsız kaldı.","Banklar kırık, çöp kutuları taşmış durumda.","Çocukların oynayabileceği güvenli bir alan neredeyse kalmadı."],"a":0,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Ne yazık ki şehrin parkları bakımsız kaldı. (2) Banklar kırık, çöp kutuları taşmış durumda. (3) Çocukların oynayabileceği güvenli bir alan neredeyse kalmadı.","correctAnswer":"Eleştirel","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır."},{"questionId":"tr8u3-cikarim-011","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Yeni açılan kütüphane, şehrimize çok değerli bir katkı oldu.","Ferah salonları ve zengin koleksiyonuyla her yaştan okuru ağırlıyor.","Böyle mekânların sayısı artmalı."],"a":2,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Yeni açılan kütüphane, şehrimize çok değerli bir katkı oldu. (2) Ferah salonları ve zengin koleksiyonuyla her yaştan okuru ağırlıyor. (3) Böyle mekânların sayısı artmalı.","correctAnswer":"Övgü dolu","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır."},{"questionId":"tr8u3-cikarim-012","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"cikarim","rank":3,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Romanın ilk bölümleri merak uyandırıyor.","Ancak yazar sonlara doğru konuyu gereksiz yere uzatmış.","Karakterlerin kararları da çoğu zaman inandırıcı değil."],"a":0,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Romanın ilk bölümleri merak uyandırıyor. (2) Ancak yazar sonlara doğru konuyu gereksiz yere uzatmış. (3) Karakterlerin kararları da çoğu zaman inandırıcı değil.","correctAnswer":"Eleştirel","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır. İlk cümledeki küçük övgüye rağmen paragrafın genel tutumu eleştireldir."},{"questionId":"tr8u3-cikarim-013","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"cikarim","rank":3,"type":"gauge","prompt":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster.","data":{"S":["Göller Bölgesi, adını taşıyan çok sayıda gölden alır.","Bölgedeki göllerin bir kısmı tatlı, bir kısmı tuzludur.","Gölleri besleyen akarsular, ilkbaharda en yüksek seviyeye ulaşır."],"a":1,"L":["Eleştirel","Tarafsız","Övgü dolu"]},"textPlain":"Barometrenin ibresini ayarla: Yukarıdaki paragrafta yazarın konuya bakışını göster. Paragraf: (1) Göller Bölgesi, adını taşıyan çok sayıda gölden alır. (2) Bölgedeki göllerin bir kısmı tatlı, bir kısmı tuzludur. (3) Gölleri besleyen akarsular, ilkbaharda en yüksek seviyeye ulaşır.","correctAnswer":"Tarafsız","explanation":"Yazarın tutumu, kullandığı sözcüklerden anlaşılır: övgü bildiren sözcükler (harika, ustaca, değerli) olumlu; eleştiri bildirenler (ne yazık ki, gereksiz, zayıf) eleştirel bir bakışı gösterir. Yalnızca bilgi veren metinlerde yazar tarafsızdır."},{"questionId":"tr8u3-cikarim-014","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"cikarim","rank":1,"type":"dial","prompt":"Pusulayı çevir: yazarın amacını kuzeye (K) getir.","data":{"S":["Bir damla su bile boşa akmamalı.","Dişlerimizi fırçalarken musluğu kapatmak, her gün litrelerce suyu korur.","Damlayan bir musluk, bir yılda bir küveti dolduracak kadar suyu israf eder.","Suyu korumak, gelecek kuşaklara bırakacağımız en değerli mirastır."],"o":["Bir anıyı anlatmak","Bir yeri tanıtmak","Bir kişiyi eleştirmek","Okuru su tasarrufuna yönlendirmek"],"a":3},"textPlain":"Pusulayı çevir: yazarın amacını kuzeye (K) getir. Paragraf: (1) Bir damla su bile boşa akmamalı. (2) Dişlerimizi fırçalarken musluğu kapatmak, her gün litrelerce suyu korur. (3) Damlayan bir musluk, bir yılda bir küveti dolduracak kadar suyu israf eder. (4) Suyu korumak, gelecek kuşaklara bırakacağımız en değerli mirastır. Yönler: Bir anıyı anlatmak / Bir yeri tanıtmak / Bir kişiyi eleştirmek / Okuru su tasarrufuna yönlendirmek.","correctAnswer":"Okuru su tasarrufuna yönlendirmek","explanation":"Yazarın amacı, paragrafla okurda ne oluşturmak istediğidir: bilgi vermek, ikna etmek, duygu aktarmak, öğüt vermek gibi."},{"questionId":"tr8u3-cikarim-015","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"dial","prompt":"Pusulayı çevir: yazarın amacını kuzeye (K) getir.","data":{"S":["Annemin dolabında, dedemin askerdeyken yazdığı mektuplar duruyor.","Sararmış kâğıtlara dökülen satırlarda özlem, umut ve sevgi var.","Her mektubun sonunda “Sizi çok özledim.” cümlesi yazıyor.","O mektupları okurken dedemi daha yakından tanıdığımı hissediyorum."],"o":["Mektup yazmayı öğretmek","Bir aile hatırasını ve duygularını paylaşmak","Askerlik hakkında bilgi vermek","Kâğıt türlerini tanıtmak"],"a":1},"textPlain":"Pusulayı çevir: yazarın amacını kuzeye (K) getir. Paragraf: (1) Annemin dolabında, dedemin askerdeyken yazdığı mektuplar duruyor. (2) Sararmış kâğıtlara dökülen satırlarda özlem, umut ve sevgi var. (3) Her mektubun sonunda “Sizi çok özledim.” cümlesi yazıyor. (4) O mektupları okurken dedemi daha yakından tanıdığımı hissediyorum. Yönler: Mektup yazmayı öğretmek / Bir aile hatırasını ve duygularını paylaşmak / Askerlik hakkında bilgi vermek / Kâğıt türlerini tanıtmak.","correctAnswer":"Bir aile hatırasını ve duygularını paylaşmak","explanation":"Yazarın amacı, paragrafla okurda ne oluşturmak istediğidir: bilgi vermek, ikna etmek, duygu aktarmak, öğüt vermek gibi."},{"questionId":"tr8u3-cikarim-016","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"cikarim","rank":2,"type":"dial","prompt":"Pusulayı çevir: yazarın amacını kuzeye (K) getir.","data":{"S":["Deniz kaplumbağaları, yumurtlamak için doğdukları kumsala geri döner.","Binlerce kilometre yüzdükten sonra bile aynı kıyıyı bulurlar.","Bilim insanları, bu yön bulma yeteneğinin Dünya’nın manyetik alanıyla ilgili olduğunu düşünüyor.","Bu nedenle yumurtlama kumsallarının korunması, türün geleceği için büyük önem taşır."],"o":["Bir canlı hakkında bilgi verip korunmasına dikkat çekmek","Deniz sporlarını tanıtmak","Bir hikâye anlatmak","Bir tatil anısını anlatmak"],"a":0},"textPlain":"Pusulayı çevir: yazarın amacını kuzeye (K) getir. Paragraf: (1) Deniz kaplumbağaları, yumurtlamak için doğdukları kumsala geri döner. (2) Binlerce kilometre yüzdükten sonra bile aynı kıyıyı bulurlar. (3) Bilim insanları, bu yön bulma yeteneğinin Dünya’nın manyetik alanıyla ilgili olduğunu düşünüyor. (4) Bu nedenle yumurtlama kumsallarının korunması, türün geleceği için büyük önem taşır. Yönler: Bir canlı hakkında bilgi verip korunmasına dikkat çekmek / Deniz sporlarını tanıtmak / Bir hikâye anlatmak / Bir tatil anısını anlatmak.","correctAnswer":"Bir canlı hakkında bilgi verip korunmasına dikkat çekmek","explanation":"Yazarın amacı, paragrafla okurda ne oluşturmak istediğidir."},{"questionId":"tr8u3-cikarim-017","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"cikarim","rank":3,"type":"dial","prompt":"Pusulayı çevir: yazarın amacını kuzeye (K) getir.","data":{"S":["İyi bir konuşmacı olmanın yolu, önce iyi bir dinleyici olmaktan geçer.","Karşımızdakini dikkatle dinlediğimizde onun ne demek istediğini anlarız.","Böylece verdiğimiz cevaplar da daha yerinde olur.","Sözünü kesmeden dinlemek, karşımızdakine duyduğumuz saygının da göstergesidir."],"o":["İyi dinleyici olmanın önemini anlatıp öğüt vermek","Bir tartışmayı aktarmak","Bir konuşmacıyı tanıtmak","Ses tellerinin yapısını açıklamak"],"a":0},"textPlain":"Pusulayı çevir: yazarın amacını kuzeye (K) getir. Paragraf: (1) İyi bir konuşmacı olmanın yolu, önce iyi bir dinleyici olmaktan geçer. (2) Karşımızdakini dikkatle dinlediğimizde onun ne demek istediğini anlarız. (3) Böylece verdiğimiz cevaplar da daha yerinde olur. (4) Sözünü kesmeden dinlemek, karşımızdakine duyduğumuz saygının da göstergesidir. Yönler: İyi dinleyici olmanın önemini anlatıp öğüt vermek / Bir tartışmayı aktarmak / Bir konuşmacıyı tanıtmak / Ses tellerinin yapısını açıklamak.","correctAnswer":"İyi dinleyici olmanın önemini anlatıp öğüt vermek","explanation":"Yazarın amacı, paragrafla okurda ne oluşturmak istediğidir."},{"questionId":"tr8u3-cikarim-018","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"cikarim","rank":3,"type":"dial","prompt":"Pusulayı çevir: yazarın amacını kuzeye (K) getir.","data":{"S":["Halk oyunları, bir yörenin kültürünü yansıtan canlı bir aynadır.","Karadeniz’in hızlı horonunda dalgaların coşkusu, Ege’nin zeybeğinde efelerin vakarı görülür.","Kıyafetler, müzik ve figürler o bölgenin yaşayışını anlatır.","Bu oyunları yaşatmak, geçmişimizi geleceğe taşımaktır."],"o":["Bir yarışmayı anlatmak","Dans adımlarını öğretmek","Halk oyunlarının kültürel değerini vurgulamak","Bölgeleri karşılaştırıp birini öne çıkarmak"],"a":2},"textPlain":"Pusulayı çevir: yazarın amacını kuzeye (K) getir. Paragraf: (1) Halk oyunları, bir yörenin kültürünü yansıtan canlı bir aynadır. (2) Karadeniz’in hızlı horonunda dalgaların coşkusu, Ege’nin zeybeğinde efelerin vakarı görülür. (3) Kıyafetler, müzik ve figürler o bölgenin yaşayışını anlatır. (4) Bu oyunları yaşatmak, geçmişimizi geleceğe taşımaktır. Yönler: Bir yarışmayı anlatmak / Dans adımlarını öğretmek / Halk oyunlarının kültürel değerini vurgulamak / Bölgeleri karşılaştırıp birini öne çıkarmak.","correctAnswer":"Halk oyunlarının kültürel değerini vurgulamak","explanation":"Yazarın amacı, paragrafla okurda ne oluşturmak istediğidir."},{"questionId":"tr8u3-cikarim-019","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragraftan çıkarılabilecek yargılar, yazarın amacı ve tutumu","outcome":"Okuduğu metinle ilgili çıkarımlarda bulunur; yazarın amacını ve bakış açısını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"cikarim","rank":1,"type":"dial","prompt":"Pusulayı çevir: yazarın amacını kuzeye (K) getir.","data":{"S":["Mahallemizdeki küçük kitapçı, yalnızca kitap satılan bir yer değildi.","Sahibi Hasan Amca, her gelene okuyacağı kitabı seçmesinde yardım ederdi.","Çocuklar için masalar kurmuş, cumartesileri masal saati düzenlerdi.","Kitapçı kapandığında mahalle, bir dostunu kaybetmiş gibi oldu."],"o":["Bir mekânı ve ona duyulan özlemi anlatmak","Bir yazarın hayatını anlatmak","Masal yazmayı öğretmek","Kitap satmak"],"a":0},"textPlain":"Pusulayı çevir: yazarın amacını kuzeye (K) getir. Paragraf: (1) Mahallemizdeki küçük kitapçı, yalnızca kitap satılan bir yer değildi. (2) Sahibi Hasan Amca, her gelene okuyacağı kitabı seçmesinde yardım ederdi. (3) Çocuklar için masalar kurmuş, cumartesileri masal saati düzenlerdi. (4) Kitapçı kapandığında mahalle, bir dostunu kaybetmiş gibi oldu. Yönler: Bir mekânı ve ona duyulan özlemi anlatmak / Bir yazarın hayatını anlatmak / Masal yazmayı öğretmek / Kitap satmak.","correctAnswer":"Bir mekânı ve ona duyulan özlemi anlatmak","explanation":"Yazarın amacı, paragrafla okurda ne oluşturmak istediğidir."},{"questionId":"tr8u3-gelistirme-001","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"gelistirme","rank":1,"type":"dial","prompt":"Pusulayı çevir: 1. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir.","data":{"S":["Fotosentez, bitkilerin güneş ışığını kullanarak kendi besinini üretmesidir.","Bu olay yaprakların yeşil bölümlerinde gerçekleşir.","Böylece hem bitki beslenir hem de havaya oksijen verilir."],"o":["Tanımlama","Sayısal veri","Karşılaştırma","Tanık gösterme"],"a":0},"textPlain":"Pusulayı çevir: 1. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir. Paragraf: (1) Fotosentez, bitkilerin güneş ışığını kullanarak kendi besinini üretmesidir. (2) Bu olay yaprakların yeşil bölümlerinde gerçekleşir. (3) Böylece hem bitki beslenir hem de havaya oksijen verilir. Yönler: Tanımlama / Sayısal veri / Karşılaştırma / Tanık gösterme.","correctAnswer":"Tanımlama","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-002","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"gelistirme","rank":1,"type":"dial","prompt":"Pusulayı çevir: 2. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir.","data":{"S":["Bazı hayvanlar kışı uyuyarak geçirir.","Örneğin ayılar sonbaharda iyice beslenir, sonra mağaralarına çekilip aylarca uyur.","Kirpiler ve kaplumbağalar da benzer şekilde kış uykusuna yatar."],"o":["Tanık gösterme","Sayısal veri","Örnekleme","Karşılaştırma"],"a":2},"textPlain":"Pusulayı çevir: 2. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir. Paragraf: (1) Bazı hayvanlar kışı uyuyarak geçirir. (2) Örneğin ayılar sonbaharda iyice beslenir, sonra mağaralarına çekilip aylarca uyur. (3) Kirpiler ve kaplumbağalar da benzer şekilde kış uykusuna yatar. Yönler: Tanık gösterme / Sayısal veri / Örnekleme / Karşılaştırma.","correctAnswer":"Örnekleme","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-003","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"gelistirme","rank":2,"type":"dial","prompt":"Pusulayı çevir: 2. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir.","data":{"S":["Köy hayatı ile şehir hayatı birçok yönden ay r.","Her fidanın ihtiyacını bilir, ona göre su ve ışık verir.","Sonunda bahçesinde rengârenk çiçekler açar."],"o":["Tanık gösterme","Benzetme","Karşılaştırma","Örnekleme"],"a":1},"textPlain":"Pusulayı çevir: 1. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir. Paragraf: (1) İyi bir öğretmen, bahçesine özenle bakan bir bahçıvan gibidir. (2) Her fidanın ihtiyacını bilir, ona göre su ve ışık verir. (3) Sonunda bahçesinde rengârenk çiçekler açar. Yönler: Tanık gösterme / Benzetme / Karşılaştırma / Örnekleme.","correctAnswer":"Benzetme","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-007","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"gelistirme","rank":3,"type":"dial","prompt":"Pusulayı çevir: 1. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir.","data":{"S":["Deprem, yer kabuğundaki kırılmalar sonucu oluşan sarsıntılardır.","Ülkemiz deprem kuşağında yer alır.","Bu nedenle binaların sağlam yapılması hayati önem taşır."],"o":["Benzetme","Tanımlama","Sayısal veri","Tanık gösterme"],"a":1},"textPlain":"Pusulayı çevir: 1. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir. Paragraf: (1) Deprem, yer kabuğundaki kırılmalar sonucu oluşan sarsıntılardır. (2) Ülkemiz deprem kuşağında yer alır. (3) Bu nedenle binaların sağlam yapılması hayati önem taşır. Yönler: Benzetme / Tanımlama / Sayısal veri / Tanık gösterme.","correctAnswer":"Tanımlama","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-008","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"gelistirme","rank":3,"type":"dial","prompt":"Pusulayı çevir: 2. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir.","data":{"S":["Kuşlar göç ederken çok uzun yollar kat eder.","Leylekler her yıl yaklaşık on bin kilometre yol yaparak Afrika’ya gider.","Bu yolculuk aylar sürer."],"o":["Benzetme","Örnekleme","Sayısal veri","Tanık gösterme"],"a":2},"textPlain":"Pusulayı çevir: 2. cümlede kullanılan düşünceyi geliştirme yolunu kuzeye (K) getir. Paragraf: (1) Kuşlar göç ederken çok uzun yollar kat eder. (2) Leylekler her yıl yaklaşık on bin kilometre yol yaparak Afrika’ya gider. (3) Bu yolculuk aylar sürer. Yönler: Benzetme / Örnekleme / Sayısal veri / Tanık gösterme.","correctAnswer":"Sayısal veri","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-009","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"gelistirme","rank":1,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta örneklemenin kullanıldığı veren cümleyi göster.","data":{"S":["Bitkiler de canlıdır ve bakıma ihtiyaç duyar.","Örneğin fesleğen, güneşli bir pencere önünde ve sık sulandığında hızla büyür.","Bakımsız kalan bitkiler ise kısa sürede solar."],"a":[1]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta örneklemenin kullanıldığı veren cümleyi göster. Paragraf: (1) Bitkiler de canlıdır ve bakıma ihtiyaç duyar. (2) Örneğin fesleğen, güneşli bir pencere önünde ve sık sulandığında hızla büyür. (3) Bakımsız kalan bitkiler ise kısa sürede solar.","correctAnswer":"2. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-010","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"gelistirme","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta karşılaştırmanın yapıldığı veren cümleyi göster.","data":{"S":["Deniz suyu ile tatlı su birbirinden farklıdır.","Deniz suyu tuzludur ve içilemez; tatlı su ise içme suyu olarak kullanılır.","Dünyadaki suyun çok büyük bölümü denizlerde bulunur."],"a":[1]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta karşılaştırmanın yapıldığı veren cümleyi göster. Paragraf: (1) Deniz suyu ile tatlı su birbirinden farklıdır. (2) Deniz suyu tuzludur ve içilemez; tatlı su ise içme suyu olarak kullanılır. (3) Dünyadaki suyun çok büyük bölümü denizlerde bulunur.","correctAnswer":"2. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-011","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"gelistirme","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta sayısal verinin kullanıldığı veren cümleyi göster.","data":{"S":["Sağlıklı beslenmenin yolu dengeli öğünlerden geçer.","Uzmanlar günde en az beş porsiyon meyve ve sebze yenmesini öneriyor.","Bunun yanında bol su içmek de önemlidir."],"a":[1]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta sayısal verinin kullanıldığı veren cümleyi göster. Paragraf: (1) Sağlıklı beslenmenin yolu dengeli öğünlerden geçer. (2) Uzmanlar günde en az beş porsiyon meyve ve sebze yenmesini öneriyor. (3) Bunun yanında bol su içmek de önemlidir.","correctAnswer":"2. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-012","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"gelistirme","rank":3,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta tanık göstermenin kullanıldığı veren cümleyi göster.","data":{"S":["Bilgi paylaşıldıkça çoğalır.","Ünlü bir bilim insanı, “Bilgi, bir mum ışığı gibidir; başka mumları yaksa da azalmaz.” demiştir.","Öğrendiklerimizi paylaşmak, hem bizi hem çevremizi zenginleştirir."],"a":[1]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta tanık göstermenin kullanıldığı veren cümleyi göster. Paragraf: (1) Bilgi paylaşıldıkça çoğalır. (2) Ünlü bir bilim insanı, “Bilgi, bir mum ışığı gibidir; başka mumları yaksa da azalmaz.” demiştir. (3) Öğrendiklerimizi paylaşmak, hem bizi hem çevremizi zenginleştirir.","correctAnswer":"2. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme. Bu cümlede hem tanık gösterme hem de benzetme vardır; ama cümle bir bilim insanının sözüne başvuruyor."},{"questionId":"tr8u3-gelistirme-013","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"gelistirme","rank":3,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta benzetmenin kullanıldığı veren cümleyi göster.","data":{"S":["Kitaplar, bizi başka dünyalara taşıyan sihirli kapılardır.","Bir kitabı açtığımızda farklı ülkelere, farklı çağlara gideriz.","Bu yolculuklar hayal gücümüzü besler."],"a":[0]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta benzetmenin kullanıldığı veren cümleyi göster. Paragraf: (1) Kitaplar, bizi başka dünyalara taşıyan sihirli kapılardır. (2) Bir kitabı açtığımızda farklı ülkelere, farklı çağlara gideriz. (3) Bu yolculuklar hayal gücümüzü besler.","correctAnswer":"1. cümle","explanation":"Düşünceyi geliştirme yolları: tanımlama (bir şeyin ne olduğunu açıklama), örnekleme (somut örnek verme), karşılaştırma (benzerlik/farklılık), tanık gösterme (bir kişinin sözüne başvurma), sayısal verilerden yararlanma, benzetme."},{"questionId":"tr8u3-gelistirme-014","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Düşünceyi geliştirme yolları","outcome":"Metinde kullanılan düşünceyi geliştirme yollarını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"gelistirme","ra
