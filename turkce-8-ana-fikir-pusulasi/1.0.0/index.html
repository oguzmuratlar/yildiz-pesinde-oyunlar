<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Ana Fikir Pusulası</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}
.logo b{color:var(--yel);text-shadow:0 0 8px var(--yel2)}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}
.pill.gold{background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;border-color:#fff}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
#sound{width:34px;height:30px;border-radius:10px;border:1px solid #29d3ff77;background:#0a0820cc;color:#fff;font-size:15px;padding:0}
#track{height:38px;margin:0 8px}
#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}
.chip{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#1b13471a;color:var(--ink2)}
.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}
#go:disabled{filter:grayscale(.8);opacity:.5;box-shadow:0 3px 0 #6a0a3e}
#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}
#fb b{display:block;font:900 19px/1.2 var(--show);margin-bottom:3px}
#fb .ca{display:block;margin:4px 0;padding:4px 8px;border-radius:8px;background:#ff4d5e1a;font-weight:800}
#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}
.blank.ok{background:#c9f5dc;box-shadow:0 2px 0 #146b3e}.blank.bad{background:#ffd0d5;box-shadow:0 2px 0 #7a1420;text-decoration:line-through}
.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}
.frow .fn{font-size:12.5px;font-weight:800;color:#fff;line-height:1.15}
.frow .fn.r{text-align:right}
.frow .mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.frow .mid svg{width:96px;height:16px}
.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}
.evr .n{flex:1 1 auto}.evr .pc{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#e8e2ff;color:#4a3a6a}
.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}
.slot .sb .tok{font-size:12px;padding:4px 8px}
.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:linear-gradient(180deg,#3a2a6a 0,#8a4a8a 30%,#ff8a5a 62%,#ffd08a 100%)}
.mt1{position:absolute;left:-20%;right:-20%;bottom:0;height:62%;background:linear-gradient(180deg,#5a3a6a,#2a1a3a);clip-path:polygon(0 100%,0 60%,18% 30%,34% 52%,52% 0,70% 40%,84% 22%,100% 46%,100% 100%)}
.mt2{position:absolute;left:-10%;right:-10%;bottom:0;height:36%;background:linear-gradient(180deg,#3a2a4a,#1a0e28);clip-path:polygon(0 100%,0 40%,26% 10%,48% 46%,74% 18%,100% 50%,100% 100%)}
.snow{position:absolute;left:calc(32% - 20%);width:20%;bottom:calc(62% - 9%);height:9%;background:#fff;clip-path:polygon(50% 0,100% 100%,70% 80%,50% 100%,30% 80%,0 100%)}
.sun{position:absolute;left:50%;bottom:36%;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:radial-gradient(circle,#fff6c8,#ffb84a 70%);box-shadow:0 0 60px #ffb84a;opacity:.0;transform:translateY(60px)}
#gate.on .sun{animation:sun 2.6s .4s ease-out forwards}@keyframes sun{to{opacity:1;transform:none}}
.cmp{position:absolute;left:50%;top:36%;width:min(56vw,220px);aspect-ratio:1;margin:-110px 0 0 calc(min(56vw,220px)/-2);z-index:5;border-radius:50%;background:radial-gradient(circle,#fffaf0 0 58%,#c8903a 60% 66%,#8a5a1a 67%);box-shadow:0 10px 30px #0006}
.cmp::before{content:"K";position:absolute;left:50%;top:9%;transform:translateX(-50%);font:900 20px/1 var(--show);color:#a83a2a}
.cmp i{position:absolute;left:50%;top:50%;width:14px;height:76%;margin:-38% 0 0 -7px;background:linear-gradient(180deg,#d83a2a 0 50%,#3a4a5a 50%);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:rotate(130deg)}
#gate.on .cmp i{animation:nd 2.4s .3s cubic-bezier(.3,1.6,.5,1) forwards}@keyframes nd{0%{transform:rotate(130deg)}30%{transform:rotate(-260deg)}55%{transform:rotate(40deg)}75%{transform:rotate(-15deg)}100%{transform:rotate(0)}}
.cmp b{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border-radius:50%;background:#ffd23f;border:3px solid #5a3a10}
.lid{position:absolute;inset:-6%;border-radius:50%;background:radial-gradient(circle,#d8a050,#8a5a1a);transform-origin:50% 0;z-index:2;box-shadow:inset 0 0 0 6px #6a4010}
#gate.on .lid{animation:lid .7s .1s ease-in forwards}@keyframes lid{to{transform:perspective(500px) rotateX(-120deg);opacity:0}}
.camp{position:absolute;font-size:24px;opacity:0;z-index:3}
#gate.on .camp{animation:cp .4s var(--d) forwards}@keyframes cp{to{opacity:1}}
.sign11{position:absolute;left:50%;top:5%;width:min(84vw,320px);margin-left:calc(min(84vw,320px)/-2);z-index:7;text-align:center;padding:8px;border-radius:12px;background:#2a1a3acc;border:3px solid #ffd08a}
.sign11 b{display:block;white-space:nowrap;font:900 clamp(21px,7vw,30px)/1 var(--show);letter-spacing:1px;color:#ffd08a;padding:4px 0}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#ffe8b8 40%,#ff8a5a 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#2a1a0a;background:linear-gradient(180deg,#ffe8a8,#ffb84a 55%,#c8782a);box-shadow:0 6px 0 #6a3a10;margin-top:6px}
.primary:disabled{opacity:.55;box-shadow:none}
.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}
.status{font-size:13px!important;color:#fff;background:#000a;border-radius:10px;padding:6px 8px}.fine{font-size:12.5px!important}
#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,#3a2a6a 0,#8a4a8a 30%,#ff8a5a 62%,#ffd08a 100%)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}
.camps{position:absolute;inset:0;z-index:4}
.ck{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;display:grid;place-items:center;font-size:24px;opacity:0;transform:scale(.3)}
.ck b{position:absolute;right:-6px;top:-6px;font:900 11px/1 var(--show);background:#fff;color:#2a8a3a;border-radius:50%;width:16px;height:16px;display:grid;place-items:center}.ck.x{filter:grayscale(1)}.ck.x b{color:#a83a2a}
#outro.open .ck{animation:cki .4s var(--d) cubic-bezier(.3,1.5,.5,1) forwards}@keyframes cki{to{opacity:1;transform:none}}
#outro.open .ck.x{animation:ckx .4s var(--d) forwards}@keyframes ckx{to{opacity:.55;transform:none}}
.medal{position:absolute;left:50%;top:80%;width:136px;margin:-68px 0 0 -68px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#fffaf0,#ffd08a 62%,#c8903a);border:6px solid #5a3a10;box-shadow:0 0 0 4px #ffd08a,0 10px 30px #0006;transform:scale(2.5) rotate(-20deg);opacity:0;z-index:6}
.medal div{font:900 10.5px/1.2 var(--show);letter-spacing:1px;color:#3a2010}.medal b{display:block;margin:2px 0;font:900 34px/1 var(--show);color:#3a2010}
#outro.stamp .medal{animation:stamp8 .6s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes stamp8{to{transform:rotate(-6deg);opacity:1}}
.vstat{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);z-index:6;white-space:nowrap;font:900 clamp(13px,4.2vw,17px)/1 var(--show);color:#ffd08a;background:#2a1a3a;padding:8px 14px;border-radius:999px;opacity:0}

böceklere yuva olur.","Kısacası ağaçlar, şehirde yaşamı her yönüyle kolaylaştıran sessiz dostlarımızdır."],"a":[4]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Şehirdeki ağaçlar yalnızca gölge vermez. (2) Havadaki tozu tutar, gürültüyü azaltır. (3) Yazın sokakların sıcaklığını birkaç derece düşürür. (4) Kuşlara ve böceklere yuva olur. (5) Kısacası ağaçlar, şehirde yaşamı her yönüyle kolaylaştıran sessiz dostlarımızdır.","correctAnswer":"5. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Burada ana düşünce, örneklerin ardından paragrafın sonunda toplanıyor."},{"questionId":"tr8u3-anafikir-003","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"anafikir","rank":1,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Takım sporları, çocuklara iş birliği yapmayı öğretir.","Sahada her oyuncu, takım arkadaşının hareketine göre konum alır.","Bir golün arkasında çoğu zaman birkaç kişinin pası vardır.","Kazanılan maç, tek bir kişinin değil bütün takımın başarısıdır."],"a":[0]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Takım sporları, çocuklara iş birliği yapmayı öğretir. (2) Sahada her oyuncu, takım arkadaşının hareketine göre konum alır. (3) Bir golün arkasında çoğu zaman birkaç kişinin pası vardır. (4) Kazanılan maç, tek bir kişinin değil bütün takımın başarısıdır.","correctAnswer":"1. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-004","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Bir damla su bile boşa akmamalı.","Dişlerimizi fırçalarken musluğu kapatmak, her gün litrelerce suyu korur.","Damlayan bir musluk, bir yılda bir küveti dolduracak kadar suyu israf eder.","Suyu korumak, gelecek kuşaklara bırakacağımız en değerli mirastır."],"a":[0,3]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Bir damla su bile boşa akmamalı. (2) Dişlerimizi fırçalarken musluğu kapatmak, her gün litrelerce suyu korur. (3) Damlayan bir musluk, bir yılda bir küveti dolduracak kadar suyu israf eder. (4) Suyu korumak, gelecek kuşaklara bırakacağımız en değerli mirastır.","correctAnswer":"1. cümle / 4. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. İlk ve son cümle aynı mesajı veriyor: suyu korumalıyız."},{"questionId":"tr8u3-anafikir-005","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Dedem bahçesindeki her ağacı tek tek kendi elleriyle dikmişti.","Sabahları erkenden kalkar, fidanlara su taşırdı.","Kurumaya yüz tutan bir dalı görse günlerce onunla ilgilenirdi.","Ona göre toprağa emek veren, ondan her zaman karşılığını alırdı."],"a":[3]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Dedem bahçesindeki her ağacı tek tek kendi elleriyle dikmişti. (2) Sabahları erkenden kalkar, fidanlara su taşırdı. (3) Kurumaya yüz tutan bir dalı görse günlerce onunla ilgilenirdi. (4) Ona göre toprağa emek veren, ondan her zaman karşılığını alırdı.","correctAnswer":"4. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Dedenin davranışları, son cümledeki düşünceyi örneklendiriyor."},{"questionId":"tr8u3-anafikir-006","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Teknoloji hayatımızı kolaylaştırırken bazı alışkanlıklarımızı da değiştirdi.","Eskiden mektupla haberleşen insanlar, şimdi birkaç saniyede mesaj gönderiyor.","Kütüphanede saatlerce aranan bilgiye artık bir dokunuşla ulaşılıyor.","Ancak ekran başında geçen uzun saatler, yüz yüze sohbetleri azaltıyor.","Teknolojiden yararlanırken onun bizi yönetmesine izin vermemeliyiz."],"a":[4]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Teknoloji hayatımızı kolaylaştırırken bazı alışkanlıklarımızı da değiştirdi. (2) Eskiden mektupla haberleşen insanlar, şimdi birkaç saniyede mesaj gönderiyor. (3) Kütüphanede saatlerce aranan bilgiye artık bir dokunuşla ulaşılıyor. (4) Ancak ekran başında geçen uzun saatler, yüz yüze sohbetleri azaltıyor. (5) Teknolojiden yararlanırken onun bizi yönetmesine izin vermemeliyiz.","correctAnswer":"5. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Paragraf, teknolojinin etkilerini sıraladıktan sonra yazarın asıl mesajını son cümlede veriyor."},{"questionId":"tr8u3-anafikir-007","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"anafikir","rank":3,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Geçen hafta sınıfça şehrimizdeki arkeoloji müzesini gezdik.","Binlerce yıl önce yapılmış toprak kaplar, süs eşyaları ve sikkeler gördük.","Rehberimiz her eserin hangi dönemden kaldığını anlattı.","Müzeden çıkarken geçmişin bugünü anlamak için bir anahtar olduğunu düşündüm."],"a":[3]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Geçen hafta sınıfça şehrimizdeki arkeoloji müzesini gezdik. (2) Binlerce yıl önce yapılmış toprak kaplar, süs eşyaları ve sikkeler gördük. (3) Rehberimiz her eserin hangi dönemden kaldığını anlattı. (4) Müzeden çıkarken geçmişin bugünü anlamak için bir anahtar olduğunu düşündüm.","correctAnswer":"4. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Gezi ayrıntıları, son cümledeki düşünceye ulaşmak için anlatılıyor."},{"questionId":"tr8u3-anafikir-008","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"anafikir","rank":3,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Hata yapmaktan korkmamalıyız.","Bisiklet sürmeyi öğrenen bir çocuk defalarca düşer ama her düşüşte dengeyi biraz daha öğrenir.","Bilim insanları da sayısız denemeden sonra doğru sonuca ulaşır.","Hatalar, başarıya giden yolda atılmış basamaklardır."],"a":[0,3]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Hata yapmaktan korkmamalıyız. (2) Bisiklet sürmeyi öğrenen bir çocuk defalarca düşer ama her düşüşte dengeyi biraz daha öğrenir. (3) Bilim insanları da sayısız denemeden sonra doğru sonuca ulaşır. (4) Hatalar, başarıya giden yolda atılmış basamaklardır.","correctAnswer":"1. cümle / 4. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Paragraf hem başta hem sonda aynı düşünceyi veriyor."},{"questionId":"tr8u3-anafikir-009","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"anafikir","rank":1,"type":"dial","prompt":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir.","data":{"S":["İyi bir konuşmacı olmanın yolu, önce iyi bir dinleyici olmaktan geçer.","Karşımızdakini dikkatle dinlediğimizde onun ne demek istediğini anlarız.","Böylece verdiğimiz cevaplar da daha yerinde olur.","Sözünü kesmeden dinlemek, karşımızdakine duyduğumuz saygının da göstergesidir."],"o":["Dinlemek zaman kaybıdır.","İyi dinlemek, iyi iletişimin temelidir.","Konuşurken sesimizi yükseltmeliyiz.","Herkes aynı şekilde konuşur."],"a":1},"textPlain":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir. Paragraf: (1) İyi bir konuşmacı olmanın yolu, önce iyi bir dinleyici olmaktan geçer. (2) Karşımızdakini dikkatle dinlediğimizde onun ne demek istediğini anlarız. (3) Böylece verdiğimiz cevaplar da daha yerinde olur. (4) Sözünü kesmeden dinlemek, karşımızdakine duyduğumuz saygının da göstergesidir. Yönler: Dinlemek zaman kaybıdır. / İyi dinlemek, iyi iletişimin temelidir. / Konuşurken sesimizi yükseltmeliyiz. / Herkes aynı şekilde konuşur..","correctAnswer":"İyi dinlemek, iyi iletişimin temelidir.","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-010","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"dial","prompt":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir.","data":{"S":["Denizlerdeki plastik atıklar her yıl artıyor.","Kıyıya atılan bir şişe, yüzlerce yıl boyunca doğada kalabiliyor.","Balıklar ve kaplumbağalar bu atıkları yiyecek sanarak yutuyor.","Tek kullanımlık ürünleri azaltmak, denizleri korumanın ilk adımıdır."],"o":["Denizlerde balık sayısı artıyor.","Denizleri korumak için plastik kullanımını azaltmalıyız.","Şişeler kısa sürede yok olur.","Kaplumbağalar plastiği sever."],"a":1},"textPlain":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir. Paragraf: (1) Denizlerdeki plastik atıklar her yıl artıyor. (2) Kıyıya atılan bir şişe, yüzlerce yıl boyunca doğada kalabiliyor. (3) Balıklar ve kaplumbağalar bu atıkları yiyecek sanarak yutuyor. (4) Tek kullanımlık ürünleri azaltmak, denizleri korumanın ilk adımıdır. Yönler: Denizlerde balık sayısı artıyor. / Denizleri korumak için plastik kullanımını azaltmalıyız. / Şişeler kısa sürede yok olur. / Kaplumbağalar plastiği sever..","correctAnswer":"Denizleri korumak için plastik kullanımını azaltmalıyız.","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-011","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"dial","prompt":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir.","data":{"S":["Düzenli uyku, öğrenmenin en önemli destekçisidir.","Uyurken beynimiz gün içinde öğrendiklerini düzenler ve kalıcı hâle getirir.","Yapılan bir araştırmada yeterince uyuyan öğrencilerin daha başarılı olduğu görülmüş.","Bu nedenle ders çalışmak kadar dinlenmeye de zaman ayırmalıyız."],"o":["Uyumak tembelliktir.","Gece geç saatlere kadar çalışmalıyız.","Araştırmalar güvenilir değildir.","Öğrenmek için dinlenmek de gereklidir."],"a":3},"textPlain":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir. Paragraf: (1) Düzenli uyku, öğrenmenin en önemli destekçisidir. (2) Uyurken beynimiz gün içinde öğrendiklerini düzenler ve kalıcı hâle getirir. (3) Yapılan bir araştırmada yeterince uyuyan öğrencilerin daha başarılı olduğu görülmüş. (4) Bu nedenle ders çalışmak kadar dinlenmeye de zaman ayırmalıyız. Yönler: Uyumak tembelliktir. / Gece geç saatlere kadar çalışmalıyız. / Araştırmalar güvenilir değildir. / Öğrenmek için dinlenmek de gereklidir..","correctAnswer":"Öğrenmek için dinlenmek de gereklidir.","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-012","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"anafikir","rank":3,"type":"dial","prompt":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir.","data":{"S":["Çocukluğumuzun sokak oyunları, yerini ekran oyunlarına bıraktı.","Eskiden saklambaç, yakar top, ip atlama oynayan çocuklar, akşam olunca zorla eve çağrılırdı.","Şimdi aynı sokaklar sessiz, çocuklar ise ekranların başında.","Bu değişimle birlikte çocukların birbiriyle kurduğu bağ da zayıflıyor."],"o":["Çocuklar artık daha çok kitap okuyor.","Sokaklar eskisinden daha kalabalık.","Ekran oyunları çocukların arkadaşlık bağlarını zayıflatıyor.","Saklambaç en eğlenceli oyundur."],"a":2},"textPlain":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir. Paragraf: (1) Çocukluğumuzun sokak oyunları, yerini ekran oyunlarına bıraktı. (2) Eskiden saklambaç, yakar top, ip atlama oynayan çocuklar, akşam olunca zorla eve çağrılırdı. (3) Şimdi aynı sokaklar sessiz, çocuklar ise ekranların başında. (4) Bu değişimle birlikte çocukların birbiriyle kurduğu bağ da zayıflıyor. Yönler: Çocuklar artık daha çok kitap okuyor. / Sokaklar eskisinden daha kalabalık. / Ekran oyunları çocukların arkadaşlık bağlarını zayıflatıyor. / Saklambaç en eğlenceli oyundur..","correctAnswer":"Ekran oyunları çocukların arkadaşlık bağlarını zayıflatıyor.","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Ana düşünce son cümlede veriliyor."},{"questionId":"tr8u3-anafikir-013","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"anafikir","rank":3,"type":"dial","prompt":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir.","data":{"S":["Deniz kaplumbağaları, yumurtlamak için doğdukları kumsala geri döner.","Binlerce kilometre yüzdükten sonra bile aynı kıyıyı bulurlar.","Bilim insanları, bu yön bulma yeteneğinin Dünya’nın manyetik alanıyla ilgili olduğunu düşünüyor.","Bu nedenle yumurtlama kumsallarının korunması, türün geleceği için büyük önem taşır."],"o":["Manyetik alan her canlıyı etkiler.","Kaplumbağalar çok hızlı yüzer.","Kumsallar turizm için açılmalıdır.","Kaplumbağaların yumurtlama kumsalları korunmalıdır."],"a":3},"textPlain":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir. Paragraf: (1) Deniz kaplumbağaları, yumurtlamak için doğdukları kumsala geri döner. (2) Binlerce kilometre yüzdükten sonra bile aynı kıyıyı bulurlar. (3) Bilim insanları, bu yön bulma yeteneğinin Dünya’nın manyetik alanıyla ilgili olduğunu düşünüyor. (4) Bu nedenle yumurtlama kumsallarının korunması, türün geleceği için büyük önem taşır. Yönler: Manyetik alan her canlıyı etkiler. / Kaplumbağalar çok hızlı yüzer. / Kumsallar turizm için açılmalıdır. / Kaplumbağaların yumurtlama kumsalları korunmalıdır..","correctAnswer":"Kaplumbağaların yumurtlama kumsalları korunmalıdır.","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-014","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"anafikir","rank":1,"type":"dial","prompt":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir.","data":{"S":["Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir.","Yakıt gerektirmez, havayı kirletmez.","Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır.","Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir."],"o":["Bisiklet, şehir içinde avantajlı bir ulaşım aracıdır.","Arabalar bisikletten hızlıdır.","Yakıt fiyatları artıyor.","Bisiklet sürmek tehlikelidir."],"a":0},"textPlain":"Pusulayı çevir: paragrafın ana düşüncesini kuzeye (K) getir. Paragraf: (1) Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir. (2) Yakıt gerektirmez, havayı kirletmez. (3) Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır. (4) Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir. Yönler: Bisiklet, şehir içinde avantajlı bir ulaşım aracıdır. / Arabalar bisikletten hızlıdır. / Yakıt fiyatları artıyor. / Bisiklet sürmek tehlikelidir..","correctAnswer":"Bisiklet, şehir içinde avantajlı bir ulaşım aracıdır.","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-015","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"bin","prompt":"Bir paragrafın cümleleri bunlar. Onları ana ve yardımcı düşünce sırt çantalarına yerleştir.","data":{"L":["🧭 Ana düşünce","🪢 Yardımcı düşünce"],"r":[["Arılar doğanın dengesi için önemlidir.",0],["Arılar tozlaşmayı sağlar.",1],["Meyvelerin çoğu tozlaşmayla oluşur.",1],["Arı azalırsa ürün azalır.",1]]},"textPlain":"Bir paragrafın cümleleri bunlar. Onları ana ve yardımcı düşünce sırt çantalarına yerleştir. Bölmeler: Ana düşünce, Yardımcı düşünce. Kartlar: Arılar doğanın dengesi için önemlidir. / Arılar tozlaşmayı sağlar. / Meyvelerin çoğu tozlaşmayla oluşur. / Arı azalırsa ürün azalır..","correctAnswer":"Arılar doğanın dengesi için önemlidir. → Ana düşünce | Arılar tozlaşmayı sağlar. → Yardımcı düşünce | Meyvelerin çoğu tozlaşmayla oluşur. → Yardımcı düşünce | Arı azalırsa ürün azalır. → Yardımcı düşünce","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-016","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"anafikir","rank":3,"type":"bin","prompt":"Bir paragrafın cümleleri bunlar. Onları ana ve yardımcı düşünce sırt çantalarına yerleştir.","data":{"L":["🧭 Ana düşünce","🪢 Yardımcı düşünce"],"r":[["Hata yapmaktan korkmamalıyız.",0],["Bisiklet öğrenen çocuk düşe düşe dengeyi öğrenir.",1],["Bilim insanları sayısız denemeden sonra sonuca ulaşır.",1]]},"textPlain":"Bir paragrafın cümleleri bunlar. Onları ana ve yardımcı düşünce sırt çantalarına yerleştir. Bölmeler: Ana düşünce, Yardımcı düşünce. Kartlar: Hata yapmaktan korkmamalıyız. / Bisiklet öğrenen çocuk düşe düşe dengeyi öğrenir. / Bilim insanları sayısız denemeden sonra sonuca ulaşır..","correctAnswer":"Hata yapmaktan korkmamalıyız. → Ana düşünce | Bisiklet öğrenen çocuk düşe düşe dengeyi öğrenir. → Yardımcı düşünce | Bilim insanları sayısız denemeden sonra sonuca ulaşır. → Yardımcı düşünce","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Örnekler ana düşünceyi destekleyen yardımcı düşüncelerdir."},{"questionId":"tr8u3-anafikir-017","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"anafikir","rank":1,"type":"bin","prompt":"Yukarıdaki paragrafın düşüncelerini ana ve yardımcı düşünce sırt çantalarına yerleştir.","data":{"L":["🧭 Ana düşünce","🪢 Yardımcı düşünce"],"r":[["Ağaçlar şehirde yaşamı kolaylaştırır.",0],["Ağaçlar havadaki tozu tutar.",1],["Ağaçlar sokakları serinletir.",1],["Ağaçlar kuşlara yuva olur.",1]],"S":["Şehirdeki ağaçlar yalnızca gölge vermez.","Havadaki tozu tutar, gürültüyü azaltır.","Yazın sokakların sıcaklığını birkaç derece düşürür.","Kuşlara ve böceklere yuva olur.","Kısacası ağaçlar, şehirde yaşamı her yönüyle kolaylaştıran sessiz dostlarımızdır."]},"textPlain":"Yukarıdaki paragrafın düşüncelerini ana ve yardımcı düşünce sırt çantalarına yerleştir. Paragraf: (1) Şehirdeki ağaçlar yalnızca gölge vermez. (2) Havadaki tozu tutar, gürültüyü azaltır. (3) Yazın sokakların sıcaklığını birkaç derece düşürür. (4) Kuşlara ve böceklere yuva olur. (5) Kısacası ağaçlar, şehirde yaşamı her yönüyle kolaylaştıran sessiz dostlarımızdır. Bölmeler: Ana düşünce, Yardımcı düşünce. Kartlar: Ağaçlar şehirde yaşamı kolaylaştırır. / Ağaçlar havadaki tozu tutar. / Ağaçlar sokakları serinletir. / Ağaçlar kuşlara yuva olur..","correctAnswer":"Ağaçlar şehirde yaşamı kolaylaştırır. → Ana düşünce | Ağaçlar havadaki tozu tutar. → Yardımcı düşünce | Ağaçlar sokakları serinletir. → Yardımcı düşünce | Ağaçlar kuşlara yuva olur. → Yardımcı düşünce","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-018","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"anafikir","rank":2,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Halk oyunları, bir yörenin kültürünü yansıtan canlı bir aynadır.","Karadeniz’in hızlı horonunda dalgaların coşkusu, Ege’nin zeybeğinde efelerin vakarı görülür.","Kıyafetler, müzik ve figürler o bölgenin yaşayışını anlatır.","Bu oyunları yaşatmak, geçmişimizi geleceğe taşımaktır."],"a":[0,3]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Halk oyunları, bir yörenin kültürünü yansıtan canlı bir aynadır. (2) Karadeniz’in hızlı horonunda dalgaların coşkusu, Ege’nin zeybeğinde efelerin vakarı görülür. (3) Kıyafetler, müzik ve figürler o bölgenin yaşayışını anlatır. (4) Bu oyunları yaşatmak, geçmişimizi geleceğe taşımaktır.","correctAnswer":"1. cümle / 4. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. İlk cümle halk oyunlarının kültürü yansıttığını, son cümle onları yaşatmanın önemini söylüyor; ikisi birlikte ana düşünceyi taşır."},{"questionId":"tr8u3-anafikir-019","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"anafikir","rank":1,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster.","data":{"S":["Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir.","Yakıt gerektirmez, havayı kirletmez.","Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır.","Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir."],"a":[0]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana düşünceyi veren cümleyi göster. Paragraf: (1) Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir. (2) Yakıt gerektirmez, havayı kirletmez. (3) Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır. (4) Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir.","correctAnswer":"1. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır."},{"questionId":"tr8u3-anafikir-020","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Paragrafın ana düşüncesi","outcome":"Metnin ana fikrini/ana duygusunu belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"anafikir","rank":3,"type":"needle","prompt":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana duyguyu veren cümleyi göster.","data":{"S":["Mahallemizdeki küçük kitapçı, yalnızca kitap satılan bir yer değildi.","Sahibi Hasan Amca, her gelene okuyacağı kitabı seçmesinde yardım ederdi.","Çocuklar için masalar kurmuş, cumartesileri masal saati düzenlerdi.","Kitapçı kapandığında mahalle, bir dostunu kaybetmiş gibi oldu."],"a":[3]},"textPlain":"Pusulanın iğnesini çevir: Yukarıdaki paragrafta ana duyguyu veren cümleyi göster. Paragraf: (1) Mahallemizdeki küçük kitapçı, yalnızca kitap satılan bir yer değildi. (2) Sahibi Hasan Amca, her gelene okuyacağı kitabı seçmesinde yardım ederdi. (3) Çocuklar için masalar kurmuş, cumartesileri masal saati düzenlerdi. (4) Kitapçı kapandığında mahalle, bir dostunu kaybetmiş gibi oldu.","correctAnswer":"4. cümle","explanation":"Ana düşünce, yazarın paragrafta okura asıl iletmek istediği mesajdır; diğer cümleler onu açıklar, örneklendirir ya da destekler. Genellikle paragrafın başında ya da sonunda yer alır. Son cümle, anlatılan ayrıntıların ortak duygusunu veriyor: kitapçı mahallenin dostuydu."},{"questionId":"tr8u3-yardimci-001","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"yardimci","rank":1,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Kahvaltı, günün en önemli öğünüdür.","Sabah yapılan dengeli bir kahvaltı, güne enerjik başlamamızı sağlar.","Futbol, dünyada en çok izlenen spordur.","Kahvaltı yapan öğrencilerin derslere daha iyi odaklandığı biliniyor."],"k":2},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Kahvaltı, günün en önemli öğünüdür. (2) Sabah yapılan dengeli bir kahvaltı, güne enerjik başlamamızı sağlar. (3) Futbol, dünyada en çok izlenen spordur. (4) Kahvaltı yapan öğrencilerin derslere daha iyi odaklandığı biliniyor.","correctAnswer":"3. cümle: Futbol, dünyada en çok izlenen spordur.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir."},{"questionId":"tr8u3-yardimci-002","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"yardimci","rank":1,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Kediler, temizliklerine çok önem veren hayvanlardır.","Günün önemli bir bölümünü tüylerini yalayarak geçirirler.","Kumlarını mutlaka temiz bir yerde isterler.","Köpekler ise sahiplerine çok bağlıdır."],"k":3},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Kediler, temizliklerine çok önem veren hayvanlardır. (2) Günün önemli bir bölümünü tüylerini yalayarak geçirirler. (3) Kumlarını mutlaka temiz bir yerde isterler. (4) Köpekler ise sahiplerine çok bağlıdır.","correctAnswer":"4. cümle: Köpekler ise sahiplerine çok bağlıdır.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir. Son cümle konuyu kedilerden köpeklere kaydırıyor."},{"questionId":"tr8u3-yardimci-003","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"yardimci","rank":2,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Kış aylarında kuşlar yiyecek bulmakta zorlanır.","Toprak donar, böcekler saklanır, ağaçlarda meyve kalmaz.","Balkonlara bırakılan bir avuç yem, onlar için büyük bir yardımdır.","Göçmen kuşlar baharda yuvalarına döner.","Bu küçük yardım, pek çok kuşun kışı atlatmasını sağlar."],"k":3},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Kış aylarında kuşlar yiyecek bulmakta zorlanır. (2) Toprak donar, böcekler saklanır, ağaçlarda meyve kalmaz. (3) Balkonlara bırakılan bir avuç yem, onlar için büyük bir yardımdır. (4) Göçmen kuşlar baharda yuvalarına döner. (5) Bu küçük yardım, pek çok kuşun kışı atlatmasını sağlar.","correctAnswer":"4. cümle: Göçmen kuşlar baharda yuvalarına döner.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir."},{"questionId":"tr8u3-yardimci-004","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"yardimci","rank":2,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Kütüphaneler sessiz çalışma ortamı sunar.","Burada pahalı kaynak kitaplara ücretsiz ulaşılabilir.","Kütüphane binası şehrin en eski yapılarından biridir.","Ayrıca düzenlenen söyleşiler, okurları yazarlarla buluşturur."],"k":2},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Kütüphaneler sessiz çalışma ortamı sunar. (2) Burada pahalı kaynak kitaplara ücretsiz ulaşılabilir. (3) Kütüphane binası şehrin en eski yapılarından biridir. (4) Ayrıca düzenlenen söyleşiler, okurları yazarlarla buluşturur.","correctAnswer":"3. cümle: Kütüphane binası şehrin en eski yapılarından biridir.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir. Binanın yaşı, kütüphanenin sağladığı imkânlarla ilgili değildir."},{"questionId":"tr8u3-yardimci-005","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"yardimci","rank":3,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Ormanlar, iklimi dengeleyen doğal kalkanlardır.","Ağaçlar havadaki karbondioksiti tutar ve oksijen üretir.","Kökleri toprağı tutarak sel ve heyelanları önler.","Orman yürüyüşleri için rahat ayakkabı seçmek gerekir.","Bu yüzden ormanları korumak, iklimi korumaktır."],"k":3},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Ormanlar, iklimi dengeleyen doğal kalkanlardır. (2) Ağaçlar havadaki karbondioksiti tutar ve oksijen üretir. (3) Kökleri toprağı tutarak sel ve heyelanları önler. (4) Orman yürüyüşleri için rahat ayakkabı seçmek gerekir. (5) Bu yüzden ormanları korumak, iklimi korumaktır.","correctAnswer":"4. cümle: Orman yürüyüşleri için rahat ayakkabı seçmek gerekir.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir."},{"questionId":"tr8u3-yardimci-006","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"yardimci","rank":3,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Ressam, tablolarında genellikle köy hayatını işlemiştir.","Tarlada çalışan kadınlar, sürüsünü otlatan çobanlar onun en sevdiği konulardır.","Ressamın doğduğu kasaba deniz kenarındadır.","Renklerini de toprağın ve ekinlerin tonlarından seçer."],"k":2},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Ressam, tablolarında genellikle köy hayatını işlemiştir. (2) Tarlada çalışan kadınlar, sürüsünü otlatan çobanlar onun en sevdiği konulardır. (3) Ressamın doğduğu kasaba deniz kenarındadır. (4) Renklerini de toprağın ve ekinlerin tonlarından seçer.","correctAnswer":"3. cümle: Ressamın doğduğu kasaba deniz kenarındadır.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir. Doğum yeri bilgisi, tabloların konusu ve renkleriyle ilgili akışı bozar."},{"questionId":"tr8u3-yardimci-007","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"yardimci","rank":2,"type":"rock","prompt":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun.","data":{"S":["Çay, Türk kültüründe misafirperverliğin simgesidir.","Eve gelen konuğa hemen bir bardak çay ikram edilir.","Çay ocağı, köy kahvesinin başköşesinde yer alır.","Kahve ise Yemen’den dünyaya yayılmıştır."],"k":3},"textPlain":"Patikadaki kayayı kaldır: Paragrafın cümleleri patikanın taşlarıdır; akışı bozan cümleye dokun. Paragraf: (1) Çay, Türk kültüründe misafirperverliğin simgesidir. (2) Eve gelen konuğa hemen bir bardak çay ikram edilir. (3) Çay ocağı, köy kahvesinin başköşesinde yer alır. (4) Kahve ise Yemen’den dünyaya yayılmıştır.","correctAnswer":"4. cümle: Kahve ise Yemen’den dünyaya yayılmıştır.","explanation":"Akışı bozan cümle, paragrafın konusu ya da ana düşüncesiyle ilgisi olmayan, düşünce zincirini koparan cümledir."},{"questionId":"tr8u3-yardimci-008","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"kolay","group":"yardimci","rank":1,"type":"bridge","prompt":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç.","data":{"S":["Arılar, doğadaki dengenin en önemli parçalarından biridir.","Çiçekten çiçeğe konarak bitkilerin tozlaşmasını sağlarlar.","Yediğimiz meyve ve sebzelerin büyük bölümü bu sayede oluşur.","Arıların azalması, sofralarımızdaki ürünlerin de azalması demektir."],"r":[["Arılar bitkilerin tozlaşmasını sağlar.",0],["Arılar yalnızca bal üretir.",1],["Arılar azalırsa ürünler azalır.",0],["Arılar kışın uyur.",1]]},"textPlain":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç. Paragraf: (1) Arılar, doğadaki dengenin en önemli parçalarından biridir. (2) Çiçekten çiçeğe konarak bitkilerin tozlaşmasını sağlarlar. (3) Yediğimiz meyve ve sebzelerin büyük bölümü bu sayede oluşur. (4) Arıların azalması, sofralarımızdaki ürünlerin de azalması demektir. Tahtalar: Arılar bitkilerin tozlaşmasını sağlar. / Arılar yalnızca bal üretir. / Arılar azalırsa ürünler azalır. / Arılar kışın uyur..","correctAnswer":"Arılar bitkilerin tozlaşmasını sağlar. → sağlam | Arılar yalnızca bal üretir. → kırık | Arılar azalırsa ürünler azalır. → sağlam | Arılar kışın uyur. → kırık","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-yardimci-009","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"yardimci","rank":2,"type":"bridge","prompt":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç.","data":{"S":["Teknoloji hayatımızı kolaylaştırırken bazı alışkanlıklarımızı da değiştirdi.","Eskiden mektupla haberleşen insanlar, şimdi birkaç saniyede mesaj gönderiyor.","Kütüphanede saatlerce aranan bilgiye artık bir dokunuşla ulaşılıyor.","Ancak ekran başında geçen uzun saatler, yüz yüze sohbetleri azaltıyor.","Teknolojiden yararlanırken onun bizi yönetmesine izin vermemeliyiz."],"r":[["Haberleşme hızlandı.",0],["Bilgiye ulaşmak kolaylaştı.",0],["Yüz yüze sohbetler azaldı.",0],["Teknoloji sağlığı her zaman olumsuz etkiler.",1]]},"textPlain":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç. Paragraf: (1) Teknoloji hayatımızı kolaylaştırırken bazı alışkanlıklarımızı da değiştirdi. (2) Eskiden mektupla haberleşen insanlar, şimdi birkaç saniyede mesaj gönderiyor. (3) Kütüphanede saatlerce aranan bilgiye artık bir dokunuşla ulaşılıyor. (4) Ancak ekran başında geçen uzun saatler, yüz yüze sohbetleri azaltıyor. (5) Teknolojiden yararlanırken onun bizi yönetmesine izin vermemeliyiz. Tahtalar: Haberleşme hızlandı. / Bilgiye ulaşmak kolaylaştı. / Yüz yüze sohbetler azaldı. / Teknoloji sağlığı her zaman olumsuz etkiler..","correctAnswer":"Haberleşme hızlandı. → sağlam | Bilgiye ulaşmak kolaylaştı. → sağlam | Yüz yüze sohbetler azaldı. → sağlam | Teknoloji sağlığı her zaman olumsuz etkiler. → kırık","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz."},{"questionId":"tr8u3-yardimci-010","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"orta","group":"yardimci","rank":2,"type":"bridge","prompt":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç.","data":{"S":["Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir.","Yakıt gerektirmez, havayı kirletmez.","Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır.","Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir."],"r":[["Bisiklet yakıt gerektirmez.",0],["Bisiklet havayı kirletmez.",0],["Bisiklet ucuza satın alınır.",1],["Bisiklet sürmek insanı güçlendirir.",0]]},"textPlain":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç. Paragraf: (1) Bisiklet, şehir içi ulaşımda hem ekonomik hem çevreci bir seçenektir. (2) Yakıt gerektirmez, havayı kirletmez. (3) Trafiğin yoğun olduğu saatlerde çoğu zaman arabadan daha hızlıdır. (4) Üstelik bisiklet sürmek, insanı fiziksel olarak da güçlendirir. Tahtalar: Bisiklet yakıt gerektirmez. / Bisiklet havayı kirletmez. / Bisiklet ucuza satın alınır. / Bisiklet sürmek insanı güçlendirir..","correctAnswer":"Bisiklet yakıt gerektirmez. → sağlam | Bisiklet havayı kirletmez. → sağlam | Bisiklet ucuza satın alınır. → kırık | Bisiklet sürmek insanı güçlendirir. → sağlam","explanation":"Paragraftan çıkarılabilecek yargılar paragrafta açıkça ya da dolaylı olarak söylenmiş olmalıdır; paragrafta hiç değinilmeyen bilgi çıkarılamaz. Bisikletin fiyatından söz edilmiyor."},{"questionId":"tr8u3-yardimci-011","grade":8,"subject":"Türkçe","unit":"Paragrafta Anlam","topic":"Yardımcı düşünceler ve paragrafın akışı","outcome":"Metindeki yardımcı fikirleri belirler; paragrafın akışını bozan cümleyi fark eder.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafta anlam)","difficulty":"zor","group":"yardimci","rank":3,"type":"bridge","prompt":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; sonra köprüden geç.","data":{"S":["Güneş enerjisi, tükenmeyen bir enerji kaynağıdır.","Çatılara kurulan panellerle evler kendi elektriğini üretebilir.","Bu sayede hem faturalar azalır hem de doğa daha az kirlenir.","Ülkemiz bol güneş alan bir coğrafyada olduğu için bu enerjiden daha çok yararlanmalıyız."],"r":[["Güneş enerjisi tükenmez.",0],["Paneller faturaları azaltır.",0],["Güneş enerjisi geceleri de doğrudan üretilir.",1],["Ülkemiz bol güneş alır.",0],["Paneller ucuzdur.",1]]},"textPlain":"Yukarıdaki paragrafta değinilen düşüncelerin tahtasını sağlam bırak, değinilmeyenleri kır; s
