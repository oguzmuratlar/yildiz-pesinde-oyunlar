<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Merdiven Ekibi</title>
<style>

.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}

.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}

r”","difficulty":"kolay","group":"yardimci","rank":1,"type":"bin","prompt":"Özellikleri doğru yardımcı elemana yerleştir.","data":{"L":["📍 Kenarortay","📐 Açıortay","⬇️ Yükseklik"],"r":[["Karşı kenarı iki eş parçaya ayırır",0],["Köşedeki açıyı iki eş açıya ayırır",1],["Karşı kenara dik iner",2],["Alan hesabında kullanılır",2],["BD = DC",0],["∠BAD = ∠DAC",1]]},"textPlain":"Özellikleri doğru yardımcı elemana yerleştir. Bölmeler: Kenarortay, Açıortay, Yükseklik. Kartlar: Karşı kenarı iki eş parçaya ayırır, Köşedeki açıyı iki eş açıya ayırır, Karşı kenara dik iner, Alan hesabında kullanılır, BD = DC, ∠BAD = ∠DAC.","correctAnswer":"Karşı kenarı iki eş parçaya ayırır → Kenarortay | Köşedeki açıyı iki eş açıya ayırır → Açıortay | Karşı kenara dik iner → Yükseklik | Alan hesabında kullanılır → Yükseklik | BD = DC → Kenarortay | ∠BAD = ∠DAC → Açıortay","explanation":"Kenarortay kenarı, açıortay açıyı ortadan böler; yükseklik karşı kenara diktir ve alan = taban × yükseklik ÷ 2 hesabında kullanılır."},{"questionId":"mat8u9-yardimci-014","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenarortay, açıortay, yükseklik ve üçgen çizimi","outcome":"Üçgende kenarortay, açıortay ve yüksekliği inşa eder; yeterli sayıda elemanının ölçüleri verilen üçgeni çizer.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"orta","group":"yardimci","rank":2,"type":"bin","prompt":"Verilenlerle üçgenin tek türlü çizilip çizilemeyeceğini ayır.","data":{"L":["✅ Tek türlü çizilir","❌ Tek türlü çizilmez"],"r":[["Üç kenar: 5, 6, 7 cm",0],["İki kenar ve aradaki açı",0],["Bir kenar ve iki ucundaki açılar",0],["Üç açı: 50°, 60°, 70°",1],["Yalnızca iki kenar: 4 ve 6 cm",1]]},"textPlain":"Verilenlerle üçgenin tek türlü çizilip çizilemeyeceğini ayır. Bölmeler: Tek türlü çizilir, Tek türlü çizilmez. Kartlar: Üç kenar: 5, 6, 7 cm, İki kenar ve aradaki açı, Bir kenar ve iki ucundaki açılar, Üç açı: 50°, 60°, 70°, Yalnızca iki kenar: 4 ve 6 cm.","correctAnswer":"Üç kenar: 5, 6, 7 cm → Tek türlü çizilir | İki kenar ve aradaki açı → Tek türlü çizilir | Bir kenar ve iki ucundaki açılar → Tek türlü çizilir | Üç açı: 50°, 60°, 70° → Tek türlü çizilmez | Yalnızca iki kenar: 4 ve 6 cm → Tek türlü çizilmez","explanation":"Bir üçgen; üç kenarı, iki kenarı ve aradaki açısı ya da bir kenarı ve bu kenarın iki ucundaki açıları verilince tek türlü çizilir. Yalnızca açılar verilirse aynı biçimde farklı büyüklükte üçgenler çizilir."},{"questionId":"mat8u9-yardimci-015","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenarortay, açıortay, yükseklik ve üçgen çizimi","outcome":"Üçgende kenarortay, açıortay ve yüksekliği inşa eder; yeterli sayıda elemanının ölçüleri verilen üçgeni çizer.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"zor","group":"yardimci","rank":3,"type":"bin","prompt":"Ölçüleri verilen üçgenlerin çizilip çizilemeyeceğini ayır.","data":{"L":["✅ Çizilebilir","❌ Çizilemez"],"r":[["Kenarlar 3, 4, 5 cm",0],["Kenarlar 2, 3, 6 cm",1],["Açılar 90°, 60°, 30°",0],["Açılar 100°, 50°, 40°",1],["Kenarlar 4, 4, 7 cm",0],["Kenarlar 5, 5, 10 cm",1]]},"textPlain":"Ölçüleri verilen üçgenlerin çizilip çizilemeyeceğini ayır. Bölmeler: Çizilebilir, Çizilemez. Kartlar: Kenarlar 3, 4, 5 cm, Kenarlar 2, 3, 6 cm, Açılar 90°, 60°, 30°, Açılar 100°, 50°, 40°, Kenarlar 4, 4, 7 cm, Kenarlar 5, 5, 10 cm.","correctAnswer":"Kenarlar 3, 4, 5 cm → Çizilebilir | Kenarlar 2, 3, 6 cm → Çizilemez | Açılar 90°, 60°, 30° → Çizilebilir | Açılar 100°, 50°, 40° → Çizilemez | Kenarlar 4, 4, 7 cm → Çizilebilir | Kenarlar 5, 5, 10 cm → Çizilemez","explanation":"Kenarlarda her kenar diğer ikisinin toplamından küçük olmalıdır; açılarda iç açıların toplamı 180° olmalıdır."},{"questionId":"mat8u9-yardimci-016","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenarortay, açıortay, yükseklik ve üçgen çizimi","outcome":"Üçgende kenarortay, açıortay ve yüksekliği inşa eder; yeterli sayıda elemanının ölçüleri verilen üçgeni çizer.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"kolay","group":"yardimci","rank":1,"type":"key","prompt":"ABC üçgeninde AD kenarortaydır. BC = 18 cm ise BD kaç cm’dir?","data":{"a":9,"u":"cm"},"textPlain":"ABC üçgeninde AD kenarortaydır. BC = 18 cm ise BD kaç cm’dir?","correctAnswer":"9 cm","explanation":"Kenarortay BC’yi iki eş parçaya ayırır: 18 ÷ 2 = 9."},{"questionId":"mat8u9-yardimci-017","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenarortay, açıortay, yükseklik ve üçgen çizimi","outcome":"Üçgende kenarortay, açıortay ve yüksekliği inşa eder; yeterli sayıda elemanının ölçüleri verilen üçgeni çizer.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"orta","group":"yardimci","rank":2,"type":"key","prompt":"ABC üçgeninde AD açıortaydır. m(∠BAC) = 76° ise m(∠BAD) kaç derecedir?","data":{"a":38,"u":"derece"},"textPlain":"ABC üçgeninde AD açıortaydır. m(∠BAC) = 76° ise m(∠BAD) kaç derecedir?","correctAnswer":"38 derece","explanation":"Açıortay açıyı iki eş parçaya böler: 76 ÷ 2 = 38."},{"questionId":"mat8u9-yardimci-018","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenarortay, açıortay, yükseklik ve üçgen çizimi","outcome":"Üçgende kenarortay, açıortay ve yüksekliği inşa eder; yeterli sayıda elemanının ölçüleri verilen üçgeni çizer.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"orta","group":"yardimci","rank":2,"type":"key","prompt":"Tabanı 12 cm olan üçgenin bu tabana ait yüksekliği 7 cm’dir. Alanı kaç cm²’dir?","data":{"a":42,"u":"cm²"},"textPlain":"Tabanı 12 cm olan üçgenin bu tabana ait yüksekliği 7 cm’dir. Alanı kaç cm²’dir?","correctAnswer":"42 cm²","explanation":"Alan = taban × yükseklik ÷ 2 = 12 × 7 ÷ 2 = 42."},{"questionId":"mat8u9-yardimci-019","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenarortay, açıortay, yükseklik ve üçgen çizimi","outcome":"Üçgende kenarortay, açıortay ve yüksekliği "8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"kolay","group":"kenaraci","rank":1,"type":"key","prompt":"ABC üçgeninde m(∠A) = 70°, m(∠B) = 45° ise m(∠C) kaç derecedir?","data":{"a":65,"u":"derece"},"textPlain":"ABC üçgeninde m(∠A) = 70°, m(∠B) = 45° ise m(∠C) kaç derecedir?","correctAnswer":"65 derece","explanation":"180 − 70 − 45 = 65."},{"questionId":"mat8u9-kenaraci-016","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenar uzunlukları ile açı ölçüleri arasındaki ilişki","outcome":"Üçgenin kenar uzunlukları ile bu kenarların karşısındaki açıların ölçülerini ilişkilendirir.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"orta","group":"kenaraci","rank":2,"type":"key","prompt":"ABC üçgeninde |AB| = |AC| ve m(∠B) = 52° ise m(∠A) kaç derecedir?","data":{"a":76,"u":"derece"},"textPlain":"ABC üçgeninde |AB| = |AC| ve m(∠B) = 52° ise m(∠A) kaç derecedir?","correctAnswer":"76 derece","explanation":"Eş kenarların karşısındaki açılar eşittir: ∠C = 52°; ∠A = 180 − 104 = 76."},{"questionId":"mat8u9-kenaraci-017","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenar uzunlukları ile açı ölçüleri arasındaki ilişki","outcome":"Üçgenin kenar uzunlukları ile bu kenarların karşısındaki açıların ölçülerini ilişkilendirir.","sourceRef":"8. Sınıf Öğretim Programı, 9. Ünite “Üçgenler”","difficulty":"orta","group":"kenaraci","rank":2,"type":"key","prompt":"Kenarları 6, 8 ve 11 cm olan üçgenin en büyük açısı hangi kenarın karşısındadır? Uzunluğunu yaz.","data":{"a":11,"u":"cm"},"textPlain":"Kenarları 6, 8 ve 11 cm olan üçgenin en büyük açısı hangi kenarın karşısındadır? Uzunluğunu yaz.","correctAnswer":"11 cm","explanation":"En büyük açı en uzun kenarın (11 cm) karşısındadır."},{"questionId":"mat8u9-kenaraci-018","grade":8,"subject":"Matematik","unit":"9. Ünite: Üçgenler","topic":"Kenar uzunlukları ile açı ölçüleri arasındaki ilişki","outcome":"Üçgenin kenar uzunlukları ile bu kenarların karşısındaki a
