<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Sözlük Kâşifi</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}
.logo b{color:var(--yel);text-shadow:0 0 8px var(--yel2)}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}
.pill.gold{background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;border-color:#fff}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
#sound{width:34px;height:30px;border-radius:10px;border:1px solid #29d3ff77;background:#0a0820cc;color:#fff;font-size:15px;padding:0}
#track{height:38px;margin:0 8px}
#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}
.chip{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#1b13471a;color:var(--ink2)}
.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}
#go:disabled{filter:grayscale(.8);opacity:.5;box-shadow:0 3px 0 #6a0a3e}
#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}
#fb b{display:block;font:900 19px/1.2 var(--show);margin-bottom:3px}
#fb .ca{display:block;margin:4px 0;padding:4px 8px;border-radius:8px;background:#ff4d5e1a;font-weight:800}
#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}
.blank.ok{background:#c9f5dc;box-shadow:0 2px 0 #146b3e}.blank.bad{background:#ffd0d5;box-shadow:0 2px 0 #7a1420;text-decoration:line-through}
.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}
.frow .fn{font-size:12.5px;font-weight:800;color:#fff;line-height:1.15}
.frow .fn.r{text-align:right}
.frow .mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.frow .mid svg{width:96px;height:16px}
.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}
.evr .n{flex:1 1 auto}.evr .pc{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#e8e2ff;color:#4a3a6a}
.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}
.slot .sb .tok{font-size:12px;padding:4px 8px}
.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:radial-gradient(circle at 50% 30%,#3a2a6a,#1a1238 60%,#0a0818)}
.rock{position:absolute;inset:0;background:radial-gradient(ellipse at 10% 100%,#120c28 0 30%,transparent 31%),radial-gradient(ellipse at 90% 100%,#120c28 0 34%,transparent 35%),radial-gradient(ellipse at 50% -10%,#120c28 0 26%,transparent 27%)}
.gm{position:absolute;width:var(--s);height:calc(var(--s)*1.6);background:linear-gradient(135deg,hsl(var(--h) 100% 80%),hsl(var(--h) 90% 45%));clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);opacity:.18;filter:saturate(.3)}
#gate.on .gm{animation:glow .5s var(--d) forwards}@keyframes glow{to{opacity:1;filter:drop-shadow(0 0 8px hsl(var(--h) 100% 60%))}}
.beam{position:absolute;left:50%;top:100%;width:160vw;height:160vw;margin-left:-80vw;margin-top:-80vw;background:conic-gradient(from 160deg,transparent 0 10deg,#fff6c833 14deg 30deg,transparent 34deg);border-radius:50%;transform:rotate(-40deg);z-index:2;pointer-events:none}
#gate.on .beam{animation:beam 2.8s .2s ease-in-out forwards}@keyframes beam{to{transform:rotate(40deg)}}
.book{position:absolute;left:50%;top:58%;width:min(54vw,220px);aspect-ratio:1.4;margin-left:calc(min(54vw,220px)/-2);z-index:4}
.book i{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(90deg,#e8d4a8,#f8ecd0);border:3px solid #8a5a2a;box-sizing:border-box}
.book i:nth-child(1){left:0;border-radius:8px 0 0 8px}.book i:nth-child(2){right:0;border-radius:0 8px 8px 0;background:linear-gradient(90deg,#f8ecd0,#e8d4a8)}
.book i.cov{left:0;right:0;width:100%;border-radius:8px;background:linear-gradient(135deg,#8a3aba,#4a1a7a);transform-origin:0 50%;z-index:3}
.book i.cov::after{content:"";position:absolute;inset:14%;border:2px solid #ffd23f88;border-radius:6px}
#gate.on .book i.cov{animation:bk .9s 2.4s ease-in forwards}@keyframes bk{to{transform:scaleX(0);opacity:.2}}
.book b{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;opacity:0;z-index:2}
#gate.on .book b{animation:bb .5s 3.1s forwards}@keyframes bb{to{opacity:1;transform:translateY(-30px)}}
.sign11{position:absolute;left:50%;top:6%;width:min(84vw,320px);margin-left:calc(min(84vw,320px)/-2);z-index:7;text-align:center;padding:8px;border-radius:14px;background:#1a1238cc;border:3px solid #7ae8ff;box-shadow:0 0 22px #3ad8ff66}
.sign11 b{display:block;white-space:nowrap;font:900 clamp(22px,7.4vw,32px)/1 var(--show);letter-spacing:1.5px;color:#bff4ff;padding:4px 0;text-shadow:0 0 12px #3ad8ff}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#bff4ff 40%,#8a5aff 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#1a1238;background:linear-gradient(180deg,#bff4ff,#3ad8ff 55%,#1a8ab8);box-shadow:0 6px 0 #0a3a5a,0 0 22px #3ad8ff88;margin-top:6px}
.primary:disabled{opacity:.55;box-shadow:none}
.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}
.status{font-size:13px!important;color:#fff;background:#000a;border-radius:10px;padding:6px 8px}.fine{font-size:12.5px!important}
#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:radial-gradient(circle at 50% 30%,#3a2a6a,#1a1238 60%,#0a0818)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}
.vault{position:absolute;left:6%;right:6%;top:19%;height:42%;z-index:3;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;place-items:center}
.vg{width:clamp(34px,11vw,52px);aspect-ratio:.66;clip-path:polygon(50% 0,100% 30%,80% 100%,20% 100%,0 30%);background:linear-gradient(135deg,hsl(var(--h) 100% 82%),hsl(var(--h) 90% 45%));opacity:0;transform:scale(.2) rotate(-30deg);position:relative}
.vg.x{background:linear-gradient(135deg,#6a6a7a,#3a3a4a)}
#outro.open .vg{animation:vgi .45s var(--d) cubic-bezier(.3,1.5,.5,1) forwards}@keyframes vgi{to{opacity:1;transform:none}}
#outro.open .vg:not(.x){animation:vgi .45s var(--d) cubic-bezier(.3,1.5,.5,1) forwards,vgg 1.6s calc(var(--d) + .5s) infinite alternate}@keyframes vgg{to{filter:drop-shadow(0 0 10px hsl(var(--h) 100% 60%))}}
.medal{position:absolute;left:50%;top:79%;width:136px;margin:-68px 0 0 -68px;aspect-ratio:1;border-radius:50%;display:grid;place-content:center;text-align:center;background:radial-gradient(circle,#ffffff,#bff4ff 62%,#3ad8ff);border:6px solid #8a5aff;box-shadow:0 0 0 4px #1a1238,0 0 30px #3ad8ff;transform:scale(2.5) rotate(-20deg);opacity:0;z-index:6}
.medal div{font:900 10.5px/1.2 var(--show);letter-spacing:1px;color:#1a1238}.medal b{display:block;margin:2px 0;font:900 34px/1 var(--show);color:#1a1238}
#outro.stamp .medal{animation:stamp8 .6s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes stamp8{to{transform:rotate(-6deg);opacity:1}}
.vstat{position:absolute;left:50%;bottom:1.5%;transform:translateX(-50%);z-index:6;white-space:nowrap;font:900 clamp(13px,4.2vw,17px)/1 var(--show);color:#bff4ff;background:#1a1238;border:2px solid #3ad8ff;padding:8px 14px;border-radius:999px;opacity:0}

ost kara günde belli olur..","correctAnswer":"Elif her gün biraz para biriktirip bisiklet aldı. — Damlaya damlaya göl olur. | Kerem hastalanınca yanında yalnızca Can vardı. — Dost kara günde belli olur. | Okuldaki ağaçları birlikte dikip bitirdiler. — Birlikten kuvvet doğar. | Acele edip hata yapan Efe işi baştan yaptı. — Acele işe şeytan karışır.","explanation":"Atasözleri, uzun deneyimlerle oluşmuş, öğüt veren, kalıplaşmış ve genellikle bir yargı bildiren sözlerdir. Sözcükleri değiştirilemez."},{"questionId":"tr8u1-atasozu-009","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Atasözleri","outcome":"Atasözlerinin metne katkısını ve anlamını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"zor","group":"atasozu","rank":3,"type":"link","prompt":"Durumları uygun atasözüyle bağla.","data":{"L":["Düşünmeden konuşan Mert sonra pişman oldu.","Her gün piyano çalışan Ada çok ilerledi.","Komşularıyla iyi geçinen aile her zaman yardım gördü.","Kendi hatasını görmeyen Ege başkasını eleştirdi."],"R":["İşleyen demir ışıldar.","Söz ağızdan bir kere çıkar.","Kendi gözündeki merteği görmez, başkasının gözündeki çöpü görür.","Ev alma, komşu al."],"a":[1,0,3,2],"hl":"Durum","hr":"Atasözü"},"textPlain":"Durumları uygun atasözüyle bağla. Sol: Düşünmeden konuşan Mert sonra pişman oldu. / Her gün piyano çalışan Ada çok ilerledi. / Komşularıyla iyi geçinen aile her zaman yardım gördü. / Kendi hatasını görmeyen Ege başkasını eleştirdi.. Sağ: İşleyen demir ışıldar. / Söz ağızdan bir kere çıkar. / Kendi gözündeki merteği görmez, başkasının gözündeki çöpü görür. / Ev alma, komşu al..","correctAnswer":"Düşünmeden konuşan Mert sonra pişman oldu. — Söz ağızdan bir kere çıkar. | Her gün piyano çalışan Ada çok ilerledi. — İşleyen demir ışıldar. | Komşularıyla iyi geçinen aile her zaman yardım gördü. — Ev alma, komşu al. | Kendi hatasını görmeyen Ege başkasını eleştirdi. — Kendi gözündeki merteği günde belli olur. / el ele vermek.","correctAnswer":"Damlaya damlaya göl olur. → Atasözü | göz atmak → Deyim | Ağaç yaşken eğilir. → Atasözü | kulak asmamak → Deyim | Dost kara günde belli olur. → Atasözü | el ele vermek → Deyim","explanation":"Atasözleri, uzun deneyimlerle oluşmuş, öğüt veren, kalıplaşmış ve genellikle bir yargı bildiren sözlerdir. Sözcükleri değiştirilemez. Deyim, genellikle mecaz anlamlı, kalıplaşmış söz öbeğidir; sözcükleri değiştirilemez ve sırası bozulamaz. Çoğu deyim çekimli bir fiille biter. Atasözü bir yargı bildirir; deyim ise bir kavramı ya da durumu anlatır."},{"questionId":"tr8u1-atasozu-018","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Atasözleri","outcome":"Atasözlerinin metne katkısını ve anlamını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"orta","group":"atasozu","rank":2,"type":"rain","prompt":"Düşen sözleri atasözü ya da deyim sepetine at.","data":{"L":["📜 Atasözü","🎭 Deyim"],"r":[["Sakla samanı, gelir zamanı.",0],["ağzı kulaklarına varmak",1],["Bugünün işini yarına bırakma.",0],["dört gözle beklemek",1],["İşleyen demir ışıldar.",0]]},"textPlain":"Düşen sözleri atasözü ya da deyim sepetine at. Sepetler: Atasözü, Deyim. Düşen kristaller: Sakla samanı, gelir zamanı. / ağzı kulaklarına varmak / Bugünün işini yarına bırakma. / dört gözle beklemek / İşleyen demir ışıldar..","correctAnswer":"Sakla samanı, gelir zamanı. → Atasözü | ağzı kulaklarına varmak → Deyim | Bugünün işini yarına bırakma. → Atasözü | dört gözle beklemek → Deyim | İşleyen demir ışıldar. → Atasözü","explanation":"Atasözleri, uzun deneyimlerle oluşmuş, öğüt veren, kalıplaşmış ve genellikle bir yargı bildiren sözlerdir. Sözcükleri değiştirilemez. Deyim, genellikle mecaz anlamlı, kalıplaşmış söz öbeğidir; sözcükleri değiştirilemez ve sırası bozulamaz. Çoğu deyim çekimli bir fiille biter."},{"questionId":"tr8u1-atasozu-019","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Atasözleri","outcome":"Atasözlerinin metne katkısını ve anlamını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"zor","group":"atasozu","rank":3,"type":"bin","prompt":"Atasözlerini konularına göre ayır.","data":{"L":["🤝 Dayanışma","⏳ Sabır ve emek","🗣️ Söz"],"r":[["Bir elin nesi var, iki elin sesi var.",0],["Damlaya damlaya göl olur.",1],["Tatlı dil yılanı deliğinden çıkarır.",2],["Birlikten kuvvet doğar.",0],["Sabır acıdır, meyvesi tatlıdır.",1],["Söz gümüşse sükût altındır.",2]]},"textPlain":"Atasözlerini konularına göre ayır. Bölmeler: Dayanışma, Sabır ve emek, Söz. Kartlar: Bir elin nesi var, iki elin sesi var. / Damlaya damlaya göl olur. / Tatlı dil yılanı deliğinden çıkarır. / Birlikten kuvvet doğar. / Sabır acıdır, meyvesi tatlıdır. / Söz gümüşse sükût altındır..","correctAnswer":"Bir elin nesi var, iki elin sesi var. → Dayanışma | Damlaya damlaya göl olur. → Sabır ve emek | Tatlı dil yılanı deliğinden çıkarır. → Söz | Birlikten kuvvet doğar. → Dayanışma | Sabır acıdır, meyvesi tatlıdır. → Sabır ve emek | Söz gümüşse sükût altındır. → Söz","explanation":"Atasözleri, uzun deneyimlerle oluşmuş, öğüt veren, kalıplaşmış ve genellikle bir yargı bildiren sözlerdir. Sözcükleri değiştirilemez."},{"questionId":"tr8u1-atasozu-020","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Atasözleri","outcome":"Atasözlerinin metne katkısını ve anlamını belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"orta","group":"atasozu","rank":2,"type":"bin","prompt":"Atasözü ile durumun uyumuna göre ayır.","data":{"L":["✅ Atasözüne uygun","❌ Uygun değil"],"r":[["Damlaya damlaya göl olur. → Her gün bir sayfa okuyan kitabı bitirdi.",0],["Ağaç yaşken eğilir. → Yaşlı adam yeni bir dil öğrendi.",1],["Dost kara günde belli olur. → Arkadaşı hastanede yanından ayrılmadı.",0],["İşleyen demir ışıldar. → Hiç çalışmadan ödül kazandı.",1]]},"textPlain":"Atasözü ile durumun uyumuna göre ayır. Bölmeler: Atasözüne uygun, Uygun değil. Kartlar: Damlaya damlaya göl olur. → Her gün bir sayfa okuyan kitabı bitirdi. / Ağaç yaşken eğilir. → Yaşlı adam yeni bir dil öğrendi. / Dost kara günde belli olur. → Arkadaşı hastanede yanından ayrılmadı. / İşleyen demir ışıldar. → Hiç çalışmadan ödül kazandı..","correctAnswer":"Damlaya damlaya göl olur. → Her gün bir sayfa okuyan kitabı bitirdi. → Atasözüne uygun | Ağaç yaşken eğilir. → Yaşlı adam yeni bir dil öğrendi. → Uygun değil | Dost kara günde belli olur. → Arkadaşı hastanede yanından ayrılmadı. → Atasözüne uygun | İşleyen demir ışıldar. → Hiç çalışmadan ödül kazandı. → Uygun değil","explanation":"Atasözleri, uzun deneyimlerle oluşmuş, öğüt veren, kalıplaşmış ve genellikle bir yargı bildiren sözlerdir. Sözcükleri değiştirilemez."},{"questionId":"tr8u1-ozellik-001","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Somut-soyut, genel-özel anlam; ikileme ve yansıma","outcome":"Kelimelerin somut-soyut, genel-özel anlamlarını ayırt eder; ikileme ve yansıma sözcükleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"kolay","group":"ozellik","rank":1,"type":"collect","prompt":"Soyut anlamlı kristalleri topla.","data":{"w":["sevgi","masa","umut","rüzgâr","korku","kalem","özlem","ses"],"a":[0,2,4,6]},"textPlain":"Soyut anlamlı kristalleri topla. Kristaller: sevgi, masa, umut, rüzgâr, korku, kalem, özlem, ses.","correctAnswer":"sevgi, umut, korku, özlem","explanation":"Somut sözcükler beş duyudan en az biriyle algılanır (masa, rüzgâr); soyut sözcükler duyularla algılanamaz (sevgi, umut). Genel anlam bir türün bütününü, özel anlam ise bir bölümünü karşılar. Rüzgâr ve ses duyularla algılandığı için somuttur."},{"questionId":"tr8u1-ozellik-002","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Somut-soyut, genel-özel anlam; ikileme ve yansıma","outcome":"Kelimelerin somut-soyut, genel-özel anlamlarını ayırt eder; ikileme ve yansıma sözcükleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"orta","group":"ozellik","rank":2,"type":"collect","prompt":"Somut anlamlı kristalleri topla.","data":{"w":["koku","merak","gölge","saygı","gürültü","sabır","sis","hayal"],"a":[0,2,4,6]},"textPlain":"Somut anlamlı kristalleri topla. Kristaller: koku, merak, gölge, saygı, gürültü, sabır, sis, hayal.","correctAnswer":"koku, gölge, gürültü, sis","explanation":"Somut sözcükler beş duyudan en az biriyle algılanır (masa, rüzgâr); soyut sözcükler duyularla algılanamaz (sevgi, umut). Genel anlam bir türün bütününü, özel anlam ise bir bölümünü karşılar. Koku, gölge, gürültü ve sis duyularla algılanır."},{"questionId":"tr8u1-ozellik-003","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"Somut-soyut, genel-özel anlam; ikileme ve yansıma","outcome":"Kelimelerin somut-soyut, genel-özel anlamlarını ayırt eder; ikileme ve yansıma sözcükleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Söz Varlığı (sözcükte ve söz öbeklerinde anlam)","difficulty":"zor","group":"ozellik","rank":3,"type":"collect","prompt":"Yansıma sözcükleri topla.","data":{"w":["şırıl","pırıl","hav","çatırtı","mışıl","gıcırtı","yavaş","vızıltı"],"a":[0,2,3,5,7]},"textPlain":"Yansıma sözcükleri topla. Kristaller: şırıl, pırıl, hav, çatırtı, mışıl, gıcırtı, yavaş, vızıltı.","correctAnswer":"şırıl, hav, çatırtı, gıcırtı, vızıltı","explanation":"İkileme, anlamı güçlendirmek için sözcüklerin tekrarıdır (güle güle, yavaş yavaş, eğri büğrü). Yansıma sözcükler doğadaki seslerin taklidiyle oluşur (şırıl, miyav, çatırtı). “Pırıl” ve “mışıl” ses taklidi değildir; “yavaş” ise ikilemede kullanılır."},{"questionId":"tr8u1-ozellik-004","grade":8,"subject":"Türkçe","unit":"Sözcükte ve Söz Öbeklerinde Anlam","topic":"So
