<style>

:root{--mag:#1a1a2a;--mag2:#3a3a4a;--cyan:#5ab8f0;--cyan2:#2a8ad8;--yel:#ffd23f;--yel2:#c79a00;--ink:#1a1a2a;--ink2:#4a4a5a;--panel:#ffffff}

<script id="question-data" type="application/json">[{"questionId":"tr8u4-sira-001","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"sira","rank":1,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Sabah erkenden kalktım.","Kahvaltımı yaptıktan sonra çantamı hazırladım.","Otobüse yetişmek için hızlıca evden çıktım.","Okula vaktinde ulaştım."],"p":[3,1,0,2]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Okula vaktinde ulaştım. / Kahvaltımı yaptıktan sonra çantamı hazırladım. / Sabah erkenden kalktım. / Otobüse yetişmek için hızlıca evden çıktım.","correctAnswer":"(1) Sabah erkenden kalktım. → (2) Kahvaltımı yaptıktan sonra çantamı hazırladım. → (3) Otobüse yetişmek için hızlıca evden çıktım. → (4) Okula vaktinde ulaştım.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar. Bu paragraf zaman sırasına göre dizilir."},{"questionId":"tr8u4-sira-002","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"sira","rank":1,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Fidanı dikmek için önce bir çukur kazdık.","Ardından fidanı çukura yerleştirip etrafını toprakla doldurduk.","Son olarak bolca su verdik."],"p":[2,1,0]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Son olarak bolca su verdik. / Ardından fidanı çukura yerleştirip etrafını toprakla doldurduk. / Fidanı dikmek için önce bir çukur kazdık.","correctAnswer":"(1) Fidanı dikmek için önce bir çukur kazdık. → (2) Ardından fidanı çukura yerleştirip etrafını toprakla doldurduk. → (3) Son olarak bolca su verdik.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-sira-003","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"sira","rank":2,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Kuşlar sonbaharda güneye göç eder.","Bunun nedeni, soğuk havalarda yiyecek bulmanın zorlaşmasıdır.","Sıcak bölgelerde ise böcek ve tohum boldur.","Bu yüzden kuşlar her yıl binlerce kilometre yol yapar."],"p":[0,2,3,1]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Kuşlar sonbaharda güneye göç eder. / Sıcak bölgelerde ise böcek ve tohum boldur. / Bu yüzden kuşlar her yıl binlerce kilometre yol yapar. / Bunun nedeni, soğuk havalarda yiyecek bulmanın zorlaşmasıdır.","correctAnswer":"(1) Kuşlar sonbaharda güneye göç eder. → (2) Bunun nedeni, soğuk havalarda yiyecek bulmanın zorlaşmasıdır. → (3) Sıcak bölgelerde ise böcek ve tohum boldur. → (4) Bu yüzden kuşlar her yıl binlerce kilometre yol yapar.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar. “Bunun nedeni” ve “Bu yüzden” kendinden önce bir cümle ister."},{"questionId":"tr8u4-sira-004","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"sira","rank":2,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Kitap okumak, kelime hazinemizi zenginleştirir.","Okudukça yeni sözcüklerle tanışırız.","Bu sözcükleri zamanla konuşmalarımızda da kullanırız.","Böylece kendimizi daha iyi ifade ederiz."],"p":[1,0,3,2]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Okudukça yeni sözcüklerle tanışırız. / Kitap okumak, kelime hazinemizi zenginleştirir. / Böylece kendimizi daha iyi ifade ederiz. / Bu sözcükleri zamanla konuşmalarımızda da kullanırız.","correctAnswer":"(1) Kitap okumak, kelime hazinemizi zenginleştirir. → (2) Okudukça yeni sözcüklerle tanışırız. → (3) Bu sözcükleri zamanla konuşmalarımızda da kullanırız. → (4) Böylece kendimizi daha iyi ifade ederiz.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-sira-005","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"sira","rank":3,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Dedem yıllarca köyde öğretmenlik yaptı.","O yıllarda köyde okul binası yoktu.","Dersleri bu yüzden caminin yanındaki küçük bir odada işlerdi.","Bugün o köyde dedemin adını taşıyan bir okul var."],"p":[0,1,3,2]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Dedem yıllarca köyde öğretmenlik yaptı. / O yıllarda köyde okul binası yoktu. / Bugün o köyde dedemin adını taşıyan bir okul var. / Dersleri bu yüzden caminin yanındaki küçük bir odada işlerdi.","correctAnswer":"(1) Dedem yıllarca köyde öğretmenlik yaptı. → (2) O yıllarda köyde okul binası yoktu. → (3) Dersleri bu yüzden caminin yanındaki küçük bir odada işlerdi. → (4) Bugün o köyde dedemin adını taşıyan bir okul var.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-sira-006","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"sira","rank":3,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Plastik atıklar denizlerde büyük bir sorun hâline geldi.","Bu atıklar parçalanarak küçük taneciklere dönüşüyor.","Balıklar bu tanecikleri besin sanarak yutuyor.","Sonuçta plastik, besin zinciri yoluyla sofralarımıza kadar ulaşıyor."],"p":[2,3,0,1]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Balıklar bu tanecikleri besin sanarak yutuyor. / Sonuçta plastik, besin zinciri yoluyla sofralarımıza kadar ulaşıyor. / Plastik atıklar denizlerde büyük bir sorun hâline geldi. / Bu atıklar parçalanarak küçük taneciklere dönüşüyor.","correctAnswer":"(1) Plastik atıklar denizlerde büyük bir sorun hâline geldi. → (2) Bu atıklar parçalanarak küçük taneciklere dönüşüyor. → (3) Balıklar bu tanecikleri besin sanarak yutuyor. → (4) Sonuçta plastik, besin zinciri yoluyla sofralarımıza kadar ulaşıyor.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-sira-007","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"sira","rank":2,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Yağmur yağmaya başladı.","Bahçedeki çocuklar koşarak saçağın altına sığındı.","Yağmur dinince yeniden oyunlarına döndüler."],"p":[1,2,0]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Bahçedeki çocuklar koşarak saçağın altına sığındı. / Yağmur dinince yeniden oyunlarına döndüler. / Yağmur yağmaya başladı.","correctAnswer":"(1) Yağmur yağmaya başladı. → (2) Bahçedeki çocuklar koşarak saçağın altına sığındı. → (3) Yağmur dinince yeniden oyunlarına döndüler.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-sira-008","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"sira","rank":1,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Kek yapmak için önce malzemeleri hazırladık.","Sonra yumurta ve şekeri iyice çırptık.","Un ve sütü ekleyip karışımı kalıba döktük.","Kırk dakika fırında pişirdik."],"p":[2,3,0,1]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Un ve sütü ekleyip karışımı kalıba döktük. / Kırk dakika fırında pişirdik. / Kek yapmak için önce malzemeleri hazırladık. / Sonra yumurta ve şekeri iyice çırptık.","correctAnswer":"(1) Kek yapmak için önce malzemeleri hazırladık. → (2) Sonra yumurta ve şekeri iyice çırptık. → (3) Un ve sütü ekleyip karışımı kalıba döktük. → (4) Kırk dakika fırında pişirdik.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-sira-009","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"sira","rank":3,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Toplantıda herkes farklı bir öneri sundu.","Ancak önerilerin çoğu bütçeyi aşıyordu.","Bunun üzerine en az masraflı öneriyi seçmeye karar verdik."],"p":[1,0,2]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Ancak önerilerin çoğu bütçeyi aşıyordu. / Toplantıda herkes farklı bir öneri sundu. / Bunun üzerine en az masraflı öneriyi seçmeye karar verdik.","correctAnswer":"(1) Toplantıda herkes farklı bir öneri sundu. → (2) Ancak önerilerin çoğu bütçeyi aşıyordu. → (3) Bunun üzerine en az masraflı öneriyi seçmeye karar verdik.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar. “Ancak” bir karşıtlık kurduğu için önceki cümleye bağlıdır."},{"questionId":"tr8u4-sira-010","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"sira","rank":1,"type":"swap","prompt":"İki kat yanlış yere konmuş: Yer değiştirmesi gereken iki bloğa sırayla dokun, katlar düzelsin.","data":{"S":["Ece sabah uyandı.","Yüzünü yıkadı ve giyindi.","Kahvaltıdan sonra okula gitti."],"p":[2,1,0]},"textPlain":"İki kat yanlış yere konmuş: Yer değiştirmesi gereken iki bloğa sırayla dokun, katlar düzelsin. Dizilen bloklar: (1) Kahvaltıdan sonra okula gitti. (2) Yüzünü yıkadı ve giyindi. (3) Ece sabah uyandı.","correctAnswer":"1. ve 3. bloklar yer değiştirmeli","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cüm masıdır..","correctAnswer":"Arılar çalışkan hayvanlardır. → Giriş olabilir | Bu yüzden balları çok değerlidir. → Giriş olamaz | Ayrıca çiçeklerin tozlaşmasını sağlarlar. → Giriş olamaz | Kış, doğanın dinlenme mevsimidir. → Giriş olabilir | Bunun nedeni havanın soğumasıdır. → Giriş olamaz","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-girsonuc-001","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Giriş ve sonuç cümlesi","outcome":"Paragrafın giriş, gelişme ve sonuç bölümlerini belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"girsonuc","rank":1,"type":"keystone","prompt":"Temel taşını koy: Bir paragrafın giriş cümlesi olabilecek bloğu sürükleyip temele bırak.","data":{"o":["Bu yüzden onları korumalıyız.","Ayrıca gölgeleriyle bizi serinletirler.","Örneğin çınarlar yüzyıllarca yaşar.","Ağaçlar, doğanın akciğerleridir."],"a":3,"k":"giriş"},"textPlain":"Temel taşını koy: Bir paragrafın giriş cümlesi olabilecek bloğu sürükleyip temele bırak. Bloklar: Bu yüzden onları korumalıyız. / Ayrıca gölgeleriyle bizi serinletirler. / Örneğin çınarlar yüzyıllarca yaşar. / Ağaçlar, doğanın akciğerleridir.","correctAnswer":"Ağaçlar, doğanın akciğerleridir.","explanation":"Giriş cümlesi genel bir yargıyla konuya girer; önceki bir cümleye gönderme yapan sözcükler (bu, bunun için, ayrıca, çünkü, ancak, örneğin) içermez. Sonuç cümlesi ise paragrafı toparlar; “kısacası, bu yüzden, sonuç olarak” gibi sözlerle başlayabilir."},{"questionId":"tr8u4-girsonuc-002","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Giriş ve sonuç cümlesi","outcome":"Paragrafın giriş, gelişme ve sonuç bölümlerini belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (p  Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"girsonuc","rank":1,"type":"beam","prompt":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç.","data":{"S":["Su hayatın kaynağıdır.","Dünyadaki suyun çok azı içilebilir.","suyu dikkatli kullanmalıyız."],"g":2,"o":["Ancak","Örneğin","Bu yüzden"],"a":2},"textPlain":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç. Paragraf: (1) Su hayatın kaynağıdır. (2) Dünyadaki suyun çok azı içilebilir. (3) ___ suyu dikkatli kullanmalıyız. Bağlayıcılar: Ancak / Örneğin / Bu yüzden","correctAnswer":"Bu yüzden","explanation":"Giriş cümlesi genel bir yargıyla konuya girer; önceki bir cümleye gönderme yapan sözcükler (bu, bunun için, ayrıca, çünkü, ancak, örneğin) içermez. Sonuç cümlesi ise paragrafı toparlar; “kısacası, bu yüzden, sonuç olarak” gibi sözlerle başlayabilir. Sonuç bildiren “bu yüzden” paragrafı toparlar."},{"questionId":"tr8u4-girsonuc-018","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Giriş ve sonuç cümlesi","outcome":"Paragrafın giriş, gelişme ve sonuç bölümlerini belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"girsonuc","rank":2,"type":"beam","prompt":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç.","data":{"S":["Şehirde yaşamın birçok kolaylığı vardır.","hastaneye, okula, markete yakın olmak zaman kazandırır.","Ancak gürültü ve kalabalık insanı yorabilir."],"g":1,"o":["Kısacası","Çünkü","Örneğin"],"a":2},"textPlain":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç. Paragraf: (1) Şehirde yaşamın birçok kolaylığı vardır. (2) ___ hastaneye, okula, markete yakın olmak zaman kazandırır. (3) Ancak gürültü ve kalabalık insanı yorabilir. Bağlayıcılar: Kısacası / Çünkü / Örneğin","correctAnswer":"Örneğin","explanation":"Giriş cümlesi genel bir yargıyla konuya girer; önceki bir cümleye gönderme yapan sözcükler (bu, bunun için, ayrıca, çünkü, ancak, örneğin) içermez. Sonuç cümlesi ise paragrafı toparlar; “kısacası, bu yüzden, sonuç olarak” gibi sözlerle başlayabilir."},{"questionId":"tr8u4-girsonuc-019","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Giriş ve sonuç cümlesi","outcome":"Paragrafın giriş, gelişme ve sonuç bölümlerini belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"girsonuc","rank":3,"type":"beam","prompt":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç.","data":{"S":["Çocukluk anıları insanın hafızasında silinmez.","Yıllar geçse de ilk okul günümüzü hatırlarız.","çocukluk, hayatımızın en canlı sayfasıdır."],"g":2,"o":["Kısacası","Ama","Örneğin"],"a":0},"textPlain":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç. Paragraf: (1) Çocukluk anıları insanın hafızasında silinmez. (2) Yıllar geçse de ilk okul günümüzü hatırlarız. (3) ___ çocukluk, hayatımızın en canlı sayfasıdır. Bağlayıcılar: Kısacası / Ama / Örneğin","correctAnswer":"Kısacası","explanation":"Giriş cümlesi genel bir yargıyla konuya girer; önceki bir cümleye gönderme yapan sözcükler (bu, bunun için, ayrıca, çünkü, ancak, örneğin) içermez. Sonuç cümlesi ise paragrafı toparlar; “kısacası, bu yüzden, sonuç olarak” gibi sözlerle başlayabilir."},{"questionId":"tr8u4-girsonuc-020","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Giriş ve sonuç cümlesi","outcome":"Paragrafın giriş, gelişme ve sonuç bölümlerini belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"girsonuc","rank":2,"type":"beam","prompt":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç.","data":{"S":["Kitap okumak hayal gücünü geliştirir.","kelime hazinemizi de zenginleştirir.","Bu yüzden her gün okumalıyız."],"g":1,"o":["Ayrıca","Kısacası","Ancak"],"a":0},"textPlain":"Kirişi bağla: Boşluğa iki cümleyi bağlayacak uygun bağlayıcıyı vida kutusundan seç. Paragraf: (1) Kitap okumak hayal gücünü geliştirir. (2) ___ kelime hazinemizi de zenginleştirir. (3) Bu yüzden her gün okumalıyız. Bağlayıcılar: Ayrıca / Kısacası / Ancak","correctAnswer":"Ayrıca","explanation":"Ekleme bildiren “ayrıca, bunun yanında” yeni bir yardımcı düşünce getirir."},{"questionId":"tr8u4-bolme-001","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafı ikiye bölme ve bağlayıcılar","outcome":"Paragrafın akışına göre metni bölümlere ayırır; cümleler arasındaki geçişleri sağlayan ifadeleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"bolme","rank":1,"type":"split","prompt":"Ara duvarı ör: Bu metin iki paragraftan oluşmalı. İkinci paragrafın başlayacağı yere duvar koy.","data":{"S":["Köpekler insanın en sadık dostlarıdır.","Sahiplerini korur, onlara her koşulda bağlı kalırlar.","Kediler ise daha bağımsız hayvanlardır.","İstedikleri zaman sevilmeyi, istemedikleri zaman yalnız kalmayı seçerler."],"k":[2]},"textPlain":"Ara duvarı ör: Bu metin iki paragraftan oluşmalı. İkinci paragrafın başlayacağı yere duvar koy. Paragraf: (1) Köpekler insanın en sadık dostlarıdır. (2) Sahiplerini korur, onlara her koşulda bağlı kalırlar. (3) Kediler ise daha bağımsız hayvanlardır. (4) İstedikleri zaman sevilmeyi, istemedikleri zaman yalnız kalmayı seçerler.","correctAnswer":"3. cümleden itibaren ikinci paragraf","explanation":"Bir metin ikiye bölünürken konunun ya da bakış açısının değiştiği yer bulunur. İkinci paragrafın ilk cümlesi yeni bir yönü başlatır; çoğu zaman “ancak, öte yandan, buna karşın” gibi geçiş sözleriyle başlar. Konu köpeklerden kedilere geçiyor."},{"questionId":"tr8u4-bolme-002","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topi rompt":"Geçiş sözlerini görevlerine göre ayır.","data":{"L":["➕ Ekleme","↔️ Karşıtlık","🎯 Sonuç"],"r":[["Ayrıca",0],["Ancak",1],["Bu yüzden",2],["Bunun yanında",0],["Öte yandan",1],["Sonuç olarak",2]]},"textPlain":"Geçiş sözlerini görevlerine göre ayır. Bölmeler: Ekleme, Karşıtlık, Sonuç. Kartlar: Ayrıca / Ancak / Bu yüzden / Bunun yanında / Öte yandan / Sonuç olarak.","correctAnswer":"Ayrıca → Ekleme | Ancak → Karşıtlık | Bu yüzden → Sonuç | Bunun yanında → Ekleme | Öte yandan → Karşıtlık | Sonuç olarak → Sonuç","explanation":"Geçiş sözleri cümleler arasındaki ilişkiyi kurar: ekleme (ayrıca, bunun yanında), karşıtlık (ancak, öte yandan), sonuç (bu yüzden, sonuç olarak)."},{"questionId":"tr8u4-bolme-018","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafı ikiye bölme ve bağlayıcılar","outcome":"Paragrafın akışına göre metni bölümlere ayırır; cümleler arasındaki geçişleri sağlayan ifadeleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"bolme","rank":3,"type":"bin","prompt":"Geçiş sözlerini görevlerine göre ayır.","data":{"L":["🧩 Örnek verir","⏱️ Zaman sırası","↔️ Karşıtlık"],"r":[["Örneğin",0],["Sözgelimi",0],["Ardından",1],["Daha sonra",1],["Buna karşın",2],["Oysa",2]]},"textPlain":"Geçiş sözlerini görevlerine göre ayır. Bölmeler: Örnek verir, Zaman sırası, Karşıtlık. Kartlar: Örneğin / Sözgelimi / Ardından / Daha sonra / Buna karşın / Oysa.","correctAnswer":"Örneğin → Örnek verir | Sözgelimi → Örnek verir | Ardından → Zaman sırası | Daha sonra → Zaman sırası | Buna karşın → Karşıtlık | Oysa → Karşıtlık","explanation":"Geçiş sözleri cümleler arasındaki ilişkiyi kurar."},{"questionId":"tr8u4-bolme-019","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafı ikiye bölme ve bağlayıcılar","outcome":"Paragrafın akışına göre metni bölümlere ayırır; cümleler arasındaki geçişleri sağlayan ifadeleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"bolme","rank":1,"type":"bin","prompt":"Durumları paragrafın bölünüp bölünmeyeceğine göre ayır.","data":{"L":["✂️ Burada bölünür","🔗 Bölünmez"],"r":[["Konu kedilerden köpeklere geçiyor.",0],["Aynı olayın devamı anlatılıyor.",1],["Bakış açısı “öte yandan” ile değişiyor.",0],["Bir önceki cümleye örnek veriliyor.",1]]},"textPlain":"Durumları paragrafın bölünüp bölünmeyeceğine göre ayır. Bölmeler: Burada bölünür, Bölünmez. Kartlar: Konu kedilerden köpeklere geçiyor. / Aynı olayın devamı anlatılıyor. / Bakış açısı “öte yandan” ile değişiyor. / Bir önceki cümleye örnek veriliyor..","correctAnswer":"Konu kedilerden köpeklere geçiyor. → Burada bölünür | Aynı olayın devamı anlatılıyor. → Bölünmez | Bakış açısı “öte yandan” ile değişiyor. → Burada bölünür | Bir önceki cümleye örnek veriliyor. → Bölünmez","explanation":"Bir metin ikiye bölünürken konunun ya da bakış açısının değiştiği yer bulunur. İkinci paragrafın ilk cümlesi yeni bir yönü başlatır; çoğu zaman “ancak, öte yandan, buna karşın” gibi geçiş sözleriyle başlar."},{"questionId":"tr8u4-ekleme-001","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafa cümle ekleme","outcome":"Paragrafın akışına uygun cümleyi belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"ekleme","rank":1,"type":"fill","prompt":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir.","data":{"S":["Arılar, çok çalışkan böceklerdir.",null,"Bu sayede kovanlarında bol bal birikir."],"g":1,"o":["Gün boyu çiçekten çiçeğe uçarak nektar toplarlar.","Kelebekler de çok renklidir.","Bal çayla çok güzel gider."],"a":0},"textPlain":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir. Paragraf: (1) Arılar, çok çalışkan böceklerdir. (2) …… (3) Bu sayede kovanlarında bol bal birikir. Bloklar: Gün boyu çiçekten çiçeğe uçarak nektar toplarlar. / Kelebekler de çok renklidir. / Bal çayla çok güzel gider.","correctAnswer":"Gün boyu çiçekten çiçeğe uçarak nektar toplarlar.","explanation":"Boşluğa gelecek cümle, kendinden önceki cümleyle başlar gibi, sonraki cümleye de zemin hazırlamalıdır; paragrafın konusundan ve akışından çıkmamalıdır."},{"questionId":"tr8u4-ekleme-002","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafa cümle ekleme","outcome":"Paragrafın akışına uygun cümleyi belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"ekleme","rank":1,"type":"fill","prompt":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir.","data":{"S":["Kış geldiğinde hava soğudu.",null,"Çocuklar karda kızak kaydı, kardan adam yaptı."],"g":1,"o":["Yazın denize gitmeyi severim.","Gece boyunca kar yağdı ve her yer bembeyaz oldu.","Okulumuzda yeni bir kütüphane açıldı."],"a":1},"textPlain":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir. Paragraf: (1) Kış geldiğinde hava soğudu. (2) …… (3) Çocuklar karda kızak kaydı, kardan adam yaptı. Bloklar: Yazın denize gitmeyi severim. / Gece boyunca kar yağdı ve her yer bembeyaz oldu. / Okulumuzda yeni bir kütüphane açıldı.","correctAnswer":"Gece boyunca kar yağdı ve her yer bembeyaz oldu.","explanation":"Boşluğa gelecek cümle, kendinden önceki cümleyle başlar gibi, sonraki cümleye de zemin hazırlamalıdır; paragrafın konusundan ve akışından çıkmamalıdır."},{"questionId":"tr8u4-ekleme-003","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafa cümle ekleme","outcome":"Paragrafın akışına uygun cümleyi belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"ekleme","rank":2,"type":"fill","prompt":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir.","data":{"S":["Düzenli uyumak öğrenmeyi kolaylaştırır.","Uyku sırasında beynimiz gün içinde öğrendiklerini düzenler.",null,"Bu yüzden ders çalışmak kadar dinlenmek de önemlidir."],"g":2,"o":["Bazı hayvanlar gündüz uyur.","Yeterince uyumayan biri, öğrendiklerini kolayca unutabilir.","Yatağımı her sabah toplarım."],"a":1},"textPlain":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir. Paragraf: (1) Düzenli uyumak öğrenmeyi kolaylaştırır. (2) Uyku sırasında beynimiz gün içinde öğrendiklerini düzenler. (3) …… (4) Bu yüzden ders çalışmak kadar dinlenmek de önemlidir. Bloklar: Bazı hayvanlar gündüz uyur. / Yeterince uyumayan biri, öğrendiklerini kolayca unutabilir. / Yatağımı her sabah toplarım.","correctAnswer":"Yeterince uyumayan biri, öğrendiklerini kolayca unutabilir.","explanation":"Boşluğa gelecek cümle, kendinden önceki cümleyle başlar gibi, sonraki cümleye de zemin hazırlamalıdır; paragrafın konusundan ve akışından çıkmamalıdır."},{"questionId":"tr8u4-ekleme-004","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafa cümle ekleme","outcome":"Paragrafın akışına uygun cümleyi belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"ekleme","rank":2,"type":"fill","prompt":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir.","data":{"S":[null,"Örneğin bir haberi dinlerken sözü kesilen biri, söyleyeceğini unutabilir.","Bu yüzden konuşanı sonuna kadar dinlemek gerekir."],"g":0,"o":["Karşımızdakinin sözünü kesmek, iletişimi bozar.","Haber bültenleri her gün yayımlanır.","Telefonla konuşmak kolaydır."],"a":0},"textPlain":"Eksik katı tamamla: Boşluğa paragrafın akışına uygun bloğu vinçle indir. Paragraf: (1) …… (2) Örneğin bir haberi dinlerken sözü kesilen biri, söyleyeceğini unutabilir. (3) Bu yüzden konuşanı sonuna kadar dinlemek gerekir. Bloklar: Karşımızdakinin sözünü kesmek, iletişimi bozar. / Haber bültenleri her gün yayımlanır. / Telefonla konuşmak kolaydır."," ışından çıkmamalıdır."},{"questionId":"tr8u4-anlatim-001","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"anlatim","rank":1,"type":"stamp","prompt":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala.","data":{"S":["Fotosentez, bitkilerin güneş ışığını kullanarak besin üretmesidir.","Bu olay yaprakların yeşil kısımlarında gerçekleşir.","Sonucunda havaya oksijen verilir."],"a":0},"textPlain":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala. Paragraf: (1) Fotosentez, bitkilerin güneş ışığını kullanarak besin üretmesidir. (2) Bu olay yaprakların yeşil kısımlarında gerçekleşir. (3) Sonucunda havaya oksijen verilir.","correctAnswer":"Açıklama","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-002","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"anlatim","rank":1,"type":"stamp","prompt":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala.","data":{"S":["Sabah erkenden yola çıktık.","Öğleye doğru köye vardık.","Dedem bizi kapıda karşıladı, hemen bahçeye götürdü."],"a":2},"textPlain":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala. Paragraf: (1) Sabah erkenden yola çıktık. (2) Öğleye doğru köye vardık. (3) Dedem bizi kapıda karşıladı, hemen bahçeye götürdü.","correctAnswer":"Öyküleme","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-003","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"anlatim","rank":1,"type":"stamp","prompt":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala.","data":{"S":["Gölün suyu cam gibi berraktı.","Kıyıdaki söğütler dallarını suya değdirmiş, hafif rüzgârla salınıyordu.","Havada taze çimen kokusu vardı."],"a":3},"textPlain":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala. Paragraf: (1) Gölün suyu cam gibi berraktı. (2) Kıyıdaki söğütler dallarını suya değdirmiş, hafif rüzgârla salınıyordu. (3) Havada taze çimen kokusu vardı.","correctAnswer":"Betimleme","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-004","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"anl artışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-006","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"anlatim","rank":2,"type":"stamp","prompt":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala.","data":{"S":["Kapıyı açtığımda içerisi karanlıktı.","El yordamıyla ışığı aradım.","Tam o sırada arkamdan bir ses geldi.","Dönüp baktığımda kardeşimin gülümsediğini gördüm."],"a":2},"textPlain":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala. Paragraf: (1) Kapıyı açtığımda içerisi karanlıktı. (2) El yordamıyla ışığı aradım. (3) Tam o sırada arkamdan bir ses geldi. (4) Dönüp baktığımda kardeşimin gülümsediğini gördüm.","correctAnswer":"Öyküleme","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-007","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"anlatim","rank":3,"type":"stamp","prompt":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala.","data":{"S":["Kimileri timleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-012","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"anlatim","rank":3,"type":"stamp","prompt":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala.","data":{"S":["Mıknatıslar demir, nikel ve kobalt gibi maddeleri çeker.","Her mıknatısın kuzey ve güney olmak üzere iki kutbu vardır.","Aynı kutuplar birbirini iter, zıt kutuplar çeker."],"a":0},"textPlain":"Proje mührünü bas: Mühür seç ve yukarıdaki paragrafın anlatım biçimini paftaya damgala. Paragraf: (1) Mıknatıslar demir, nikel ve kobalt gibi maddeleri çeker. (2) Her mıknatısın kuzey ve güney olmak üzere iki kutbu vardır. (3) Aynı kutuplar birbirini iter, zıt kutuplar çeker.","correctAnswer":"Açıklama","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-013","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"kolay","group":"anlatim","rank":1,"type":"bin","prompt":"Paragraf parçalarını anlatım biçimine göre ayır.","data":{"L":["📘 Açıklama","📖 Öyküleme"],"r":[["Volkanlar, yerin derinliklerindeki erimiş kayaların yüzeye çıktığı yerlerdir.",0],["Dün akşam eve dönerken yolda eski bir arkadaşımla karşılaştım.",1],["Su, yüz derecede kaynar.",0],["Kapıyı çaldım, kimse açmadı; ben de bahçeye dolandım.",1]]},"textPlain":"Paragraf parçalarını anlatım biçimine göre ayır. Bölmeler: Açıklama, Öyküleme. Kartlar: Volkanlar, yerin derinliklerindeki erimiş kayaların yüzeye çıktığı yerlerdir. / Dün akşam eve dönerken yolda eski bir arkadaşımla karşılaştım. / Su, yüz derecede kaynar. / Kapıyı çaldım, kimse açmadı; ben de bahçeye dolandım..","correctAnswer":"Volkanlar, yerin derinliklerindeki erimiş kayaların yüzeye çıktığı yerlerdir. → Açıklama | Dün akşam eve dönerken yolda eski bir arkadaşımla karşılaştım. → Öyküleme | Su, yüz derecede kaynar. → Açıklama | Kapıyı çaldım, kimse açmadı; ben de bahçeye dolandım. → Öyküleme","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-014","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"anlatim","rank":2,"type":"bin","prompt":"Paragraf parçalarını anlatım biçimine göre ayır.","data":{"L":["🎨 Betimleme","🗣️ Tartışma"],"r":[["Odanın duvarları gök mavisiydi, içeri ılık bir güneş süzülüyordu.",0],["Üniforma gereksiz diyenler yanılıyor; üniforma eşitlik sağlar.",1],["Sarı ışık ıslak kaldırımlarda parlıyordu.",0],["Ödev kaldırılmamalı; tekrar olmadan öğrenme olmaz.",1]]},"textPlain":"Paragraf parçalarını anlatım biçimine göre ayır. Bölmeler: Betimleme, Tartışma. Kartlar: Odanın duvarları gök mavisiydi, içeri ılık bir güneş süzülüyordu. / Üniforma gereksiz diyenler yanılıyor; üniforma eşitlik sağlar. / Sarı ışık ıslak kaldırımlarda m Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"anlatim","rank":2,"type":"bin","prompt":"Paragraf parçalarını anlatım biçimine göre ayır.","data":{"L":["📘 Açıklama","🗣️ Tartışma"],"r":[["Kalp, vücuda kan pompalayan bir organdır.",0],["Fast food yasaklanmalı mı? Bence hayır, bilinçli tüketim yeterlidir.",1],["Güneş, Dünya’ya en yakın yıldızdır.",0],["Bazıları sporun zaman kaybı olduğunu savunur; ama spor zihni de güçlendirir.",1]]},"textPlain":"Paragraf parçalarını anlatım biçimine göre ayır. Bölmeler: Açıklama, Tartışma. Kartlar: Kalp, vücuda kan pompalayan bir organdır. / Fast food yasaklanmalı mı? Bence hayır, bilinçli tüketim yeterlidir. / Güneş, Dünya’ya en yakın yıldızdır. / Bazıları sporun zaman kaybı olduğunu savunur; ama spor zihni de güçlendirir..","correctAnswer":"Kalp, vücuda kan pompalayan bir organdır. → Açıklama | Fast food yasaklanmalı mı? Bence hayır, bilinçli tüketim yeterlidir. → Tartışma | Güneş, Dünya’ya en yakın yıldızdır. → Açıklama | Bazıları sporun zaman kaybı olduğunu savunur; ama spor zihni de güçlendirir. → Tartışma","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-anlatim-020","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Anlatım biçimleri","outcome":"Metindeki anlatım biçimlerini (açıklama, tartışma, öyküleme, betimleme) belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"anlatim","rank":3,"type":"bin","prompt":"Paragraf parçalarını anlatım biçimine göre ayır.","data":{"L":["📘 Açıklama","🗣️ Tartışma","📖 Öyküleme","🎨 Betimleme"],"r":[["Kelebekler yumurta, tırtıl, koza ve ergin evrelerinden geçer.",0],["Kelebek bahçesi açılmalı diyenlere katılıyorum; çünkü doğa bilinci böyle gelişir.",1],["Kozanın kabuğu yavaşça çatladı ve içinden bir kelebek çıktı.",2],["Kelebeğin kanatları turuncu ve siyah desenlerle süslüydü.",3]]},"textPlain":"Paragraf parçalarını anlatım biçimine göre ayır. Bölmeler: Açıklama, Tartışma, Öyküleme, Betimleme. Kartlar: Kelebekler yumurta, tırtıl, koza ve ergin evrelerinden geçer. / Kelebek bahçesi açılmalı diyenlere katılıyorum; çünkü doğa bilinci böyle gelişir. / Kozanın kabuğu yavaşça çatladı ve içinden bir kelebek çıktı. / Kelebeğin kanatları turuncu ve siyah desenlerle süslüydü..","correctAnswer":"Kelebekler yumurta, tırtıl, koza ve ergin evrelerinden geçer. → Açıklama | Kelebek bahçesi açılmalı diyenlere katılıyorum; çünkü doğa bilinci böyle gelişir. → Tartışma | Kozanın kabuğu yavaşça çatladı ve içinden bir kelebek çıktı. → Öyküleme | Kelebeğin kanatları turuncu ve siyah desenlerle süslüydü. → Betimleme","explanation":"Açıklama bilgi verir, öğretir. Tartışma bir görüşü savunur, karşı görüşü çürütmeye çalışır, okuru ikna etmeyi amaçlar. Öyküleme olayları zaman sırasıyla anlatır (kişi, yer, zaman, olay). Betimleme bir varlığı ya da yeri ayırt edici özellikleriyle, duyulara seslenerek resmeder."},{"questionId":"tr8u4-sira-019","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"sira","rank":3,"type":"stack","prompt":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir.","data":{"S":["Pazar sabahı ailece pikniğe gitmeye karar verdik.","Ancak yola çıkmadan hava kararmaya başladı.","Bunun üzerine pikniği bahçede yapmaya karar verdik.","Yağmur başlayınca da sofrayı balkona taşıdık."],"p":[3,0,1,2]},"textPlain":"Vinçle katları diz: Cümle bloklarını paragraf oluşturacak sırayla temelden yukarı doğru yerleştir. Bloklar: Yağmur başlayınca da sofrayı balkona taşıdık. / Pazar sabahı ailece pikniğe gitmeye karar verdik. / Ancak yola çıkmadan hava kararmaya başladı. / Bunun üzerine pikniği bahçede yapmaya karar verdik.","correctAnswer":"(1) Pazar sabahı ailece pikniğe gitmeye karar verdik. → (2) Ancak yola çıkmadan hava kararmaya başladı. → (3) Bunun üzerine pikniği bahçede yapmaya karar verdik. → (4) Yağmur başlayınca da sofrayı balkona taşıdık.","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar. “Ancak”, “Bunun üzerine” ve “da” bağlantıları sırayı belirler."},{"questionId":"tr8u4-sira-020","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragraf oluşturma ve cümle sıralaması","outcome":"Paragrafı oluşturan cümleleri anlamlı bir bütün olacak şekilde sıralar.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"zor","group":"sira","rank":3,"type":"swap","prompt":"İki kat yanlış yere konmuş: Yer değiştirmesi gereken iki bloğa sırayla dokun, katlar düzelsin.","data":{"S":["Okulumuzda geri dönüşüm kampanyası başlatıldı.","Her sınıfa kâğıt, plastik ve cam kutuları kondu.","Ay sonunda en çok atık toplayan sınıf ödüllendirildi.","Kampanyanın sonunda tonlarca atık geri dönüştürüldü."],"p":[0,2,1,3]},"textPlain":"İki kat yanlış yere konmuş: Yer değiştirmesi gereken iki bloğa sırayla dokun, katlar düzelsin. Dizilen bloklar: (1) Okulumuzda geri dönüşüm kampanyası başlatıldı. (2) Ay sonunda en çok atık toplayan sınıf ödüllendirildi. (3) Her sınıfa kâğıt, plastik ve cam kutuları kondu. (4) Kampanyanın sonunda tonlarca atık geri dönüştürüldü.","correctAnswer":"2. ve 3. bloklar yer değiştirmeli","explanation":"Paragrafta cümleler mantık ve zaman sırasına göre dizilir. Giriş cümlesi konuyu açar ve kendinden önce bir cümleye bağlı değildir; “bu, bunun için, ayrıca, ancak” gibi sözlerle başlamaz. Sonuç cümlesi paragrafı toparlar."},{"questionId":"tr8u4-bolme-020","grade":8,"subject":"Türkçe","unit":"Paragrafın Yapısı","topic":"Paragrafı ikiye bölme ve bağlayıcılar","outcome":"Paragrafın akışına göre metni bölümlere ayırır; cümleler arasındaki geçişleri sağlayan ifadeleri belirler.","sourceRef":"8. Sınıf Öğretim Programı, Okuma: Anlam Bilgisi (paragrafın yapısı, anlatım biçimleri)","difficulty":"orta","group":"bolme","rank":2,"type":"split","prompt":"Ara duvarı ör: Bu metin iki paragraftan oluşmalı. İkinci paragrafın başlayacağı yere duvar koy.","data":{"S":["Ormanlar oksijen üretir, iklimi dengeler.","Pek çok canlıya da yuva olur.","Ne var ki her yıl binlerce hektar orman yangınlarla yok oluyor.","Yangınların çoğu dikkatsizlik yüzünden çıkıyor."],"k":[2]},"textPlain":"Ara duvarı ör: Bu metin iki paragraftan oluşmalı. İkinci paragrafın başlayacağı yere duvar koy. Paragraf: (1) Ormanlar oksijen üretir, iklimi dengeler. (2) Pek çok canlıya da yuva olur. (3) Ne var ki her yıl binlerce hektar orman yangınlarla yok oluyor. (4) Yangınların çoğu dikkatsizlik yüzünden çıkıyor.","correctAnswer":"3. cümleden itibaren ikinci paragraf","explanation":"Bir metin ikiye bölünürken konunun ya da bakış açısının değiştiği yer bulunur. İkinci paragrafın ilk cümlesi yeni bir yönü başlatır; çoğu zaman “ancak, öte yandan, buna karşın” gibi geçiş sözleriyle başlar. Ormanların yararlarından yangın sorununa geçiliyor."}]</script>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:'turkce-8-paragraf-mimari',gameVersion:'1.0.0',grade:8,subjectId:'turkish',subjectName:'Türkçe',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([8]),TOTAL=10,RECENT_KEY='tr8-paragraf-mimari-recent',GAME_NAME='Paragraf Mimarı';
const GROUP_LABEL={sira:'s',girsonuc:'g',bolme:'b',ekleme:'e',anlatim:'a'},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,sessionRecent=[],reviewAt=0,okCount=0,points=0,cur=null,timers=[];
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(rnd()*a.length)];}
function stars(n){return n>=9?3:n>=7?2:n>=5?1:0;}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='Uygulamaya bağlanıyor';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='Bu tarayıcı denemesi uygulamaya sonuç kaydetmez.';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();$('card').classList.add('hidden');$('stage').classList.add('hidden');$('dock').classList.add('hidden');$('intro').classList.remove('hidden');$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function osc(f,t0,dur,type,vol,slide){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sfx(kind){if(muted||!audio||document.hidden)return;try{
 if(kind==='tap')osc(640,0,.05,'sine',.05);
 else if(kind==='tick')osc(1150,0,.02,'square',.015);
 else if(kind==='plop')osc(520,0,.08,'sine',.07,880);
 else if(kind==='drop')osc(300,0,.12,'triangle',.06,180);
 else if(kind==='drum'){for(let i=0;i<10;i++)osc(110+rnd()*30,i*.045,.05,'square',.025);}
 else if(kind==='lo'){[784,988,1319].forEach((f,i)=>osc(f,.45+i*.07,.18,'triangle',.07));}
 else if(kind==='hi'){osc(392,.45,.35,'sawtooth',.04,196);osc(330,.6,.4,'triangle',.05,165);}
 else if(kind==='ring'){for(let i=0;i<4;i++){osc(880,i*.22,.09,'square',.03);osc(1100,i*.22+.1,.09,'square',.03);}}
 else if(kind==='cash'){osc(1568,0,.08,'square',.04);osc(2093,.07,.25,'triangle',.06);}
 else if(kind==='ok'){[659,880,1175].forEach((f,i)=>osc(f,i*.08,.18,'triangle',.07));}
 else if(kind==='miss'){osc(330,0,.18,'square',.03,220);osc(247,.14,.22,'triangle',.05);}
 else if(kind==='win'){[523,659,784,1047,784,1047,1319].forEach((f,i)=>osc(f,i*.13,.36,'triangle',.08));}
 else if(kind==='siren'){for(let i=0;i<3;i++){osc(660,i*.5,.25,'square',.018,990);osc(990,i*.5+.25,.25,'square',.018,660);}}
 else if(kind==='creak'){osc(220,0,.4,'sawtooth',.015,160);osc(330,.1,.3,'triangle',.02,250);}
 else if(kind==='zip'){for(let i=0;i<10;i++)osc(1800+rnd()*900,i*.025,.02,'square',.012);}
 else if(kind==='stitch'){for(let i=0;i<5;i++)osc(900,i*.07,.03,'triangle',.03,600);}
 else if(kind==='clip'){osc(1500,0,.04,'square',.03);osc(700,.04,.05,'square',.02);}
 else if(kind==='flame'){osc(180,0,.5,'sawtooth',.015,90);osc(700,0,.4,'sine',.02,1100);}
