<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Editör Masası</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}
.logo b{color:var(--yel);text-shadow:0 0 8px var(--yel2)}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}
.pill.gold{background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;border-color:#fff}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
#sound{width:34px;height:30px;border-radius:10px;border:1px solid #29d3ff77;background:#0a0820cc;color:#fff;font-size:15px;padding:0}
#track{height:38px;margin:0 8px}
#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}
.chip{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#1b13471a;color:var(--ink2)}
.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}
#go:disabled{filter:grayscale(.8);opacity:.5;box-shadow:0 3px 0 #6a0a3e}
#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}
#fb b{display:block;font:900 19px/1.2 var(--show);margin-bottom:3px}
#fb .ca{display:block;margin:4px 0;padding:4px 8px;border-radius:8px;background:#ff4d5e1a;font-weight:800}
#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}
.blank.ok{background:#c9f5dc;box-shadow:0 2px 0 #146b3e}.blank.bad{background:#ffd0d5;box-shadow:0 2px 0 #7a1420;text-decoration:line-through}
.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}
.frow .fn{font-size:12.5px;font-weight:800;color:#fff;line-height:1.15}
.frow .fn.r{text-align:right}
.frow .mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.frow .mid svg{width:96px;height:16px}
.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}
.evr .n{flex:1 1 auto}.evr .pc{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#e8e2ff;color:#4a3a6a}
.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}
.slot .sb .tok{font-size:12px;padding:4px 8px}
.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:linear-gradient(180deg,#3a2418 0,#5a3a26 50%,#4a2e1e 100%)}
.grain{position:absolute;inset:0;background:repeating-linear-gradient(92deg,#ffffff06 0 3px,transparent 3px 19px),repeating-linear-gradient(88deg,#00000010 0 2px,transparent 2px 27px)}
.dlamp{position:absolute;right:-6%;top:-4%;width:60vw;height:60vw;max-width:300px;max-height:300px;border-radius:50%;background:radial-gradient(circle,#ffe8a866,transparent 65%);z-index:1}
.msheet{position:absolute;left:9%;right:9%;top:16%;height:46%;background:#fffdf4;border-radius:4px;box-shadow:0 14px 30px #0007;transform:translateY(-130%) rotate(-8deg);z-index:2;padding:7% 6%;background-image:repeating-linear-gradient(180deg,transparent 0 27px,#c8d8f0 27px 28px)}
#gate.on .msheet{animation:shin .7s .2s cubic-bezier(.3,1.3,.5,1) forwards}@keyframes shin{to{transform:rotate(-2deg)}}
.mline{font:800 clamp(17px,5.4vw,22px)/1.6 var(--show);color:#1a2a4a;position:relative}
.mline i{font-style:normal;position:relative;display:inline-block;margin:0 7px}
.mline i::after{content:"";position:absolute;left:-6px;right:-6px;top:-2px;bottom:-2px;border:3px solid #d8283a;border-radius:50%;clip-path:inset(0 100% 0 0)}
#gate.on .mline i.e1::after{animation:circ .45s 1.2s forwards}#gate.on .mline i.e2::after{animation:circ .45s 1.8s forwards}@keyframes circ{to{clip-path:inset(0 0 0 0)}}
.mline i b{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font:italic 900 15px/1 var(--show);color:#d8283a;white-space:nowrap;opacity:0}
#gate.on .mline i.e1 b{animation:fin .3s 1.6s forwards}#gate.on .mline i.e2 b{animation:fin .3s 2.2s forwards}@keyframes fin{to{opacity:1}}
.mtitle{position:absolute;left:6%;right:6%;bottom:12%;font:900 clamp(20px,6.8vw,30px)/1 'Courier New',monospace;color:#1a2a4a;letter-spacing:1px;white-space:nowrap;overflow:hidden;width:0}
#gate.on .mtitle{animation:typ 1.1s 2.5s steps(13) forwards}@keyframes typ{to{width:88%}}
.rpen{position:absolute;left:80%;top:30%;font-size:44px;z-index:4;transform:rotate(10deg);opacity:0}
#gate.on .rpen{animation:pen 1.4s 1s forwards}@keyframes pen{0%{opacity:1;left:80%;top:30%}35%{left:20%;top:27%}60%{left:60%;top:33%}100%{opacity:1;left:78%;top:38%}}
.gstamp{position:absolute;left:50%;top:68%;transform:translate(-50%,0) scale(3) rotate(-12deg);font:900 clamp(18px,6vw,26px)/1 var(--show);letter-spacing:2px;color:#2a8a4a;border:4px solid #2a8a4a;border-radius:8px;padding:8px 14px;opacity:0;z-index:5;background:#fffdf4cc;white-space:nowrap}
#gate.on .gstamp{animation:gst .35s 3.7s cubic-bezier(.3,1.5,.5,1) forwards}@keyframes gst{to{opacity:1;transform:translate(-50%,0) scale(1) rotate(-8deg)}}
.dk{position:absolute;bottom:4%;font-size:36px;z-index:2}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#fffdf4 40%,#e8c88a 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6a7a,#d8283a 55%,#9a1424);box-shadow:0 6px 0 #5a0a14;margin-top:6px}
.primary:disabled{opacity:.55;box-shadow:none}
.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}
.status{font-size:13px!important;color:#fff;background:#000a;border-radius:10px;padding:6px 8px}.fine{font-size:12.5px!important}
#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,#3a2418 0,#5a3a26 50%,#4a2e1e 100%)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}
.otitle{position:absolute;left:50%;top:4%;transform:translateX(-50%);white-space:nowrap;z-index:7;font:900 clamp(20px,6.6vw,28px)/1 'Courier New',monospace;color:#1a2a4a;background:#fffdf4;border-radius:6px;padding:8px 14px;box-shadow:0 6px 0 #0004}
.book{position:absolute;left:50%;top:15%;width:min(62vw,240px);height:44%;margin-left:calc(min(62vw,240px)/-2);z-index:3;border-radius:4px 10px 10px 4px;background:linear-gradient(90deg,#1a2a4a 0 9%,#24386a 9% 100%);box-shadow:0 14px 30px #0008;display:flex;flex-direction:column;align-items:stretch;justify-content:center;gap:4%;padding:8% 8% 8% 16%}
.book::before{content:"";position:absolute;right:-6px;top:3%;bottom:3%;width:6px;background:repeating-linear-gradient(180deg,#fffdf4 0 2px,#d8d0b8 2px 3px);border-radius:0 3px 3px 0}
.pg8{height:7%;border-radius:3px;background:#fffdf4;opacity:0;transform:translateX(120%);display:flex;align-items:center;justify-content:flex-end;padding-right:4px;font-size:clamp(9px,2.8vw,12px)}
.pg8.x{background:#8a8070}
#outro.open .pg8{animation:pgi .35s var(--d) cubic-bezier(.3,1.4,.5,1) forwards}@keyframes pgi{to{opacity:1;transform:none}}

/* Editör Masası teması */
:root{--mag:#d8283a;--mag2:#9a1424;--cyan:#24386a;--cyan2:#1a2a4a;--yel:#e8b84a;--yel2:#a87a1a;--ink:#1a2a4a;--ink2:#4a5a7a;--panel:#fffdf4}

.prow{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}.prow .opt{padding:8px 12px}
.hint2{text-align:center;font-size:12px;font-weight:800;color:#6a5a4a}
.xtag{align-self:center;text-align:center;font:900 12.5px/1.2 var(--show);color:#fff;background:#24386a;border-radius:999px;padding:7px 14px}
.ghost{opacity:.9;box-shadow:0 10px 24px #0004}
.shake{animation:shk .35s}@keyframes shk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mpage{background:#fffdf4;background-image:repeating-linear-gradient(180deg,transparent 0 33px,#d0dcf0 33px 34px);border:1px solid #d8c8a8;border-left:4px solid #e8a0a8;border-radius:4px;box-shadow:0 6px 14px #0002;padding:14px 10px;display:flex;flex-wrap:wrap;gap:6px 4px;justify-content:center;align-items:center}

.mw.circ{box-shadow:inset 0 0 0 3px #d8283a}
.mw.ok{background:#d8f5e0;border-radius:10px}.mw.bad{background:#ffd8dc;border-radius:10px}.mw.want{background:#fff4c8;border-radius:10px;box-shadow:inset 0 0 0 2px #2a8a4a}

.tkey{border:0;border-radius:50%;aspect-ratio:1;max-width:58px;justify-self:center;width:100%;background:radial-gradient(circle at 40% 35%,#5a5a5a,#1a1a1a);color:#fffdf4;font:900 20px/1 'Courier New',monospace;box-shadow:0 4px 0 #000,inset 0 0 0 3px #8a8a8a;min-height:44px}

ılır | Fransızca + yı → Ayrılmaz | İstanbul + lu → Ayrılmaz | Ayşe + ye → Kesmeyle ayrılır | Türk + ler → Ayrılmaz | Van Gölü + nde → Kesmeyle ayrılır","explanation":"Özel adlara getirilen çekim ekleri kesme işaretiyle ayrılır (Ankara’da, Ayşe’ye). Yapım ekleri ve çokluk eki kesmeyle ayrılmaz (İstanbullu, Türkler); -ca ekiyle kurulan dil adlarına gelen ekler de ayrılmaz (Fransızcayı). Kısaltmalara ve rakamlara gelen ekler kesmeyle ayrılır ve kısaltmanın okunuşuna uyar (TDK’nin = te-de-ke’nin, NATO’ya)."},{"questionId":"tr8u7-buyuk-019","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Büyük harflerin ve kesme işaretinin kullanımı","outcome":"Yazım kurallarını uygular (büyük harf, kesme işareti).","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"orta","group":"buyuk","rank":2,"type":"bin","prompt":"Tırnak içindeki sözcüklerin ilk harfine karar ver.","data":{"L":["🔠 Büyük harfle","🔡 Küçük harfle"],"r":[["“salı” (Toplantı salı günü.)",1],["“mayıs” (19 Mayıs 1919)",0],["“bayramı” (Cumhuriyet Bayramı)",0],["“ingilizce” (dil adı)",0],["“eylül” (Eylül ayında tatil var.)",1],["“bey” (Ali Bey)",0]]},"textPlain":"Tırnak içindeki sözcüklerin ilk harfine karar ver. Tepsiler: Büyük harfle, Küçük harfle. Kartlar: “salı” (Toplantı salı günü.) / “mayıs” (19 Mayıs 1919) / “bayramı” (Cumhuriyet Bayramı) / “ingilizce” (dil adı) / “eylül” (Eylül ayında tatil var.) / “bey” (Ali Bey).","correctAnswer":"“salı” (Toplantı salı günü.) → Küçük harfle | “mayıs” (19 Mayıs 1919) → Büyük harfle | “bayramı” (Cumhuriyet Bayramı) → Büyük harfle | “ingilizce” (dil adı) → Büyük harfle | “eylül” (Eylül ayında tatil var.) → Küçük harfle | “bey” (Ali Bey) → Büyük harfle","explanation":"Cümle büyük harfle başlar. Kişi, yer, kurum, dil, eser, bayram ve gök cisimlerinin (Dünya, Güneş, Ay) adları büyük harfle başlar; yer adlarından -lı ekiyle türeyen sözcükler de büyük yazılır (Ankaralı). Ay ve gün adlar pic":"Bitişik ve ayrı yazılanlar (de, ki, mi; birleşik sözcükler)","outcome":"Yazım kurallarını uygular (bitişik ve ayrı yazılan sözcükler).","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"kolay","group":"bitisik","rank":1,"type":"bin","prompt":"Sözcük parçalarını yazımına göre ayır.","data":{"L":["🔗 Bitişik yazılır","↔️ Ayrı yazılır"],"r":[["bir + çok",0],["bir + şey",1],["her + kes",0],["hiç + bir",0],["her + şey",1],["ya + da",1]]},"textPlain":"Sözcük parçalarını yazımına göre ayır. Tepsiler: Bitişik yazılır, Ayrı yazılır. Kartlar: bir + çok / bir + şey / her + kes / hiç + bir / her + şey / ya + da.","correctAnswer":"bir + çok → Bitişik yazılır | bir + şey → Ayrı yazılır | her + kes → Bitişik yazılır | hiç + bir → Bitişik yazılır | her + şey → Ayrı yazılır | ya + da → Ayrı yazılır","explanation":"Bağlaç olan “de” ve “ki” ile soru eki “mi” ayrı yazılır (Sen de, Duydum ki, Geliyor musun?). Hâl eki “-de” ve sıfat yapan “-ki” bitişik yazılır (Evde, Masadaki). “Herkes, birçok, birkaç, hiçbir” bitişik; “bir şey, her şey, ya da, on beş” ayrı yazılır. Anlam kayması olan birleşik sözcükler bitişik yazılır (hanımeli, açıkgöz)."},{"questionId":"tr8u7-bitisik-019","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Bitişik ve ayrı yazılanlar (de, ki, mi; birleşik sözcükler)","outcome":"Yazım kurallarını uygular (bitişik ve ayrı yazılan sözcükler).","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"orta","group":"bitisik","rank":2,"type":"bin","prompt":"Köşeli ayraçtaki “de/da”ları ayır.","data":{"L":["🔗 Bağlaç “de” (ayrı)","📍 Hâl eki “-de” (bitişik)"],"r":[["Sen [de] bizimle gel.",0],["Ev [de] kimse yok.",1],["Ben [de] biliyorum.",0],["Okul [da] kaldık.",1],["Annem [de] geldi.",0],["Bu kitap sen [de] kalsın.",1]]},"textPlain":"Köşeli ayraçtaki “de/da”ları ayır. Tepsiler: Bağlaç “de” (ayrı), Hâl eki “-de” (bitişik). Kartlar: S sonra gelir",0],["Aktarılan sözden önce konur",1],["Sıralanan örneklerin sürdüğünü gösterir",2]]},"textPlain":"Görev kartlarını işaretlere göre ayır. Tepsiler: Virgül, İki nokta, Üç nokta. Kartlar: Eş görevli sözcükleri ayırır / Açıklama ve örnekten önce gelir / Tamamlanmamış cümlenin sonuna konur / Hitap sözünden sonra gelir / Aktarılan sözden önce konur / Sıralanan örneklerin sürdüğünü gösterir.","correctAnswer":"Eş görevli sözcükleri ayırır → Virgül | Açıklama ve örnekten önce gelir → İki nokta | Tamamlanmamış cümlenin sonuna konur → Üç nokta | Hitap sözünden sonra gelir → Virgül | Aktarılan sözden önce konur → İki nokta | Sıralanan örneklerin sürdüğünü gösterir → Üç nokta","explanation":"Nokta tamamlanmış cümlenin, soru işareti soru bildiren cümlenin, ünlem işareti duygu ve seslenme bildiren cümlenin sonuna konur. Virgül eş görevli sözcükleri, sıralı cümleleri ayırır; hitaptan ve cümle başındaki “evet, hayır, eyvah” gibi sözlerden sonra konur. İki nokta açıklama ve örnekten, alıntıdan önce; noktalı virgül ögeleri virgülle ayrılmış eş görevli öbekler arasında; üç nokta tamamlanmamış cümlenin sonunda kullanılır. Saat ve dakika nokta ile ayrılır (14.30)."},{"questionId":"tr8u7-noktalama-018","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Noktalama işaretleri","outcome":"Noktalama işaretlerini işlevine uygun olarak kullanır.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"orta","group":"noktalama","rank":2,"type":"bin","prompt":"Görev kartlarını işaretlere göre ayır.","data":{"L":["✂️ Kesme işareti","❝ Tırnak işareti","( ) Yay ayraç"],"r":[["Özel ada gelen çekim ekini ayırır",0],["Başkasının sözünü aynen aktarır",1],["Cümle dışında kalan açıklamayı gösterir",2],["Kısaltmaya gelen eki ayırır",0],["Vurgulanan sözü ve eser adını gösterir",1],["Tiyatro metninde hareketleri gösterir",2]]},"textPlain":"Görev kartlarını işaretlere göre ayır. Tepsiler: Kesme işareti, Tırnak işareti, ) Yay ayraç. Kartlar: Özel ada gelen çekim ekini ayırır / Başkasının sözünü aynen aktarır / Cümle dışında kalan açıklamayı gösterir / Kısaltmaya gelen eki ayırır / Vurgulanan sözü ve eser adını gösterir / Tiyatro metninde hareketleri gösterir.","correctAnswer":"Özel ada gelen çekim ekini ayırır → Kesme işareti | Başkasının sözünü aynen aktarır → Tırnak işareti | Cümle dışında kalan açıklamayı gösterir → ) Yay ayraç | Kısaltmaya gelen eki ayırır → Kesme işareti | Vurgulanan sözü ve eser adını gösterir → Tırnak işareti | Tiyatro metninde hareketleri gösterir → ) Yay ayraç","explanation":"Kesme işareti özel adlara ve kısaltmalara gelen ekleri ayırır. Tırnak işareti aktarılan sözleri, vurgulanan sözleri ve eser adlarını gösterir. Yay ayraç cümlenin dışında kalan açıklamaları ve tiyatro metinlerinde hareketleri gösterir."},{"questionId":"tr8u7-noktalama-019","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Noktalama işaretleri","outcome":"Noktalama işaretlerini işlevine uygun olarak kullanır.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"zor","group":"noktalama","rank":3,"type":"bin","prompt":"Kullanım kartlarını işaretlere göre ayır.","data":{"L":["🔸 Virgül","🔹 Noktalı virgül"],"r":[["Hitaptan sonra: “Arkadaşlar, …”",0],["Virgülle ayrılmış öbekler arasında",1],["Cümle başındaki “Evet” sözünden sonra",0],["Sıralı cümleleri ayırırken",0],["Farklı türden eş görevli öbekleri ayırırken",1],["Eş görevli sözcükleri ayırırken",0]]},"textPlain":"Kullanım kartlarını işaretlere göre ayır. Tepsiler: Virgül, Noktalı virgül. Kartlar: Hitaptan sonra: “Arkadaşlar, …” / Virgülle ayrılmış öbekler arasında / Cümle başındaki “Evet” sözünden sonra / Sıralı cümleleri ayırırken / Farklı türden eş görevli öbekleri ayırırken / Eş görevli sözcükleri ayırırken.","correctAnswer":"Hitaptan sonra: “Arkadaşlar, …” → Virgül | Virgülle ayrılmış öbekler arasında → Noktalı virgül | Cümle başındaki “Evet” sözünden sonra → Virgül | Sıralı cümleleri ayırırken → Virgül | Farklı türden eş görevli öbekleri ayırırken → Noktalı virgül | Eş görevli sözcükleri ayırırken → Virgül","explanation":"Nokta tamamlanmış cümlenin, soru işareti soru bildiren cümlenin, ünlem işareti duygu ve seslenme bildiren cümlenin sonuna konur. Virgül eş görevli sözcükleri, sıralı cümleleri ayırır; hitaptan ve cümle başındaki “evet, hayır, eyvah” gibi sözlerden sonra konur. İki nokta açıklama ve örnekten, alıntıdan önce; noktalı virgül ögeleri virgülle ayrılmış eş görevli öbekler arasında; üç nokta tamamlanmamış cümlenin sonunda kullanılır. Saat ve dakika nokta ile ayrılır (14.30)."},{"questionId":"tr8u7-noktalama-020","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Noktalama işaretleri","outcome":"Noktalama işaretlerini işlevine uygun olarak kullanır.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"zor","group":"noktalama","rank":3,"type":"bin","prompt":"Cümleleri işaret kullanımına göre ayır.","data":{"L":["✅ Doğru kullanım","❌ Yanlış kullanım"],"r":[["Nerede kaldın?",0],["Kitabı okudun mu.",1],["Eyvah! Kapı açık kalmış.",0],["Ali, Veli, ve Can geldi.",1],["Bugün hava çok sıcak?",1],["Kardeşim, buraya gel.",0]]},"textPlain":"Cümleleri işaret kullanımına göre ayır. Tepsiler: Doğru kullanım, Yanlış kullanım. Kartlar: Nerede kaldın? / Kitabı okudun mu. / Eyvah! Kapı açık kalmış. / Ali, Veli, ve Can geldi. / Bugün hava çok sıcak? / Kardeşim, buraya gel..","correctAnswer":"Nerede kaldın? → Doğru kullanım | Kitabı okudun mu. → Yanlış kullanım | Eyvah! Kapı açık kalmış. → Doğru kullanım | Ali, Veli, ve Can geldi. → Yanlış kullanım | Bugün hava çok sıcak? → Yanlış kullanım | Kardeşim, buraya gel. → Doğru kullanım","explanation":"Nokta tamamlanmış cümlenin, soru işareti soru bildiren cümlenin, ünlem işareti duygu ve seslenme bildiren cümlenin sonuna konur. Virgül eş görevli sözcükleri, sıralı cümleleri ayırır; hitaptan ve cümle başındaki “evet, hayır, eyvah” gibi sözlerden sonra konur. İki nokta açıklama ve örnekten, alıntıdan önce; noktalı virgül ögeleri virgülle ayrılmış eş görevli öbekler arasında; üç nokta tamamlanmamış cümlenin sonunda kullanılır. Saat ve dakika nokta ile ayrılır (14.30). “ve” bağlacından önce virgül konmaz."},{"questionId":"tr8u7-anlatim-001","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Anlatım bozuklukları","outcome":"Metindeki anlatım bozukluklarını belirler ve düzeltir.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"kolay","group":"anlatim","rank":1,"type":"strike","prompt":"Üstünü çiz: Cümledeki gereksiz sözcüğün üstüne kalemle çizgi çek.","data":{"w":["Bu","konuyu","daha","sonra","tekrar","yeniden","konuşalım."],"a":[4,5]},"textPlain":"Üstünü çiz: Cümledeki gereksiz sözcüğün üstüne kalemle çizgi çek. Taslak: “Bu konuyu daha sonra tekrar yeniden konuşalım.”","correctAnswer":"tekrar ya da yeniden çıkarılmalı","explanation":"Gereksiz sözcük kullanımı bir anlatım bozukluğudur: aynı anlamı taşıyan iki sözcük birlikte kullanılmaz (tekrar yeniden, yaklaşık … kadar, yaşlı ihtiyar, kısa özet, yeni icat)."},{"questionId":"tr8u7-anlatim-002","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Anlatım bozuklukları","outcome":"Metindeki anlatım bozukluklarını belirler ve düzeltir.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"kolay","group":"anlatim","rank":1,"type":"strike","prompt":"Üstünü çiz: Cümledeki gereksiz sözcüğün üstüne kalemle çizgi çek.","data":{"w":["Dedem","yaşlı","bir","ihtiyardır."],"a":[1]},"textPlain":"Üstünü çiz: Cümledeki gereksiz sözcüğün üstüne kalemle çizgi çek. Taslak: “Dedem yaşlı bir ihtiyardır.”","correctAnswer":"yaşlı çıkarılmalı","explanation":"Gereksiz sözcük kullanım  çiz: Cümledeki gereksiz sözcüğün üstüne kalemle çizgi çek.","data":{"w":["Mucit,","yeni","bir","icat","geliştirdi."],"a":[1]},"textPlain":"Üstünü çiz: Cümledeki gereksiz sözcüğün üstüne kalemle çizgi çek. Taslak: “Mucit, yeni bir icat geliştirdi.”","correctAnswer":"yeni çıkarılmalı","explanation":"Gereksiz sözcük kullanımı bir anlatım bozukluğudur: aynı anlamı taşıyan iki sözcük birlikte kullanılmaz (tekrar yeniden, yaklaşık … kadar, yaşlı ihtiyar, kısa özet, yeni icat)."},{"questionId":"tr8u7-anlatim-010","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Anlatım bozuklukları","outcome":"Metindeki anlatım bozukluklarını belirler ve düzeltir.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"kolay","group":"anlatim","rank":1,"type":"sticky","prompt":"Düzelti notu: Cümleyi doğru düzelten yapışkan notu sayfaya yapıştır.","data":{"s":"Ben ve arkadaşım sinemaya gittiler.","o":["Ben ve arkadaşım sinemaya gidiyorlar.","Ben ve arkadaşım sinemaya gitti.","Ben ve arkadaşım sinemaya gittik."],"a":2},"textPlain":"Düzelti notu: Cümleyi doğru düzelten yapışkan notu sayfaya yapıştır. Bozuk cümle: “Ben ve arkadaşım sinemaya gittiler.” Notlar: Ben ve arkadaşım sinemaya gidiyorlar. / Ben ve arkadaşım sinemaya gitti. / Ben ve arkadaşım sinemaya gittik.","correctAnswer":"Ben ve arkadaşım sinemaya gittik.","explanation":"Özne-yüklem uyumsuzluğu: “ben ve arkadaşım” = “biz”, yüklem “gittik” olmalı."},{"questionId":"tr8u7-anlatim-011","grade":8,"subject":"Türkçe","unit":"Yazım Kuralları, Noktalama İşaretleri ve Anlatım Bozuklukları","topic":"Anlatım bozuklukları","outcome":"Metindeki anlatım bozukluklarını belirler ve düzeltir.","sourceRef":"8. Sınıf Öğretim Programı, Yazım ve Noktalama; Anlatım Bozuklukları","difficulty":"kolay","group":"anlatim","rank":1,"type":"sticky","prompt":"Düzelti notu: Cümleyi doğru düzelten yapışkan notu sayfaya yapıştır.","data":{"s":"Kalabalık olduğu için
