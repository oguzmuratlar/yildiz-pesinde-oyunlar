<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Mega Mikro</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}

header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}

.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}

.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}

/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}

.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}

.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}

.sent{display:flex;flex-direction:column;gap:6px}

.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}

.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}

.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}

.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}

.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}

.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}

/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:radial-gradient(circle at 50% 42%,#2a1a6a 0,#0a0a2a 70%)}
.lens{position:absolute;left:50%;top:42%;width:min(70vw,270px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:10px solid #3ae8e8;box-shadow:0 0 0 6px #1a1450,0 0 0 10px #ff5ad8,0 0 50px #3ae8e888,inset 0 0 40px #3ae8e855;background:radial-gradient(circle,#1e1450,#0a0a2a);overflow:hidden;z-index:3}
.zs{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;transform:scale(.3)}

@keyframes zz{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:none}75%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(3)}}

.ring{position:absolute;left:50%;top:42%;width:min(92vw,360px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed #3ae8e866;z-index:2}
#gate.on .ring{animation:spin 3s linear infinite}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.sign11{position:absolute;left:50%;top:4%;width:min(80vw,300px);margin-left:calc(min(80vw,300px)/-2);z-index:7;text-align:center;padding:8px;border-radius:14px;background:#0a0a2aee;border:3px solid #ff5ad8;box-shadow:0 0 20px #ff5ad888}
.sign11 b{display:block;white-space:nowrap;font:900 clamp(26px,8.4vw,36px)/1 var(--show);letter-spacing:2px;color:#3ae8e8;text-shadow:0 0 12px #3ae8e8;padding:4px 0}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#3ae8e8 40%,#ff5ad8 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}

#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}

.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}

.nf{position:absolute;left:50%;top:50%;border-radius:8px;transform:translate(-50%,-50%) scale(.2);opacity:0;border:3px solid #5a5a7a}

#outro.open .nf{animation:nfi .5s var(--d) cubic-bezier(.3,1.4,.5,1) forwards}@keyframes nfi{to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r))}}

#sheet{z-index:50}
.card2{background:var(--panel);border-radius:22px;box-shadow:0 0 0 4px var(--mag),0 0 0 8px var(--cyan),0 14px 40px #000c;padding:12px 16px 16px;text-align:center;width:min(380px,100%);max-height:100%;overflow:auto;position:relative}

.ports{display:flex;justify-content:center;gap:3px;margin:6px 0;flex-wrap:wrap}
.ports i{font-style:normal;font-size:20px}

 $('fb').classList.add('hidden');$('go').classList.remove('hidden');$('go').disabled=true;const myPos=pos;

function finish(q,res){state='review';const ok=!!res.ok;const rec={questionId:q.questionId,isCorrect:ok};
 if(!ok)Object.assign(rec,{questionText:q.textPlain,studentAnswer:res.student,correctAnswer:q.correctAnswer,unit:q.unit,topic:q.topic,outcome:q.outcome,sourceRef:q.sourceRef,explanation:q.explanation});
 answers.push(rec);const R2=reduced();
 if(ok){okCount++;const gain=q.rank*50+50;points+=gain;$('nP').textContent=points;const pl=$('pP');pl.classList.remove('bump');void pl.offsetWidth;if(!R2)pl.classList.add('bump');floatAt(pl,'+'+gain+' 🔭','#9afcfc');sfx('ok');confetti(R2?0:12);}else{sfx('miss');}
 $('nO').textContent=okCount;$('nX').textContent=answers.length-okCount;drawTrack();$('go').classList.add('hidden');const fb=$('fb');fb.className=ok?'':'bad';fb.classList.remove('hidden');
 $('fbT').textContent=ok?pick(['Görüntü netleşti! 🔍','Tam odak! 🔭','Mercek parladı! ✨','Ölçek tuttu! 📏']):pick(['Görüntü bulanık 🌫️','Odak kaçtı 🌫️','Mercek buğulandı 🌫️']);

 $('next').textContent=pos===TOTAL-1?'MERCEĞE BAK 🔭':'SONRAKİ GÖREV ▶';reviewAt=performance.now();$('app').classList.add('rev');$('next').focus({preventScroll:true});zoomOffer(ok);}

function attract(){const G=$('gate');G.className='overlay';void G.offsetWidth;}
function start(){if(!ctx||state!=='ready')return;document.documentElement.classList.toggle('rm',reduced());deck=buildDeck();const ids=deck.map(q=>q.questionId);sessionRecent=[...sessionRecent,...ids].slice(-40);writeRecent([...readRecent(),...ids]);

 const R2=reduced(),G=$('gate');$('intro').classList.add('go');G.className='overlay';$('outro').className='gone';

 setTimeout(()=>{$('intro').classList.add('hidden');$('intro').classList.remove('go');G.classList.add('on');sfx('zoom');},380);

function finale(){state='finishing';const R2=reduced(),O=$('outro');const n=answers.filter(a=>a.isCorrect).length;$('badgeT').textContent=n+'/10';
 $('vstat').textContent=`${n} net görüntü · ${points} 🔭`;const t=$('nest');t.replaceChildren();
 answers.forEach((a,i)=>{const f=document.createElement('div');f.className='nf'+(a.isCorrect?' ok':' x');const sz=100-i*8.5;f.style.width=sz+'%';f.style.height=sz+'%';f.style.setProperty('--r',(i*9)+'deg');f.style.setProperty('--d',(.3+i*.28)+'s');f.innerHTML='<i>10'+['¹⁰','⁸','⁶','⁴','²','⁰','⁻²','⁻⁴','⁻⁶','⁻⁸'][i]+'</i>';t.append(f);});
 O.className='';void O.offsetWidth;O.classList.add('on');sfx('zoom');

function complete(){if(sent||result||answers.length!==TOTAL)return;state='completed';const n=answers.filter(a=>a.isCorrect).length;
 result={bridgeVersion:'1.0',type:'game.completed',messageId:uid('result'),runId:ctx.runId,nonce:ctx.nonce,payload:{gameId:ctx.gameId,gameVersion:ctx.gameVersion,grade:ctx.grade,gameName:GAME_NAME,subjectId:ctx.subjectId,subjectName:ctx.subjectName,stars:stars(n),correctCount:n,wrongCount:TOTAL-n,durationMs:Math.max(0,Math.round(activeMs)),answers:structuredClone(answers)}};

 const ports=`<div class="ports" aria-hidden="true">${answers.map((a,i)=>`<i>${a.isCorrect?(FB&&FB.best[i]?'⭐':'🔍'):'🌫️'}</i>`).join('')}</div>`;
 const body=`<div class="ct">MEGA MİKRO</div><div class="sub">ZOOM KARNESİ</div><div style="font-size:48px;line-height:1">🔭</div><h2 id="sheetTitle">${title}</h2>${ports}<div class="reward">🔭 ${points} PUAN</div><p style="font-size:14px;margin:4px 0">${n} görüntü netleşti, ${TOTAL-n} görüntü bulanık kaldı.</p>`;
 if(nativeMode){openSheet(body+`<p id="saveStatus" class="status" role="status">Sonucun uygulamaya iletiliyor…</p><p class="fine">Yıldızların ve yeniden oynama seçenekleri uygulamanın sonuç ekranında gösterilir.</p>`);if(!sent)sent=send(result);if(!sent)$('saveStatus').textContent='Sonuç uygulamaya iletilemedi. Uygulamadan oyunu yeniden açmayı dene.';}
 else{sent=true;const st=stars(n);openSheet(body+`<div class="stars3" aria-label="${st} yıldız">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}" style="animation-delay:${.15+i*.18}s">★</span>`).join('')}</div><div class="stats"><div><b>${n}/10</b><span>doğru</span></div><div><b>${Math.round(activeMs/1000)} sn</b><span>süre</span></div></div><p id="saveStatus" class="fine">Deneme modu: Sonuç uygulamaya kaydedilmedi.</p><button class="primary" id="retry">YENİ ZOOM 🔭</button>`);$('retry').onclick=()=>{unlockAudio();closeSheet();if(demoInit())start();};}}
function openSheet(html){$('outro').classList.remove('stamp');$('sheetIn').innerHTML=html;$('sheet').classList.remove('hidden');$('sheet').focus({preventScroll:true});}

setInterval(()=>{const now=performance.now(),dt=now-lastTick;lastTick=now;if(!document.hidden&&['playing','running','review'].includes(state))activeMs+=dt;},250);
document.addEventListener('visibilitychange',()=>{lastTick=performance.now();if(document.hidden)audio?.suspend().catch(()=>{});else if(!muted)audio?.resume().catch(()=>{});});

$('reconnect').onclick=()=>{if(state==='waiting')handshake();};
$('start').onclick=()=>{unlockAudio();if(state==='waiting'&&!nativeMode&&!demoInit())return;if(state==='ready')start();};
