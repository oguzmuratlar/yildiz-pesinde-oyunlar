<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>Enerji Şebekesi</title>
<style>
:root{--bg1:#0a0820;--bg2:#1b1347;--mag:#ff3ea5;--mag2:#b0166c;--cyan:#29d3ff;--cyan2:#0a8fb8;--yel:#ffd23f;--yel2:#c79a00;--panel:#fff8ec;--panel2:#ffe9d1;--ink:#1a1033;--ink2:#4a3a6a;--ok:#2fbf71;--bad:#ff4d5e;--hot:#ff5a3c;--cold:#3c8cff;--show:"Arial Rounded MT Bold","Trebuchet MS","Segoe UI",ui-rounded,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg1);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,max-content) minmax(0,1fr) auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow:hidden;background:radial-gradient(ellipse at 50% 0%,#3b1f7a 0,#1b1347 45%,#0a0820 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,#ffffff14 1.2px,transparent 1.6px);background-size:12px 12px;opacity:.7}
#app::after{content:"";position:absolute;left:-30%;right:-30%;top:-10%;height:80%;pointer-events:none;background:conic-gradient(from 160deg at 15% 0%,transparent 0 6deg,#ff3ea522 8deg 16deg,transparent 18deg 360deg),conic-gradient(from 184deg at 85% 0%,transparent 0 6deg,#29d3ff22 8deg 16deg,transparent 18deg 360deg);animation:sweep 9s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(4%) rotate(2deg)}}
#app>*{position:relative;z-index:1}
header{display:flex;align-items:center;gap:6px;padding:8px 10px 2px;min-width:0}
.logo{flex:1;min-width:0;font:900 20px/1 var(--show);color:#fff;text-shadow:0 0 8px var(--mag),0 0 18px var(--mag2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px;font-style:italic}
.logo b{color:var(--yel);text-shadow:0 0 8px var(--yel2)}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:3px;border-radius:999px;padding:4px 9px;font-size:13px;font-weight:900;background:#0a0820cc;color:#fff;border:1px solid #29d3ff77;font-variant-numeric:tabular-nums}
.pill.gold{background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;border-color:#fff}
.pill.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.3)}}
#sound{width:34px;height:30px;border-radius:10px;border:1px solid #29d3ff77;background:#0a0820cc;color:#fff;font-size:15px;padding:0}
#track{height:38px;margin:0 8px}
#track svg{width:100%;height:100%;display:block;overflow:visible}
#card{min-height:0;overflow:auto;margin:4px 10px 4px;border-radius:16px;padding:8px 12px 9px;position:relative;background:var(--panel);box-shadow:0 0 0 3px var(--mag),0 0 0 6px var(--cyan),0 0 22px #ff3ea566,0 8px 18px #0008}
#card.enter{animation:cIn .45s cubic-bezier(.2,1.4,.4,1)}@keyframes cIn{from{transform:translateY(-14px) scale(.96);opacity:0}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 5px}
.chip{font-size:11px;font-weight:900;padding:2px 8px;border-radius:999px;background:#1b13471a;color:var(--ink2)}
.chip.r1{color:#1f8a52}.chip.r2{color:#9a6a00}.chip.r3{color:#c0263a}
#prompt{margin:0;font-size:15.5px;line-height:1.35;font-weight:800}
#stage{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:2px 10px 4px;overflow:hidden}
.sv{flex:1 1 auto;min-height:0;width:100%;display:block;touch-action:none}
svg.sv.box{flex:0 1 auto;height:auto;max-height:100%}
.box{border-radius:14px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66,0 0 14px #29d3ff33}
#dock{padding:4px 10px 8px}
#go{width:100%;height:50px;border:0;border-radius:999px;font:900 18px/1 var(--show);letter-spacing:1px;color:#fff;background:linear-gradient(180deg,#ff6cbd,var(--mag) 55%,var(--mag2));box-shadow:0 5px 0 #6a0a3e,0 0 20px #ff3ea588;text-shadow:0 2px 0 #6a0a3e}
#go:disabled{filter:grayscale(.8);opacity:.5;box-shadow:0 3px 0 #6a0a3e}
#go:not(:disabled){animation:goP 1.6s ease-in-out infinite}@keyframes goP{50%{transform:scale(1.03)}}
#fb{border-radius:16px;padding:10px 12px;background:var(--panel);color:var(--ink);font-size:14.5px;line-height:1.42;font-weight:600;max-height:36vh;overflow:auto;animation:fbin .4s cubic-bezier(.2,1.3,.3,1);border:3px solid var(--ok);box-shadow:0 5px 0 #146b3e,0 0 16px #2fbf7166}
#fb.bad{border-color:var(--bad);box-shadow:0 5px 0 #7a1420,0 0 16px #ff4d5e66}@keyframes fbin{from{transform:translateY(40px) scale(.95);opacity:0}}
#fb b{display:block;font:900 19px/1.2 var(--show);margin-bottom:3px}
#fb .ca{display:block;margin:4px 0;padding:4px 8px;border-radius:8px;background:#ff4d5e1a;font-weight:800}
#next{margin-top:8px;width:100%;height:46px;border:0;border-radius:999px;font:900 17px/1 var(--show);color:#04202e;background:linear-gradient(180deg,#9ff0ff,var(--cyan));box-shadow:0 4px 0 var(--cyan2);position:sticky;bottom:0}
#app.rev #card{max-height:18vh}
.float{position:fixed;z-index:60;font-weight:900;font-size:21px;pointer-events:none;animation:up 1s ease forwards;text-shadow:0 2px 4px #000a}@keyframes up{to{transform:translateY(-40px);opacity:0}}
.ghost{position:fixed;z-index:70;pointer-events:none;transform:rotate(-5deg) scale(1.06);box-shadow:0 12px 24px #0008!important}
/* ortak */
.row{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;align-items:center}
.rl{font:900 12px/1 var(--show);color:var(--yel);min-width:58px;text-align:right}
.opt{border:0;border-radius:12px;padding:7px 9px;font-weight:900;font-size:12.5px;line-height:1.15;background:#fff;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.opt.on{background:linear-gradient(180deg,#fff0a0,var(--yel));box-shadow:0 3px 0 var(--yel2);outline:2px solid #fff}
.opt.ok{background:#c9f5dc;box-shadow:0 3px 0 #146b3e}.opt.bad{background:#ffd0d5;box-shadow:0 3px 0 #7a1420}.opt.miss{outline:2px dashed var(--ok)}
.tray{flex:0 1 auto;min-height:50px;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:6px;padding:6px;border-radius:14px;background:#0a082088;border:2px dashed #29d3ff88;overflow:auto}
.tok{position:relative;border:0;border-radius:12px;padding:6px 11px;font-size:13.5px;font-weight:800;line-height:1.2;color:var(--ink);background:#fff;box-shadow:0 3px 0 #8a6ad0,0 4px 8px #0006;touch-action:none;max-width:100%;text-align:left}
.tok.sel{outline:3px solid var(--yel);transform:translateY(-2px)}
.tok.bad{background:#ffd0d5;animation:shk .45s}.tok.ok{background:#c9f5dc}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.hot{outline:3px solid var(--yel)!important}.tapme{outline:2px dashed #ffd23faa}
.bins{flex:1 1 auto;min-height:0;display:flex;gap:6px;align-items:stretch}
.bin{flex:1 1 0;min-width:0;min-height:96px;border-radius:14px;padding:6px 5px 8px;display:flex;flex-direction:column;gap:4px;background:linear-gradient(180deg,#2a1d66,#1b1347);box-shadow:inset 0 0 0 2px var(--cyan),0 0 12px #29d3ff44;position:relative}
.bin:nth-child(2){box-shadow:inset 0 0 0 2px var(--mag),0 0 12px #ff3ea544}.bin:nth-child(3){box-shadow:inset 0 0 0 2px var(--yel),0 0 12px #ffd23f44}
.bin .bl{font:900 12px/1.15 var(--show);color:#fff;text-align:center}
.bin .ld{display:flex;flex-direction:column;gap:3px}
.bin .tok{font-size:11.5px;padding:4px 7px;box-shadow:0 2px 0 #8a6ad0}
.bin.glow{animation:bglow 1s}@keyframes bglow{40%{box-shadow:inset 0 0 0 3px #fff,0 0 28px 6px var(--yel)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mini{border:0;padding:0;border-radius:12px;background:#120c33;box-shadow:inset 0 0 0 2px #29d3ff66;position:relative;overflow:hidden;display:flex;flex-direction:column}
.mini svg{width:100%;display:block}
.mini .mn{font-size:12px;font-weight:800;color:#fff;padding:0 4px 5px;text-align:center;line-height:1.15}
.mini.on{box-shadow:inset 0 0 0 3px var(--yel),0 0 12px #ffd23f99}
.mini.ok{box-shadow:inset 0 0 0 3px var(--ok)}.mini.bad{box-shadow:inset 0 0 0 3px var(--bad)}.mini.miss{box-shadow:inset 0 0 0 3px var(--ok);outline:2px dashed var(--ok)}
.mini .st{position:absolute;right:5px;top:3px;font-size:16px}
.stk{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stk .opt{text-align:left;font-size:12px;padding:7px 8px}
.sent{display:flex;flex-direction:column;gap:6px}
.line{background:#fff;border-radius:12px;padding:7px 10px;font-size:14px;font-weight:700;line-height:1.9;color:var(--ink);box-shadow:0 3px 0 #8a6ad0}
.blank{border:0;border-radius:8px;padding:2px 8px;margin:0 2px;font-weight:900;font-size:13.5px;background:#ffe9a0;color:#3a2a00;box-shadow:0 2px 0 var(--yel2);line-height:1.4}
.blank.unset{background:#e8e2ff;color:#6a5aa0}
.blank.ok{background:#c9f5dc;box-shadow:0 2px 0 #146b3e}.blank.bad{background:#ffd0d5;box-shadow:0 2px 0 #7a1420;text-decoration:line-through}
.fix{font-size:12px;font-weight:900;color:var(--ok);margin-left:3px}
.frow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:5px;align-items:center;background:#ffffff10;border-radius:12px;padding:5px 6px}
.frow .fn{font-size:12.5px;font-weight:800;color:#fff;line-height:1.15}
.frow .fn.r{text-align:right}
.frow .mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.frow .mid svg{width:96px;height:16px}
.frow .bb{display:flex;gap:3px}.frow .opt{padding:5px 8px;font-size:13px}
.frows{display:flex;flex-direction:column;gap:5px}
.evr{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:6px 8px;background:#fff;color:var(--ink);font-size:12.5px;font-weight:800;text-align:left;box-shadow:0 3px 0 #8a6ad0;line-height:1.2}
.evr .n{flex:1 1 auto}.evr .pc{flex:0 0 auto;font-size:11.5px;font-weight:900;padding:3px 7px;border-radius:999px;background:#e8e2ff;color:#4a3a6a}
.evr.act{outline:3px solid var(--yel)}.evr.ok{background:#c9f5dc}.evr.bad{background:#ffd0d5}
.slots{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;justify-content:center}
.slot{display:flex;align-items:center;gap:6px;border-radius:12px;padding:4px 6px;background:linear-gradient(90deg,#2a1d66,#1b1347);border:2px solid #29d3ff66;position:relative}
.slot .si{font-size:20px;flex:0 0 auto}
.slot .stx{flex:1 1 50%;min-width:0;font-size:12px;font-weight:800;color:#fff;line-height:1.2}
.slot .sb{flex:1 1 50%;min-width:0;min-height:32px;border-radius:10px;border:2px dashed #ffd23f99;display:flex;align-items:center;justify-content:center;padding:2px}
.slot .sb .tok{font-size:12px;padding:4px 8px}
.slot .res{position:absolute;right:6px;top:-9px;font-size:11.5px;font-weight:900;background:#0a0820;color:#fff;padding:2px 7px;border-radius:999px;border:1px solid var(--yel)}
.slot.okk{border-color:var(--ok);box-shadow:0 0 14px #2fbf71aa}.slot.off{border-color:var(--bad);animation:shk .45s}
.stepper{display:flex;align-items:center;gap:4px;justify-content:center}
.stepper button{border:0;border-radius:8px;padding:5px 7px;font-weight:900;font-size:12px;background:#fff;color:var(--ink);box-shadow:0 2px 0 #8a6ad0}
.stepper b{min-width:56px;text-align:center;font:900 18px/1 var(--show);color:var(--yel)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#ffffff10;border-radius:12px;padding:5px 8px}
.srow .fn{font-size:13px;font-weight:800;color:#fff}
.banner{align-self:center;font:900 14px/1 var(--show);padding:7px 14px;border-radius:999px;background:var(--ok);color:#fff;box-shadow:0 3px 0 #146b3e;animation:cIn .4s}
.banner.bad{background:var(--bad);box-shadow:0 3px 0 #7a1420}
.reg{display:flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:14px;background:linear-gradient(180deg,#2a1d66,#1b1347);border:2px solid var(--cyan)}
.reg .lab{font:900 12.5px/1.1 var(--show);color:var(--cyan);max-width:110px;text-align:center}
.reg .dg{display:flex;flex-direction:column;align-items:center;gap:2px}
.reg .dg button{width:40px;height:26px;border:0;border-radius:8px;background:linear-gradient(180deg,#fff0a0,var(--yel));color:#3a2a00;font-weight:900;font-size:13px;box-shadow:0 2px 0 var(--yel2);padding:0}
.reg .dg span{width:40px;height:42px;border-radius:8px;background:#0a0820;display:grid;place-items:center;font:900 28px/1 "Courier New",monospace;color:#ff5a3c;text-shadow:0 0 8px #ff5a3c;box-shadow:inset 0 3px 6px #000a}
.reg .un{font:900 20px/1 var(--show);color:#fff;margin-left:2px}
.reg.ok .dg span{color:var(--ok);text-shadow:0 0 8px var(--ok)}.reg.bad .dg span{color:var(--bad)}
.reg .dg span.roll{animation:roll .18s}@keyframes roll{from{transform:translateY(-6px);opacity:.3}}
/* overlays */
.overlay{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px}
#gate{z-index:40;overflow:hidden;display:block;padding:0;background:linear-gradient(180deg,#02040e 0,#0a1230 60%,#141a30 100%);transition:background 1.4s}
#gate.on{background:linear-gradient(180deg,#0a1840 0,#1a2a6a 60%,#2a2a4a 100%)}
.stars{position:absolute;inset:0 0 40% 0;background-image:radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 45% 50%,#fff,transparent),radial-gradient(1px 1px at 85% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 10% 70%,#fff,transparent);opacity:.7}
.land{position:absolute;left:0;right:0;bottom:0;height:16%;background:linear-gradient(180deg,#1a2a3a,#0a1420);z-index:2}
.plant{position:absolute;left:4%;bottom:16%;width:16%;height:16%;z-index:3;background:linear-gradient(180deg,#5a6a8a,#3a4a6a);border-radius:4px 4px 0 0}
.plant::before{content:"";position:absolute;left:18%;bottom:100%;width:18%;height:70%;background:#4a5a7a}
.plant::after{content:"";position:absolute;left:58%;bottom:100%;width:18%;height:50%;background:#4a5a7a}
.fan{position:absolute;left:12%;bottom:calc(16% + 16% + 8%);width:44px;height:44px;margin-left:-22px;z-index:4;border-radius:50%;background:conic-gradient(#cfe8ff 0 10%,transparent 10% 33%,#cfe8ff 33% 43%,transparent 43% 66%,#cfe8ff 66% 76%,transparent 76%)}
#gate.on .fan{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.pyl{position:absolute;bottom:16%;width:22px;height:34%;margin-left:-11px;z-index:3;background:linear-gradient(90deg,transparent 45%,#8a9ab8 45% 55%,transparent 55%),repeating-linear-gradient(45deg,transparent 0 6px,#8a9ab855 6px 8px);clip-path:polygon(50% 0,100% 100%,0 100%)}
.pyl::after{content:"";position:absolute;left:-6px;right:-6px;top:12%;height:3px;background:#8a9ab8}
.wire{position:absolute;left:20%;right:12%;bottom:calc(16% + 34% * .86);height:3px;background:#5a6a8a;z-index:2;overflow:hidden}
.wire::after{content:"";position:absolute;left:-20%;top:0;width:20%;height:100%;background:linear-gradient(90deg,transparent,#fff6a0,#ffd23f,transparent);opacity:0}
#gate.on .wire{background:#ffd23f88;box-shadow:0 0 10px #ffd23f}#gate.on .wire::after{opacity:1;animation:flow 1s .3s linear infinite}@keyframes flow{to{left:100%}}
.hs{position:absolute;width:6%;margin-left:-3%;z-index:3;background:#2a3450;border:2px solid #3a4a6a}
.win{position:absolute;width:24%;height:16%;background:#1a2030;transition:background .3s}
#gate.on .win{background:#fff6a0;box-shadow:0 0 6px #ffd23f;transition-delay:1.6s}
.city{position:absolute;right:0;bottom:16%;width:30%;height:22%;z-index:2;background:repeating-linear-gradient(90deg,#1e2840 0 14%,#26304a 14% 22%);clip-path:polygon(0 40%,14% 40%,14% 10%,30% 10%,30% 30%,46% 30%,46% 0,64% 0,64% 25%,80% 25%,80% 50%,100% 50%,100% 100%,0 100%)}
.city::after{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 3px at 20% 50%,#fff6a0,transparent),radial-gradient(2px 3px at 38% 30%,#fff6a0,transparent),radial-gradient(2px 3px at 55% 20%,#fff6a0,transparent),radial-gradient(2px 3px at 72% 45%,#fff6a0,transparent),radial-gradient(2px 3px at 90% 70%,#fff6a0,transparent),radial-gradient(2px 3px at 50% 70%,#fff6a0,transparent);opacity:0;transition:opacity .4s 1.8s}
#gate.on .city::after{opacity:1}
.sign11{position:absolute;left:50%;top:22%;width:min(86vw,330px);margin-left:calc(min(86vw,330px)/-2);z-index:7;text-align:center;padding:10px 8px;border-radius:14px;background:#0a1230ee;border:3px solid #3a4a6a;transition:border-color .5s,box-shadow .5s}
.sign11 b{display:block;white-space:nowrap;font:900 clamp(24px,8vw,34px)/1 var(--show);letter-spacing:1px;color:#8a9ab8;padding:4px 0;transition:color .3s,text-shadow .3s}
#gate.on .sign11{border-color:#ffd23f;box-shadow:0 0 30px #ffd23f66;transition-delay:2.1s}#gate.on .sign11 b{color:#ffd23f;text-shadow:0 0 12px #ffd23f;transition-delay:2.1s}
.spark{position:absolute;left:20%;bottom:calc(16% + 34% * .86 - 8px);width:18px;height:18px;margin-left:-9px;border-radius:50%;background:radial-gradient(circle,#fff,#ffd23f 50%,transparent 70%);z-index:5;opacity:0}
#gate.on .spark{animation:spk 1.6s .2s ease-in forwards}@keyframes spk{0%{opacity:1;left:20%}90%{opacity:1;left:86%}100%{opacity:0;left:88%}}
.pflash{position:fixed;inset:0;z-index:41;pointer-events:none;background:radial-gradient(circle,#ffffff,#fff6a0 40%,#ffd23f 65%,transparent 85%);opacity:0}
.pflash.on{animation:pf .8s ease-out forwards}@keyframes pf{0%{opacity:0;transform:scale(.3)}30%{opacity:.9}100%{opacity:0;transform:scale(1.4)}}
#gate.go{transition:opacity .6s .1s;opacity:0;pointer-events:none}
#gate.gone{visibility:hidden;pointer-events:none}
#intro{z-index:45;align-items:end;padding-bottom:max(18px,env(safe-area-inset-bottom));pointer-events:none}
#intro .panel{pointer-events:auto}
#intro.go .panel{animation:pout .4s ease forwards}@keyframes pout{to{transform:translateY(120%);opacity:0}}
.panel{width:min(360px,100%);max-height:100%;overflow:auto;background:transparent;color:var(--ink);border-radius:18px;padding:6px;text-align:center}
#intro .panel{animation:pin .7s .6s cubic-bezier(.2,1.3,.3,1) both}@keyframes pin{from{transform:translateY(130%)}}
.panel h2{margin:4px 0;font:900 25px/1.1 var(--show);color:var(--ink)}
.panel p{margin:6px 0;font-size:14.5px;line-height:1.4}
.primary{width:100%;min-height:58px;border:0;border-radius:14px;padding:14px;font:900 clamp(19px,5.4vw,23px)/1 var(--show);letter-spacing:1px;color:#0a1230;background:linear-gradient(180deg,#fff6a0,#ffd23f 55%,#e8a820);box-shadow:0 6px 0 #6a4a0a,0 0 26px #ffd23f88;margin-top:6px}
.primary:disabled{opacity:.55;box-shadow:none}
.ghostbtn{border:2px solid var(--mag);background:#fff;border-radius:10px;padding:8px 12px;font-weight:800;margin-top:8px}
.status{font-size:13px!important;color:#fff;background:#000a;border-radius:10px;padding:6px 8px}.fine{font-size:12.5px!important}
#mode{display:inline-block;font-size:12px;font-weight:800;background:#000a;color:#fff;border-radius:999px;padding:4px 10px}
#outro{position:fixed;inset:0;z-index:35;overflow:hidden;pointer-events:none;opacity:0;transition:opacity .5s;background:linear-gradient(180deg,#02040e 0,#0a1230 60%,#141a30 100%)}
#outro.on{opacity:1}#outro.gone{visibility:hidden}

 → Birbirini iter","explanation":"Aynı cins yükler birbirini iter, zıt cins yükler birbirini çeker. Yüklü bir cisim nötr bir cismi de çeker. İki nötr cisim arasında elektriksel etkileşim olmaz."},{"questionId":"fen8u7-yuk-020","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik yükleri, sürtünme ile elektriklenme ve yüklerin etkileşimi","outcome":"Elektrik yüklerini sınıflandırır; sürtünme, dokunma ve etki ile elektriklenmeyi ve aynı/zıt yüklerin etkileşimini açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"orta","group":"yuk","rank":2,"type":"bin","prompt":"Kartları doğru bölmeye yerleştir.","data":{"L":["🤚 Sürtünme","👆 Dokunma","🫳 Etki"],"r":[["Kazağı çıkarırken saçların kabarması",0],["Yüklü çubuğun nötr metal küreye değdirilmesi",1],["Yüklü çubuk yaklaşınca nötr kürenin bir ucunun +, diğer ucunun − olması",2],["Saça sürtülen tarağın yüklenmesi",0],["Yüklü balon yaklaşınca nötr duvarın yüzeyindeki yüklerin yer değiştirmesi",2],["Yüklü kürenin nötr küreye dokundurulup ayrılması",1]]},"textPlain":"Kartları doğru bölmeye yerleştir. Bölmeler: Sürtünme, Dokunma, Etki. Kartlar: Kazağı çıkarırken saçların kabarması, Yüklü çubuğun nötr metal küreye değdirilmesi, Yüklü çubuk yaklaşınca nötr kürenin bir ucunun +, diğer ucunun − olması, Saça sürtülen tarağın yüklenmesi, Yüklü balon yaklaşınca nötr duvarın yüzeyindeki yüklerin yer değiştirmesi, Yüklü kürenin nötr küreye dokundurulup ayrılması.","correctAnswer":"Kazağı çıkarırken saçların kabarması → Sürtünme | Yüklü çubuğun nötr metal küreye değdirilmesi → Dokunma | Yüklü çubuk yaklaşınca nötr kürenin bir ucunun +, diğer ucunun − olması → Etki | Saça sürtülen tarağın yüklenmesi → Sürtünme | Yüklü balon yaklaşınca nötr duvarın yüzeyindeki yüklerin yer değiştirmesi → Etki | Yüklü kürenin nötr küreye dokundurulup ayrılması → Dokunma","explanation":"Sürtünmede iki cisim zıt yüklerle yüklenir. Dokunmada yüklü cisim, dokunduğu cisimle yükünü paylaşır; iki cisim aynı cins yüklenir. Etkide yüklü cisim yaklaştırılır ama dokunmaz; nötr cismin yükleri yer değiştirir, toplam yükü değişmez."},{"questionId":"fen8u7-yuk-021","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik yükleri, sürtünme ile elektriklenme ve yüklerin etkileşimi","outcome":"Elektrik yüklerini sınıflandırır; sürtünme, dokunma ve etki ile elektriklenmeyi ve aynı/zıt yüklerin etkileşimini açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"zor","group":"yuk","rank":3,"type":"bin","prompt":"Kartları doğru bölmeye yerleştir.","data":{"L":["✅ Doğru","❌ Yanlış"],"r":[["Sürtünmede protonlar bir cisimden diğerine geçer",1],["Elektron kazanan cisim negatif yüklenir",0],["Dokunma ile elektriklenmede iki cisim aynı cins yükle yüklenir",0],["Etki ile elektriklenmede cismin toplam yükü değişir",1],["Nötr cisimde proton ve elektron sayısı eşittir",0]]},"textPlain":"Kartları doğru bölmeye yerleştir. Bölmeler: Doğru, Yanlış. Kartlar: Sürtünmede protonlar bir cisimden diğerine geçer, Elektron kazanan cisim negatif yüklenir, Dokunma ile elektriklenmede iki cisim aynı cins yükle yüklenir, Etki ile elektriklenmede cismin toplam yükü değişir, Nötr cisimde proton ve elektron sayısı eşittir.","correctAnswer":"Sürtünmede protonlar bir cisimden diğerine geçer → Yanlış | Elektron kazanan cisim negatif yüklenir → Doğru | Dokunma ile elektriklenmede iki cisim aynı cins yükle yüklenir → Doğru | Etki ile elektriklenmede cismin toplam yükü değişir → Yanlış | Nötr cisimde proton ve elektron sayısı eşittir → Doğru","explanation":"Elektriklenmede yalnızca elektronlar yer değiştirir. Elektron kazanan cisim negatif, kaybeden pozitif yüklenir. Dokunmada cisimler aynı cins yüklenir; etkide yalnızca yükler cisim içinde yer değiştirir, toplam yük değişmez. Nötr cisimde proton ve elektron sayıları eşittir."},{"questionId":"fen8u7-skop-001","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektroskop, topraklama, yıldırım ve paratoner","outcome":"Elektroskobun işlevini açıklar; topraklamanın önemini ve yıldırımdan korunma yollarını açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"kolay","group":"skop","rank":1,"type":"scope","prompt":"Nötr elektroskobun topuzuna negatif yüklü çubuk dokunduruldu. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç.","data":{"s0":0,"rod":-1,"act":"touch","a":[1,-1],"ask":"net"},"textPlain":"Nötr elektroskobun topuzuna negatif yüklü çubuk dokunduruldu. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç. Elektroskop başlangıçta nötr. Çubuk: negatif (−).","correctAnswer":"Yapraklar daha çok açılır; elektroskobun toplam yükü negatif (−).","explanation":"Dokunma ile elektriklenmede elektroskop çubukla aynı cins yükle yüklenir; yapraklar aynı cins yüklendiği için birbirini iterek açılır."},{"questionId":"fen8u7-skop-002","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektroskop, topraklama, yıldırım ve paratoner","outcome":"Elektroskobun işlevini açıklar; topraklamanın önemini ve yıldırımdan korunma yollarını açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"kolay","group":"skop","rank":1,"type":"scope","prompt":"Nötr elektroskobun topuzuna pozitif yüklü çubuk dokunduruldu. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç.","data":{"s0":0,"rod":1,"act":"touch","a":[1,1],"ask":"net"},"textPlain":"Nötr elektroskobun topuzuna pozitif yüklü çubuk dokunduruldu. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç. Elektroskop başlangıçta nötr. Çubuk: pozitif (+).","correctAnswer":"Yapraklar daha çok açılır; elektroskobun toplam yükü pozitif (+).","explanation":"Dokunma ile elektriklenmede elektroskop çubukla aynı cins yükle yüklenir; yapraklar aynı cins yüklendiği için birbirini iterek açılır."},{"questionId":"fen8u7-skop-003","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektroskop, topraklama, yıldırım ve paratoner","outcome":"Elektroskobun işlevini açıklar; topraklamanın önemini ve yıldırımdan korunma yollarını açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"kolay","group":"skop","rank":1,"type":"scope","prompt":"Pozitif yüklü elektroskobun topuzu toprağa bağlandı. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç.","data":{"s0":1,"rod":0,"act":"ground","a":[-1,0],"ask":"net"},"textPlain":"Pozitif yüklü elektroskobun topuzu toprağa bağlandı. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç. Elektroskop başlangıçta pozitif (+). Topraklama yapılıyor.","correctAnswer":"Yapraklar kapanır (açıklık azalır); elektroskobun toplam yükü nötr.","explanation":"Topraklanan yüklü elektroskop ile toprak arasında elektron alışverişi olur; elektroskop nötr olur ve yapraklar kapanır."},{"questionId":"fen8u7-skop-004","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektroskop, topraklama, yıldırım ve paratoner","outcome":"Elektroskobun işlevini açıklar; topraklamanın önemini ve yıldırımdan korunma yollarını açıklar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"orta","group":"skop","rank":2,"type":"scope","prompt":"Nötr elektroskoba negatif yüklü çubuk dokunmadan yaklaştırıldı. Yaprakların son açıklığını sürükle; elektroskobun toplam yükünü topuza dokunarak seç.","data":{"s0":0,"rod":-1,"act":"near","a":[1,0],"ask":"net"},"textPlain":"Nötr elektroskoba negatif yüklü çubuk dokunma meye yerleştir.","data":{"L":["⚡ Gücü büyük","🔋 Gücü küçük"],"r":[["Ütü",0],["LED lamba",1],["Elektrikli fırın",0],["Telefon şarj aleti",1]]},"textPlain":"Kartları doğru bölmeye yerleştir. Bölmeler: Gücü büyük, Gücü küçük. Kartlar: Ütü, LED lamba, Elektrikli fırın, Telefon şarj aleti.","correctAnswer":"Ütü → Gücü büyük | LED lamba → Gücü küçük | Elektrikli fırın → Gücü büyük | Telefon şarj aleti → Gücü küçük","explanation":"Isı üreten araçların (ütü, fırın, ısıtıcı) güçleri genellikle büyüktür; LED lamba ve şarj aleti gibi araçların güçleri küçüktür. Güç büyüdükçe aynı sürede daha çok enerji harcanır."},{"questionId":"fen8u7-donusum-019","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik enerjisinin ısı, ışık ve hareket enerjisine dönüşümü; güç ve enerji","outcome":"Elektrik enerjisinin ısı, ışık veya hareket enerjisine dönüşümünü örneklerle açıklar; harcanan enerjiyi güç ve süreyle ilişkilendirir.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"orta","group":"donusum","rank":2,"type":"bin","prompt":"Kartları doğru bölmeye yerleştir.","data":{"L":["⬆️ Isı artar","⬇️ Isı azalır"],"r":[["Isıtıcı daha uzun süre çalıştırılırsa",0],["Aynı sürede daha güçlü ısıtıcı kullanılırsa",0],["Isıtıcının çalışma süresi kısaltılırsa",1],["Daha düşük güçlü ısıtıcı kullanılırsa",1]]},"textPlain":"Kartları doğru bölmeye yerleştir. Bölmeler: Isı artar, Isı azalır. Kartlar: Isıtıcı daha uzun süre çalıştırılırsa, Aynı sürede daha güçlü ısıtıcı kullanılırsa, Isıtıcının çalışma süresi kısaltılırsa, Daha düşük güçlü ısıtıcı kullanılırsa.","correctAnswer":"Isıtıcı daha uzun süre çalıştırılırsa → Isı artar | Aynı sürede daha güçlü ısıtıcı kullanılırsa → Isı artar | Isıtıcının çalışma süresi kısaltılırsa → Isı azalır | Daha düşük güçlü ısıtıcı kullanılırsa → Isı azalır","explanation":"Elektrikli bir ısıtıcının verdiği ısı enerjisi, gücü ve çalışma süresi arttıkça artar."},{"quest n enerji artar."},{"questionId":"fen8u7-tasarruf-018","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik enerjisinin bilinçli ve tasarruflu kullanımı; enerji etiketi","outcome":"Elektrik enerjisini tasarruflu kullanmaya yönelik önerilerde bulunur; enerji etiketini yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"zor","group":"tasarruf","rank":3,"type":"meter","prompt":"Klima 1000 W, vantilatör 50 W. Evde serinlemek için toplam 4 saat cihaz çalışacak ve toplam enerji 1,15 kWh olmalı. İki cihazın sürelerini ayarla.","data":{"r":[["Klima","❄️",1000,4,0],["Vantilatör","🌀",50,4,0]],"E":1.15,"min":0,"hs":4},"textPlain":"Klima 1000 W, vantilatör 50 W. Evde serinlemek için toplam 4 saat cihaz çalışacak ve toplam enerji 1,15 kWh olmalı. İki cihazın sürelerini ayarla. Cihazlar: Klima 1000 W (en çok 4 saat), Vantilatör 50 W (en çok 4 saat). Hedef: 1.15 kWh.","correctAnswer":"Klima 1 saat, Vantilatör 3 saat → 1.15 kWh","explanation":"Elektrikli bir aracın harcadığı enerji, gücü ile çalışma süresinin çarpımıdır: E = P × t. 1000 W (1 kW) güçteki araç 1 saat çalışınca 1 kWh enerji harcar. Güç büyüdükçe ya da süre uzadıkça harcanan enerji artar."},{"questionId":"fen8u7-tasarruf-019","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik enerjisinin bilinçli ve tasarruflu kullanımı; enerji etiketi","outcome":"Elektrik enerjisini tasarruflu kullanmaya yönelik önerilerde bulunur; enerji etiketini yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"kolay","group":"tasarruf","rank":1,"type":"bin","prompt":"Kartları doğru bölmeye yerleştir.","data":{"L":["💰 Tasarruf sağlar","💸 Enerjiyi boşa harcar"],"r":[["Odadan çıkarken ışığı kapatmak",0],["Şarj aletini prizde bırakmak",1],["LED lamba kullanmak",0],["Buzdolabının kapısını açık unutmak",1]]},"textPlain":"Kartları doğru bölmeye yerleştir. Bölmeler: Tasarruf sağlar, Enerjiyi boşa harcar. Kartlar: Odadan çıkarken ışığı kapatmak, Şarj aletini prizde bırakmak, LED lamba kullanmak, Buzdolabının kapısını açık unutmak.","correctAnswer":"Odadan çıkarken ışığı kapatmak → Tasarruf sağlar | Şarj aletini prizde bırakmak → Enerjiyi boşa harcar | LED lamba kullanmak → Tasarruf sağlar | Buzdolabının kapısını açık unutmak → Enerjiyi boşa harcar","explanation":"Kullanılmayan cihazları kapatmak, fişi çekmek, cihazları tam dolu çalıştırmak, gün ışığından yararlanmak, verimli (A sınıfı, LED) araçlar seçmek ve ısıyı dışarı kaçırmamak elektrik enerjisinden tasarruf sağlar."},{"questionId":"fen8u7-tasarruf-020","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik enerjisinin bilinçli ve tasarruflu kullanımı; enerji etiketi","outcome":"Elektrik enerjisini tasarruflu kullanmaya yönelik önerilerde bulunur; enerji etiketini yorumlar.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"orta","group":"tasarruf","rank":2,"type":"bin","prompt":"Kartları doğru bölmeye yerleştir.","data":{"L":["✅ Doğru","❌ Yanlış"],"r":[["A sınıfı cihaz aynı işi daha az enerjiyle yapar",0],["Bekleme modundaki cihaz hiç enerji harcamaz",1],["Enerji etiketi yıllık enerji tüketimini gösterir",0],["Gücü büyük olan cihaz her zaman daha az enerji harcar",1]]},"textPlain":"Kartları doğru bölmeye yerleştir. Bölmeler: Doğru, Yanlış. Kartlar: A sınıfı cihaz aynı işi daha az enerjiyle yapar, Bekleme modundaki cihaz hiç enerji harcamaz, Enerji etiketi yıllık enerji tüketimini gösterir, Gücü büyük olan cihaz her zaman daha az enerji harcar.","correctAnswer":"A sınıfı cihaz aynı işi daha az enerjiyle yapar → Doğru | Bekleme modundaki cihaz hiç enerji harcamaz → Yanlış | Enerji etiketi yıllık enerji tüketimini gösterir → Doğru | Gücü büyük olan cihaz her zaman daha az enerji harcar → Yanlış","explanation":"Enerji etiketi cihazın yıllık tüketimini ve sınıfını gösterir; A sınıfı en verimlidir. Bekleme modundaki cihazlar da enerji harcar. Harcanan enerji güç ve süreye bağlıdır; aynı sürede gücü büyük olan daha çok enerji harcar."},{"questionId":"fen8u7-santral-001","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik enerjisinin üretildiği santraller ve kaynakları","outcome":"Elektrik enerjisinin üretildiği santralleri, kullandıkları kaynakları ve enerji dönüşümlerini açıklar; avantaj ve dezavantajlarını tartışır.","sourceRef":"8. Sınıf Öğretim Programı, 7. Ünite “Elektrik Yükleri ve Elektrik Enerjisi”","difficulty":"kolay","group":"santral","rank":1,"type":"map","prompt":"Santral kartlarını haritada en uygun yere sürükle.","data":{"L":[["🏞️","Barajlı, hızlı akan büyük nehir"],["💨","Sürekli güçlü rüzgâr alan tepe"],["☀️","Yılın çoğu bulutsuz, geniş düzlük"]],"P":["Hidroelektrik santrali","Rüzgâr santrali","Güneş santrali"]},"textPlain":"Santral kartlarını haritada en uygun yere sürükle. Yerler: Barajlı, hızlı akan büyük nehir; Sürekli güçlü rüzgâr alan tepe; Yılın çoğu bulutsuz, geniş düzlük. Kartlar: Hidroelektrik santrali, Rüzgâr santrali, Güneş santrali.","correctAnswer":"Barajlı, hızlı akan büyük nehir → Hidroelektrik santrali | Sürekli güçlü rüzgâr alan tepe → Rüzgâr santrali | Yılın çoğu bulutsuz, geniş düzlük → Güneş santrali","explanation":"Santral, kullandığı kaynağın bulunduğu yere kurulur: hidroelektrik santrali barajlı akarsulara, rüzgâr santrali sürekli rüzgâr alan yerlere, güneş santrali güneşlenme süresi uzun yerlere, jeotermal santral yer altı sıcak su ve buharının olduğu bölgelere, termik santral kömür kaynaklarının yakınına kurulur."},{"questionId":"fen8u7-santral-002","grade":8,"subject":"Fen Bilimleri","unit":"7. Ünite: Elektrik Yükleri ve Elektrik Enerjisi","topic":"Elektrik enerjisinin üretildiği santraller ve kaynakları","outcome":"Elektrik enerjisinin üretildiği santralleri, kullandıkları kaynakl <script>

const CONFIG=Object.freeze({gameId:'fen-8-enerji-sebekesi',gameVersion:'1.0.0',grade:8,subjectId:'science',subjectName:'Fen Bilimleri',locale:'tr-TR',orientation:'portrait'});

function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(a){return a[Math.floor(rnd()*a.length)];}

/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='Uygulamaya bağlanıyor';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='Bu tarayıcı denemesi uygulamaya sonuç kaydetmez.';}}

function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){

  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();$('card').classList.add('hidden');$('stage').classList.add('hidden');$('dock').classList.add('hidden');$('intro').classList.remove('hidden');$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}

function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function osc(f,t0,dur,type,vol,slide){const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);}
function sfx(kind){if(muted||!audio||document.hidden)return;try{
 if(kind==='tap')osc(640,0,.05,'sine',.05);

 else if(kind==='creak'){osc(220,0,.4,'sawtooth',.015,160);osc(330,.1,.3,'triangle',.02,250);}
 else if(kind==='zip'){for(let i=0;i<10;i++)osc(1800+rnd()*900,i*.025,.02,'square',.012);}

 else if(kind==='paper'){for(let i=0;i<6;i++)osc(2000+rnd()*2000,i*.04,.03,'square',.008);}
 else if(kind==='beam'){osc(500,0,.5,'sine',.03,1400);}
 else if(kind==='thunder'){const n=Math.floor(audio.sampleRate*1.2),bf=audio.createBuffer(1,n,audio.sampleRate),d=bf.getChannelData(0);for(let i=0;i<n;i++){d[i]=(rnd()*2-1)*Math.pow(1-i/n,2);}const src=audio.createBufferSource(),g=audio.createGain(),f=audio.createBiquadFilter();f.type='lowpass';f.frequency.value=400;g.gain.value=.25;src.buffer=bf;src.connect(f);f.connect(g);g.connect(master);src.start();}
 else if(kind==='lamp'){[523,659,784,1047].forEach((f,i)=>osc(f,i*.08,.4,'sine',.04));}
