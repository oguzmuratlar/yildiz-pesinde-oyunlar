<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Dev Ahtapot</title>
<style>
:root{--c1:#ff5f8f;--c2:#12b5b0;--deep:#0b3a5b;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:normal;text-align:center;width:92%;font-size:clamp(20px,6.6vw,26px);line-height:1.15}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}
.bin{min-width:0;border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px;max-width:100%;overflow-wrap:anywhere}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.slot{position:absolute;width:13%;aspect-ratio:1;transform:translate(-50%,-50%);z-index:3}
.slot .pearl{position:absolute;inset:14%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#fdf3ff 30%,#e9d3ff 62%,#b98cf0 100%);box-shadow:0 0 10px rgba(255,255,255,.9),0 0 2px #fff}
.slot .wrap{position:absolute;inset:0;border-radius:50%;border:5px solid var(--c1);border-left-color:transparent;transform:rotate(30deg);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);transition:transform .7s,opacity .7s}
.slot.free .wrap{transform:rotate(-260deg) scale(1.9);opacity:0}
.slot.free .pearl{animation:float 1s .4s forwards}
@keyframes float{to{transform:translateY(-140px) scale(.4);opacity:0}}
.cloud{position:absolute;width:44%;height:54%;top:14%;border-radius:50%;z-index:4;background:radial-gradient(circle at 40% 45%,#3a2450 0 35%,rgba(40,20,60,.85) 55%,rgba(40,20,60,0) 72%);opacity:0;transform:scale(.3);transition:transform .6s,opacity .6s;pointer-events:none}
.cloud.l{left:4%}.cloud.r{right:4%}
.cloud.on{opacity:1;transform:scale(1)}
.cloud.blown{opacity:0;transform:scale(1.8) translateY(-30px)}
#splat{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(circle at 30% 40%,rgba(35,15,50,.92) 0 18%,transparent 19%),radial-gradient(circle at 70% 30%,rgba(35,15,50,.9) 0 13%,transparent 14%),radial-gradient(circle at 55% 70%,rgba(35,15,50,.9) 0 22%,transparent 23%),radial-gradient(circle at 18% 78%,rgba(35,15,50,.85) 0 9%,transparent 10%)}
#splat.on{animation:splat 1s ease forwards}
@keyframes splat{0%{opacity:0;transform:scale(.6)}15%{opacity:1;transform:scale(1)}70%{opacity:.85}100%{opacity:0}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>
<div id="conf" aria-hidden="true"></div>

: "Güneş, Dünya ve Ay’ın birbirine göre hareketlerini ve hacimsel büyüklüklerini temsil eden model oluşturma.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı 1. Kitap, 1. Ünite “Gökyüzündeki Komşularımız ve Biz”, s. 37, 47", "difficulty": "orta", "group": "f1", "rank": 2, "type": "match", "prompt": "Her hareketi tamamlanma süresiyle eşleştir.", "data": {"pairs": [["Dünya’nın kendi ekseni etrafında bir tur dönmesi", "24 saat"], ["Dünya’nın Güneş etrafında bir tur dolanması", "365 gün 6 saat"], ["Ay’ın evrelerinin bir kez tamamlanması", "29,5 gün"]]}, "textPlain": "Hareketleri süreleriyle eşleştir: Dünya’nın kendi ekseni etrafında dönmesi; Dünya’nın Güneş etrafında dolanması; Ay evrelerinin tamamlanması. Süreler: 24 saat, 365 gün 6 saat, 29,5 gün.", "correctAnswer": "Dünya’nın dönmesi = 24 saat; Dünya’nın Güneş etrafında dolanması = 365 gün 6 saat; Ay evreleri = 29,5 gün", "explanation": "Dünya kendi ekseni etrafında 24 saatte döner, Güneş etrafındaki dolanmasını yaklaşık 365 gün 6 saatte tamamlar. Ay’ın evreleri yaklaşık 29,5 günde tamamlanır."}, {"questionId": "boss-a01-f1-04", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ünite: Gökyüzündeki Komşularımız ve Biz", "topic": "Güneş ve Ay", "outcome": "Ay’ın yapısı, özellikleri ve hareketleri ile ilgili bilgilere ulaşma ve bu bilgileri kaydetme.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı 1. Kitap, 1. Ünite “Gökyüzündeki Komşularımız ve Biz”, s. 22–33", "difficulty": "orta", "group": "f1", "rank": 2, "type": "sort2", "prompt": "Her bilgi kartını ait olduğu gök cisminin kutusuna koy.", "data": {"bins": ["Güneş", "Ay"], "items": [["Bir ışık kaynağıdır", 0], ["Yüzeyinde çok sayıda krater vardır", 1], ["Sıcak gazlardan ve katmanlardan oluşur", 0], ["Atmosferi yok denecek kadar incedir", 1], ["Dünya’nın doğal uydusudur", 1]]}, "textPlain": "Kartları Güneş ve Ay olarak ayır: Bir ışık kaynağıdır; Yüzeyinde çok sayıda krater vardır; Sıcak gazlardan ve katmanlardan oluşur; Atmosferi yok denecek kadar incedir; Dünya’nın doğal uydusudur.", "correctAnswer": "Güneş: ışık kaynağıdır, sıcak gazlardan ve katmanlardan oluşur. Ay: krater vardır, atmosferi çok incedir, Dünya’nın doğal uydusudur.", "explanation": "Güneş sıcak gazlardan oluşan bir yıldızdır ve ışık kaynağıdır. Ay, Dünya’nın uydusudur; atmosferi çok ince olduğu için yüzeyinde çok sayıda krater bulunur."}, {"questionId": "boss-a01-f1-05", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ünite: Gökyüzündeki Komşularımız ve Biz", "topic": "Güneş’in dönme hareketi", "outcome": "Güneş’in yapısı ve dönme hareketi ile ilgili bilgilere ulaşma ve bu bilgileri kaydetme.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı 1. Kitap, 1. Ünite “Gökyüzündeki Komşularımız ve Biz”, s. 24", "difficulty": "orta", "group": "f1", "rank": 2, "type": "tf", "prompt": "Bir gözlemci, Güneş lekelerinin günler içinde hep aynı yöne kaydığını görüyor. Bu gözlem, Güneş’in kendi ekseni etrafında döndüğünü gösterir.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? Güneş lekelerinin günler içinde aynı yöne kayması, Güneş’in kendi ekseni etrafında döndüğünü gösterir.", "correctAnswer": "Doğru", "explanation": "Lekelerin düzenli olarak aynı yöne kayması, Güneş’in kendi ekseni etrafında döndüğünün kanıtıdır."}, {"questionId": "boss-a01-f1-06", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ünite: Gökyüzündeki Komşularımız ve Biz", "topic": "Ay’ın evreleri", "outcome": "Ay’ın evrelerini gözlemleyerek temsil eden bilimsel model oluşturma.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı 1. Kitap, 1. Ünite “Gökyüzündeki Komşularımız ve Biz”, s. 39–40", "difficulty": "zor", "group": "f1", "rank": 3, "type": "choice", "prompt": "Şekilde Ay’ın dolunay evresi görülüyor. Yaklaşık bir hafta sonra gözlenecek ana evre hangisidir?", "data": {"options": ["Son dördün", "İlk dördün", "Yeni ay"], "fig": {"k": "phase", "p": "dolunay"}}, "textPlain": "[Şekil: Doluna Kütlesi de ağırlığı da aynı kalır."]}, "textPlain": "Kütlesi 30 kg olan astronot Ay’a gidiyor. Hangisi doğrudur? Seçenekler: Kütlesi aynı, ağırlığı azalır / Kütlesi azalır, ağırlığı aynı / İkisi de aynı", "correctAnswer": "Kütlesi aynı kalır, ağırlığı azalır.", "explanation": "Kütle madde miktarıdır, yer değiştirince değişmez. Ay’ın çekim kuvveti Dünya’nınkinden az olduğu için ağırlık azalır."}, {"questionId": "boss-a01-f2-05", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: Kuvveti Tanıyalım", "topic": "Kütle ve ağırlık", "outcome": "Kütleye etki eden yer çekimi kuvvetini ağırlık olarak tanımlar; kütle ve ağırlığı karşılaştırır.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı, 2. Ünite “Kuvveti Tanıyalım”, s. 72–75", "difficulty": "orta", "group": "f2", "rank": 2, "type": "match", "prompt": "Her aracı ya da kavramı doğru açıklamasıyla eşleştir.", "data": {"pairs": [["Eşit kollu terazi", "Kütleyi ölçer"], ["Dinamometre", "Ağırlığı ölçer"], ["Newton", "Kuvvetin birimidir"]]}, "textPlain": "Eşleştir: Eşit kollu terazi, Dinamometre, Newton — Kütleyi ölçer, Ağırlığı ölçer, Kuvvetin birimidir.", "correctAnswer": "Eşit kollu terazi = kütleyi ölçer; Dinamometre = ağırlığı ölçer; Newton = kuvvetin birimidir", "explanation": "Kütle eşit kollu teraziyle, ağırlık bir kuvvet olduğu için dinamometreyle ölçülür. Kuvvetin birimi newtondur."}, {"questionId": "boss-a01-f2-06", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: Kuvveti Tanıyalım", "topic": "Sürtünme kuvveti", "outcome": "Sürtünme kuvvetinin çeşitli ortamlardaki etkilerine yönelik akıl yürütür; sürtünmeyi artırma ve azaltmaya yönelik model tasarlar.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı, 2. Ünite “Kuvveti Tanıyalım”, s. 80, 86", "difficulty": "zor", "group": "f2", "rank": 3, "type": "sort2", "prompt": "Her önlem sürtünmeyi artırır mı, azaltır mı? Kartları ayır.", "data": {"bins": ["Sürtünmeyi artırır", "Sürtünmeyi azaltır"], "items": [["Kışın tekerleklere zincir takmak", 0], ["Gıcırdayan menteşeyi yağlamak", 1], ["Buzlu yola kum dökmek", 0], ["Kızağın altını cilalamak", 1], ["Ayakkabı tabanını tırtıklı yapmak", 0]]}, "textPlain": "Önlemleri sürtünmeyi artıran / azaltan diye ayır: Tekerleğe zincir; Menteşeyi yağlamak; Buzlu yola kum; Kızağı cilalamak; Tırtıklı taban.", "correctAnswer": "Artırır: zincir, kum, tırtıklı taban. Azaltır: menteşeyi yağlamak, kızağı cilalamak.", "explanation": "Yüzeyi pürüzlü hâle getirmek sürtünmeyi artırır; yağlamak ve cilalamak yüzeyi kayganlaştırıp sürtünmeyi azaltır."}, {"questionId": "boss-a01-f2-07", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: Kuvveti Tanıyalım", "topic": "Hava direnci", "outcome": "Hava ve su direncinin cisimlerin hareketine etkisini açıklar; araç tasarımlarıyla ilişkilendirir.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı, 2. Ünite “Kuvveti Tanıyalım”, s. 88", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Bir paraşütçü yere daha yavaş inmek istiyor. Hangi değişiklik işine yarar?", "data": {"options": ["Daha geniş yüzeyli bir paraşüt kullanmak", "Daha dar yüzeyli bir paraşüt kullanmak", "Paraşütün rengini değiştirmek"]}, "textPlain": "Paraşütçü daha yavaş inmek istiyor. Hangisi işe yarar? Seçenekler: Daha geniş paraşüt / Daha dar paraşüt / Rengini değiştirmek", "correctAnswer": "Daha geniş yüzeyli bir paraşüt kullanmak", "explanation": "Yüzey genişledikçe hava direnci artar; paraşüt daha yavaş düşer. Renk hava direncini etkilemez."}, {"questionId": "boss-a01-f2-08", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: Kuvveti Tanıyalım", "topic": "Su direnci", "outcome": "Hava ve su direncinin cisimlerin hareketine etkisini açıklar; araç tasarımlarıyla ilişkilendirir.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı, 2. Ünite “Kuvveti Tanıyalım”, s. 88", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Balıkların ve denizaltıların önünün sivri, gövdesinin akıcı biçimde olmasının yararı nedir?", "data": {"options": ["Su direncini azaltıp kolay ilerlemek", "Su direncini artırıp hızlanmak", "Ağırlıklarını artırıp batmak"]}, "textPlain": "Balık ve denizaltının sivri, akıcı biçiminin yararı nedir? Seçenekler: Su direncini azaltmak / Su direncini artırmak / Ağırlığı artırmak", "correctAnswer": "Su direncini azaltıp kolay ilerlemek", "explanation": "Sivri ve akıcı biçim suyun karşı koymasını, yani su direncini azaltır; böylece daha kolay ve hızlı ilerlenir."}, {"questionId": "boss-a01-m1-01", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "Açı çeşitleri", "outcome": "Açıları standart birimle (derece) ölçebilme ve açı çeşitlerini belirleyebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Geometrik Şekiller”, s. 43", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "choice", "prompt": "Şekildeki açı hangi açı çeşididir?", "data": {"options": ["Geniş açı", "Dar açı", "Dik açı"], "fig": {"k": "angle", "d": 125}}, "textPlain": "[Şekil: ölçüsü 90°’den büyük, 180°’den küçük bir açı (125°)] Şekildeki açı hangi açı çeşididir? Seçenekler: Geniş açı / Dar açı / Dik açı", "correctAnswer": "Geniş açı", "explanation": "Ölçüsü 90°’den büyük, 180°’den küçük açılar geniş açıdır."}, {"questionId": "boss-a01-m1-02", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "Temel geometrik çizimler", "outcome": "Temel geometrik çizimleri (nokta, doğru, doğru parçası, ışın, çember, dikme) tanıyıp gösterimlerini kullanabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Geometrik Şekiller”, s. 18 (şekil ekranda çizilir)", "difficulty": "kolay", "group": "m1", "rank": 1, "type": "choice", "prompt": "Bir başlangıç noktası olan ve bir yönde sınırsız uzayan çizgiye ne ad verilir?", "data": {"options": ["Işın", "Doğru parçası", "Doğru"], "fig": {"k": "ray"}}, "textPlain": "[Şekil: A noktasından başlayıp bir yönde ok ile uzayan çizgi] Bir başlangıç noktası olan ve bir yönde sınırsız uzayan çizgiye ne denir? Seçenekler: Işın / Doğru parçası / Doğru", "correctAnswer": "Işın", "explanation": "Işının bir başlangıç noktası vardır ve tek yönde sınırsız uzar. Doğru iki yönde, doğru parçası ise iki uç nokta arasında sınırlıdır."}, {"questionId": "boss-a01-m1-03", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "Tümler açılar", "outcome": "Düzlemde iki ve üç doğrunun birbirine göre durumlarını ve oluşan açıları (ters, komşu, tümler, bütünler) belirleyebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Geometrik Şekiller”, s. 52", "difficulty": "orta", "group": "m1", "rank": 2, "type": "num", "prompt": "Ölçüsü 28° olan bir açının tümleri kaç derecedir? Kadranları ayarla.", "data": {"answer": 62, "digits": 2, "unit": "°"}, "textPlain": "Ölçüsü 28° olan bir açının tümleri kaç derecedir?", "correctAnswer": "62°", "explanation": "Tümler açıların ölçüleri toplamı 90°’dir: 90 − 28 = 62."}, {"questionId": "boss-a01-m1-04", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "İç açılar toplamı", "outcome": "Üçgenleri açılarına ve kenarlarına göre sınıflandırabilme, iç açılarını ilişkilendirebilme ve kesişen çemberlerle üçgen inşa edebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Geometrik Şekiller”, s. 73", "difficulty": "orta", "group": "m1", "rank": 2, "type": "num", "prompt": "Bir üçgenin iki iç açısı 70° ve 45°’dir. Üçüncü iç açısı kaç derecedir?", "data": {"answer": 65, "digits": 2, "unit": "°", "fig": {"k": "tri", "a": [70, 45]}}, "textPlain": "[Şekil: iki açısı 70° ve 45° olarak verilmiş üçgen, üçüncü açı “?”] Üçüncü iç açı kaç derecedir?", "correctAnswer": "65°", "explanation": "Üçgenin iç açılarının ölçüleri toplamı 180°’dir: 180 − (70 + 45) = 65."}, {"questionId": "boss-a01-m1-05", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "Açı çeşitleri", "outcome": "Açıları standart birimle (derece) ölçebilme ve açı çeşitlerini belirleyebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Geometrik Şekiller”, s. 43", "difficulty": "orta", "group": "m1", "rank": 2, "type": "sort2", "prompt": "Ölçüsü verilen açıları dar açı ve geniş açı olarak ayır.", "data": {"bins": ["Dar açı", "Geniş açı"], "items": [["40°", 0], ["120°", 1], ["89°", 0], ["91°", 1], ["175°", 1]]}, "textPlain": "Açıları dar / geniş diye ayır: 40°, 120°, 89°, 91°, 175°.", "correctAnswer": "Dar: 40°, 89°. Geniş: 91°, 120°, 175°.", "explanation": "Ölçüsü 90°’den küçük açılar dar, 90° ile 180° arasındaki açılar geniş açıdır."}, {"questionId": "boss-a01-m1-06", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "Komşu açılar", "outcome": "Düzlemde iki ve üç doğrunun birbirine göre durumlarını ve oluşan açıları (ters, komşu, tümler, bütünler) belirleyebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Geometrik Şekiller”, s. 50 (şekil ekranda çizilir)", "difficulty": "zor", "group": "m1", "rank": 3, "type": "num", "prompt": "Kesişen iki doğrunun oluşturduğu açılardan biri 130°’dir. Şekilde x ile gösterilen komşu açı kaç derecedir?", "data": {"answer": 50, "digits": 2, "unit": "°", "fig": {"k": "cross", "a": 130}}, "textPlain": "[Şekil: kesişen iki doğru; bir açı 130°, ona komşu açı x] x kaç derecedir?", "correctAnswer": "50°", "explanation": "Bir doğru üzerindeki komşu açıların toplamı 180°’dir: 180 − 130 = 50."}, {"questionId": "boss-a01-m1-07", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "1. Tema: Geometrik Şekiller", "topic": "Köşegen", "outcome": "Çokgenlerin temel elemanlarını (kenar, köşe, iç açı, dış açı, köşegen) ve düzgün çokgeni belirleyebilme.", "sourceRef": " r ve İşlemler”, s. 130", "difficulty": "zor", "group": "m2", "rank": 3, "type": "num", "prompt": "□ ÷ 8 = 125 işleminde □ yerine hangi sayı gelmelidir?", "data": {"answer": 1000, "digits": 4, "unit": ""}, "textPlain": "□ ÷ 8 = 125 işleminde □ kaçtır?", "correctAnswer": "1000", "explanation": "Bölünen = bölüm × bölen: 125 × 8 = 1000."}, {"questionId": "boss-a01-m2-07", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "2. Tema: Sayılar ve Nicelikler (1)", "topic": "Yuvarlama", "outcome": "Çok basamaklı doğal sayıları karşılaştırıp sıralayabilme; yuvarlama ve tahmin yapabilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Sayılar ve Nicelikler (1): Doğal Sayılar ve İşlemler”, s. 120", "difficulty": "zor", "group": "m2", "rank": 3, "type": "choice", "prompt": "6 748 sayısının en yakın yüzlüğe yuvarlanmış hâli hangisidir?", "data": {"options": ["6 700", "6 800", "7 000"]}, "textPlain": "6 748 sayısı en yakın yüzlüğe yuvarlanırsa kaç olur? Seçenekler: 6 700 / 6 800 / 7 000", "correctAnswer": "6 700", "explanation": "Onlar basamağındaki rakam 4’tür (5’ten küçük); yüzler basamağı değişmez: 6 700."}, {"questionId": "boss-a01-m2-08", "grade": 5, "subjectId": "math", "subject": "Matematik", "unit": "2. Tema: Sayılar ve Nicelikler (1)", "topic": "Problem çözme", "outcome": "Doğal sayılarla dört işlem gerektiren gerçek yaşam problemlerini çözebilme.", "sourceRef": "MEB Matematik 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Sayılar ve Nicelikler (1): Doğal Sayılar ve İşlemler”, s. 132", "difficulty": "zor", "group": "m2", "rank": 3, "type": "num", "prompt": "Bir geziye 6 otobüs gidiyor; her otobüste 45 öğrenci var. Ayrıca 30 öğrenci servisle geliyor. Geziye toplam kaç öğrenci katılıyor?", "data": {"answer": 300, "digits": 3, "unit": ""}, "textPlain": "6 otobüste 45’er öğrenci ve servisle 30 öğrenci geziye katılıyor. Toplam kaç öğrenci?", "correctAnswer": "300", "explanation": "6 × 45 = 270 öğrenci otobüsle gelir; 270 + 30 = 300."}, {"questionId": "boss-a01-t1-01", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Zıt anlam", "outcome": "Metinde geçen söz varlığı unsurlarının anlamını belirleyebilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 14", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "choice", "prompt": "“Neşeli” kelimesinin zıt anlamlısı hangisidir?", "data": {"options": ["Üzgün", "Mutlu", "Sevinçli"]}, "textPlain": "“Neşeli” kelimesinin zıt anlamlısı hangisidir? Seçenekler: Üzgün / Mutlu / Sevinçli", "correctAnswer": "Üzgün", "explanation": "“Mutlu” ve “sevinçli” neşeliyle yakın anlamlıdır; zıt anlamlısı “üzgün”dür."}, {"questionId": "boss-a01-t1-02", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "İsim ve fiil", "outcome": "Dil yapılarını tanıyıp metin içinde kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 42", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "sort2", "prompt": "Kelimeleri isim ve fiil olarak ayır.", "data": {"bins": ["İsim", "Fiil"], "items": [["top", 0], ["koşmak", 1], ["ip", 0], ["saklanmak", 1], ["mendil", 0]]}, "textPlain": "Kelimeleri isim / fiil diye ayır: top, koşmak, ip, saklanmak, mendil.", "correctAnswer": "İsim: top, ip, mendil. Fiil: koşmak, saklanmak.", "explanation": "Varlıklara verilen adlar isimdir; iş, oluş ve hareket bildiren kelimeler fiildir."}, {"questionId": "boss-a01-t1-03", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Kısa çizgi", "outcome": "Yazım kurallarını ve noktalama işaretlerini doğru kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 41", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "“saklambaç” kelimesi satır sonuna sığmadı. Hangisinde doğru bölünmüştür?", "data": {"options": ["sak-lambaç", "sa-klambaç", "sakl-ambaç"]}, "textPlain": "“saklambaç” kelimesi satır sonunda hangisinde doğru bölünmüştür? Seçenekler: sak-lambaç / sa-klambaç / sakl-ambaç", "correctAnswer": "sak-lambaç", "explanation": "Satır sonunda kelime hece sınırından bölünür ve kısa çizgi konur: sak-lam-baç."}, {"questionId": "boss-a01-t1-04", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Nokta", "outcome": "Yazım kurallarını ve noktalama işaretlerini doğru kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 30", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "Hangi cümlenin sonuna nokta konmalıdır?", "data": {"options": ["Çocuklar bahçede yakan top oynadı", "Oyuna kim başlayacak", "Eyvah, top kaçtı"]}, "textPlain": "Hangi cümlenin sonuna nokta konmalıdır? Seçenekler: Çocuklar bahçede yakan top oynadı / Oyuna kim başlayacak / Eyvah, top kaçtı", "correctAnswer": "Çocuklar bahçede yakan top oynadı", "explanation": "Tamamlanmış bir bildirme cümlesinin sonuna nokta konur; soru cümlesine soru işareti, heyecan bildiren cümleye ünlem konur."}, {"questionId": "boss-a01-t1-05", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Eş sesli kelime", "outcome": "Metinde geçen söz varlığı unsurlarının anlamını belirleyebilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 14", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "Hangi cümlede “yüz” kelimesi sayı anlamında kullanılmıştır?", "data": {"options": ["Okulumuzun bahçesinde yüz fidan var.", "Yüzünü soğuk suyla yıkadı.", "Yastığın yüzü çok yumuşak."]}, "textPlain": "Hangi cümlede “yüz” sayı anlamındadır? Seçenekler: Okulumuzun bahçesinde yüz fidan var. / Yüzünü soğuk suyla yıkadı. / Yastığın yüzü çok yumuşak.", "correctAnswer": "Okulumuzun bahçesinde yüz fidan var.", "explanation": "Yazılışı aynı, anlamı farklı kelimelere eş sesli kelime denir. “Yüz fidan”da yüz, 100 sayısını bildirir."}, {"questionId": "boss-a01-t1-06", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Tahmin işlevli söz varlığı", "outcome": "Dil yapılarını tanıyıp metin içinde kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 56", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Hangi cümlede tahmin bildiren bir ifade vardır?", "data": {"options": ["Yarın galiba yağmur yağacak.", "Dün parkta ip atladık.", "Körebe en sevdiğim oyundur."]}, "textPlain": "Hangi cümlede tahmin bildiren ifade vardır? Seçenekler: Yarın galiba yağmur yağacak. / Dün parkta ip atladık. / Körebe en sevdiğim oyundur.", "correctAnswer": "Yarın galiba yağmur yağacak.", "explanation": "“Galiba” kesin bilinmeyen bir durumu tahmin ettiğimizi gösterir."}, {"questionId": "boss-a01-t1-07", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Okuma (metin soruda verilir)", "outcome": "Metnin yüzey anlamını belirleyebilme.", "sourceRef": "Özgün soru; MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası” öğrenme çıktılarına göre hazırlandı (metin soruda verilir)", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metne göre sıranın Mert’e geçmesinin sebebi nedir?", "data": {"options": ["Elif’in taşı çizginin üstüne düştü.", "Elif oyundan sıkıldı.", "Teneffüs bitmek üzereydi."], "passage": "Elif ve arkadaşları teneffüste seksek oynamaya karar verdi. Tebeşirle yere kareler çizdiler. İlk taşı Elif attı ama taş çizginin tam üstüne düştü. Kurala göre çizgiye düşen taş geçersiz sayılıyordu. Elif gülümseyerek taşı Mert’e uzattı."}, "textPlain": "Metin: Elif ve arkadaşları teneffüste seksek oynamaya karar verdi. Tebeşirle yere kareler çizdiler. İlk taşı Elif attı ama taş çizginin tam üstüne düştü. Kurala göre çizgiye düşen taş geçersiz sayılıyordu. Elif gülümseyerek taşı Mert’e uzattı. Soru: Sıranın Mert’e geçmesinin sebebi nedir?", "correctAnswer": "Elif’in taşı çizginin üstüne düştü.", "explanation": "Metinde çizgiye düşen taşın geçersiz sayıldığı yazıyor; Elif’in taşı çizgiye düştüğü için sıra Mert’e geçti."}, {"questionId": "boss-a01-t1-08", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Oyun Dünyası", "topic": "Gerçek ve hayal", "outcome": "Dil yapılarını tanıyıp metin içinde kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Oyun Dünyası”, s. 30", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Hangi cümle hayal ürünü bir olayı anlatır?", "data": {"options": ["Topumuz kanat çırpıp bulutların arasına saklandı.", "Uçurtmamız rüzgârla gökyüzüne yükseldi.", "Mahalledeki çocuklar akşama kadar körebe oynadı."]}, "textPlain": "Hangi cümle hayal ürünüdür? Seçenekler: Topumuz kanat çırpıp bulutlara saklandı. / Uçurtmamız rüzgârla yükseldi. / Çocuklar akşama kadar körebe oynadı.", "correctAnswer": "Topumuz kanat çırpıp bulutların arasına saklandı.", "explanation": "Topun kanat çırpması gerçek hayatta olamaz; diğer iki olay gerçekte yaşanabilir."}, {"questionId": "boss-a01-t2-01", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Büyük harf", "outcome": "Yazım kurallarını ve noktalama işaretlerini doğru kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 116", "difficulty": "kolay", "group": "t2", "rank": 1, "type": "choice", "prompt": "Hangi cümlede büyük harfler doğru kullanılmıştır?", "data": {"options": ["Atatürk, 1881 yılında Selanik’te doğdu.", "atatürk, 1881 yılında Selanik’te doğdu.", "Atatürk, 1881 yılında selanik’te doğdu."]}, "textPlain": "Hangi cümlede büyük harfler doğrudur? Seçenekler: Atatürk, 1881 yılında Selanik’te doğdu. / atatürk, ... Selanik’te / Atatürk, ... selanik’te", "correctAnswer": "Atatürk, 1881 yılında Selanik’te doğdu.", "explanation": "Cümle büyük harfle başlar; kişi ve yer adları gibi özel isimler de büyük harfle yazılır."}, {"questionId": "boss-a01-t2-02", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Soru işareti", "outcome": "Yazım kurallarını ve noktalama işaretlerini doğru kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 72", "difficulty": "kolay", "group": "t2", "rank": 1, "type": "choice", "prompt": "Hangi cümlenin sonuna soru işareti konmalıdır?", "data": {"options": ["Atatürk hangi şehirde doğmuştur", "Atatürk Selanik’te doğmuştur", "Atatürk’ü çok seviyoruz"]}, "textPlain": "Hangi cümlenin sonuna soru işareti konmalıdır? Seçenekler: Atatürk hangi şehirde doğmuştur / Atatürk Selanik’te doğmuştur / Atatürk’ü çok seviyoruz", "correctAnswer": "Atatürk hangi şehirde doğmuştur", "explanation": "Soru bildiren cümlelerin sonuna soru işareti konur."}, {"questionId": "boss-a01-t2-03", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Niteleyen ve belirten kelimeler", "outcome": "Dil yapılarını tanıyıp metin içinde kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 88", "difficulty": "orta", "group": "t2", "rank": 2, "type": "sort2", "prompt": "Her kelime grubundaki ilk kelime ismi niteliyor mu, belirtiyor mu? Kartları ayır.", "data": {"bins": ["Niteleyen", "Belirten"], "items": [["çalışkan öğrenci", 0], ["üç kitap", 1], ["bu bayrak", 1], ["yeşil çiftlik", 0], ["birkaç fidan", 1]]}, "textPlain": "Kelime gruplarındaki ilk kelimeyi niteleyen / belirten diye ayır: çalışkan öğrenci, üç kitap, bu bayrak, yeşil çiftlik, birkaç fidan.", "correctAnswer": "Niteleyen: çalışkan, yeşil. Belirten: üç, bu, birkaç.", "explanation": "Niteleyen kelimeler ismin nasıl olduğunu (rengini, durumunu) anlatır; belirten kelimeler ismin sayısını gösterir ya da onu işaret eder."}, {"questionId": "boss-a01-t2-04", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Benzetme", "outcome": "Şiirin biçim özelliklerini ve söz sanatlarını belirleyebilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 95", "difficulty": "orta", "group": "t2", "rank": 2, "type": "choice", "prompt": "“Bayrağımız gelincik gibi kırmızıydı.” cümlesinde bayrak neye benzetilmiştir?", "data": {"options": ["Gelinciğe", "Kırmızı renge", "Rüzgâra"]}, "textPlain": "“Bayrağımız gelincik gibi kırmızıydı.” cümlesinde bayrak neye benzetilmiştir?", "correctAnswer": "Gelinciğe", "explanation": "“Gibi” kelimesiyle bayrak, rengi bakımından gelincik çiçeğine benzetilmiştir."}, {"questionId": "boss-a01-t2-05", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Virgül", "outcome": "Yazım kurallarını ve noktalama işaretlerini doğru kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 73", "difficulty": "orta", "group": "t2", "rank": 2, "type": "choice", "prompt": "Hangi cümlede virgül doğru kullanılmıştır?", "data": {"options": ["Çiftlikte inek, koyun ve tavuk vardı.", "Çiftlikte, inek koyun ve tavuk vardı.", "Çiftlikte inek koyun, ve tavuk vardı."]}, "textPlain": "Hangi cümlede virgül doğrudur? Seçenekler: Çiftlikte inek, koyun ve tavuk vardı. / Çiftlikte, inek koyun ve tavuk vardı. / Çiftlikte inek koyun, ve tavuk vardı.", "correctAnswer": "Çiftlikte inek, koyun ve tavuk vardı.", "explanation": "Sıralanan eş görevli kelimeler arasına virgül konur; “ve” bağlacından önce virgül kullanılmaz."}, {"questionId": "boss-a01-t2-06", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Bağlantı ifadeleri", "outcome": "Dil yapılarını tanıyıp metin içinde kullanabilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 81", "difficulty": "zor", "group": "t2", "rank": 3, "type": "choice", "prompt": "“Atatürk tarıma çok önem verirdi, ___ Ankara’da örnek bir çiftlik kurdu.” Boşluğa hangisi gelmelidir?", "data": {"options": ["bu yüzden", "ama", "yine de"]}, "textPlain": "“Atatürk tarıma çok önem verirdi, ___ Ankara’da örnek bir çiftlik kurdu.” Boşluğa hangisi gelmeli? Seçenekler: bu yüzden / ama / yine de", "correctAnswer": "bu yüzden", "explanation": "İkinci cümle birincinin sonucudur; sebep-sonuç ilişkisini “bu yüzden” kurar. “Ama” ve “yine de” karşıtlık bildirir."}, {"questionId": "boss-a01-t2-07", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Atatürk’ün hayatı (bilgi soruda verilir)", "outcome": "Metnin yüzey anlamını belirleyebilme.", "sourceRef": "Özgün soru; MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak” öğrenme çıktılarına göre hazırlandı (metin soruda verilir)", "difficulty": "zor", "group": "t2", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metne göre Atatürk’e “Başöğretmen” denmesinin sebebi nedir?", "data": {"options": ["Yeni harfleri halka kendisinin öğretmesi", "Bir okulda müdürlük yapması", "Ankara’da örnek bir çiftlik kurması"], "passage": "1928 yılında Yeni Türk harfleri kabul edildi. Atatürk, yeni harfleri halka öğretmek için yurdun pek çok yerini gezdi. Kara tahtanın başına geçip harfleri kendisi tanıttı. Bu çalışmaları nedeniyle ona “Başöğretmen” denildi."}, "textPlain": "Metin: 1928 yılında Yeni Türk harfleri kabul edildi. Atatürk, yeni harfleri halka öğretmek için yurdun pek çok yerini gezdi. Kara tahtanın başına geçip harfleri kendisi tanıttı. Bu çalışmaları nedeniyle ona “Başöğretmen” denildi. Soru: Atatürk’e “Başöğretmen” denmesinin sebebi nedir?", "correctAnswer": "Yeni harfleri halka kendisinin öğretmesi", "explanation": "Metne göre Atatürk kara tahtanın başına geçip yeni harfleri halka kendisi öğretmiştir."}, {"questionId": "boss-a01-t2-08", "grade": 5, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Atatürk’ü Tanımak", "topic": "Kişileştirme", "outcome": "Şiirin biçim özelliklerini ve söz sanatlarını belirleyebilme.", "sourceRef": "MEB Türkçe 5. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Atatürk’ü Tanımak”, s. 116", "difficulty": "zor", "group": "t2", "rank": 3, "type": "choice", "prompt": "Hangi cümlede kişileştirme yapılmıştır?", "data": {"options": ["Rüzgâr, bayrağın kulağına bir şarkı fısıldadı.", "Bayrak rüzgârda hızla dalgalandı.", "Bayrak sabah törenle direğe çekildi."]}, "textPlain": "Hangi cümlede kişileştirme vardır? Seçenekler: Rüzgâr bayrağın kulağına şarkı fısıldadı. / Bayrak rüzgârda dalgalandı. / Bayrak törenle direğe çekildi.", "correctAnswer": "Rüzgâr, bayrağın kulağına bir şarkı fısıldadı.", "explanation": "Rüzgâra fısıldamak, bayrağa kulak gibi insana ait özellikler verilmiştir; bu kişileştirmedir."}, {"questionId": "boss-a01-f1-09", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ünite: Gökyüzündeki Komşularımız ve Biz", "topic": "Güneş’in yapısı", "outcome": "Güneş’in yapısı ve dönme hareketi ile ilgili bilgilere ulaşma ve bu bilgileri kaydetme.", "sourceRef": "MEB Fen Bilimleri 5. Sınıf Ders Kitabı 1. Kitap, 1. Ünite “Gökyüzündeki Komşularımız ve Biz”, s. 23", "difficulty": "kolay", "group": "f1", "rank": 1, "type": "choice", "prompt": "Güneş nasıl bir gök cismidir?", "data": {"options": ["Kendi ışığını ve ısısını üreten bir yıldız", "Dünya’nın çevresinde dolanan bir uydu", "Kendi ışığı olmayan bir gezegen"]}, "textPlain": "Güneş nasıl bir gök cismidir? Seçenekler: Kendi ışığını ve ısısını üreten bir yıldız / Dünya’nın çevresinde dolanan bir uydu / Kendi ışığı olmayan bir gezegen", "correctAnswer": "Kendi ışığını ve ısısını üreten bir yıldız", "explanation": "Güneş, sıcak gazlardan oluşan, kendi ışığını ve ısısını üreten bir yıldızdır."}, {"questionId": "boss-a01-f1-10", "grade": 5, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ü <script>

const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;

const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();showIntro();$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}
function sfx(k){({tap:()=>tone(660,.06,'triangle',.1),pick:()=>tone(520,.07,'triangle',.12,0,120),
 ok:()=>{tone(523,.12,'triangle',.16);tone(784,.16,'triangle',.16,.09);tone(1046,.22,'sine',.12,.18);},
 bad:()=>{tone(220,.28,'sawtooth',.08,0,-90);noise(.25,.12,.05,500);},
 splat:()=>{noise(.35,.28,0,700);tone(140,.3,'sine',.12,0,-60);},
 bubble:()=>{for(let i=0;i<5;i++)tone(400+i*120,.07,'sine',.08,i*.06,200);},
 free:()=>{tone(880,.1,'sine',.12);tone(1320,.18,'sine',.1,.08);},
 roar:()=>{tone(90,.6,'sawtooth',.1,0,60);noise(.6,.12,0,400);},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12));},
 gate:()=>{tone(196,.25,'square',.06);tone(294,.35,'square',.06,.2);}}[k]||(()=>{}))();}
$('mute').onclick=()=>{muted=!muted;unlockAudio();if(master)master.gain.value=muted?0:.8;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');};
/* ---------- Deste ---------- */
function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}
function remember(ids){try{localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent()].slice(0,30)));}catch(e){}}
function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});
  const cnt=[0,0,0,0];al.forEach(a=>a.ranks.forEach(r=>cnt[r]++));const d=Math.abs(cnt[1]-4)+Math.abs(cnt[2]-4)+Math.abs(cnt[3]-4);if(d<bd){bd=d;best=al;}if(d===0)break;}

function buildDeck(){const rec=new Set(recent()),plan=deckPlan();
 let chosen=null,cs=-1;for(let t=0;t<80;t++){const c=[];let fr=0;plan.forEach(a=>a.ranks.forEach(r=>{const pool=BANK.filter(q=>q.group===a.u&&q.rank===r&&!c.includes(q));const fresh=pool.filter(q=>!rec.has(q.questionId));const q=shuffle(t<40&&fresh.length?fresh:pool)[0];if(!rec.has(q.questionId))fr++;c.push(q);}));
  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
 let best=null,bs=1e9;
 for(let t=0;t<400;t++){const seq=[1,2,3].flatMap(r=>shuffle(chosen.filter(q=>q.rank===r)));let s=0;for(let i=1;i<seq.length;i++){if(seq[i].subjectId===seq[i-1].subjectId)s+=3;if(seq[i].type===seq[i-1].type)s+=1;}if(s<bs){bs=s;best=seq;}if(s===0)break;}
 return best;}
