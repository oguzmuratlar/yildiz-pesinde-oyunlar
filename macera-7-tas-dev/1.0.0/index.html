<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; media-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>Taş Dev</title>
<style>
:root{--c1:#7f8c86;--c2:#3f7d4f;--deep:#1d2a22;--ink:#1d1033;--ok:#16a36a;--bad:#e2425c;--gold:#ffcf3f;--card:#fffdf8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--deep)}
/* ÜST */
#top{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,0));position:relative;z-index:5}
#bossName{flex:1;min-width:0;font-weight:900;font-size:17px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);letter-spacing:.3px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 11px;font-weight:800;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.18);white-space:nowrap}
#mute{width:44px;height:44px;border:0;border-radius:50%;background:rgba(255,255,255,.92);font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.18)}
/* SAHNE */
#scene{position:relative;height:clamp(150px,27vh,230px);flex:none;overflow:hidden;background:var(--deep) center 30%/cover no-repeat}
#scene::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.35));pointer-events:none}
#rig{position:absolute;left:50%;top:4px;bottom:44px;aspect-ratio:1.45/1;transform:translateX(-50%);max-width:96%}
#boss{position:absolute;left:50%;top:0;height:92%;transform:translateX(-50%);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));z-index:2;user-select:none;-webkit-user-drag:none}
#boss.hit{animation:hit .5s ease}
#boss.laugh{animation:laugh .6s ease}
#boss.gone{animation:none;transition:transform 1.4s cubic-bezier(.5,-.3,.7,.3),opacity 1.4s;transform:translate(-50%,-160%) scale(.6);opacity:0}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
@keyframes hit{20%{transform:translateX(calc(-50% - 9px)) rotate(-5deg)}45%{transform:translateX(calc(-50% + 8px)) rotate(4deg)}70%{transform:translateX(calc(-50% - 4px))}}
@keyframes laugh{30%{transform:translate(-50%,-10px) scale(1.07)}60%{transform:translate(-50%,0) scale(.97)}}
#meter{position:absolute;left:0;right:0;bottom:20px;display:flex;justify-content:center;gap:6px;z-index:5;flex-wrap:wrap;padding:0 6px}
#meter .pill{font-size:12.5px;padding:4px 9px}
#banner{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);z-index:21;font-weight:900;font-size:26px;color:#fff;text-shadow:0 3px 0 var(--c1),0 0 18px rgba(0,0,0,.5);opacity:0;pointer-events:none;white-space:normal;text-align:center;width:92%;font-size:clamp(20px,6.6vw,26px);line-height:1.15}
#banner.on{animation:ban 1.6s ease forwards}
@keyframes ban{15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
/* KART */
#card{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:22px 22px 0 0;margin-top:-14px;position:relative;z-index:6;padding:14px 14px 10px;box-shadow:0 -4px 14px rgba(0,0,0,.25)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;color:#fff;margin-bottom:8px}
.tag.science{background:#1fa37a}.tag.math{background:#2f6fe0}.tag.turkish{background:#e0662f}
.lvl{font-size:12px;font-weight:800;color:#7a6c8f;margin-left:6px}
.passage{background:#fff4dc;border:2px solid #f3d79a;border-radius:14px;padding:10px 12px;font-size:15px;line-height:1.45;margin-bottom:10px}
.prompt{font-size:17px;font-weight:800;line-height:1.35;margin:2px 0 12px}
.fig{display:block;margin:0 auto 10px;width:min(100%,260px);height:auto;max-height:min(230px,28vh)}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;text-align:left;border:3px solid #e5dcf2;background:#fff;border-radius:16px;padding:9px 12px;font-size:15.5px;font-weight:700;line-height:1.3;transition:transform .12s,border-color .15s,background .15s}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--c2),var(--c1));color:#fff;font-weight:900;font-size:14px}
.opt.sel{border-color:var(--c1);background:#fff0f6;transform:scale(1.015)}
.opt.right{border-color:var(--ok);background:#e3f8ee}.opt.wrong{border-color:var(--bad);background:#fde7ea}
.opt .mk{margin-left:auto;font-weight:900;font-size:18px}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .opt{justify-content:center;font-size:18px;min-height:64px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px;padding:6px;border-radius:14px;background:#f3eefa}
.chip{border:2.5px solid #d9cdea;background:#fff;border-radius:12px;padding:9px 11px;font-size:14.5px;font-weight:700;min-height:44px;line-height:1.25;max-width:100%}
.chip.sel{border-color:var(--c1);background:#fff0f6;box-shadow:0 0 0 3px rgba(255,111,145,.25)}
.chip.used{opacity:.35}
.chip.right{border-color:var(--ok);background:#e3f8ee}.chip.wrong{border-color:var(--bad);background:#fde7ea}
.slots{display:flex;flex-direction:column;gap:7px;margin:10px 0}
.oslot{display:flex;align-items:center;gap:9px;min-height:46px;border:2.5px dashed #cfc2e2;border-radius:12px;padding:5px 9px;background:#fff;font-weight:700;font-size:14.5px;width:100%;text-align:left}
.oslot b{flex:none;width:26px;height:26px;border-radius:50%;background:var(--c2);color:#fff;display:grid;place-items:center;font-size:13px}
.oslot.full{border-style:solid;border-color:var(--c2)}
.oslot.right{border-color:var(--ok);background:#e3f8ee}.oslot.wrong{border-color:var(--bad);background:#fde7ea}
.mrow{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:stretch}
.mrow .l{background:#efe7fb;border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;display:flex;align-items:center;line-height:1.25}
.mrow .oslot{border-style:dashed;min-height:44px;font-size:14px}
.mrow.act .l{outline:3px solid var(--c1)}
.bins{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px;margin-top:10px}
.bin{min-width:0;border:3px solid var(--c2);border-radius:16px;background:#effbfa;padding:8px 6px 10px;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.bin>span{font-weight:900;font-size:14px;color:#0c6964;text-align:center;line-height:1.2}
.bin.b1{border-color:var(--c1);background:#fff1f4}.bin.b1>span{color:#b43a5a}
.bin .chip{font-size:13.5px;padding:6px 8px;min-height:38px;max-width:100%;overflow-wrap:anywhere}
.wheels{display:flex;justify-content:center;align-items:center;gap:4px;margin:6px 0}
.wheel{display:flex;flex-direction:column;align-items:center;gap:2px}
.wheel button{width:38px;height:34px;border:0;border-radius:10px;background:#efe7fb;font-size:15px;font-weight:900;color:#6b4fa0}
.wheel output{width:38px;height:46px;border-radius:10px;background:#fff;border:3px solid var(--c2);display:grid;place-items:center;font-size:24px;font-weight:900;font-variant-numeric:tabular-nums}
.wheel.gap{margin-left:7px}
.unit{font-size:22px;font-weight:900;margin-left:4px}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 2px;font-size:.92em}.fr b{font-weight:inherit;padding:0 2px}.fr b:first-child{border-bottom:2px solid currentColor}
.numans{text-align:center;font-weight:800;margin-top:6px;font-size:15px}
/* DOCK */
#dock{flex:none;background:var(--card);padding:8px 14px calc(env(safe-area-inset-bottom) + 10px);position:relative;z-index:7;box-shadow:0 -6px 12px rgba(0,0,0,.06)}
.primary{width:100%;min-height:54px;border:0;border-radius:18px;background:linear-gradient(180deg,#ffd64f,#ffb000);box-shadow:0 4px 0 #c98400;font-weight:900;font-size:18px;color:#3b2500;letter-spacing:.3px}
.primary:disabled{filter:grayscale(.8);opacity:.55;box-shadow:none}
.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 #c98400}
#fb{border-radius:16px;padding:10px 12px;margin-bottom:8px;font-size:14.5px;line-height:1.4;max-height:30vh;overflow:auto}
#fb.ok{background:#e3f8ee;border:2px solid #9fe0c0}#fb.bad{background:#fde7ea;border:2px solid #f4b0bb}
#fb h3{margin:0 0 3px;font-size:16.5px}
/* GİRİŞ */
#intro{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 22px calc(env(safe-area-inset-bottom) + 26px);background:var(--deep) center/cover no-repeat;overflow:hidden;text-align:center;color:#fff}
#intro::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 30%,rgba(0,0,0,.7));}
#intro>*{position:relative}
#introBoss{width:min(84vw,380px);max-height:56vh;object-fit:contain;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45));transform:translateY(80vh);transition:transform 1.3s cubic-bezier(.2,1.25,.4,1)}
#intro.show #introBoss{transform:translateY(0);animation:bob2 3s 1.4s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-8px)}}
#introTitle{font-size:clamp(34px,11vw,48px);font-weight:900;margin:6px 0 22px;letter-spacing:1px;text-shadow:0 4px 0 var(--c1),0 0 22px rgba(0,0,0,.5);transform:scale(2.4);opacity:0;transition:transform .45s 1.1s cubic-bezier(.3,1.6,.5,1),opacity .3s 1.1s}
#intro.show #introTitle{transform:scale(1);opacity:1}
#introSub{font-size:15.5px;line-height:1.4;max-width:340px;margin:2px 0 6px;opacity:0;transition:opacity .5s 1.6s}
#introRule{display:inline-block;background:rgba(255,255,255,.95);color:var(--ink);font-weight:900;border-radius:999px;padding:6px 14px;font-size:14.5px;margin:4px 0 14px;opacity:0;transition:opacity .5s 1.8s}
#intro.show #introSub,#intro.show #introRule{opacity:1}
#start{max-width:340px}
#mode{font-size:12.5px;font-weight:800;opacity:.9;margin-top:10px}
#introStatus{font-size:13px;opacity:.9;margin:4px 0 0;min-height:18px}
#reconnect{margin-top:8px;background:#fff;border:0;border-radius:14px;padding:10px 16px;font-weight:800}
.bub{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);animation:rise linear infinite;pointer-events:none}
@keyframes rise{to{transform:translateY(-110vh) translateX(20px);opacity:.1}}
#ink{position:absolute;left:50%;top:38%;width:10px;height:10px;border-radius:50%;background:#2c1640;transform:translate(-50%,-50%) scale(0);opacity:.9;pointer-events:none}
#intro.show #ink{animation:inkp 1.4s .9s ease-out forwards}
@keyframes inkp{40%{transform:translate(-50%,-50%) scale(60);opacity:.85}100%{transform:translate(-50%,-50%) scale(90);opacity:0}}
/* PERDE */
#gate{position:fixed;inset:0;z-index:35;display:grid;place-items:center;background:radial-gradient(circle,rgba(0,0,0,.25),rgba(0,0,0,.65));color:#fff;font-weight:900;font-size:clamp(22px,8vw,34px);white-space:nowrap;text-shadow:0 4px 0 var(--c1);opacity:0;pointer-events:none}
#gate.on{animation:gate 1.5s ease forwards}
@keyframes gate{0%{opacity:0}15%{opacity:1}75%{opacity:1}100%{opacity:0}}
#gate span{display:block;animation:gz 1.5s ease}
@keyframes gz{0%{transform:scale(.3)}20%{transform:scale(1.15)}30%{transform:scale(1)}}
/* SONUÇ */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(10,4,25,.55);opacity:0;pointer-events:none;transition:opacity .4s}
#sheet.open{opacity:1;pointer-events:auto}
#sheetBox{width:min(100%,400px);max-height:100%;overflow:auto;background:var(--card);border-radius:28px;padding:18px 18px 20px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4);transform:translateY(30px) scale(.95);transition:transform .5s cubic-bezier(.2,1.3,.4,1)}
#sheet.open #sheetBox{transform:none}
.ct{font-weight:900;color:var(--c1);letter-spacing:2px;font-size:13px}
#sheetBox h2{margin:4px 0 6px;font-size:23px;line-height:1.2}
.endimg{width:150px;height:150px;object-fit:contain;margin:0 auto;display:block}
.stars3{font-size:40px;letter-spacing:6px;margin:2px 0}
.stars3 span{display:inline-block;color:var(--gold);text-shadow:0 2px 0 #c98400;animation:pop .5s backwards}
.stars3 span.off{color:#ddd;text-shadow:none}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
.pearls{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:6px 0 8px}
.pearls i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 20%,#e9d3ff 60%,#b98cf0);box-shadow:0 0 6px rgba(185,140,240,.8)}
.pearls i.x{background:#3a2450;box-shadow:none;opacity:.7}
.stats{display:flex;justify-content:center;gap:10px;margin:6px 0}
.stats div{background:#f3eefa;border-radius:14px;padding:6px 14px}
.stats b{display:block;font-size:20px}.stats span{font-size:12px;color:#6d5f82;font-weight:700}
.fine{font-size:12.5px;color:#6d5f82;margin:8px 0}
.status{font-weight:800;font-size:14px}
#conf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#conf i{position:absolute;top:-14px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flyup{position:fixed;z-index:30;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--c1);font-size:20px;pointer-events:none;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translateY(-70px);opacity:0}}
.plate{position:absolute;width:12%;height:11%;transform:translate(-50%,-50%) rotate(var(--r));z-index:3;pointer-events:none;filter:drop-shadow(0 0 0 #fff) drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 3px 3px rgba(0,0,0,.55))}
.plate i{position:absolute;inset:0;clip-path:polygon(18% 0,82% 6%,100% 44%,86% 92%,30% 100%,0 64%,4% 18%);background:radial-gradient(circle at 32% 28%,#d9dcd6 0 18%,#a3aaa4 40%,#6c756f 78%,#4c544f)}
.plate b{position:absolute;inset:0;opacity:0;background:linear-gradient(62deg,transparent 46%,#1d2320 47% 51%,transparent 52%),linear-gradient(-38deg,transparent 47%,#1d2320 48% 51%,transparent 52%);clip-path:polygon(18% 0,82% 6%,100% 44%,86% 92%,30% 100%,0 64%,4% 18%)}
.plate.crack b{animation:crk .35s ease forwards}
.plate.crack{animation:fall 1.25s cubic-bezier(.5,0,.9,.6) .35s forwards}
@keyframes crk{to{opacity:1}}
@keyframes fall{0%{transform:translate(-50%,-50%) rotate(var(--r))}100%{transform:translate(-50%,160%) rotate(calc(var(--r) + 120deg)) scale(.7);opacity:0}}
.pebble{position:absolute;width:9px;height:8px;border-radius:40% 55% 45% 50%;background:#8d958f;border:1.5px solid #fff;z-index:4;pointer-events:none;opacity:0;animation:peb 1s ease-out forwards}
@keyframes peb{0%{opacity:1;transform:translate(-50%,-50%)}60%{opacity:1;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy)))}100%{opacity:0;transform:translate(calc(-50% + var(--dx)*1.3),calc(-50% + var(--dy)))}}
#boss.stomp{filter:drop-shadow(0 0 8px #9be36b) drop-shadow(0 6px 8px rgba(0,0,0,.4))}
#scene.quake{animation:quake .6s ease}
@keyframes quake{0%,100%{transform:none}15%{transform:translateY(6px)}30%{transform:translate(-5px,-3px)}45%{transform:translate(5px,3px)}60%{transform:translate(-3px,-1px)}80%{transform:translate(2px,1px)}}
.rockfall{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;overflow:hidden}
.rockfall i{position:absolute;top:-14%;width:13%;aspect-ratio:1;border-radius:42% 58% 50% 46%;background:radial-gradient(circle at 35% 30%,#c9cec8,#6c756f 70%);border:2px solid #fff;box-shadow:0 3px 4px rgba(0,0,0,.5)}
.rockfall i:nth-child(1){left:8%}.rockfall i:nth-child(2){left:28%;width:9%}.rockfall i:nth-child(3){left:50%;width:15%}.rockfall i:nth-child(4){left:70%;width:10%}.rockfall i:nth-child(5){left:86%;width:12%}
.rockfall.on{animation:rfo 1s ease forwards}.rockfall.on i{animation:rdrop .75s cubic-bezier(.5,0,1,1) forwards}
.rockfall.on i:nth-child(2){animation-delay:.08s}.rockfall.on i:nth-child(3){animation-delay:.03s}.rockfall.on i:nth-child(4){animation-delay:.12s}.rockfall.on i:nth-child(5){animation-delay:.06s}
@keyframes rfo{0%,80%{opacity:1}100%{opacity:0}}
@keyframes rdrop{to{transform:translateY(118%) rotate(160deg);top:72%}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.rm *,.rm *::before,.rm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-height:600px){#scene{height:140px}#fb{max-height:25vh;font-size:13.5px;padding:8px 10px}#fb h3{font-size:15px}.prompt{font-size:16px}.opt{min-height:46px;font-size:14.5px}}
</style>
</head>
<body>
<div id="app">
 <div id="top"><div id="bossName"></div><div class="pill" id="prog" aria-live="polite">1/12</div><button id="mute" aria-label="Sesi kapat">🔊</button></div>
 <div id="scene"><div id="rig"><img id="boss" alt=""></div>
  <div id="meter"><span class="pill" id="mArms"></span><span class="pill" id="mLife"></span></div>
  <div id="splat"></div><div id="banner"></div></div>
 <main id="card" aria-live="polite"></main>
 <div id="dock"><div id="fb" class="hidden" role="status"></div><button class="primary" id="go" disabled></button><button class="primary hidden" id="next">Devam ▶</button></div>
</div>
<section id="intro" aria-labelledby="introTitle"><div id="ink"></div><img id="introBoss" alt=""><h1 id="introTitle"></h1>
 <button class="primary" id="start" disabled>BAŞLA</button><div id="mode"></div><p id="introStatus"></p><button id="reconnect" class="hidden">Yeniden dene</button></section>
<div id="gate" aria-hidden="true"><span id="gateText"></span></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div id="sheetBox"></div></div>

kobu; Haberleşme uydusu; Uluslararası Uzay İstasyonu; Gözlemevindeki teleskop; El dürbünü.", "correctAnswer": "Uzayda çalışır: Uzay teleskobu, Haberleşme uydusu, Uluslararası Uzay İstasyonu. Yeryüzünde çalışır: Gözlemevindeki teleskop, El dürbünü.", "explanation": "Uzay teleskobu, uydular ve uzay istasyonu Dünya’nın çevresinde çalışır; gözlemevi teleskobu ve dürbün yeryüzünde kullanılır."}, {"questionId": "boss-a09-f1-08", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ünite: Uzay Çağı", "topic": "Yıldızın yaşamı", "outcome": "Yıldızların yaşamını açıklayarak yapılandırır.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Uzay Çağı”, s. 41–42", "difficulty": "orta", "group": "f1", "rank": 2, "type": "order", "prompt": "Güneş benzeri bir yıldızın yaşam evrelerini baştan sona sırala.", "data": {"items": ["Bulutsu (gaz ve toz bulutu)", "Yıldız", "Kırmızı dev", "Gezegenimsi bulutsu", "Beyaz cüce"]}, "textPlain": "Güneş benzeri bir yıldızın yaşam evrelerini baştan sona sırala. Kartlar: Bulutsu (gaz ve toz bulutu); Kırmızı dev; Yıldız; Beyaz cüce; Gezegenimsi bulutsu.", "correctAnswer": "Bulutsu (gaz ve toz bulutu) → Yıldız → Kırmızı dev → Gezegenimsi bulutsu → Beyaz cüce", "explanation": "Yıldız bulutsuda doğar, yaşlanınca kırmızı deve dönüşür, dış katmanlarını gezegenimsi bulutsu olarak saçar ve geriye beyaz cüce kalır."}, {"questionId": "boss-a09-f1-09", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "1. Ünite: Uzay Çağı", "topic": "Yıldızların rengi", "outcome": "Yıldızların yaşamını açıklayarak yapılandırır.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (1. kitap), 1. Ünite “Uzay Çağı”, s. 41–42", "difficulty": "orta", "group": "f1", "rank": 2, "type": "choice", "prompt": "Mavi renkli bir yıldız ile kırmızı renkli bir yıldız için hangisi doğrudur?", "data": {"options": ["Mavi yıldızın yüzey sıcaklığı daha yüksektir.", "Kırmızı yıldızın yüzey sıcaklığı daha yüksektir.", "Yıldızın . Kutu kuvvet doğrultusunda kaç metre yol almıştır?", "data": {"answer": 5, "digits": 1, "unit": "m"}, "textPlain": "Bir kutuya 30 N’luk kuvvet uygulanarak 150 J iş yapılıyor. Kutu kuvvet doğrultusunda kaç metre yol almıştır?", "correctAnswer": "5 m", "explanation": "İş = kuvvet × yol → 150 = 30 × yol → yol = 5 m."}, {"questionId": "boss-a09-f2-17", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: Kuvvet ve Enerjiyi Keşfedelim", "topic": "Sürtünmesiz rampa", "outcome": "Enerji dönüşümünden hareketle enerjinin korunduğuna ilişkin tümevarımsal akıl yürütür.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (1. kitap), 2. Ünite “Kuvvet ve Enerjiyi Keşfedelim”, s. 80", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Sürtünmesiz bir rampanın bir ucundan serbest bırakılan bilye, karşıdaki rampada EN FAZLA hangi yüksekliğe çıkar?", "data": {"options": ["Bırakıldığı yüksekliğe", "Bırakıldığı yükseklikten daha yükseğe", "Hiç yükselemez"]}, "textPlain": "Sürtünmesiz bir rampanın bir ucundan serbest bırakılan bilye, karşıdaki rampada EN FAZLA hangi yüksekliğe çıkar? Seçenekler: Bırakıldığı yüksekliğe / Bırakıldığı yükseklikten daha yükseğe / Hiç yükselemez", "correctAnswer": "Bırakıldığı yüksekliğe", "explanation": "Sürtünme yoksa enerji korunur; bilye bırakıldığı yüksekliğe kadar çıkabilir."}, {"questionId": "boss-a09-f2-18", "grade": 7, "subjectId": "science", "subject": "Fen Bilimleri", "unit": "2. Ünite: Kuvvet ve Enerjiyi Keşfedelim", "topic": "Enerji yok olur mu", "outcome": "Enerji dönüşümünden hareketle enerjinin korunduğuna ilişkin tümevarımsal akıl yürütür.", "sourceRef": "MEB Fen Bilimleri 7. Sınıf Ders Kitabı (1. kitap), 2. Ünite “Kuvvet ve Enerjiyi Keşfedelim”, s. 80", "difficulty": "zor", "group": "f2", "rank": 3, "type": "choice", "prompt": "Sürtünmeli bir pistte salınan kaykaycı her seferinde biraz daha alçağa çıkıyor. Bunun nedeni nedir?", "data": {"options": ["Enerjinin bir kısmı sürtünmeyle ı ı kaçtır?", "data": {"answer": 16, "digits": 2, "unit": ""}, "textPlain": "Beş sayının aritmetik ortalaması 14’tür. Sayılardan dördü 10, 12, 15 ve 17 ise beşinci sayı kaçtır?", "correctAnswer": "16", "explanation": "Toplam = 5 × 14 = 70. Dört sayının toplamı 54; beşinci sayı 70 − 54 = 16."}, {"questionId": "boss-a09-m3-17", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "3. Tema: İstatistiksel Araştırma Süreci", "topic": "Uç değer", "outcome": "Veri setini merkezî eğilim ölçüleri (aritmetik ortalama, ortanca, tepe değer) ve yayılım ölçüleri (açıklık, ortalama mutlak sapma) ile özetleyebilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 1. Kitap, 3. Tema “İstatistiksel Araştırma Süreci”, s. 176 (veri/şekil ekranda verilir)", "difficulty": "zor", "group": "m3", "rank": 3, "type": "choice", "prompt": "4, 5, 5, 6, 7 veri grubuna 100 sayısı ekleniyor. Aşağıdaki ölçülerden hangisi EN ÇOK değişir?", "data": {"options": ["Aritmetik ortalama", "Tepe değer", "Ortanca"]}, "textPlain": "4, 5, 5, 6, 7 veri grubuna 100 sayısı ekleniyor. Aşağıdaki ölçülerden hangisi EN ÇOK değişir? Seçenekler: Aritmetik ortalama / Tepe değer / Ortanca", "correctAnswer": "Aritmetik ortalama", "explanation": "Ortalama 5,4’ten yaklaşık 21,2’ye çıkar; ortanca 5’ten 5,5’e değişir; tepe değer 5 olarak kalır."}, {"questionId": "boss-a09-m3-18", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "3. Tema: İstatistiksel Araştırma Süreci", "topic": "Ortalama mutlak sapma", "outcome": "Veri setini merkezî eğilim ölçüleri (aritmetik ortalama, ortanca, tepe değer) ve yayılım ölçüleri (açıklık, ortalama mutlak sapma) ile özetleyebilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 1. Kitap, 3. Tema “İstatistiksel Araştırma Süreci”, s. 182 (veri/şekil ekranda verilir)", "difficulty": "zor", "group": "m3", "rank": 3, "type": "num", "prompt": "2, 4, 6, 8 veri grubunun ortalama mutlak sapması kaçtır?", "data": {"answer": 2, "digits": 1, "unit": ""}, "textPlain": "2, 4, 6, 8 veri grubunun ortalama mutlak sapması kaçtır?", "correctAnswer": "2", "explanation": "Ortalama 5. Ortalamaya uzaklıklar 3, 1, 1, 3; toplamı 8. 8 ÷ 4 = 2."}, {"questionId": "boss-a09-m3-19", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "3. Tema: İstatistiksel Araştırma Süreci", "topic": "Yayılımı yorumlama", "outcome": "Araştırma sonuçlarını veriye dayalı yorumlayabilme, tahmin ve karar verebilme; araştırma süreçlerini eleştirel olarak inceleyebilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 1. Kitap, 3. Tema “İstatistiksel Araştırma Süreci”, s. 191", "difficulty": "zor", "group": "m3", "rank": 3, "type": "choice", "prompt": "A grubu: 9, 10, 11 — B grubu: 2, 10, 18. İki grubun ortalaması da 10’dur. Hangisi doğrudur?", "data": {"options": ["B grubundaki veriler ortalamadan daha uzağa yayılmıştır.", "A grubunun açıklığı B grubununkinden daha büyüktür.", "Ortalamaları eşit olduğu için iki grubun açıklığı da eşittir."]}, "textPlain": "A grubu: 9, 10, 11 — B grubu: 2, 10, 18. İki grubun ortalaması da 10’dur. Hangisi doğrudur? Seçenekler: B grubundaki veriler ortalamadan daha uzağa yayılmıştır. / A grubunun açıklığı B grubununkinden daha büyüktür. / Ortalamaları eşit olduğu için iki grubun açıklığı da eşittir.", "correctAnswer": "B grubundaki veriler ortalamadan daha uzağa yayılmıştır.", "explanation": "A’nın açıklığı 2, B’nin açıklığı 16’dır. B grubunun verileri daha çok yayılmıştır."}, {"questionId": "boss-a09-m3-20", "grade": 7, "subjectId": "math", "subject": "Matematik", "unit": "3. Tema: İstatistiksel Araştırma Süreci", "topic": "Kesikli ve sürekli", "outcome": "Kategorik ve nicel (kesikli, sürekli) verileri ayırt edebilme; araştırma sorusu oluşturup istatistiksel araştırma sürecinin adımlarını sıralayabilme.", "sourceRef": "MEB Matematik 7. Sınıf Ders Kitabı 1. Kitap, 3. Tema “İstatistiksel Araştırma Süreci”, s. 163", "difficulty": "zor", "group": "m3", "rank": 3, "type": "sort2", "prompt": "Nicel verileri kesikli ve sürekli diye ayır.", "data": {"bins": ["Kesikli", "Sürekli"], "items": [["Sınıftaki öğrenci sayısı", 0], ["Okunan kitap sayısı", 0], ["Boy uzunluğu", 1], ["Hava sıcaklığı", 1], ["Koşu süresi", 1]]}, "textPlain": "Nicel verileri kesikli ve sürekli diye ayır. (Kesikli / Sürekli) Kartlar: Sınıftaki öğrenci sayısı; Okunan kitap sayısı; Boy uzunluğu; Hava sıcaklığı; Koşu süresi.", "correctAnswer": "Kesikli: Sınıftaki öğrenci sayısı, Okunan kitap sayısı. Sürekli: Boy uzunluğu, Hava sıcaklığı, Koşu süresi.", "explanation": "Sayılan veriler kesikli, ölçülen veriler süreklidir."}, {"questionId": "boss-a09-t1-01", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Bağlamdan anlam", "outcome": "T.O.7.4. Metinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 31", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "choice", "prompt": "“Yeni başladığı kursta ilk haftalar zorlandı ama azmini hiç yitirmedi.” cümlesinde “azim” sözcüğünün anlamı hangisidir?", "data": {"options": ["Bir işi kararlılıkla sürdürme gücü", "İçini saran korku ve kaygı", "Uzun çalışmadan gelen yorgunluk"]}, "textPlain": "“Yeni başladığı kursta ilk haftalar zorlandı ama azmini hiç yitirmedi.” cümlesinde “azim” sözcüğünün anlamı hangisidir? Seçenekler: Bir işi kararlılıkla sürdürme gücü / İçini saran korku ve kaygı / Uzun çalışmadan gelen yorgunluk", "correctAnswer": "Bir işi kararlılıkla sürdürme gücü", "explanation": "Zorlanmasına rağmen vazgeçmediği anlatılıyor; azim, kararlılıkla sürdürme gücüdür."}, {"questionId": "boss-a09-t1-02", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Deyim", "outcome": "T.O.7.4. Metinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 53", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "choice", "prompt": "“Sınavdan önceki gece heyecandan göz kırpmadı.” cümlesindeki deyimin anlamı hangisidir?", "data": {"options": ["Hiç uyumadı.", "Çok ağladı.", "Gözleri ağrıdı."]}, "textPlain": "“Sınavdan önceki gece heyecandan göz kırpmadı.” cümlesindeki deyimin anlamı hangisidir? Seçenekler: Hiç uyumadı. / Çok ağladı. / Gözleri ağrıdı.", "correctAnswer": "Hiç uyumadı.", "explanation": "“Göz kırpmamak” hiç uyumamak anlamındadır."}, {"questionId": "boss-a09-t1-03", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "İkileme yazımı", "outcome": "T.Y.7.21. Yazım kuralları ve noktalama işaretlerini uygulayabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 34", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "tf", "prompt": "İkilemelerin arasına virgül konur; örneğin “yavaş, yavaş” biçiminde yazılır.", "data": {"truth": false}, "textPlain": "Doğru mu yanlış mı? İkilemelerin arasına virgül konur; örneğin “yavaş, yavaş” biçiminde yazılır.", "correctAnswer": "Yanlış", "explanation": "İkilemeler ayrı yazılır; arasına virgül ya da kısa çizgi konmaz: yavaş yavaş."}, {"questionId": "boss-a09-t1-04", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Noktalı virgül", "outcome": "T.Y.7.21. Yazım kuralları ve noktalama işaretlerini uygulayabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 25", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "choice", "prompt": "Hangi cümlede noktalı virgül doğru kullanılmıştır?", "data": {"options": ["Ahmet, Ayşe ve Can bahçede; Elif, Deniz ve Ece salonda oturuyordu.", "Akşam; eve erkenden geldi ve hemen yattı.", "Kitap okumayı, resim yapmayı; çok severim."]}, "textPlain": "Hangi cümlede noktalı virgül doğru kullanılmıştır? Seçenekler: Ahmet, Ayşe ve Can bahçede; Elif, Deniz ve Ece salonda oturuyordu. / Akşam; eve erkenden geldi ve hemen yattı. / Kitap okumayı, resim yapmayı; çok severim.", "correctAnswer": "Ahmet, Ayşe ve Can bahçede; Elif, Deniz ve Ece salonda oturuyordu.", "explanation": "Virgülle ayrılmış eş görevli grupları birbirinden ayırmak için noktalı virgül kullanılır."}, {"questionId": "boss-a09-t1-05", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Olay örgüsü", "outcome": "T.O.7.5. Metnin yüzey anlamını belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 18", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "order", "prompt": "Bir öykünün bölümlerini sırala.", "data": {"items": ["Serim: Kişiler ve yer tanıtılır.", "Düğüm: Olaylar karmaşıklaşır.", "Çözüm: Sorun sonuca bağlanır."]}, "textPlain": "Bir öykünün bölümlerini sırala. Kartlar: Çözüm: Sorun sonuca bağlanır.; Düğüm: Olaylar karmaşıklaşır.; Serim: Kişiler ve yer tanıtılır..", "correctAnswer": "Serim: Kişiler ve yer tanıtılır. → Düğüm: Olaylar karmaşıklaşır. → Çözüm: Sorun sonuca bağlanır.", "explanation": "Olay örgüsü serim, düğüm ve çözüm bölümlerinden oluşur."}, {"questionId": "boss-a09-t1-06", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Üç nokta", "outcome": "T.Y.7.21. Yazım kuralları ve noktalama işaretlerini uygulayabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 35", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "choice", "prompt": "“— Neden geç kaldın? — Ben… şey…” Bu konuşmada üç nokta hangi amaçla kullanılmıştır?", "data": {"options": ["Tamamlanmayan, eksik bırakılan cevabı göstermek için", "Cümlenin tamamen bittiğini göstermek için", "Karşıdakine yeni bir soru sormak için"]}, "textPlain": "“— Neden geç kaldın? — Ben… şey…” Bu konuşmada üç nokta hangi amaçla kullanılmıştır? Seçenekler: Tamamlanmayan, eksik bırakılan cevabı göstermek için / Cümlenin tamamen bittiğini göstermek için / Karşıdakine yeni bir soru sormak için", "correctAnswer": "Tamamlanmayan, eksik bırakılan cevabı göstermek için", "explanation": "Üç nokta, konuşmalarda eksik bırakılan ya da tamamlanmayan cevapları gösterir."}, {"questionId": "boss-a09-t1-07", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Söz sanatları", "outcome": "Şiirde kullanılan söz sanatlarını ve ahengi sağlayan unsurları (hece sayısı, uyak, redif) belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 47", "difficulty": "kolay", "group": "t1", "rank": 1, "type": "match", "prompt": "Her cümleyi içindeki söz sanatıyla eşleştir.", "data": {"pairs": [["Rüzgâr pencereyi tıklattı, içeri girmek istedi.", "Kişileştirme"], ["Gözleri deniz gibi maviydi.", "Benzetme"], ["Bu otobüsü bir ömür bekledim.", "Abartma"]]}, "textPlain": "Her cümleyi içindeki söz sanatıyla eşleştir. Sol: Rüzgâr pencereyi tıklattı, içeri girmek istedi.; Gözleri deniz gibi maviydi.; Bu otobüsü bir ömür bekledim.. Sağ: Kişileştirme; Benzetme; Abartma.", "correctAnswer": "Rüzgâr pencereyi tıklattı, içeri girmek istedi. = Kişileştirme; Gözleri deniz gibi maviydi. = Benzetme; Bu otobüsü bir ömür bekledim. = Abartma", "explanation": "Rüzgâra insan isteği verilmiş (kişileştirme); göz denize benzetilmiş (benzetme); bekleme süresi abartılmış (abartma)."}, {"questionId": "boss-a09-t1-08", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Ana düşünce", "outcome": "T.O.7.5. Metnin yüzey anlamını belirleyebilme.", "sourceRef": "Özgün soru; 1. Tema öğrenme çıktılarına ve “Yazılıya Hazırlanıyorum 1. Dönem 1. Yazılı” soru tarzına göre hazırlandı", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "Yukarıdaki metnin ana düşüncesi hangisidir?", "data": {"options": ["Hatalardan ders alarak denemeyi sürdürmek öğrenmenin anahtarıdır.", "Yeni beceriler yalnızca çocukluk yıllarında kolayca öğrenilebilir.", "Usta ressamlar ilk çizimlerinden itibaren hiç hata yapmaz."], "passage": "Yeni bir beceri öğrenmek çoğu zaman sabır ister. İlk denemelerde yapılan hatalar insanı yıldırabilir; oysa her hata, neyin işe yaramadığını gösteren bir işarettir. Usta ressamların ilk çizimleri de kusurluydu. Önemli olan, hatalardan ders alarak denemeyi sürdürmektir."}, "textPlain": "Metin: Yeni bir beceri öğrenmek çoğu zaman sabır ister. İlk denemelerde yapılan hatalar insanı yıldırabilir; oysa her hata, neyin işe yaramadığını gösteren bir işarettir. Usta ressamların ilk çizimleri de kusurluydu. Önemli olan, hatalardan ders alarak denemeyi sürdürmektir. Soru: Yukarıdaki metnin ana düşüncesi hangisidir? Seçenekler: Hatalardan ders alarak denemeyi sürdürmek öğrenmenin anahtarıdır. / Yeni beceriler yalnızca çocukluk yıllarında kolayca öğrenilebilir. / Usta ressamlar ilk çizimlerinden itibaren hiç hata yapmaz.", "correctAnswer": "Hatalardan ders alarak denemeyi sürdürmek öğrenmenin anahtarıdır.", "explanation": "Metin, hataların öğretici olduğunu ve denemeyi sürdürmenin önemini vurgular."}, {"questionId": "boss-a09-t1-09", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Benzetme", "outcome": "T.O.7.14. Bilgilendirici metinlerde metin yapılarından hareketle önemli bilgileri belirlemeye yönelik çözümleme yapabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 30", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "“Kitap okumak, zihin için spor yapmak gibidir; düzenli yapıldıkça zihni güçlendirir.” cümlesinde hangi düşünceyi geliştirme yolu kullanılmıştır?", "data": {"options": ["Benzetme", "Tanık gösterme", "Sayısal verilerden yararlanma"]}, "textPlain": "“Kitap okumak, zihin için spor yapmak gibidir; düzenli yapıldıkça zihni güçlendirir.” cümlesinde hangi düşünceyi geliştirme yolu kullanılmıştır? Seçenekler: Benzetme / Tanık gösterme / Sayısal verilerden yararlanma", "correctAnswer": "Benzetme", "explanation": "Kitap okumak “gibi” sözüyle spor yapmaya benzetilmiştir."}, {"questionId": "boss-a09-t1-10", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Tanık gösterme", "outcome": "T.O.7.14. Bilgilendirici metinlerde metin yapılarından hareketle önemli bilgileri belirlemeye yönelik çözümleme yapabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 30", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "“Bir bilim insanı ‘Öğrenmeyi bıraktığın gün yaşlanmaya başlarsın.’ der. Bu söz, öğrenmenin yaşı olmadığını gösterir.” Bu metinde hangi düşünceyi geliştirme yolu kullanılmıştır?", "data": {"options": ["Tanık gösterme", "Karşılaştırma", "Benzetme"]}, "textPlain": "“Bir bilim insanı ‘Öğrenmeyi bıraktığın gün yaşlanmaya başlarsın.’ der. Bu söz, öğrenmenin yaşı olmadığını gösterir.” Bu metinde hangi düşünceyi geliştirme yolu kullanılmıştır? Seçenekler: Tanık gösterme / Karşılaştırma / Benzetme", "correctAnswer": "Tanık gösterme", "explanation": "Düşünceyi desteklemek için başkasının sözü aktarılmıştır; bu tanık göstermedir."}, {"questionId": "boss-a09-t1-11", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Metin yapısı", "outcome": "T.O.7.14. Bilgilendirici metinlerde metin yapılarından hareketle önemli bilgileri belirlemeye yönelik çözümleme yapabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 38", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "Yukarıdaki metinde hangi metin yapısı kullanılmıştır?", "data": {"options": ["Sebep-sonuç", "Karşılaştırma", "Zaman sırası"], "passage": "Düzenli uyumayan öğrencilerin dikkat süresi kısalır. Bu yüzden derslerde öğrendiklerini hatırlamakta zorlanırlar ve sınavlarda kolayca yorulurlar."}, "textPlain": "Metin: Düzenli uyumayan öğrencilerin dikkat süresi kısalır. Bu yüzden derslerde öğrendiklerini hatırlamakta zorlanırlar ve sınavlarda kolayca yorulurlar. Soru: Yukarıdaki metinde hangi metin yapısı kullanılmıştır? Seçenekler: Sebep-sonuç / Karşılaştırma / Zaman sırası", "correctAnswer": "Sebep-sonuç", "explanation": "Düzensiz uyku (sebep) dikkat ve hatırlama sorunlarına (sonuç) yol açıyor; “bu yüzden” bağlacı sonucu bildirir."}, {"questionId": "boss-a09-t1-12", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "İkilemeler", "outcome": "T.Y.7.21. Yazım kuralları ve noktalama işaretlerini uygulayabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 34", "difficulty": "orta", "group": "t1", "rank": 2, "type": "sort2", "prompt": "İkilemeleri yazımı doğru ve yanlış diye ayır.", "data": {"bins": ["Doğru yazılmış", "Yanlış yazılmış"], "items": [["günden güne", 0], ["yavaş yavaş", 0], ["arada-sırada", 1], ["omuzomuza", 1], ["ağır, ağır", 1]]}, "textPlain": "İkilemeleri yazımı doğru ve yanlış diye ayır. (Doğru yazılmış / Yanlış yazılmış) Kartlar: günden güne; yavaş yavaş; arada-sırada; omuzomuza; ağır, ağır.", "correctAnswer": "Doğru yazılmış: günden güne, yavaş yavaş. Yanlış yazılmış: arada-sırada, omuzomuza, ağır, ağır.", "explanation": "İkilemeler ayrı yazılır; arasına kısa çizgi ya da virgül konmaz: arada sırada, omuz omuza, ağır ağır."}, {"questionId": "boss-a09-t1-13", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "İkna paragrafı", "outcome": "İkna paragrafı ve elektronik posta gibi metinlerin bölümlerini ve amacını belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 60", "difficulty": "orta", "group": "t1", "rank": 2, "type": "choice", "prompt": "İkna edici bir paragrafta yazarın temel amacı hangisidir?", "data": {"options": ["Okuru bir düşünceyi benimsemeye yöneltmek", "Olayları yalnızca oluş sırasıyla anlatmak", "Bir yeri bütün ayrıntılarıyla betimlemek"]}, "textPlain": "İkna edici bir paragrafta yazarın temel amacı hangisidir? Seçenekler: Okuru bir düşünceyi benimsemeye yöneltmek / Olayları yalnızca oluş sırasıyla anlatmak / Bir yeri bütün ayrıntılarıyla betimlemek", "correctAnswer": "Okuru bir düşünceyi benimsemeye yöneltmek", "explanation": "İkna edici metinde yazar, kanıtlarla okuru kendi düşüncesine yöneltmeye çalışır."}, {"questionId": "boss-a09-t1-14", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Kişileştirme", "outcome": "Şiirde kullanılan söz sanatlarını ve ahengi sağlayan unsurları (hece sayısı, uyak, redif) belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 47", "difficulty": "orta", "group": "t1", "rank": 2, "type": "tf", "prompt": "“Çiçekler güneşi görünce gülümsedi.” cümlesinde kişileştirme vardır.", "data": {"truth": true}, "textPlain": "Doğru mu yanlış mı? “Çiçekler güneşi görünce gülümsedi.” cümlesinde kişileştirme vardır.", "correctAnswer": "Doğru", "explanation": "Gülümsemek insana özgüdür; çiçeklere bu özellik verilmiştir."}, {"questionId": "boss-a09-t1-15", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Çıkarım", "outcome": "T.O.7.5. Metnin yüzey anlamını belirleyebilme.", "sourceRef": "Özgün soru; 1. Tema öğrenme çıktılarına ve “Yazılıya Hazırlanıyorum 1. Dönem 1. Yazılı” soru tarzına göre hazırlandı", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metinden Elif ile ilgili hangisine ulaşılabilir?", "data": {"options": ["Sorunları araştırarak çözmeye çalışan biridir.", "Kodlamayı hiç zorlanmadan ilk denemede öğrenmiştir.", "Kurstaki arkadaşlarına yardım etmekten kaçınır."], "passage": "Elif, kodlama kursuna başladığında yazdığı ilk program çalışmadı. Hata mesajlarını tek tek okudu, güvenilir kaynaklardan araştırdı ve sonunda programını çalıştırdı. Şimdi kursa yeni başlayan arkadaşlarına yardım ediyor."}, "textPlain": "Metin: Elif, kodlama kursuna başladığında yazdığı ilk program çalışmadı. Hata mesajlarını tek tek okudu, güvenilir kaynaklardan araştırdı ve sonunda programını çalıştırdı. Şimdi kursa yeni başlayan arkadaşlarına yardım ediyor. Soru: Yukarıdaki metinden Elif ile ilgili hangisine ulaşılabilir? Seçenekler: Sorunları araştırarak çözmeye çalışan biridir. / Kodlamayı hiç zorlanmadan ilk denemede öğrenmiştir. / Kurstaki arkadaşlarına yardım etmekten kaçınır.", "correctAnswer": "Sorunları araştırarak çözmeye çalışan biridir.", "explanation": "Elif hata mesajlarını okuyup araştırmış ve sorunu çözmüştür; arkadaşlarına da yardım etmektedir."}, {"questionId": "boss-a09-t1-16", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Noktalı virgülün yeri", "outcome": "T.Y.7.21. Yazım kuralları ve noktalama işaretlerini uygulayabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 25", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "“Kırtasiyeden defter, kalem, silgi marketten süt, ekmek, peynir aldım.” cümlesinde noktalı virgül nereye konmalıdır?", "data": {"options": ["“silgi” sözcüğünden sonra", "“peynir” sözcüğünden sonra", "“Kırtasiyeden” sözcüğünden sonra"]}, "textPlain": "“Kırtasiyeden defter, kalem, silgi marketten süt, ekmek, peynir aldım.” cümlesinde noktalı virgül nereye konmalıdır? Seçenekler: “silgi” sözcüğünden sonra / “peynir” sözcüğünden sonra / “Kırtasiyeden” sözcüğünden sonra", "correctAnswer": "“silgi” sözcüğünden sonra", "explanation": "Virgülle sıralanmış iki grup (kırtasiye ve market) birbirinden noktalı virgülle ayrılır: …silgi; marketten…"}, {"questionId": "boss-a09-t1-17", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Deyim kullanımı", "outcome": "T.O.7.4. Metinde geçen anlamını bilmediği söz varlığı unsurlarının anlamını tahmin edebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 53", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Aşağıdaki cümlelerin hangisinde deyim anlamına UYGUN kullanılmamıştır?", "data": {"options": ["Sınavı kazandığına çok sevinince yüreği ağzına geldi.", "Kardeşi merdivenden kayınca korkudan yüreği ağzına geldi.", "Dedesinin hediye ettiği saate gözü gibi bakıyor."]}, "textPlain": "Aşağıdaki cümlelerin hangisinde deyim anlamına UYGUN kullanılmamıştır? Seçenekler: Sınavı kazandığına çok sevinince yüreği ağzına geldi. / Kardeşi merdivenden kayınca korkudan yüreği ağzına geldi. / Dedesinin hediye ettiği saate gözü gibi bakıyor.", "correctAnswer": "Sınavı kazandığına çok sevinince yüreği ağzına geldi.", "explanation": "“Yüreği ağzına gelmek” çok korkmak anlamındadır; sevinç bildiren cümlede yanlış kullanılmıştır."}, {"questionId": "boss-a09-t1-18", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Düğüm bölümü", "outcome": "T.O.7.5. Metnin yüzey anlamını belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 18", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Aşağıdaki cümlelerden hangisi bir öykünün düğüm bölümüne aittir?", "data": {"options": ["Kayıp köpeklerini aramak için ormana giren çocuklar yollarını kaybettiler.", "Küçük bir kasabada, dağların eteğinde Ali ve Ece adında iki kardeş yaşardı.", "Sonunda köpeklerini bulup akşam olmadan sağ salim eve döndüler."]}, "textPlain": "Aşağıdaki cümlelerden hangisi bir öykünün düğüm bölümüne aittir? Seçenekler: Kayıp köpeklerini aramak için ormana giren çocuklar yollarını kaybettiler. / Küçük bir kasabada, dağların eteğinde Ali ve Ece adında iki kardeş yaşardı. / Sonunda köpeklerini bulup akşam olmadan sağ salim eve döndüler.", "correctAnswer": "Kayıp köpeklerini aramak için ormana giren çocuklar yollarını kaybettiler.", "explanation": "Düğümde olaylar karmaşıklaşır; yolun kaybolması sorunu büyütür. Kişilerin tanıtıldığı yer serim, sonucun verildiği yer çözümdür."}, {"questionId": "boss-a09-t1-19", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "Abartma", "outcome": "Şiirde kullanılan söz sanatlarını ve ahengi sağlayan unsurları (hece sayısı, uyak, redif) belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 47", "difficulty": "zor", "group": "t1", "rank": 3, "type": "choice", "prompt": "Aşağıdaki cümlelerin hangisinde abartma vardır?", "data": {"options": ["Bu çantayı taşırken kollarım koptu.", "Kar taneleri pamuk gibi yağıyordu.", "Rüzgâr pencerede ıslık çalıyordu."]}, "textPlain": "Aşağıdaki cümlelerin hangisinde abartma vardır? Seçenekler: Bu çantayı taşırken kollarım koptu. / Kar taneleri pamuk gibi yağıyordu. / Rüzgâr pencerede ıslık çalıyordu.", "correctAnswer": "Bu çantayı taşırken kollarım koptu.", "explanation": "Kolların kopması gerçek değildir; yorgunluk abartılmıştır. Diğerlerinde benzetme ve kişileştirme vardır."}, {"questionId": "boss-a09-t1-20", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "1. Tema: Hayat Boyu Gelişim", "topic": "İkna paragrafı yapısı", "outcome": "İkna paragrafı ve elektronik posta gibi metinlerin bölümlerini ve amacını belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 1. Tema “Hayat Boyu Gelişim”, s. 60", "difficulty": "zor", "group": "t1", "rank": 3, "type": "order", "prompt": "İkna edici bir paragrafın bölümlerini sırala.", "data": {"items": ["Görüşünü açıkça belirt.", "Görüşünü destekleyen kanıtları sun.", "Okuru harekete geçiren bir sonuçla bitir."]}, "textPlain": "İkna edici bir paragrafın bölümlerini sırala. Kartlar: Görüşünü açıkça belirt.; Okuru harekete geçiren bir sonuçla bitir.; Görüşünü destekleyen kanıtları sun..", "correctAnswer": "Görüşünü açıkça belirt. → Görüşünü destekleyen kanıtları sun. → Okuru harekete geçiren bir sonuçla bitir.", "explanation": "İkna paragrafında önce görüş belirtilir, sonra kanıtlarla desteklenir, en sonda okura çağrı yapılır."}, {"questionId": "boss-a09-t2-01", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Bir Hilal Uğruna", "topic": "İlgi eki", "outcome": "İsim ve fiil çekim eklerinin kelimelere kattığı anlamları belirleyip cümlede doğru kullanabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Bir Hilal Uğruna”, s. 110", "difficulty": "kolay", "group": "t2", "rank": 1, "type": "choice", "prompt": "“Atatürk’ün sözleri” söz grubunda “-ün” eki hangi ektir?", "data": {"options": ["İlgi eki", "Yönelme eki", "Bulunma eki"]}, "textPlain": "“Atatürk’ün sözleri” söz grubunda “-ün” eki hangi ektir? Seçenekler: İlgi eki / Yönelme eki / Bulunma eki", "correctAnswer": "İlgi eki", "explanation": "“-in/-ın/-un/-ün” eki ilgi ekidir; sözlerin kime ait olduğunu gösterir."}, {"questionId": "boss-a09-t2-02", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Bir Hilal Uğruna", "topic": "Görülen geçmiş zaman", "outcome": "İsim ve fiil çekim eklerinin kelimelere kattığı anlamları belirleyip cümlede doğru kullanabilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Bir Hilal Uğruna”, s. 110", "difficulty": "kolay", "group": "t2", "rank": 1, "type": "choice", "prompt": "“Askerler cepheye dün ulaştı.” cümlesindeki fiil hangi zamanda çekimlenmiştir?", "data": {"options": ["Görülen geçmiş zaman", "Gelecek zaman", "Şimdiki zaman"]}, "textPlain": "“Askerler cepheye dün ulaştı.” cümlesindeki fiil hangi zamanda çekimlenmiştir? Seçenekler: Görülen geçmiş zaman / Gelecek zaman / Şimdiki zaman", "correctAnswer": "Görülen geçmiş zaman", "explanation": "“-dı” eki görülen geçmiş zaman ekidir."}, {"ques , "outcome": "T.O.7.5. Metnin yüzey anlamını belirleyebilme.", "sourceRef": "Özgün soru; MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Bir Hilal Uğruna” öğrenme çıktılarına göre hazırlandı (metin soruda verilir)", "difficulty": "zor", "group": "t2", "rank": 3, "type": "choice", "prompt": "Yukarıdaki metne göre Ayşe Nine’nin battaniyeyi sandıkların üstüne örtmesinin nedeni nedir?", "data": {"options": ["Cephanenin ıslanıp bozulmasını önlemek", "Sandıkları düşmandan gizlemek", "Kağnıyı çeken öküzleri soğuktan korumak"], "passage": "Ayşe Nine gece boyunca kağnısını sürdü. Yağmur başlayınca sırtındaki battaniyeyi çıkarıp mermi sandıklarının üstüne örttü. Sabah cepheye vardığında üşümüştü ama sandıklar kupkuruydu ve yüzü gülüyordu."}, "textPlain": "Metin: Ayşe Nine gece boyunca kağnısını sürdü. Yağmur başlayınca sırtındaki battaniyeyi çıkarıp mermi sandıklarının üstüne örttü. Sabah cepheye vardığında üşümüştü ama sandıklar kupkuruydu ve yüzü gülüyordu. Soru: Yukarıdaki metne göre Ayşe Nine’nin battaniyeyi sandıkların üstüne örtmesinin nedeni nedir? Seçenekler: Cephanenin ıslanıp bozulmasını önlemek / Sandıkları düşmandan gizlemek / Kağnıyı çeken öküzleri soğuktan korumak", "correctAnswer": "Cephanenin ıslanıp bozulmasını önlemek", "explanation": "Yağmur başlayınca battaniyeyi sandıklara örtmüş, sabah sandıklar kuru kalmıştır; amaç cephanenin ıslanmamasıdır."}, {"questionId": "boss-a09-t2-17", "grade": 7, "subjectId": "turkish", "subject": "Türkçe", "unit": "2. Tema: Bir Hilal Uğruna", "topic": "Sevgi tekniği", "outcome": "Metinlerde ve medya içeriklerinde kullanılan ikna etme tekniklerini belirleyebilme.", "sourceRef": "MEB Türkçe 7. Sınıf Ders Kitabı 1. Kitap, 2. Tema “Bir Hilal Uğruna”, s. 99", "difficulty": "zor", "group": "t2", "rank": 3, "type": "choice", "prompt": "Bir afişte sevilen bir sporcu “Ben her sabah yürüyüş yapıyorum, sen de dene!” diyor. Bu afişte hangi ikna tekniği kullanılmıştır?", "data": {"options": ["Sevgi (hoşlanma)", "Kıtlık", "Tutarlılık"]}, <script>
"use strict";
const $=id=>document.getElementById(id),BANK=JSON.parse($('question-data').textContent),BOSS=JSON.parse($('boss-data').textContent),NS='http://www.w3.org/2000/svg';
const CONFIG=Object.freeze({gameId:BOSS.gameId,gameVersion:BOSS.gameVersion,grade:BOSS.grade,subjectId:'mixed',subjectName:'Karışık',locale:'tr-TR',orientation:'portrait'});
const GRADES=Object.freeze([BOSS.grade]),TOTAL=12,WIN=10,RECENT_KEY=BOSS.gameId+'-recent',GAME_NAME=BOSS.name;
const SUBJ={science:['🔬','Fen'],math:['📐','Matematik'],turkish:['📖','Türkçe']},LEVEL={1:'Kolay',2:'Orta',3:'Zor'};
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let state='waiting',ctx=null,ready=null,nativeMode=false,deck=[],pos=0,answers=[],result=null,sent=false,saved=false,readyTimer=null,muted=false,audio=null,master=null,activeMs=0,lastTick=0,cur=null,okCount=0,badCount=0,defeated=false,checked=false;
const usedRuns=new Set(),received=new Set(),reduced=()=>motion.matches||ctx?.reducedMotion===true;
function uid(p){const a=new Uint32Array(3);crypto.getRandomValues(a);return p+'-'+Array.from(a,x=>x.toString(16)).join('');}
function rnd(){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stars(n){return n>=10?3:n>=8?2:n>=6?1:0;}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const FR=(a,b)=>`<span class="fr"><b>${a}</b><b>${b}</b></span>`;
function rich(t){return esc(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,(m,w,a,b)=>w+FR(a,b)).replace(/\{(\d+)\/(\d+)\}/g,(m,a,b)=>FR(a,b));}
function plain(t){return String(t).replace(/(\d+)\{(\d+)\/(\d+)\}/g,'$1 tam $2/$3').replace(/\{(\d+)\/(\d+)\}/g,'$1/$2');}
/* ---------- Köprü 1.0 ---------- */
function transport(){if(window.YildizPesindeBridge?.postMessage)return x=>window.YildizPesindeBridge.postMessage(x);if(window.webkit?.messageHandlers?.YildizPesindeBridge?.postMessage)return x=>window.webkit.messageHandlers.YildizPesindeBridge.postMessage(x);if(window.AndroidYildizPesinde?.postMessage)return x=>window.AndroidYildizPesinde.postMessage(x);return null;}
function send(m){try{const fn=transport();if(fn){fn(JSON.stringify(m));return true;}}catch(e){}return false;}
function handshake(){clearTimeout(readyTimer);ready={bridgeVersion:'1.0',type:'game.ready',messageId:uid('ready'),payload:{supportedVersions:['1.0']}};nativeMode=!!transport();
 if(nativeMode){$('mode').textContent='';$('start').disabled=true;send(ready);if(state==='waiting')readyTimer=setTimeout(()=>{if(state==='waiting'){$('introStatus').textContent='Bağlantı kurulamadı. Yeniden deneyebilir veya uygulamadan çıkabilirsin.';$('reconnect').classList.remove('hidden');}},8000);}
 else{$('mode').textContent='Deneme modu · kayıt yok';$('start').disabled=false;$('introStatus').textContent='';}}
function validInit(m){const p=m.payload;return m.bridgeVersion==='1.0'&&m.replyTo===ready.messageId&&typeof m.messageId==='string'&&m.messageId.length>0&&typeof m.runId==='string'&&m.runId.length>0&&typeof m.nonce==='string'&&m.nonce.length>0&&!!p&&p.gameId===CONFIG.gameId&&p.gameVersion===CONFIG.gameVersion&&GRADES.includes(p.grade);}
function receive(raw){let m;try{m=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){return false;}if(!m||typeof m!=='object'||typeof m.messageId!=='string'||received.has(m.messageId))return false;
 if(m.type==='app.init'){
  if(!['waiting','completed'].includes(state)||usedRuns.has(m.runId))return false;
  if(!validInit(m)){if(state==='waiting'){$('introStatus').textContent='Oyun oturumu doğrulanamadı. Uygulamadan yeniden açmayı dene.';$('start').disabled=true;$('reconnect').classList.remove('hidden');}return false;}
  received.add(m.messageId);usedRuns.add(m.runId);ctx={...CONFIG,...m.payload,runId:m.runId,nonce:m.nonce};clearTimeout(readyTimer);result=null;sent=false;saved=false;state='ready';closeSheet();showIntro();$('start').disabled=false;$('reconnect').classList.add('hidden');if(nativeMode){$('mode').textContent='';$('introStatus').textContent='';}return true;}
 if(!result||m.bridgeVersion!=='1.0'||m.runId!==ctx?.runId||m.nonce!==ctx?.nonce||m.replyTo!==result.messageId||state!=='completed')return false;
 if(m.type==='app.ack'&&m.payload?.status==='saved'){received.add(m.messageId);saved=true;const s=$('saveStatus');if(s)s.textContent='Sonucun kaydedildi. Yeniden oynamak veya çıkmak için uygulamanın sonuç ekranını kullan.';return true;}
 if(m.type==='app.error'&&!saved){received.add(m.messageId);const s=$('saveStatus');if(s)s.textContent=m.payload?.code==='SAVE_FAILED'&&m.payload?.retryable===true?'Sonuç kaydedilemedi. Uygulamanın “Kaydetmeyi Tekrar Dene” düğmesini kullan.':'Sonuç doğrulanamadı. Uygulamadan yeni bir oyun başlat.';return true;}
 return false;}
window.YildizPesindeGame=Object.freeze({receiveMessage:receive});
function demoInit(){if(transport()){nativeMode=true;state='waiting';handshake();return false;}return receive({bridgeVersion:'1.0',type:'app.init',messageId:uid('demo-init'),replyTo:ready.messageId,runId:uid('demo-run'),nonce:uid('demo-nonce'),payload:{...CONFIG}});}
/* ---------- Ses ---------- */
function unlockAudio(){try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(C){audio=new C();master=audio.createGain();master.gain.value=muted?0:.8;master.connect(audio.destination);}}if(audio?.state==='suspended')audio.resume().catch(()=>{});}catch(e){}}
function tone(f,d,type='sine',v=.18,at=0,slide=0){if(!audio||muted)return;try{const t=audio.currentTime+at,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}catch(e){}}
function noise(d,v=.2,at=0,lp=900){if(!audio||muted)return;try{const t=audio.currentTime+at,b=audio.createBuffer(1,Math.floor(audio.sampleRate*d),audio.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);const s=audio.createBufferSource(),f=audio.createBiquadFilter(),g=audio.createGain();f.type='lowpass';f.frequency.value=lp;g.gain.value=v;s.buffer=b;s.connect(f);f.connect(g);g.connect(master);s.start(t);}catch(e){}}
function sfx(k){({tap:()=>tone(660,.06,'triangle',.1),pick:()=>tone(520,.07,'triangle',.12,0,120),
 ok:()=>{tone(523,.12,'triangle',.16);tone(784,.16,'triangle',.16,.09);tone(1046,.22,'sine',.12,.18);},
 bad:()=>{tone(220,.28,'sawtooth',.08,0,-90);noise(.25,.12,.05,500);},
 splat:()=>{noise(.35,.28,0,700);tone(140,.3,'sine',.12,0,-60);},
 bubble:()=>{for(let i=0;i<5;i++)tone(400+i*120,.07,'sine',.08,i*.06,200);},
 free:()=>{tone(880,.1,'sine',.12);tone(1320,.18,'sine',.1,.08);},
 roar:()=>{tone(90,.6,'sawtooth',.1,0,60);noise(.6,.12,0,400);},
 win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.25,'triangle',.15,i*.12));},
 gate:()=>{tone(196,.25,'square',.06);tone(294,.35,'square',.06,.2);}}[k]||(()=>{}))();}
$('mute').onclick=()=>{muted=!muted;unlockAudio();if(master)master.gain.value=muted?0:.8;$('mute').textContent=muted?'🔇':'🔊';$('mute').setAttribute('aria-label',muted?'Sesi aç':'Sesi kapat');};

function recent(){try{return JSON.parse(localStorage.getItem(RECENT_KEY)||'[]');}catch(e){return [];}}
function remember(ids){try{localStorage.setItem(RECENT_KEY,JSON.stringify([...ids,...recent()].slice(0,30)));}catch(e){}}
function deckPlan(){const groups=BOSS.split||BOSS.units.map(u=>({units:[u],n:2}));let best=null,bd=1e9;
 for(let t=0;t<400;t++){const al=[];groups.forEach(g=>{const us=shuffle(g.units),b=Math.floor(g.n/us.length),ex=g.n%us.length;us.forEach((u,i)=>al.push({u,c:b+(i<ex?1:0)}));});
  al.forEach(a=>{a.ranks=a.c>=3?[1,2,3,...Array.from({length:a.c-3},()=>1+Math.floor(rnd()*3))]:shuffle([1,2,3]).slice(0,a.c);});
  const cnt=[0,0,0,0];al.forEach(a=>a.ranks.forEach(r=>cnt[r]++));const d=Math.abs(cnt[1]-4)+Math.abs(cnt[2]-4)+Math.abs(cnt[3]-4);if(d<bd){bd=d;best=al;}if(d===0)break;}
 return best;}
function buildDeck(){const rec=new Set(recent()),plan=deckPlan();
 let chosen=null,cs=-1;for(let t=0;t<80;t++){const c=[];let fr=0;plan.forEach(a=>a.ranks.forEach(r=>{const pool=BANK.filter(q=>q.group===a.u&&q.rank===r&&!c.includes(q));const fresh=pool.filter(q=>!rec.has(q.questionId));const q=shuffle(t<40&&fresh.length?fresh:pool)[0];if(!rec.has(q.questionId))fr++;c.push(q);}));
  const ty=new Set(c.map(q=>q.type)).size,ch=c.filter(q=>q.type==='choice').length,sc=Math.min(ty,5)*20+fr*3-Math.max(0,ch-6)*8;if(sc>cs){cs=sc;chosen=c;}}
 let best=null,bs=1e9;
 for(let t=0;t<400;t++){const seq=[1,2,3].flatMap(r=>shuffle(chosen.filter(q=>q.rank===r)));let s=0;for(let i=1;i<seq.length;i++){if(seq[i].subjectId===seq[i-1].subjectId)s+=3;if(seq[i].type===seq[i-1].type)s+=1;}if(s<bs){bs=s;best=seq;}if(s===0)break;}
 return best;}
/* ---------- Sahne ---------- */
function setupScene(){const rig=$('rig');rig.querySelectorAll('.mx').forEach(e=>e.remove());$('boss').src=BOSS.img.idle;$('boss').className='';MECH.setup(rig);meter();}
function meter(){$('mArms').textContent=defeated?'🏆 '+BOSS.defeatShort:MECH.label(okCount);
 const left=Math.max(0,(TOTAL-WIN)-badCount);$('mLife').textContent=defeated?'⭐ Bonus':badCount>TOTAL-WIN?'💫 Yıldız için devam':`🛡️ Hata hakkı ${left}`;}
function banner(t){const b=$('banner');b.textContent=t;b.classList.remove('on');void b.offsetWidth;b.classList.add('on');}
function hitBoss(){okCount++;if(!defeated)MECH.hit(okCount);
 const b=$('boss');b.classList.remove('hit','laugh');void b.offsetWidth;b.classList.add('hit');
 if(okCount===WIN&&!defeated){defeated=true;setTimeout(()=>{b.src=BOSS.img.def;b.classList.remove('hit');MECH.defeat&&MECH.defeat();sfx('win');banner(BOSS.defeatBanner);confetti(reduced()?0:50);meter();},reduced()?0:600);}
 meter();}
function missBoss(){badCount++;const b=$('boss');b.classList.remove('hit','laugh');void b.offsetWidth;if(!defeated)b.classList.add('laugh');
 MECH.miss(badCount);if(badCount===TOTAL-WIN+1&&!defeated)banner(BOSS.escapeBanner);meter();}
function fxPulse(id){const s=$(id);if(!s)return;s.classList.remove('on');void s.offsetWidth;if(!reduced())s.classList.add('on');}
const MECH={
 N:10,
 setup(rig){for(let i=0;i<this.N;i++){const th=Math.PI-(i*(Math.PI/(this.N-1))),x=50+45*Math.cos(th),y=48+40*Math.sin(th);const p=document.createElement('div');p.className='plate mx';p.style.left=x+'%';p.style.top=y+'%';p.style.setProperty('--r',((i*37)%30-15)+'deg');p.innerHTML='<i></i><b></b>';rig.appendChild(p);}
  const sc=$('scene');sc.querySelectorAll('.rockfall').forEach(e=>e.remove());const r=document.createElement('div');r.className='rockfall';r.id='rockfall';r.innerHTML='<i></i><i></i><i></i><i></i><i></i>';sc.appendChild(r);},

  if(!reduced()){for(let k=0;k<6;k++){const d=document.createElement('span');d.className='pebble mx';d.style.left=p.style.left;d.style.top=p.style.top;d.style.setProperty('--dx',(k-2.5)*13+'px');d.style.setProperty('--dy',(34+k%3*12)+'px');d.style.animationDelay='.38s';$('rig').appendChild(d);setTimeout(()=>d.remove(),1500);}}
  if(n===5){const sc=$('scene');sc.classList.remove('quake');void sc.offsetWidth;if(!reduced())sc.classList.add('quake');$('boss').classList.add('stomp');setTimeout(()=>banner(BOSS.inkBanner),reduced()?0:450);tone(60,.4,'sine',.2,0,-20);noise(.6,.22,0,300);}},
 defeat(){$('boss').classList.remove('stomp');},

};

function confetti(n){const c=$('conf'),cols=['#ffcf3f','#ff6f91','#3ee0c8','#9b7bff','#fff'];for(let i=0;i<n;i++){const e=document.createElement('i');e.style.left=rnd()*100+'%';e.style.background=cols[i%5];e.style.animationDuration=(1.4+rnd()*1.6)+'s';e.style.animationDelay=rnd()*.5+'s';c.appendChild(e);setTimeout(()=>e.remove(),3800);}}
function fly(t,el){if(reduced())return;const r=(el||$('go')).getBoundingClientRect(),f=document.createElement('div');f.className='flyup';f.textContent=t;f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1100);}
